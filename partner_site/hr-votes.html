document.getElementById("tagline").textContent = `VOTING RECORDS · ${DATA.name.toUpperCase()}`;
document.getElementById("kicker").textContent =
  `${DATA.name.toUpperCase()}${DATA.chambers.length ? " · " + DATA.chambers.join(", ").toUpperCase() : ""}`;
document.getElementById("h1").textContent = `How did ${DATA.name}'s parliamentarians vote?`;
document.getElementById("sub").innerHTML =
  `The recorded votes on the issues we track, from the parliamentary monitor's store as read on
   ${esc(fmtD(DATA.today))}: the tally and the result as the chamber records them, how each party or
   group voted, and every member's position in the record's own words. Titles are verbatim, in the
   original language. Find a member to see their record on this ground.`;
if (DATA.sample) document.getElementById("sample").innerHTML =
  `<p class="sample">${esc(DATA.sample)}: built from a scoping store, never published.</p>`;

(function(){
  const r = DATA.readings, el = document.getElementById("signoff");
  const conf = DATA.divisions.filter(d => d.reading.state === "confirmed").length;
  const awaiting = r.draft + r.unread;
  el.innerHTML = conf
    ? `<b>${conf} of the ${DATA.divisions.length} votes below carry a confirmed reading</b>, shown with
       who confirmed it and when. Every other vote is shown as the record only, with its reading
       awaiting sign-off: this page labels no member for or against our side.`
    : `<b>Readings awaiting sign-off. Nobody on this page is labelled.</b> None of the votes below has a
       confirmed reading yet (${awaiting} reading(s) of ${esc(DATA.name)}'s votes await a named signer), so
       this page shows what each member did and what was voted on, never which way it cut for CitizenGO.`;
})();

// --- filters -------------------------------------------------------------------
const fill = (id, values, label) => {
  const el = document.getElementById(id);
  for (const v of values) { const o = document.createElement("option"); o.value = v[0]; o.textContent = label ? label(v) : v[1]; el.appendChild(o); }
};
fill("fch", DATA.chambers.map(c => [c, c]));
const areas = [...new Set(DATA.divisions.flatMap(d => d.a))].sort((a,b) => a-b);
fill("far", areas.map(a => [String(a), areaName(a)]));
const groupCount = {};
for (const d of DATA.divisions) for (const p of d.p) if (G[p[2]]) groupCount[p[2]] = (groupCount[p[2]]||0) + 1;
fill("fgr", Object.keys(groupCount).map(Number).sort((a,b) => G[a].localeCompare(G[b])).map(g => [String(g), G[g]]));
const ml = document.getElementById("mlist");
const mlabel = (m) => `${m[0]}${m[1] ? " (" + m[1] + ")" : ""}${m[3] ? ", " + m[3] : ""}`;
M.forEach((m) => { const o = document.createElement("option"); o.value = mlabel(m); ml.appendChild(o); });

// --- one vote ----------------------------------------------------------------------
const tallyText = (d) => {
  const L = DATA.labels;
  if (d.y === null && d.n === null) {
    const c = {}; for (const p of d.p) if (!DERIVED.has(p[3])) c[W[p[1]]] = (c[W[p[1]]]||0) + 1;
    const parts = Object.entries(c).sort((a,b) => b[1]-a[1]).map(([w,n]) => `${esc(w)} ${n}`);
    return parts.length ? `No tally in the store; recorded positions counted: ${parts.join(", ")}` : "No tally in the store";
  }
  let t = `<b>${esc(L[0])} ${d.y ?? "?"}</b>, <b>${esc(L[1])} ${d.n ?? "?"}</b>`;
  if (d.ab !== null) t += `, abstentions ${d.ab}`;
  return t;
};
const readingTag = (r) => r.state === "confirmed"
  ? `<span class="reading ok">READING CONFIRMED</span>`
  : `<span class="reading">${r.state === "awaiting sign-off" ? "READING AWAITING SIGN-OFF" : "NO READING DRAFTED"}</span>`;
const readingLine = (r) => r.state !== "confirmed" ? "" :
  `<div class="on">CitizenGO's reading, confirmed by ${esc(r.by)} on ${esc(fmtD(r.on))}: a ${esc(DATA.labels[0])}
   vote scores ${esc(r.yea)}, a ${esc(DATA.labels[1])} vote scores ${esc(r.nay)} (on a scale from -2 to 2).</div>`;

function splitTable(d) {
  const words = [], rows = {};
  let derived = false;
  for (const p of d.p) {
    if (!words.includes(p[1])) words.push(p[1]);
    const g = G[p[2]] || "no party recorded";
    (rows[g] = rows[g] || {})[p[1]] = (rows[g][p[1]] || 0) + 1;
    if (DERIVED.has(p[3])) derived = true;
  }
  if (!d.p.length) return "";
  words.sort((a,b) => (d.p.filter(p => p[1]===b).length) - (d.p.filter(p => p[1]===a).length));
  const order = Object.keys(rows).sort((a,b) => Object.values(rows[b]).reduce((x,y)=>x+y,0) - Object.values(rows[a]).reduce((x,y)=>x+y,0));
  const head = `<tr><th>Party or group</th>${words.map(w => `<th>${esc(W[w])}</th>`).join("")}</tr>`;
  const body = order.map(g => `<tr><td>${esc(g)}</td>${words.map(w => `<td>${rows[g][w] || ""}</td>`).join("")}</tr>`).join("");
  const basis = [...new Set(d.p.map(p => B[p[3]]))].filter(Boolean);
  return `<table class="split">${head}${body}</table><div class="meta">Party basis: ${esc(basis.join("; "))}${derived ? ". DERIVED positions are the group's vote given to each member (X5), not recorded per member." : ""}</div>`;
}

function memberLists(d) {
  const by = {};
  for (const p of d.p) (by[p[1]] = by[p[1]] || []).push(p);
  return Object.entries(by).sort((a,b) => b[1].length - a[1].length).map(([w, ps]) =>
    `<div class="lobby"><b>${esc(W[w])} (${ps.length})</b>${ps.sort((a,b) => M[a[0]][0].localeCompare(M[b[0]][0])).map(p =>
      `<a href="#m=${p[0]}">${esc(M[p[0]][0])}</a> <small>(${esc(G[p[2]] || "?")})</small>${DERIVED.has(p[3]) ? '<span class="der">DERIVED</span>' : ""}`).join(", ")}</div>`).join("");
}

function card(d, hl) {
  const chips = d.a.map(a => `<span class="chip">${esc(areaName(a))}</span>`).join("") +
    (d.w ? `<span class="chip w">WATCHED</span>` : "") + (d.tier ? `<span class="chip">TIER ${d.tier}</span>` : "");
  const title = d.u ? `<a href="${esc(d.u)}"><i>${esc(d.t)}</i></a>` : `<i>${esc(d.t)}</i>`;
  const rb = d.rb.length
    ? `<div class="rebels">Against their group's majority (recorded votes, party at the vote): ${d.rb.map(i =>
        `<a href="#m=${i}">${esc(M[i][0])}</a>`).join(", ")}.</div>` : "";
  return `<div class="divcard${hl ? " hl" : ""}" id="v-${esc(d.k)}">
    <div class="meta">${esc(fmtD(d.d))}${d.c ? " · " + esc(d.c) : ""} · ${chips}${readingTag(d.reading)}</div>
    <h3>${title}</h3>
    ${d.g && d.g !== d.t ? `<div class="on">On: <i>${esc(d.g)}</i></div>` : ""}
    ${d.tk ? `<div class="takeaway">${esc(d.tk)}</div>` : ""}
    <div class="tally">${tallyText(d)}${d.r ? `. Result: <b>${esc(d.r)}</b>` : ""}</div>
    ${readingLine(d.reading)}
    ${splitTable(d)}${rb}
    ${d.p.length ? `<details data-k="${esc(d.k)}"><summary>Every member's position (${d.p.length})</summary><div class="ml"></div></details>` : ""}
  </div>`;
}

// --- one member ----------------------------------------------------------------------
function memberView(i) {
  const m = M[i];
  const rows = [];
  for (const d of DATA.divisions) for (const p of d.p) if (p[0] === i) rows.push([d, p]);
  const against = rows.filter(([d]) => d.rb.includes(i)).length;
  const meta = [m[1] ? `<b>${esc(m[1])}</b> (latest in the member list)` : "party not given by the source",
    m[2] ? esc(m[2]) : "", m[3] ? esc(m[3]) : "",
    m[4] === true ? "sitting" : m[4] === false ? "not on the current list" : "",
    m[5] ? "named in a record, not matched to one listed member" : "",
    m[6] ? esc(m[6]) : ""].filter(Boolean).join(" · ");
  return `<div class="mepcard"><h2>${esc(m[0])}</h2><div class="mep-meta">${meta}</div>
    <div class="mep-meta">${rows.length} position(s) on the votes listed here${against ? `; against their group's majority ${against} time(s)` : ""}.
    <a href="#">Back to every vote</a></div></div>
    <table class="mrec"><tr><th>Date</th><th>Position</th><th>Party at the vote</th><th>Vote</th></tr>
    ${rows.map(([d,p]) => `<tr><td>${esc(fmtD(d.d))}</td><td><b>${esc(W[p[1]])}</b>${DERIVED.has(p[3]) ? '<span class="der">DERIVED</span>' : ""}${d.rb.includes(i) ? ' <small>(against group majority)</small>' : ""}</td>
      <td>${esc(G[p[2]] || "not known")} <small>(${esc(B[p[3]])})</small></td>
      <td><a href="#v=${encodeURIComponent(d.k)}"><i>${esc(d.t.length > 160 ? d.t.slice(0,159) + "..." : d.t)}</i></a> ${readingTag(d.reading)}</td></tr>`).join("")}
    </table>`;
}

// --- the list ---------------------------------------------------------------------------
function filtered() {
  const ch = document.getElementById("fch").value, ar = document.getElementById("far").value;
  const gr = document.getElementById("fgr").value, w = document.getElementById("fw").checked;
  const q = norm(document.getElementById("fq").value).trim();
  return DATA.divisions.filter(d => (!ch || d.c === ch) && (!ar || d.a.includes(+ar)) && (!w || d.w)
    && (!gr || d.p.some(p => p[2] === +gr)) && (!q || norm(d.t + " " + (d.g || "")).includes(q)));
}

function render() {
  const main = document.getElementById("main");
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("m=") && M[+h.slice(2)]) { main.innerHTML = memberView(+h.slice(2)); window.scrollTo(0, 0); return; }
  let hl = h.startsWith("v=") ? h.slice(2) : null;
  const list = filtered();
  let n = shown;
  if (hl) { const at = list.findIndex(d => d.k === hl); if (at >= n) n = at + 1; }
  const head = `<div class="count">${list.length} of ${DATA.divisions.length} vote(s) shown${DATA.total > DATA.shown ? `; the latest ${DATA.shown} of ${DATA.total} votes on our ground are listed (earlier ones are in the store and the weekly editions)` : ""}.</div>`;
  main.innerHTML = head + list.slice(0, n).map(d => card(d, d.k === hl)).join("") +
    (list.length > n ? `<div class="more"><button id="more">Show ${Math.min(PAGE, list.length - n)} more</button></div>` : "");
  const more = document.getElementById("more");
  if (more) more.onclick = () => { shown = n + PAGE; history.replaceState(null, "", location.pathname); render(); };
  for (const det of main.querySelectorAll("details[data-k]")) det.addEventListener("toggle", () => {
    const box = det.querySelector(".ml");
    if (det.open && !box.innerHTML) box.innerHTML = memberLists(DATA.divisions.find(d => d.k === det.dataset.k));
  });
  if (hl) { const el = document.getElementById("v-" + hl); if (el) el.scrollIntoView(); }
}

for (const id of ["fch", "far", "fgr", "fw"]) document.getElementById(id).addEventListener("change", () => { shown = PAGE; render(); });
document.getElementById("fq").addEventListener("input", () => { shown = PAGE; render(); });
document.getElementById("fm").addEventListener("change", (e) => {
  const at = M.findIndex(m => mlabel(m) === e.target.value);
  if (at >= 0) location.hash = "m=" + at;
});
window.addEventListener("hashchange", render);

// --- notes ---------------------------------------------------------------------------------
document.getElementById("notes").innerHTML = [
  `<p><b>On our ground</b> means what the ${esc(DATA.name)} edition shows: the collector's classification (taxonomy and watchlist), the edition's noise rules and mutes, and the session judge's score where it has read the vote.</p>`,
  `<p><b>Party:</b> ${esc(DATA.party_note)}</p>`,
  DATA.store_note ? `<p><b>The record:</b> ${esc(DATA.store_note)}</p>` : "",
  DATA.service_note ? `<p><b>Service:</b> ${esc(DATA.service_note.replace(/^Service: /, ""))}</p>` : "",
  `<p><b>Against their group's majority</b> counts recorded Yes and No votes only, where the party is the party at the vote, in groups of three or more. Members with no group line to break (no group, non-attached, independents, mixed groups) are never counted; nor are positions DERIVED from a group's vote (X5) or parties shown as listed (X6).</p>`,
  `<p><b>No verdicts.</b> Which way a vote cut for CitizenGO is a judgement a named person signs (the 5CA stance file). Until then a vote shows its reading as awaiting sign-off, and no page places anyone.</p>`,
  DATA.attribution ? `<p><b>Source attribution:</b> ${esc(DATA.attribution)}.</p>` : "",
].join("");
document.getElementById("footer").textContent =
  `Built from ${DATA.name}'s parliamentary records in the CitizenGO parliamentary monitor's store, read ${fmtD(DATA.today)}. Prepared for coalition partners: please do not circulate beyond your organisation.`;

render();
</script>
</body>
</html>

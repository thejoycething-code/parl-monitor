# US watchlist -- GROUNDWORK DRAFT (9 October 2026), not yet reviewed by
# anyone who campaigns in the US.
#
# The shared taxonomy (American vocabulary since v1.17) does most of the
# work. This file carries only what it cannot: named bills whose titles are
# either too generic to be a term or say nothing about our ground.
#
# APPLIED BY KEY, NEVER BY TITLE (src/us_store.add_watch_areas): "Equality
# Act" as a title term would also match the Refund Equality Act and the
# TRICARE Equality Act. Keys are '<congress>/<type>/<number>'. Bills die at
# the end of each Congress and come back under new numbers, so every entry
# must be re-keyed when the 120th Congress convenes on 3 January 2027.
bills:
  "119/hr/15": {areas: [5, 8],
                why: "Equality Act (218 cosponsors). Adds sexual orientation and gender identity to the Civil Rights Act and bars RFRA as a defence. The taxonomy term is 'Equality Act 2010', so the US bill matched nothing."}
  "119/s/1503": {areas: [5, 8],
                 why: "Equality Act, Senate companion of H.R. 15."}
  "119/s/278": {areas: [6, 7],
                why: "Kids Off Social Media Act: bans social media accounts under 13. Matched nothing; KOSA and the SCREEN Act did."}

# Vote-level watch, keyed by DIVISION KEY (chamber-congress-session-roll, as
# the store writes it), never by text: roll calls whose bill carries our
# ground in a provision its title and summary never mention, so neither the
# taxonomy nor the bill watch above can give it. Their areas join the vote's
# OWN areas (src/us_store.add_vote_watch_areas), whatever the amendment's
# purpose says. Added 14 October 2026 (Chris), the mirror of Chile's votes:
# section (PR #197). Keys never need re-keying: a roll call is never renumbered.
# house-118-1-301 (the Rosendale TRICARE amendment to the FY24 NDAA) is NOT
# here: it matches by its own text and stays area 5.
votes:
  "house-118-2-500":
    areas: [3]
    why: "FY2025 NDAA (H.R. 5009), House motion to concur in the Senate amendment with an amendment, 11 December 2024, passed 281-140: the conference text kept the TRICARE ban on gender-dysphoria treatments for under-18s that could result in sterilisation (sec. 708). The bill's title and summary never say so."
  "senate-118-2-325":
    areas: [3]
    why: "FY2025 NDAA (H.R. 5009), Senate motion to concur in the House amendment to the Senate amendment, 18 December 2024, agreed 85-14: the same text, the minors' TRICARE ban included. Clerk roll 325 of the 2nd session (Voteview RS1180677); not yet in the store, which holds the 118th House only."

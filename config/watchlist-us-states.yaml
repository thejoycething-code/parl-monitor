# US state legislatures watchlist -- GROUNDWORK DRAFT (9 October 2026), not
# yet reviewed by anyone who campaigns in the US.
#
# The shared taxonomy does most of the work (docs/us-states-scope.md: 4,418
# bills on our ground in the most recent session of the fifty). This file
# carries only the named misses: state bills on our ground whose titles,
# subject terms and abstracts carry no taxonomy term, found on 9 October
# 2026 by reading every state's latest session for American names.
#
# APPLIED BY KEY, NEVER BY TITLE (src/us_states_store.add_watch_areas).
# Keys are '<ST>/<session>/<identifier>', the identifier without spaces, the
# session as Open States names it: 'TN/114/SB468'. A title would collide:
# "SAFE Act" in a state title is as often a gun-safe or school-safety act as
# the Save Adolescents from Experimentation Act. Bills die with their session
# and come back under new numbers, so entries must be re-keyed then.
#
# The lasting fix for most of these is a taxonomy term (the scope doc lists
# the candidates); that is Christopher's call, as the taxonomy is generated
# from docs/keyword-taxonomy.md and never hand-edited.
bills:
  # Area 5: sex-based rights. Girls' sports, single-sex spaces, the

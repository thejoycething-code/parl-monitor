  # --- DRAFTED 30 September 2026 from the 2011 backfill, for Christopher ------
  # Every motion or amendment text is the one ni_classify recovered from the
  # archived Hansard. The party splits come from ni_votes and ni_affiliations
  # (party as at the division). Where the subject names a mover, the mover's
  # own vote was checked and was Aye in every case. our_side follows the
  # Westminster and Holyrood entries on the same issues. NOT drafted:
  # Sheerin's 2020 amendment and Cameron's 2021 amendment (their own text is
  # not in the archive, only the motion's); the Safe Access Zones Bill's
  # Consideration Stage amendments (technical, and split exactly as the
  # Bill); the procedural Standing Order suspension; the 2016 Mental Capacity
  # restraint-wording amendments; and the near-unanimous 2024 hate crime
  # amendment. The clause votes on the Severe Fetal Impairment and Human
  # Trafficking Bills get drafted after the watch-list harvest brings their
  # roll-calls in.
  - key: "141962"
    dated: 2012-10-01
    issue: marriage
    stage: "Motion (cross-community vote)"
    landmark: true
    short: "Marriage Equality motion, 2012 (Agnew)"
    motion: >-
      "That this Assembly believes that all couples, including those of the
      same sex, should have the right to marry in the eyes of the state ...
      calls on the Minister of Finance and Personnel to introduce legislation
      to guarantee that couples of any sex or gender identity receive equal
      benefit". Moved by Mr Agnew (Green). Fell 45-50.
    note: >-
      Sinn Fein 28, SDLP 9, Alliance 4, UUP 3, Green 1 for; DUP 37, UUP 9,
      Independent 2, Alliance 1, TUV 1 against. The Assembly's first vote on
      same-sex marriage.
    our_side: against
    signed_off: false
    meaning_good: >-
      Voted against the motion calling for legislation for same-sex
      marriage in Northern Ireland.
    meaning_bad: >-
      Voted for the motion calling for legislation for same-sex marriage in
      Northern Ireland.


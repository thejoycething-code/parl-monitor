      for, 5 against, 4 abstaining.
    our_side: against
    signed_off: false
    meaning_good: >-
      Voted against moving organ donation to deemed (assumed) consent.
    meaning_bad: >-
      Voted for moving organ donation to deemed (assumed) consent.


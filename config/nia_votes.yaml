  - key: "349616"
    dated: 2021-09-20
    issue: organ-donation
    stage: "Second Stage, Organ and Tissue Donation (Deemed Consent) Bill"
    landmark: false
    short: "Deemed-consent organ donation, Second Stage"
    motion: >-
      "That the Second Stage of the Organ and Tissue Donation (Deemed
      Consent) Bill [NIA 30/17-22] be agreed." The Health Minister's Bill

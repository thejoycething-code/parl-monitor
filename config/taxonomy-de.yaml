    # note: ITS OWN AREA since the evening of 26 September 2026, when the UK edition gained it too (Christopher: "cover organ donation in the UK edition too"). It spent that day in area 2, and area 2 feeds member stance, issue pages and any 5CA: an organ-donation speech filed there is scored as a position ON ASSISTED DYING, and the two are separate questions. The German stance pass would have scored all fourteen speeches of the 24 September debate that way the next evening. `Organhandel` moved here from area 12 for the same reason the UK put organ trafficking here: it is organ ethics first. CitizenGO's POSITION on this area is not yet stated, so it is collated, scored for relevance and shown, but held out of member stance until it is. The measurements and guards carried over unchanged: ORGAN DONATION joined this area at v0.5 (Christopher, 26 September 2026: "check we are covering Organspendern and Organspende"). Until then no area claimed it, and the opt-out Transplantationsgesetz debate of 24 September was invisible to the edition. Measured against DIP across all time: `Organspende` 74 Vorgänge (`Organspender` and `Organspendern` return the same 74 -- one stem covers the family), `Transplantationsgesetz` 51, `Organentnahme` 15, `Hirntod` 7, `Lebendorganspende` 7, `Widerspruchslösung` 7, `Widerspruchsregelung` 6 -- and v0.4 missed essentially all of them. It sits in the end-of-life area because what is contested is consent at death and the definition of death itself. `Lebendorganspende` and `Organtransplantation` are separate terms because a German compound puts words IN FRONT too: the matcher anchors at word start, so `Organspende*` cannot reach the first and `Transplantation*` cannot reach the second -- which is exactly the one Vorgang of 156 the first draft of this addition still missed ("Warteliste für Organtransplantationen"). `Widerspruchslösung` and `Widerspruchsregelung` are GUARDED to organs: every DIP title using them is the organ opt-out, but in running text the same word is the opt-out for the electronic patient record. The guards are `Organspende*` and the plural forms rather than `Organ*`, which would also match `Organisation`. `Organentnahme` also catches forced organ harvesting from Falun Gong prisoners in China -- our ground too, though triage should weigh it for area 8. `Transplantation` alone is tier 2: mostly organ policy, but it also names bone-marrow and tissue work.

# The Federal Parliament of Australia: what a division MEANS, written by a
# human.
#
# The Australian mirror of config/ca_stance.yaml, under the same rule: which
# lobby is CitizenGO's is the campaigner's judgement, and no tool estimates
# it. tools/au_5ca.py applies these lines; it never invents one.
#
# EVERY ENTRY IS A DRAFT (9 October 2026). Claude drafted them from the store
# (the motion Hansard printed before each division, and the lobbies) at
# Christopher's request ("5CA parity for Australia"). An entry carrying
# `draft: true` places NOBODY. To sign: tick the box in
# docs/5ca-au-readings.md and run `python3 tools/au_5ca.py --sign-from-doc`,
# or delete the `draft: true` line by hand.
#
# `yea:` is the Aye lobby, `nay:` the No lobby. A PAIR places nobody: Hansard
# does not publish which side each partner was on (tools/au_rollcalls.py
# stores both as 'Paired'). No bill entries: au_bills carries no sponsor.
#
# Keys are the store's: 'senate-2026-07-01-16' (chamber-date-number of the
# day). `lobbies:` is counted from au_votes (party AT THE VOTE).
#


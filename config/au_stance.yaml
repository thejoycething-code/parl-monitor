  # --- Area 3: gender medicine for children (Senate) ---

  - key: "senate-2026-03-31-8"
    title: "Community Affairs References Committee; Reference: The question is that business of the Senate notice of motion No. 1 be agreed to."
    dated: "2026-03-31"
    result: "Ayes 19, Noes 41, pairs None"
    lobbies: "Aye: Liberal Party 9, Pauline Hanson's One Nation Party 4, National Party 2, Liberal National Party 2, United Australia Party 1, Country Liberal Party 1. No: Australian Labor Party 23, Australian Greens 10, Liberal Party 6, Independent 2."
    motion: "I move:That the following matter be referred to the Community Affairs References Committee for inquiry and report by 2 November 2026:The suitability of current Commonwealth Government guidelines regarding gender dysphoria for minors, with particular reference to:(a) the science behind medical intervention;(b) alternative treatments including counselling;(c) international trends in treatment;(d) lived experience of transitioners;(e) other reviews that may be underway or recently completed; and(f) any other related matters."
    aye_means: "For referring the Commonwealth's guidelines on gender dysphoria in minors to the Community Affairs References Committee: the science of medical intervention, alternatives such as counselling, international trends, and detransitioners' experience."
    yea: 1
    why_yea: "Voted for a Senate inquiry into gender medicine for minors (science, counselling, detransitioners)."
    nay: -1
    why_nay: "Voted against a Senate inquiry into gender medicine for minors."
    flag: "An inquiry, not a law: drafted at +/-1. Six Liberals voted No with Labor and the Greens, so the vote does tell members apart."
    draft: true
    drafted: "Claude, 9 October 2026"

  # --- Area 1: abortion (Senate) ---

  - key: "senate-2025-11-03-3"
    title: "Fair Work Amendment (Baby Priya's) Bill 2025; In Committee: The question is that amendment (1) on sheet 3479 be agreed to."
    dated: "2025-11-03"
    result: "Ayes 7, Noes 39, pairs None"
    lobbies: "Aye: Pauline Hanson's One Nation Party 3, Liberal Party 2, United Australia Party 1, Country Liberal Party 1. No: Australian Labor Party 21, Australian Greens 10, National Party 2, Liberal Party 2, Independent 2, Liberal National Party 1, Australia's Voice 1."
    motion: "I move my amendment on sheet 3479:(1) Schedule 1, item 5, page 5 (after line 16), at the end of section 333X, add: Exclusions(7) Despite subsection (1), this section does not apply if the child:(a) is stillborn because of an intentional termination (other than by child-birth) of a pregnancy; or(b) dies because of an intentional termination (other than by child-birth) of a pregnancy (whether the death occurs before, during or after delivery).Note: An intentional termination of pregnancy includes, for example, a medical termination involving the administration of a drug."
    aye_means: "For the amendment to the Fair Work Amendment (Baby Priya's) Bill 2025: the new leave for parents of a stillborn child would not apply where the stillbirth or death followed an intentional termination of pregnancy."
    yea: 1
    why_yea: "Voted to keep abortion out of the stillbirth leave entitlement."
    flag: "Uncertain: the amendment denies bereavement leave to parents after an abortion, which CitizenGO may not want to be seen backing. Drafted Aye +1 with the No side at no value (39 of 46 voted No, including most of the Coalition, so a No tells no member apart). Strike it if it is off message."
    draft: true
    drafted: "Claude, 9 October 2026"

  # --- Area 7: free speech (both chambers). Combatting Antisemitism, Hate and Extremism Bill 2026 ---

  - key: "house-2026-01-20-5"
    title: "Combatting Antisemitism, Hate and Extremism (Criminal and Migration Laws) Bill 2026; Consideration in Detail: The question is that the bill, as amended, be agreed to."
    dated: "2026-01-20"
    result: "Ayes 116, Noes 7, pairs None"
    lobbies: "Aye: Australian Labor Party 85, Liberal Party 16, Liberal National Party 7, Independent 7, National Party 1. No: Independent 2, Pauline Hanson's One Nation Party 1, National Party 1, Liberal National Party 1, Katter's Australian Party 1, Centre Alliance 1."
    motion: "I move amendments (1) to (3) on sheet 1 and the amendment on sheet 2 as circulated in my name together:(1) Schedule 1, item 7, page 4 (line 31), omit subparagraph 80.2DA(1)(b)(ii), substitute:(ii) a spiritual leader who provides religious instruction or religious pastoral care; or(iia) a leader of a prohibited hate group (within the meaning of Part 5.3B); or(2) Schedule 1, item 7, page 5 (line 12), omit subparagraph 80.2DA(2)(b)(ii), substitute:(ii) a spiritual leader who provides religious instruction or religious pastoral care; or(iia) a leader of a prohibited hate group (within the meaning of Part 5.3B); or(3) Schedule 2, page 43 (after line 28), after item 2, insert:2A Paragraph 5C(1)(d)Omit \"there is a risk\", substitute \"there is a reasonable risk\"._____SHEET 2(1) Schedule 1, item 13, page 13 (after line 31), at the end of section 114A.3, add:(7) In this section, a reference to race"
    aye_means: "For agreeing to the bill, as amended, at consideration in detail: new hate-speech and hate-group offences, with aggravation for 'spiritual leaders' who incite."
    yea: -1
    why_yea: "Voted for the hate speech and hate group offences bill."
    flag: "Uncertain direction. CitizenGO opposed hate-speech laws in Ireland and Scotland; this bill adds offences aimed at preachers ('a spiritual leader who provides religious instruction'). But it is framed against antisemitism, and the No lobby is a mix (One Nation, Katter, Nationals, independents). Drafted Aye -1 only, No at no value. Strike it, or sign the No side too, as you judge."
    draft: true
    drafted: "Claude, 9 October 2026"

  - key: "senate-2026-01-20-22"
    title: "Combatting Antisemitism, Hate and Extremism (Criminal and Migration Laws) Bill 2026; Limitation of Debate: The question is that the remaining stages of the bill be agreed to and the bill be now passed"
    dated: "2026-01-20"

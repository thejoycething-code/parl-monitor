      Nations 22 to 1 against, the Patriots 35 for and 26 against, the Conservatives
      19 for, 16 against and 29 abstaining, nine EPP members against.

      '
    signed_off: true

  # ======================================================================
  # DRAFT READINGS, UNSIGNED (Claude, 9 October 2026).
  #
  # Christopher, 9 October 2026: "raise EU 5CA sign-off coverage". Every
  # entry below was drafted from the store (eu_divisions labels and tallies,
  # eu_votes by MEP, eu_meps groups) and the adopted texts read in full from
  # data.europarl.europa.eu/distribution/doc/<TA>_en.docx. The scope is every
  # division on our ground that the judge shows (src/eugate.py) outside the
  # areas excluded from the 5CA (migration, organ donation): 393 roll calls.
  #
  # NONE IS SIGNED. Each carries `draft: true` and `signed_off: false`, and
  # every consumer (make_eu_5ca, make_eu_tracker, eu_monitor, the queue) reads
  # signed_off, so a draft places no MEP and colours no chip. To sign: tick
  # the box in docs/5ca-eu-readings.md and run
  # `python3 tools/make_eu_5ca.py --sign-from-doc`, or by hand delete
  # `draft: true` and set `signed_off: true`.
  #
  # Three kinds of draft:
  #   * our_side favor/against with meaning lines and a `confidence:` --
  #     a proposed direction;
  #   * our_side null with `placeable: false` and a `reason:` -- evidence
  #     only (no name lists, near-unanimous, a split part without the
  #     contested words, words not on our ground, an excluded area);
  #     signing it accepts that it never places anyone;
  #   * our_side null with `read_first:` -- no direction proposed, usually
  #     because the amendment's words are not in the store. These cannot be
  #     signed until someone writes our_side or placeable: false.
  # `lobbies:` counts each MEP under their CURRENT group (eu_meps), not the
  # group at the vote. `text_voted:` is the adopted text at the position the
  # label names, located by the quoted words when the label quotes them, or
  # by the numbering offset those quotes show (said so when inferred).
  # `flag:` is a question for the signer.


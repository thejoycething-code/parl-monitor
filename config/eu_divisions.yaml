    date: 2026-09-17
    our_side: against
    meaning_favor: 'Voted to keep the words ", including age-appropriate sexual
      education," in the recital saying that access to health education can
      contribute to young people''s well-being and autonomy, so that the report
      names sexual education as part of what the EU should promote, with a
      nod to national competences. Roll call requested by Renew; carried 413
      to 143.

      '

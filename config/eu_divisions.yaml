# EU division verdicts -- the Westminster pattern (config/vote_tracker.yaml)
# applied to the European Parliament. A division's meaning comes from what
# was ACTUALLY put to the vote -- the decision event and the official
# annexes -- never from a list title, and signed_off gates every verdict:
# until Christopher signs, the page shows lobby facts with no good/bad
# colour. The Lords inversion (2026-08-31) is the standing lesson; the two
# corrections below are its EU vindication, caught before anything shipped:
# the ePrivacy roll call was NOT on the derogation but on FAST-TRACKING it,
# and the SDG roll call our collector stored was a SPLIT vote on one
# paragraph, taken electronically with no name lists at all.
#
# Sides use the EP's own vocabulary: favor / against.

divisions:
  MTG-PL-2026-07-09-DEC-195749:
    short: "Nigeria: persecution of Christians resolution"
    date: 2026-07-09
    # Grounded: joint motion for resolution RC-B10-0345/2026/REV1, the vote
    # on the resolution as a whole (decision event, recorded in
    # PV-10-2026-07-09-RCV-ITM-056); adopted text TA-10-2026-0268,
    # "Ongoing persecution of Christians in Nigeria, notably the Kawel
    # village massacre". Passed 510-1-86, 597 recorded positions.
    our_side: favor
    meaning_favor: >
      Backed the resolution condemning the ongoing persecution of
      Christians in Nigeria, including the Kawel village massacre, and
      calling for EU action to protect them.
    meaning_against: >
      Opposed the resolution condemning the persecution of Christians in
      Nigeria.
    signed_off: true   # Christopher, 2026-09-01

  MTG-PL-2026-07-07-DEC-195338:
    short: "ePrivacy scanning derogation: fast-track request"
    date: 2026-07-07
    # Grounded: the roll call (RCV annex, DlvId 992951) was
    # "C10-0178/2026 - Request for an urgent decision" -- Rule 170 urgent
    # procedure on the file extending the ePrivacy derogation that lets
    # providers scan private messages for child sexual abuse material.
    # NOT a vote on the derogation's substance: a vote on FAST-TRACKING
    # it, passed 331-304-11 with 646 recorded positions. The chat-control
    # camp votes favor here; scrutiny-and-privacy votes against urgency.
    our_side: against
    meaning_favor: >
      Voted to fast-track the extension of the ePrivacy derogation that
      permits scanning of private messages, cutting short parliamentary
      scrutiny of a mass-surveillance precedent.
    meaning_against: >
      Voted against fast-tracking the message-scanning derogation,
      insisting a measure touching the privacy of every private message
      deserves full scrutiny.
    signed_off: true   # Christopher, 2026-09-01

  MTG-PL-2026-07-07-DEC-194870:
    short: "SDG resolution (2026 High-Level Political Forum)"
    date: 2026-07-07
    # Grounded: A10-0187/2026 (Mandl/Maran), the vote on the MOTION AS A
    # WHOLE -- the roll call the RCV annex carries (DlvId 992924, passed
    # 374-185, 633 recorded positions; the first collector run missed it
    # by storing only the first decision event). The adopted text
    # TA-10-2026-0250 endorses delivery of the full 2030 Agenda and its
    # paragraph 10, read in full from the official text, prioritises
    # "access to sexual and reproductive health services" -- the SRHR
    # frame used to push abortion access through development funding.
    our_side: against
    meaning_favor: >
      Backed the resolution endorsing delivery of the full 2030 Agenda,
      including paragraph 10's call to prioritise access to "sexual and
      reproductive health and rights" services through EU development
      policy.
    meaning_against: >
      Opposed the SDG resolution whose text embeds "sexual and
      reproductive health and rights" prioritisation in EU development
      policy.
    signed_off: true   # Christopher, 2026-09-01

  MTG-PL-2026-07-07-DEC-195295:
    short: "SDG resolution: paragraph 10 (SRHR in WASH)"
    date: 2026-07-07
    # DELIBERATELY NO VERDICT, two independent reasons:
    # (1) the vote was a SPLIT on paragraph 10 (the WASH paragraph whose
    #     text invokes "sexual and reproductive health and rights" --
    #     read in full from TA-10-2026-0250 via the official site), and
    #     WHICH PART of the split this 440-146-50 tally decided is stated
    #     only in the votes-results PDF annex, which the pipeline cannot
    #     read; scoring the wrong part inverts the verdict -- the exact
    #     Lords mistake;
    # (2) it was an electronic vote with NO name lists (zero recorded
    #     positions), so no member could be judged on it anyway.
    # It stays in the store as context; the page renders it unscored.
    our_side: null
    signed_off: false

  MTG-PL-2026-09-15-DEC-195987:
    short: "European Democracy Shield: special committee report"
    date: 2026-09-15
    # Grounded in the TEXT, not the title. Report A10-0199/2026, rapporteur
    # Tomas Tobe; the roll call labelled "Motion for a resolution (as a
    # whole)", the only one of the 86 on that report that is not a recital,
    # paragraph or amendment split. Adopted text TA-10-2026-0286, read in
    # full (390 paragraphs, 134 operative) from
    # data.europarl.europa.eu/distribution/doc/TA-10-2026-0286_en.docx --
    # the ELI distribution path answers 200 where the doceo TA page
    # bot-walls at 202, so the spec's "ship linkless" no longer holds.
    # Adopted 420-220-26, 666 recorded positions.
    #
    # What it does: para 21 demands "full implementation and effective
    # enforcement" of the whole digital acquis (DSA, DMA, TTPA, AI Act,
    # EMFA); para 22 calls VLOP recommender systems a systemic risk to
    # civic discourse under DSA Articles 34-35; para 25 makes the Code of
    # Conduct on Disinformation a benchmark for DSA compliance; paras 27
    # and 30 press the Commission to accelerate its investigations into X
    # and Grok and to classify Telegram as a VLOP; paras 13-14 give the
    # European Centre for Democratic Resilience a mandate feeding the DSA
    # risk assessments. Paras 35 and 36 do carry free-expression
    # safeguards and a right to challenge moderation decisions -- recorded
    # here because a fair reading must, and because they are the strongest
    # argument the other way.
    #
    # ANCHOR CHECK (the Lords inversion test), by group on this roll call:
    # against -- Patriots for Europe 0-33, ECR 1-21, ESN 0-7, Non-attached
    # 0-9, The Left 4-13 (on civil-liberties grounds); favor -- EPP 84-0,
    # S&D 60-0, Renew 42-0, Greens/EFA 28-1. Every group we stand with on
    # online speech is in the against lobby. 201 of the 666 positions are
    # from MEPs whose group is not yet enriched, so the tallies above are
    # the 465 that are known.
    our_side: against
    meaning_favor: >
      Backed the Democracy Shield report, which demands full enforcement of
      the Digital Services Act and the rest of the EU digital acquis, treats
      platform recommender systems as a systemic risk to be mitigated, makes
      the disinformation code a benchmark for compliance, and presses the
      Commission to press on with its cases against X, Grok and Telegram.
    meaning_against: >
      Refused to endorse a wider disinformation-enforcement apparatus built
      on the Digital Services Act, and the treatment of lawful online speech
      as a systemic risk for platforms to manage under regulatory pressure.
    signed_off: true   # Christopher, 2026-09-17

  # ----------------------------------------------------------------------
  # The ePrivacy scanning derogation: the SUBSTANCE, 9 July 2026.
  #
  # Only the 7 July FAST-TRACK request was signed on 1 September, because the
  # substantive second reading was never collected: the item is labelled
  # "Temporary derogation from the ePrivacy directive ***II" and nothing in
  # the taxonomy said ePrivacy. The 7 July vote matched only through the words
  # "child sexual abuse" in its longer title, which also filed it under area 6.
  # ePrivacy joined tier 1 at taxonomy v1.7 (17 Sept 2026) and the sitting's
  # 28 roll calls came in.
  #
  # Grounded in the adopted text TA-10-2026-0266, read in full (167 paragraphs)
  # from data.europarl.europa.eu/distribution/doc/TA-10-2026-0266_en.docx, and
  # in the decision events themselves. What the Regulation does: permits
  # providers of number-independent interpersonal communications services
  # (webmail, messaging) to scan VOLUNTARILY for online child sexual abuse,
  # derogating from Articles 5(1) and 6(1) of Directive 2002/58/EC. It does not
  # apply to audio. Regulation (EU) 2021/1232 carried the previous regime and
  # EXPIRED on 3 April 2026 when the co-legislators could not agree, so this
  # revives a lapsed power rather than extending a running one.
  #
  # Direction: Christopher, 17 September 2026, asked which side is ours on a
  # proposal to reject and answered REJECT. Recorded because it is not
  # derivable: the anchor groups split against type here, the European
  # People's Party being the pro-scanning bloc (157-158 against rejection,
  # 156 against the encryption carve-out) while Patriots for Europe, the
  # Conservatives and Reformists and Europe of Sovereign Nations voted to
  # reject. The privacy coalition is Greens, The Left and the sovereigntist
  # right together.

  MTG-PL-2026-07-09-DEC-195775:
    short: "ePrivacy derogation: rejection proposal (Left, Greens, ESN)"
    date: 2026-07-09
    # Activity order 2, 13:21:39, taken BEFORE the amendments. Tabled by The
    # Left, Verts/ALE and ESN. 314-276-17 of 607 attending: a plurality for
    # rejection, but a second-reading rejection needs a majority of COMPONENT
    # members (361 of 720), so the outcome is REJECTED with 314 in favour.
    our_side: favor
    meaning_favor: >
      Voted to reject the Council position outright, refusing to give
      providers any legal basis to scan private messages, before the
      Parliament had amended the text.
    meaning_against: >
      Voted to let the second reading proceed rather than reject the
      scanning derogation at the outset.
    signed_off: true   # Christopher, 2026-09-17

  MTG-PL-2026-07-09-DEC-195807:
    short: "ePrivacy derogation: final rejection proposal (Rule 68(4))"
    date: 2026-07-09
    # Activity order 31, 13:34:02, the LAST vote of the item, taken after every
    # amendment including the end-to-end encryption carve-out. Rule 68(4).
    # 276-286-30 of 592 attending. This is the decisive question on the
    # derogation: with the text as amended in front of them, the House was
    # asked to reject it and declined by ten votes.
    our_side: favor
    meaning_favor: >
      Voted to reject the scanning derogation even as amended, holding that
      no legal basis should exist for providers to read private messages.
    meaning_against: >
      Voted to let the amended derogation stand, keeping a voluntary legal
      basis for providers to scan private messages for child sexual abuse
      material.
    signed_off: true   # Christopher, 2026-09-17

  MTG-PL-2026-07-09-DEC-195778:
    short: "ePrivacy derogation: exclude end-to-end encryption (Am 30)"
    date: 2026-07-09
    # Amendment 30 to Article 1: "This Regulation does not apply to
    # interpersonal communications to which end-to-end encryption is, has been
    # or will be applied." CARRIED 369-236-6 and it is in the adopted text, so
    # the Parliament's position excludes encrypted messaging from scanning
    # altogether. The companion exclusion in Article 3 (Am 26 CP3 = 31 CP3 = 6
    # = 21) carried 362-235-5 the same afternoon and is not signed separately:
    # same question, same lobbies.
    our_side: favor
    meaning_favor: >
      Voted to put end-to-end encrypted communications beyond the reach of
      the scanning derogation entirely.
    meaning_against: >
      Voted against excluding end-to-end encrypted communications, leaving
      encrypted messaging within the derogation's reach.
    signed_off: true   # Christopher, 2026-09-17

# The eight Nigeria amendment roll calls (Am 1, 2/1, 2/2, 4/1, 4/2, 5,
# 6/1, 6/2 -- all rejected, ~595 positions each) remain UNVERDICTED: their
# amendment texts are not reachable through any public URL pattern the
# pipeline could verify (doceo AM-doc guesses 404; OEIL lists only the
# source motions), and a verdict on an unread text is the Lords inversion.
# They render neutrally in the tracker's fold. If the texts surface, draft
# meanings per amendment and sign here.

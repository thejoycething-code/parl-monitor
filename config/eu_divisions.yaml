    short: 'Social media and young people: the words "and rights" after "sexual and reproductive health" (§ 85, part 2)'
    date: 2026-09-17
    our_side: against
    meaning_favor: 'Voted to keep the words "and rights" in the paragraph on young
      people''s access to information on sexual and reproductive health, so that
      the report speaks of "sexual and reproductive health and rights", the SRHR
      formulation under which abortion is framed as a right. Split requested by

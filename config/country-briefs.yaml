# Campaign briefs for the new countries (tools/country_briefs.py,
# src/country_briefs.py). Hand-edited. 10 October 2026.
#
# language: "en" writes the campaigner text in English, as rulebook rule 6
# (docs/brief-builder/rulebook.md) and the German briefs do (Chris, 10
# October 2026: "keep briefs in English per rule 6"); "local" would write it
# in the country's own language. Cell labels, the form's header values and the Builder tab
# are English either way.
language: en

campaigner:
  name: Christopher Joyce
  email: cjoyce@citizengo.net

# Per country:
#   list         the Asana form's List value (rulebook cell 5)
#   lang         phrase table in src/brief_phrases.py
#   language     cell 16's language and variant (English, for the copy step)
#   chamber      the deciding body, in the country's own words
#   chambers     the store's chamber codes -> names (bicameral countries)
#   members      what members are called, plural, in the country's language
#   terms        institutional terms for cell 16, in the country's language
#   publisher    the primary source's name for cell 28
#   glossary     official term -> CitizenGO framing, by bill key (cell 1;
#                rulebook dependency 1, starts empty)
#   allies, opponents   the registers (rulebook: campaigner-maintained, start
#                empty); a proposed addition goes on the Builder tab first

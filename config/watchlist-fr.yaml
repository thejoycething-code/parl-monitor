# France watchlist -- GROUNDWORK DRAFT (9 October 2026), not yet reviewed by
# anyone who campaigns in France.
#
# Until Christopher approves a France term list (docs/france-scope.md,
# "Proposed taxonomy"), the collector classifies French text with the
# Quebec list (config/taxonomy-qc.yaml), read-only. This file carries what
# that list cannot see: dossiers on our ground whose titles use French legal
# terms Quebec does not ("aide a mourir", "assistance medicale a la
# procreation", "questionnement de genre", "reconnaissance du genre a l'etat
# civil"), measured as misses in the scope probe.
#
# APPLIED BY KEY, NEVER BY TITLE (src/fr_store.add_watch_areas). Keys are the
# Assemblee nationale's dossier uid: 'DLR5L<legislature>N<number>'. A dossier
# keeps its key across readings and across the navette with the Senat; it
# does not survive a dissolution unless the Senat has adopted it.
#
# LIFTED 12 October 2026 (Chris: "score all amendments and reverse France's
# decision"): France has no sign-off scope now; every watched or tier-1 vote,
# amendments and articles included, is drafted and read. An `amendments:`
# list below no longer changes what is drafted. What the scope was:
#
# 5CA SIGN-OFF SCOPE (Chris, 10 October 2026): France's stance sign-off
# (config/fr_stance.yaml, src/country5ca.py) covers only votes on the whole
# text and motions to reject it, plus the amendment and article votes listed
# here, under their dossier's entry, as an optional `amendments:` list:
#
#   "DLR5L17N51670": {areas: [2], why: "...",
#                     amendments: ["an-17-1773", "n° 3"]}
#
# Each item is either a division key from the store ('an-17-1773', exact)
# or an amendment number as the Assemblee's wording gives it ("n° 3" or 3),
# which opts in every vote in that dossier on that number (numbers restart
# with each reading, so the key is the exact form). The next
# `tools/country_5ca.py --draft` drafts a newly watched vote for sign-off.
# No amendment is watched yet.

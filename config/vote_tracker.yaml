      bad: for abortion clinic buffer zones

  - id: non-crime-hate
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Crime and Policing Bill"]
    name: Non-crime hate incidents
    area: 7
    bill: Crime and Policing Bill - New Clause 7
    # The note previously called this a free vote. The division record refutes
    # that: Labour 0 aye / 306 no, Conservative 93 aye / 0 no, with only
    # Independents splitting. A genuine free vote on the same Bill (NC1,
    # abortion) split four parties both ways. Corrected 2026-08-07 -- the
    # tracker's whole claim is that it can tell conviction from obedience.
    note: >-
      Non-crime hate incidents are recorded by police against named individuals
      who have committed no offence. New Clause 7 would have abolished the
      category. Unlike the abortion and assisted suicide votes on this tracker,
      this was a whipped party vote: every Conservative who voted backed it and
      every Labour and Liberal Democrat member who voted opposed it, so a vote
      here reflects a party position as much as a personal one.
    status: Rejected by the Commons in June 2025.
    # Drafted 2026-08-31; signed off by Christopher, 2026-08-31.
    stance:
      good: to abolish non-crime hate incidents
      bad: to keep non-crime hate incidents

  - id: parental-rights
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Children's Wellbeing and Schools Bill", "Children’s Wellbeing and Schools Bill"]
    name: Parental rights in education
    area: 6
    bill: Various
    # "Never divided on the register" verified 2026-08-07 by walking all 22
    # Commons divisions on the Bill. The register is clause 26; no division
    # touched it. Report stage divisions were mobile phones (NC36), inspection
    # (188), SEND (171), free school meals (NC7, NC34) and the deletion of
    # clauses 45 and 51. The 2026 ping-pong rounds were on safeguarding,
    # staying-put funding, care leavers, kinship care, a Child Protection
    # Authority and screen use. Re-check if the Bill returns to the Commons.
    note: >-
      The register of children not in school was debated at length during the
      Children's Wellbeing and Schools Bill, but the Commons never divided on
      the register itself. Every division on the Bill - twenty-two of them,
      from Second Reading in January 2025 to the last exchange with the Lords
      in April 2026 - was on something else: school inspection, free school
      meals, SEND provision, mobile phones, safeguarding, care leavers or
      kinship care. The Bill's Third Reading is shown here because it enacted
      the register, with the caveat that the Bill covered much else besides.
      The other two entries are the only occasions the Commons voted on
      parental rights in education directly.
    status: >-
      The register became law in the Children's Wellbeing and Schools Act 2026.
      The Ten-Minute Rule Bill and the opposition day motion both failed.
    # Drafted 2026-08-31; signed off by Christopher, 2026-08-31.
    stance:
      good: for parental rights in education
      bad: against parental rights in education

  - id: abortion-ni
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Abortion (Northern Ireland)"]
    name: Abortion services in Northern Ireland
    area: 1
    bill: Abortion (Northern Ireland) Regulations
    note: >-
      Three approval motions under the Northern Ireland (Executive Formation
      etc) Act 2019, each going further than the last. The 2020 regulations set
      the grounds and time limits. The 2021 regulations gave the Secretary of
      State power to direct Northern Ireland ministers and health bodies to
      commission services. The 2022 regulations removed the need for Northern
      Ireland Executive agreement and required the Department of Health to fund
      them. That escalation is why the same question returned three years
      running, and why the three votes are not interchangeable.
    status: All three approval motions were agreed by the Commons.
    # Drafted 2026-08-31; signed off by Christopher, 2026-08-31.
    stance:
      good: against the Northern Ireland abortion regulations
      bad: for the Northern Ireland abortion regulations

  # -- Gender medicine and single-sex NHS facilities. Both reached the floor as
  #    new clauses to the Health Bill at report stage on 8 September 2026, and
  #    NEITHER was visible to the division sweep: the titles read "Health Bill:
  #    Report Stage: New Clause 142", which carries no taxonomy term. Found on
  #    10 Sept from a passing reference at Women and Equalities questions.
  #    DRAFTED 2026-09-10 by Claude at Christopher's instruction; the divisions
  #    below carry signed_off: false, so the votes render with NO verdict until
  #    Christopher signs them.
  - id: gender-medicine
    # The Health Bill is a large structural NHS bill: most of its debate is
    # about NHS England, commissioning and medical devices. Matching its title
    # admits those quotes too, so the area filter is doing the work here. Watch
    # the card's quotes and narrow this if anything off-topic appears.
    debate_match: ["Health Bill"]
    name: Puberty blockers for under-18s
    area: 3
    bill: Health Bill - New Clause 142
    note: >-
      New Clause 142 would have required the Secretary of State to make
      regulations, within three months, preventing puberty blockers being
      prescribed, dispensed or supplied to under-18s for gender dysphoria or
      gender incongruence, and barring their use in related clinical trials
      without Parliament's specific approval. It was moved by Dr Caroline
      Johnson with nine sponsors. The division was largely party-shaped --
      Conservative 88 aye to 0 no, Labour 3 to 292 -- but three parties split
      both ways, so the four members who crossed the grain (Graham Stringer,
      Mary Glindon and Jonathan Hinder for Labour, Angus MacDonald for the
      Liberal Democrats) are the conscience signal here rather than the totals.
    status: Rejected by the Commons 108-357 on 8 September 2026.
    stance:
      good: to ban puberty blockers for under-18s for gender dysphoria
      bad: against banning puberty blockers for under-18s

  - id: single-sex-nhs
    debate_match: ["Health Bill"]
    name: Single-sex NHS facilities
    area: 5
    bill: Health Bill - New Clause 143
    note: >-
      New Clause 143 would have required the Secretary of State to ensure
      single-sex changing rooms, toilets and washing facilities for NHS staff,
      and single-sex wards and washing facilities for NHS patients, with
      exemptions for children, intensive care and named circumstances. It was
      moved by Dr Caroline Johnson with eight sponsors. Unlike the puberty
      blockers clause above, NO party split both ways on this one -- Labour 0
      aye to 293 no, Conservative 88 to 0 -- so a vote here reflects a party
      position as much as a personal one, and should be read as the non-crime
      hate incidents card is read.
    status: Rejected by the Commons 106-302 on 8 September 2026.
    stance:
      good: to require single-sex facilities for NHS patients and staff
      bad: against requiring single-sex facilities in the NHS


  - id: children-social-media
    # Same debate_match as parental-rights: both cards draw quotes from the
    # Children's Wellbeing and Schools Bill debates, and the area filter (6 for
    # both) does not separate them. If off-topic quotes appear on either card,
    # narrow this one to the ping-pong dates (9 Mar, 15 Apr, 22 Apr 2026).
    debate_match: ["Children's Wellbeing and Schools Bill", "Children’s Wellbeing and Schools Bill"]
    name: Children's social media and smartphones in schools
    area: 6
    bill: Children's Wellbeing and Schools Bill - Lords Amendments 37, 38 and 106; New Clause 36
    note: >-
      The Lords put three protections into the Bill: Lords Amendment 38 (Lord
      Nash) barring under-16s from social media platforms, Lords Amendment 37
      on children's use of VPNs, and Lords Amendment 106 requiring schools to
      prohibit smartphones during the school day. The Commons removed all three
      on 9 March 2026, again on 15 April and, on social media, a third time on
      22 April, each time replacing them with a Government power to act by
      regulations after a consultation. Whipped votes: Conservatives and Liberal
      Democrats for the Lords' protections, Labour against, so a vote here
      reflects a party position as much as a personal one.
    status: >-
      Every Lords protection was rejected by the Commons; the Act carries a
      regulation-making power and a duty to report progress within six months.
    # Drafted 2026-09-10 from batches 1 and 2 of the division review. Christopher
    # agreed the issue on 2026-09-10 and signed off all six divisions on 2026-09-11.
    stance:
      good: to protect children from social media and smartphones in schools
      bad: against protecting children from social media and smartphones in schools

  - id: sexual-exploitation
    debate_match: ["Criminal Justice Bill"]
    name: Sexual exploitation of adults
    area: 12
    bill: Criminal Justice Bill - New Clause 44
    note: >-
      New Clause 44, moved by Jess Phillips at the Criminal Justice Bill's report
      stage on 15 May 2024, would have renamed the Sexual Offences Act 2003
      offences of causing, inciting or controlling "prostitution for gain" as
      sexual exploitation, and defined it as conduct that "manipulates, deceives,
      coerces or controls another person to undertake sexual activity" - so that
      adult victims are recognised in law as victims, as children have been since
      2015. The Minister resisted "not because there is any real dispute of
      principle, but because there is dispute of degree". A whipped vote: Labour,
      Liberal Democrats, Greens, Plaid Cymru, SDLP and Alliance for; Conservatives
      against. The Bill fell at the 2024 dissolution.
    status: Rejected by the Commons 167-275 on 15 May 2024; the Bill fell at the dissolution.
    # Drafted 2026-09-11 (batch 4 of the division review); Christopher agreed the
    # issue and signed off the division on 2026-09-11.
    stance:
      good: to recognise coerced and controlled adults as victims of sexual exploitation
      bad: against recognising coerced and controlled adults as victims of sexual exploitation


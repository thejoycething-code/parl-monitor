# MP vote tracker: which divisions the public tracker shows, and what each
# vote MEANT in plain English.
#
# This file is editorial, not automatic. The monitor holds 245 matched
# divisions, but most are whipped ping-pong motions where "what did an Aye
# mean" has no honest one-line answer, and publishing a guess would cost us
# the credibility the tool exists to have. So divisions are added here
# deliberately, with meaning lines a human has written.
#
#   signed_off: false  -> the tracker renders it with the pending-sign-off
#                         notice. Set true only when the wording has been
#                         checked against Hansard by a person.
#   landmark: true     -> shown under "Key votes"; everything else sits in
#                         the collapsible "Amendment votes" section.
#   our_side           -> which way was CitizenGO's side. Drives nothing in
#                         the public view (which states facts, not verdicts)
#                         but lets the internal build show alignment.
#
# Division ids are Commons division ids: the number in div:cNNNN in the
# ledger, and in votes.parliament.uk/Votes/Commons/Division/NNNN.
# Candidates the ledger can offer: python3 tools/make_vote_tracker.py --candidates

# Areas tracked in the ledger but never shown on the tracker (Christopher,
# 2026-08-06). Migration's Commons record is almost entirely whipped
# motions-to-disagree during ping-pong, where "what did an Aye mean" has no
# honest one-line answer, and it is already out of the 5CA. We keep capturing
# it -- the candidate finder still lists it, marked HIDDEN -- and publish
# nothing.
hidden_areas:
  - 11   # migration

# Bills whose Public Bill Committee attendance is collected into the store
# (committee_attendance, via tools/pull_pbc_attendance.py). The name must be
# the bill as Hansard titles its sittings: "<name> (Nth sitting)".
# COLLECTED BUT NOT DISPLAYED (Christopher, 2026-08-31).
pbc_attendance:
  - Terminally Ill Adults (End of Life) Bill

# Per-issue keys the tracker also understands (all optional):
#   stance:   {good: ..., bad: ...} -- the member-card rollup phrases,
#             "Consistently voted <good>". Editorial; signed off 2026-08-31
#             and then PARKED the same day (Christopher: "for now also
#             remove stance trackers") -- nothing renders them until the
#             template's rollup block returns.
#   board_id: the bills_board row for the bill AS IT NOW STANDS, so the card
#             can say what happens next without hand-edited dates.
#   action:   {url: ..., label: ...} -- a live CitizenGO action, rendered as
#             a button on the bill card when both are set. ON AN ISSUE WITH
#             A board_id THE ACTION DIES ONLY WHEN THE BILL HAS (Christopher,
#             2026-08-31): the builder withholds it only once the board row
#             is CLOSED -- fell or Royal Assent -- and keeps it through a
#             missing row or any other uncertainty, because absence of
#             evidence is not a death certificate. Without a board_id there
#             is nothing to watch and the action always ships.

issues:
  - id: assisted-suicide
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    #
    # BOUNDED: the Edwards Bill below carries the same short title, and a
    # title match cannot tell the two Bills apart -- the calendar can. This
    # Bill's session fell at the end of April 2026 (Royal Assents in the
    # wash-up are dated 2026-04-29), so nothing after 30 April can be a
    # debate on it.
    debate_match: ["Terminally Ill Adults"]
    debate_until: "2026-04-30"
    name: Assisted suicide
    area: 2
    bill: Terminally Ill Adults (End of Life) Bill
    note: >-
      A Private Member's Bill introduced by Kim Leadbeater MP to legalise
      assisted suicide for terminally ill adults in England and Wales. All
      divisions were free votes: MPs voted according to personal conviction,
      not a party whip.
    # Every date and count here is from the Bills API: Lords 2nd reading
    # 2025-09-12, Lords committee 2025-11-14, and the new session's Bill
    # (4157) awaiting Commons 2nd reading on 2026-09-11. The previous wording
    # said "after 14 days in committee", which nothing on the record supports
    # (Christopher, 2026-08-07).
    # The Leadbeater Bill's story ENDS at the fall of the session: the 2026
    # Bill is a separate Bill with its own card below (Christopher,
    # 2026-08-31: "they are two separate Bills"), which is where the forward
    # look and the petition now live.
    # Status redrafted 2026-08-31 for the split; signed off by Christopher, 2026-08-31.
    status: >-
      Passed all Commons stages (Third Reading 314-291, 20 June 2025). Given a
      Second Reading by the House of Lords on 12 September 2025 and considered
      in committee from 14 November 2025, but it ran out of time and fell when
      the parliamentary session ended in April 2026.
    # One line per member: "Consistently/Generally voted <phrase>", computed
    # from their good/bad votes on this issue's signed-off divisions. The
    # phrase is EDITORIAL: no line renders on an issue without one, and the
    # arithmetic never overrides the wording.
    # Drafted 2026-08-31; signed off by Christopher, 2026-08-31.
    stance:
      good: against assisted suicide
      bad: for assisted suicide

  # THE 2026 BILL -- a separate Bill from Kim Leadbeater's, with the same
  # short title and its own card (Christopher, 2026-08-31). `upcoming: true`
  # renders in the LIVE NOW band with no divisions: status, the board's
  # forward look, and the petition.
  #
  # WHEN ITS FIRST DIVISION IS HELD (11 September, if the Second Reading
  # divides): add the division here under this issue id, drop `upcoming`,
  # give the issue a stance -- and the Bill appears in BOTH places
  # (Christopher, 2026-08-31): the full card lands in The Record, while
  # the band KEEPS the Bill for as long as board 4157 stays live, its
  # hero now showing the member's own newest vote in place of the
  # "vote will appear here" promise. The band lets go only when the
  # board row closes.
  - id: assisted-suicide-2026
    name: Assisted suicide (the 2026 Bill)
    area: 2
    bill: Terminally Ill Adults (End of Life) Bill
    upcoming: true
    # The other half of the boundary on the Leadbeater issue above: every
    # "Terminally Ill Adults" debate from the new session on is THIS Bill's.
    # The windows must not overlap and must not leave a gap -- a test holds
    # both. Speeches matched here render on this card (count and quotes),
    # so the new Bill's Second Reading debate has a home from day one.
    debate_match: ["Terminally Ill Adults"]
    debate_from: "2026-05-01"
    note: >-
      A fresh Private Member's Bill to legalise assisted suicide for
      terminally ill adults in England and Wales, sponsored by Lauren
      Edwards MP. A separate Bill from Kim Leadbeater's, with the same
      short title.
    # Status drafted 2026-08-31 for the split; signed off by Christopher, 2026-08-31.
    status: >-
      Introduced by Lauren Edwards MP in the current session. The question
      returns to the Commons for a Second Reading vote on 11 September 2026
      - the first division on this Bill.
    # The band's headline, as chosen in the C mockup (Christopher,
    # 2026-08-31): "LIVE NOW · THE ASSISTED SUICIDE BILL". Used only when
    # exactly one upcoming issue carries one; otherwise the band falls back
    # to the generic "Before Parliament".
    live_label: The assisted suicide Bill
    # What the next vote DECIDES, in one sentence: the status states the
    # facts, this states the stakes. Margin checked against the record --
    # Third Reading passed 314-291 on 20 June 2025, a margin of 23.
    # Drafted 2026-08-31; signed off by Christopher, 2026-08-31.
    decides: >-
      Second Reading is the vote on the principle: the Commons' first
      yes-or-no on assisted suicide since the last Bill passed its final
      Commons stage by just 23 votes in June 2025.
    # The bills_board row for THIS Bill. The tracker reads the board's stage
    # and next_key_date at build time, so "what happens next" stays current
    # as long as the weekly board refresh runs, with no copy to re-edit.
    board_id: 4157
    # The petition (Christopher, 2026-08-31): the builder keeps the button
    # until board 4157 records the Bill's end, and drops it the week the
    # row closes. The label is EVERGREEN by instruction, given twice: no
    # delivery date in it -- signatures continue for as long as the Bill
    # is active, and the 4 September delivery is a campaign milestone, not
    # a closing date.
    # Keep this URL CLEAN of tracking parameters: the builder stamps every
    # action link with the monitor's UTMs (utm_source=cgo-monitor, medium,
    # utm_campaign=cgo-monitor-<issue id>) at build time. A URL that already
    # carries utm_ parameters is left alone, so a hand-tuned link wins.
    action:
      url: https://citizengo.org/en-gb/lf/18429-parliament-is-being-asked-to-legalise-assisted-suicide--again---
      label: Sign the petition

  - id: abortion
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Crime and Policing Bill"]
    name: Abortion decriminalisation
    area: 1
    bill: Crime and Policing Bill - New Clause 1
    note: >-
      A landmark free-vote amendment (New Clause 1) to the Crime and Policing
      Bill, a wider Government bill. The host bill's own Second and Third
      Readings were not abortion votes and are deliberately not shown here.
    status: Agreed by the Commons 379-137 on 17 June 2025 and added to the Bill.
    # Drafted 2026-08-31; signed off by Christopher, 2026-08-31.
    stance:
      good: against decriminalising abortion
      bad: to decriminalise abortion

  - id: buffer-zones
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the

    short: "Silent prayer exemption within buffer zones"
    context: "Amendment (a) to Lords Amendment 5 to the Public Order Bill."
    meaning_aye: >-
      Supported exempting silent prayer and consensual communication from the new offence of interfering with access to abortion services, so that neither could be prosecuted inside a buffer zone.
    meaning_no: >-
      Opposed the exemption, leaving silent prayer and consensual communication within the scope of the offence.


  - id: 1491
    issue: buffer-zones
    stage: Division
    stage_group: Division
    landmark: false
    signed_off: true
    our_side: "aye"
    # Declared 2026-08-24. The inference could not decide: no whip wording in
    # the context, and the bloc test needs BOTH big parties near-unanimous on
    # opposite sides, which fails on a 107-109 Conservative split. The
    # evidence says free, and the decisive comparator is on the same bill --
    # the 150-metre buffer zones amendment is confirmed free and has almost
    # the same shape (Lab 158-0, Con 113-104 there; Lab 0-169, Con 107-109

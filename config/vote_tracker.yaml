  - id: non-crime-hate
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Crime and Policing Bill"]
    name: Non-crime hate incidents
    area: 7
    bill: Crime and Policing Bill - New Clause 7
    # The note previously called this a free vote. The division record refutes
    # that: Labour 0 aye / 306 no, Conservative 93 aye / 0 no, with only
    # Independents splitting. A genuine free vote on the same Bill (NC1,
    # abortion) split four parties both ways. Corrected 2026-08-07 -- the
    # tracker's whole claim is that it can tell conviction from obedience.
    note: >-
      Non-crime hate incidents are recorded by police against named individuals
      who have committed no offence. New Clause 7 would have abolished the
      category. Unlike the abortion and assisted suicide votes on this tracker,
      this was a whipped party vote: every Conservative who voted backed it and
      every Labour and Liberal Democrat member who voted opposed it, so a vote
      here reflects a party position as much as a personal one.
    status: Rejected by the Commons in June 2025.

  - id: parental-rights
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Children's Wellbeing and Schools Bill", "Children’s Wellbeing and Schools Bill"]
    name: Parental rights in education
    area: 6
    bill: Various
    # "Never divided on the register" verified 2026-08-07 by walking all 22
    # Commons divisions on the Bill. The register is clause 26; no division
    # touched it. Report stage divisions were mobile phones (NC36), inspection
    # (188), SEND (171), free school meals (NC7, NC34) and the deletion of
    # clauses 45 and 51. The 2026 ping-pong rounds were on safeguarding,
    # staying-put funding, care leavers, kinship care, a Child Protection
    # Authority and screen use. Re-check if the Bill returns to the Commons.
    note: >-
      The register of children not in school was debated at length during the
      Children's Wellbeing and Schools Bill, but the Commons never divided on
      the register itself. Every division on the Bill - twenty-two of them,
      from Second Reading in January 2025 to the last exchange with the Lords
      in April 2026 - was on something else: school inspection, free school
      meals, SEND provision, mobile phones, safeguarding, care leavers or
      kinship care. The Bill's Third Reading is shown here because it enacted
      the register, with the caveat that the Bill covered much else besides.
      The other two entries are the only occasions the Commons voted on
      parental rights in education directly.
    status: >-
      The register became law in the Children's Wellbeing and Schools Act 2026.
      The Ten-Minute Rule Bill and the opposition day motion both failed.

  - id: abortion-ni
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Abortion (Northern Ireland)"]
    name: Abortion services in Northern Ireland
    area: 1
    bill: Abortion (Northern Ireland) Regulations
    note: >-
      Three approval motions under the Northern Ireland (Executive Formation
      etc) Act 2019, each going further than the last. The 2020 regulations set
      the grounds and time limits. The 2021 regulations gave the Secretary of
      State power to direct Northern Ireland ministers and health bodies to
      commission services. The 2022 regulations removed the need for Northern
      Ireland Executive agreement and required the Department of Health to fund
      them. That escalation is why the same question returned three years
      running, and why the three votes are not interchangeable.
    status: All three approval motions were agreed by the Commons.


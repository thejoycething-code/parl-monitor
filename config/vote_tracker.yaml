  # -- Northern Ireland regulations: DRAFT wording, added 2026-08-06 from the
  #    ledger. Every line below needs checking against Hansard before this
  #    issue is shown publicly.
  - id: 798
    issue: abortion-ni
    stage: Approval motion
    stage_group: Third Reading
    landmark: true
    signed_off: true
    our_side: "no"
    short: Abortion (Northern Ireland) (No. 2) Regulations 2020
    # The 2020 regulations set the GROUNDS; they commissioned nothing. The
    # previous wording said "commissioning", which is what the 2021 and 2022
    # regulations did. Grounds taken from SI 2020/503 Parts 2 and 3.
    context: >-
      Approval motion for the Abortion (Northern Ireland) (No. 2) Regulations
      2020 (SI 2020/503), which set the legal framework for abortion in Northern
      Ireland after section 9 of the Northern Ireland (Executive Formation etc)
      Act 2019 repealed sections 58 and 59 of the Offences against the Person
      Act 1861. Members of both main parties voted on both sides - Conservatives
      split 104 to 124 - so this was not a whipped vote.
    meaning_aye: >-
      Voted to approve the framework permitting abortion in Northern Ireland on
      request up to 12 weeks; up to 24 weeks where two doctors judge the risk of
      injury to the woman's physical or mental health greater than termination,
      taking account of her actual or reasonably foreseeable circumstances; and
      with no time limit where there is a risk to life, a risk of grave permanent
      injury, or a substantial risk of severe fetal impairment or fatal fetal
      abnormality.
    meaning_no: >-
      Voted against approving the framework setting the grounds and time limits
      for abortion in Northern Ireland.


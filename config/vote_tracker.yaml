  #    issue is shown publicly.
  - id: 798
    issue: abortion-ni
    stage: Approval motion
    stage_group: Third Reading
    landmark: true
    signed_off: false
    our_side: "no"
    short: Abortion (Northern Ireland) (No. 2) Regulations 2020
    context: Approval motion for the regulations commissioning abortion services in Northern Ireland.
    meaning_aye: Voted to approve the 2020 regulations commissioning abortion services in Northern Ireland.
    meaning_no: Voted against approving the 2020 regulations.

  - id: 1022
    issue: abortion-ni
    stage: Approval motion
    stage_group: Third Reading
    landmark: false
    signed_off: false
    our_side: "no"
    short: Abortion (Northern Ireland) Regulations 2021
    context: Approval motion directing the Northern Ireland Executive to commission services.
    meaning_aye: Voted to approve the 2021 regulations.
    meaning_no: Voted against approving the 2021 regulations.

  - id: 1324
    issue: abortion-ni
    stage: Approval motion
    stage_group: Third Reading
    landmark: false
    signed_off: false
    our_side: "no"
    short: Abortion (Northern Ireland) Regulations 2022
    context: Approval motion for the 2022 regulations (SI 2022 No. 554).
    meaning_aye: Voted to approve the 2022 regulations.
    meaning_no: Voted against approving the 2022 regulations.

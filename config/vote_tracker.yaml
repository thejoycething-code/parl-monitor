# MP vote tracker: which divisions the public tracker shows, and what each
# vote MEANT in plain English.
#
# This file is editorial, not automatic. The monitor holds 245 matched
# divisions, but most are whipped ping-pong motions where "what did an Aye
# mean" has no honest one-line answer, and publishing a guess would cost us
# the credibility the tool exists to have. So divisions are added here
# deliberately, with meaning lines a human has written.
#
#   signed_off: false  -> the tracker renders it with the pending-sign-off
#                         notice. Set true only when the wording has been
#                         checked against Hansard by a person.
#   landmark: true     -> shown under "Key votes"; everything else sits in
#                         the collapsible "Amendment votes" section.
#   our_side           -> which way was CitizenGO's side. Drives nothing in
#                         the public view (which states facts, not verdicts)
#                         but lets the internal build show alignment.
#
# Division ids are Commons division ids: the number in div:cNNNN in the
# ledger, and in votes.parliament.uk/Votes/Commons/Division/NNNN.
# Candidates the ledger can offer: python3 tools/make_vote_tracker.py --candidates

# Areas tracked in the ledger but never shown on the tracker (Christopher,
# 2026-08-06). Migration's Commons record is almost entirely whipped
# motions-to-disagree during ping-pong, where "what did an Aye mean" has no
# honest one-line answer, and it is already out of the 5CA. We keep capturing
# it -- the candidate finder still lists it, marked HIDDEN -- and publish
# nothing.
hidden_areas:
  - 11   # migration

issues:
  - id: assisted-suicide
    name: Assisted suicide
    area: 2
    bill: Terminally Ill Adults (End of Life) Bill
    note: >-
      A Private Member's Bill introduced by Kim Leadbeater MP to legalise
      assisted suicide for terminally ill adults in England and Wales. All
      divisions were free votes: MPs voted according to personal conviction,
      not a party whip.
    status: >-
      Passed all Commons stages (Third Reading 314-291, 20 June 2025).
      Considered by the House of Lords from September 2025; after 14 days in
      committee it ran out of time at the end of the parliamentary session.

  - id: abortion
    name: Abortion decriminalisation
    area: 1
    bill: Crime and Policing Bill - New Clause 1
    note: >-
      A landmark free-vote amendment (New Clause 1) to the Crime and Policing
      Bill, a wider Government bill. The host bill's own Second and Third
      Readings were not abortion votes and are deliberately not shown here.
    status: Agreed by the Commons 379-137 on 17 June 2025 and added to the Bill.

  - id: buffer-zones
    name: Abortion clinic buffer zones
    area: 1
    bill: Public Order Act 2023
    note: >-
      Buffer zones (formally "safe access zones") outside abortion clinics were
      added to the Public Order Bill by amendment, not by a bill of their own.
      The Bill's own Second and Third Readings were votes on protest powers
      generally and are deliberately not shown here.
    status: >-
      Buffer zones were agreed by the Commons in October 2022 and are now
      section 9 of the Public Order Act 2023. An amendment to exempt silent
      prayer was rejected in March 2023.

  - id: non-crime-hate
    name: Non-crime hate incidents
    area: 7
    bill: Crime and Policing Bill - New Clause 7
    note: >-
      Non-crime hate incidents are recorded by police against named individuals
      who have committed no offence. A free-vote amendment to abolish the
      category was moved during the Crime and Policing Bill's report stage.
    status: Rejected by the Commons in June 2025.

  - id: parental-rights
    name: Parental rights in education
    area: 6
    bill: Various
    note: >-
      Parliament has not divided on a bill dedicated to parental rights in
      education. These are the two occasions the Commons voted on the question
      directly: a Ten-Minute Rule Bill and an opposition day motion.
    status: Neither proposal became law.

  - id: abortion-ni
    name: Abortion services in Northern Ireland
    area: 1
    bill: Abortion (Northern Ireland) Regulations
    note: >-
      Regulations made by the Northern Ireland Office to commission abortion
      services in Northern Ireland, following the Westminster legislation of
      2019. Approval motions rather than legislation of the Commons' own
      making, which is why the same question returns in successive years.
    status: All three approval motions were agreed by the Commons.

divisions:

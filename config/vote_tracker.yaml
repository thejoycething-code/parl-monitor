# MP vote tracker: which divisions the public tracker shows, and what each
# vote MEANT in plain English.
#
# This file is editorial, not automatic. The monitor holds 245 matched
# divisions, but most are whipped ping-pong motions where "what did an Aye
# mean" has no honest one-line answer, and publishing a guess would cost us
# the credibility the tool exists to have. So divisions are added here
# deliberately, with meaning lines a human has written.
#
#   signed_off: false  -> the tracker renders it with the pending-sign-off
#                         notice. Set true only when the wording has been
#                         checked against Hansard by a person.
#   landmark: true     -> shown under "Key votes"; everything else sits in
#                         the collapsible "Amendment votes" section.
#   our_side           -> which way was CitizenGO's side. Drives nothing in
#                         the public view (which states facts, not verdicts)
#                         but lets the internal build show alignment.
#
# Division ids are Commons division ids: the number in div:cNNNN in the
# ledger, and in votes.parliament.uk/Votes/Commons/Division/NNNN.
# Candidates the ledger can offer: python3 tools/make_vote_tracker.py --candidates

# Areas tracked in the ledger but never shown on the tracker (Christopher,
# 2026-08-06). Migration's Commons record is almost entirely whipped
# motions-to-disagree during ping-pong, where "what did an Aye mean" has no
# honest one-line answer, and it is already out of the 5CA. We keep capturing
# it -- the candidate finder still lists it, marked HIDDEN -- and publish
# nothing.
hidden_areas:
  - 11   # migration

issues:
  - id: assisted-suicide
    # Debate titles that belong to this bill card. A quote shown beside a
    # vote must come from the bill it is shown beside; matching on the
    # title is what makes that structurally true rather than inferred.
    debate_match: ["Terminally Ill Adults"]
    name: Assisted suicide
    area: 2
    bill: Terminally Ill Adults (End of Life) Bill
    note: >-
      A Private Member's Bill introduced by Kim Leadbeater MP to legalise
      assisted suicide for terminally ill adults in England and Wales. All
      divisions were free votes: MPs voted according to personal conviction,
      not a party whip.
    # Every date and count here is from the Bills API: Lords 2nd reading
    # 2025-09-12, Lords committee 2025-11-14, and the new session's Bill
    # (4157) awaiting Commons 2nd reading on 2026-09-11. The previous wording
    # said "after 14 days in committee", which nothing on the record supports
    # (Christopher, 2026-08-07).
    status: >-
      Passed all Commons stages (Third Reading 314-291, 20 June 2025). Given a
      Second Reading by the House of Lords on 12 September 2025 and considered
      in committee from 14 November 2025, but it ran out of time before the end
      of the parliamentary session. A fresh Bill was introduced in the current
      session and awaits its Commons Second Reading on 11 September 2026.


      Dying for Terminally Ill Adults (Scotland) Bill.
    # CONFIRMED by Christopher, 2026-08-21. Weights stand at -1/+1: Stage 1
    # ayes include allow-scrutiny votes (13 more ayes than Stage 3), so this
    # vote is directional but weaker than the Stage 3 question itself.
    aye: -1
    why_aye: >
      Supported the general principles at Stage 1. Weaker than the Stage 3
      vote by convention: some members vote aye at Stage 1 to allow scrutiny
      while reserving their position -- 13 more ayes here than at Stage 3.
    "no": 1
    why_no: >
      Opposed the Bill from its first vote, before any scrutiny-stage
      argument was available to justify an aye.


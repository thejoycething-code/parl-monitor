# Motion sponsorship. Proposing or co-signing scores against `sponsored:`;
# the SEQUENCE changes evidence weight (proposer > co-signer), never the
# direction -- the NI rule. Co-signatories arrive per-id via sp_supports.
motions:
  - reference: "S7M-00431"
    title: "Congratulations to For Women Scotland on Landmark Supreme Court Victory"
    dated: "2026-06-19"
    proposed_by: "Thomas Kerr (Reform UK)"
    text: >
      That the Parliament congratulates For Women Scotland on its successful
      legal challenge and the landmark Supreme Court ruling...
    # CONFIRMED 2026-08-21. Putting your name to a motion congratulating For
    # Women Scotland on the judgment is a chosen public act of alignment with
    # the sex-based rights side -- the same direction as an aye on the
    # S6M-18016.1 framing amendment, by a costlier route (a signature is
    # public and initiated, not whipped). 11 co-signers held in sp_supports.
    # Weight 1; the vote record still outranks it where both exist.
    #
    # An IDENTICAL act family exists from judgment week (April 2025):
    # S6M-17234 (Gosal, 28 signers), S6M-17241 (White, 23), S6M-17235
    # (Regan, 2) -- same line ready to copy when wanted; their proposers are
    # no longer sitting but many signers are.
    sponsored: 1
    why_sponsored: >
      Put their name to congratulating For Women Scotland on the Supreme
      Court ruling that sex in the Equality Act 2010 means biological sex.

  # The judgment-week family, April 2025 -- the same act as S7M-00431, signed
  # the day of (or the day after) the ruling itself. Texts read before adding:
  # all three welcome the judgment and congratulate For Women Scotland.
  # CONFIRMED by Christopher, 2026-08-21.
  - reference: "S6M-17234"
    title: "Welcoming the Supreme Court's Judgment on the Definition of 'Woman'"
    dated: "2025-04-16"
    proposed_by: "Pam Gosal (Conservative); 28 signers, 11 still sitting"
    sponsored: 1
    why_sponsored: >
      Signed a motion welcoming the For Women Scotland judgment on the day it
      was handed down -- that woman and sex in the Equality Act 2010 mean
      biological woman and biological sex.

  - reference: "S6M-17241"
    title: "Supreme Court Judgment on the Definition of 'Woman'"
    dated: "2025-04-17"
    proposed_by: "Tess White (Conservative); 23 signers, 10 still sitting"
    sponsored: 1
    why_sponsored: >
      Signed the motion crediting For Women Scotland's challenge for the
      ruling that the Scottish Government's guidance was incorrect.

  - reference: "S6M-17235"
    title: "Welcoming the Supreme Court's Judgment in Favour of For Women Scotland"
    dated: "2025-04-16"
    proposed_by: "Ash Regan (Alba); 2 signers, none still sitting"
    # Places nobody today -- Regan, Ewing and Mason have all left -- but the
    # family stays complete, and the line is ready if any signer returns.
    sponsored: 1
    why_sponsored: >
      Signed Alba's judgment-day motion welcoming the ruling that sex in the
      Equality Act 2010 is a fixed, biological characteristic.

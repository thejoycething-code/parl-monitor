# Holyrood meaning lines -- what an aye or a no MEANS, per division.
#
# Same contract as config/ni_stance.yaml: a HUMAN writes what a vote means;
# tools/sp_5ca.py merely applies it. An entry carrying `draft: true` places
# NOBODY -- its divisions render as evidence lines only -- until Christopher
# confirms the reading by deleting the flag. Stance values are -2..2 from
# CitizenGO's viewpoint. Sign conflicts are flagged, never averaged.
#
# Divisions are keyed on the motion REFERENCE (unique across all 656 stored:
# 'S6M-21005', 'S7M-00469.5' -- the .N suffix is an amendment, whose own text
# is in sp_items). Quote the operative text so the confirmation is made
# against the words voted on, not a title.

divisions:
  - reference: "S6M-21005"
    title: "Assisted Dying for Terminally Ill Adults (Scotland) Bill: Stage 3"
    dated: "2026-03-17"
    result: "57 aye / 69 no -- Defeated"
    text: >
      That the Parliament agrees that the Assisted Dying for Terminally Ill
      Adults (Scotland) Bill be passed.
    # CONFIRMED by Christopher, 2026-08-21. No draft flag: this entry places.
    # The cleanest confirmation the file will ever hold -- the motion text IS
    # the question ("that the Bill be passed"), so an aye and a no carry their
    # full weight with no amendment-reading required.
    aye: -2
    why_aye: >
      Voted to pass the assisted dying Bill at its final stage. The cleanest
      direction a vote can carry: this was the question itself, not an
      amendment.
    "no": 2
    why_no: >
      Voted to defeat the assisted dying Bill at Stage 3 -- the vote that
      killed it on 17 March 2026.

  - reference: "S6M-17416"
    title: "Assisted Dying (Scotland) Bill: Stage 1 general principles"
    dated: "2025-05-13"
    result: "70 aye / 56 no -- Carried"
    text: >
      That the Parliament agrees to the general principles of the Assisted
      Dying for Terminally Ill Adults (Scotland) Bill.
    # CONFIRMED by Christopher, 2026-08-21. Weights stand at -1/+1: Stage 1
    # ayes include allow-scrutiny votes (13 more ayes than Stage 3), so this
    # vote is directional but weaker than the Stage 3 question itself.
    aye: -1
    why_aye: >
      Supported the general principles at Stage 1. Weaker than the Stage 3
      vote by convention: some members vote aye at Stage 1 to allow scrutiny
      while reserving their position -- 13 more ayes here than at Stage 3.
    "no": 1
    why_no: >
      Opposed the Bill from its first vote, before any scrutiny-stage
      argument was available to justify an aye.

  - reference: "S6M-16755.3"
    title: "Amendment gutting 'Protecting Single-sex Spaces in the Public Sector'"
    dated: "2025-03-12"
    result: "57 aye / 50 no -- Carried"
    text: >
      As an amendment to motion S6M-16755 (Russell Findlay, Protecting
      Single-sex Spaces in the Public Sector), leave out from "believes" to
      end and insert "notes that the Scottish Government fully upholds the
      Equality Act 2010, and requires all public bodies to comply with the
      law..."
    # CONFIRMED by Christopher, 2026-08-21, after the caution was resolved by
    # reading the full texts and the party split. The vote (12 March 2025)
    # predates the For Women Scotland judgment (16 April 2025), but the
    # meaning comes from what the amendment STRUCK OUT -- a demand that the
    # Scottish Government direct public bodies to provide single-sex spaces
    # for biological women and girls -- not from how its Equality Act
    # boilerplate reads today. The split validates the direction: ayes are
    # the government lobby (SNP 53, LD 4), noes are Con 25 + Labour 20 +
    # 3 SNP rebels + Alba; the Greens abstained and place nowhere. Nobody
    # voted aye from our premises. Weights stay at 1: opposing a wrecker is
    # a cheaper act than proposing the directive itself.
    aye: -1
    why_aye: >
      Voted to strip the operative wording from a motion protecting
      single-sex spaces and replace it with compliance boilerplate -- the
      government wrecking amendment.
    "no": 1
    why_no: >
      Voted to keep the single-sex spaces motion's own wording against the
      wrecking amendment.

  - reference: "S7M-00446.2"
    title: "SNP replacement of 'Scotland Needs Reform: Five Years to 2031'"
    dated: "2026-06-24"
    result: "75 aye / 25 no -- Carried (and the amended motion then 91-27)"
    text: >
      As an amendment to motion S7M-00446 (Malcolm Offord, Scotland Needs
      Reform): leave out from first "believes" to end and insert "condemns
      xenophobia, racism and hatred... welcomes the valuable contribution
      that migrants make..."
    # NOT PLACEABLE -- recorded 2026-08-21 at Christopher's request for a
    # meaning line, with the reasoning written down so the question is not
    # reopened. No aye/no values on purpose: an entry without them places
    # nobody even though it is not a draft.
    #
    # The original motion is an OMNIBUS: tax, net zero, apprenticeships,
    # literacy -- plus one passage on our ground (Lady Ross's transgender
    # prison-guidance ruling "must be swiftly complied with", the reason the
    # taxonomy matched it at area 5) and one on migration (area 11, never
    # campaigned). The amendment struck THE WHOLE TEXT, so a vote either way
    # bundles our passage with the entire Reform economic programme: an MSP
    # could vote No purely on tax policy, or Yes while agreeing with Lady
    # Ross compliance. The splits confirm bloc voting, not issue voting --
    # government parties aye (SNP 52, Green 15, LD 8), opposition no
    # (Reform 16, Con 9), LABOUR ABSTAINED on the amendment and then voted
    # AYE on the amended text: bundling behaviour, nothing issue-specific.
    # The final 91-27 was on the REPLACEMENT text, which contains nothing on
    # our ground at all.
    #
    # Same discipline as NI division 488823 (blasphemy): a vote that cannot
    # discriminate ally from opponent on our issue places nobody, however
    # tempting the tally looks. Both votes render as evidence lines only.

  - reference: "S7M-00446"
    title: "Scotland Needs Reform: Five Years to 2031 (as amended)"
    dated: "2026-06-24"
    result: "91 aye / 27 no -- Carried"
    # NOT PLACEABLE, same reasoning as S7M-00446.2 above: by this vote the
    # text was the SNP replacement, which contains nothing on our ground --
    # the Lady Ross passage was already struck. A 91-27 tally on an
    # anti-xenophobia statement says nothing about any member's position on
    # single-sex spaces. No aye/no values on purpose.

  - reference: "S6M-20037"
    title: "LCM: Terminally Ill Adults (End of Life) Bill -- advertising provisions"
    dated: "2025-12-09"
    result: "103 aye / 2 no / 9 abstain -- Carried"
    text: >
      That the Parliament agrees that the relevant provisions of the
      Terminally Ill Adults (End of Life) Bill... relating to the prohibition
      on advertising of the England and Wales Voluntary Assisted Dying
      Service, so far as these matters fall within the legislative competence
      of the Scottish Parliament, should be considered by the UK Parliament.
    # NOT PLACEABLE -- recorded 2026-08-21 at Christopher's request for a
    # meaning line; reading the text reversed the expected reading. This is
    # NOT Holyrood's position on the Westminster bill: it is a narrow
    # legislative consent motion on the bill's ADVERTISING PROHIBITION as it
    # touches devolved competence. Consenting to an advertising ban is not a
    # pro-assisted-dying act, and the split proves the vote cannot
    # discriminate: the 103 ayes contain BOTH Stage 3 lobbies (22
    # Conservatives alongside SNP and Greens -- restricting advertising is
    # common ground); the 9 abstainers include firm allies Marie McNair and
    # Clare Adamson (both ++ from the Stage 3 vote) plus Kerr, Sturgeon and
    # Yousaf, a mix of consent-process objection and refusal to touch the
    # bill at all; the 2 noes are Conservatives plausibly refusing to
    # facilitate the bill in any form -- also our side. Allies in every
    # lobby. No aye/no values on purpose.

  - reference: "S6M-21077"
    title: "Business Programme scheduling the Stage 3 assisted dying day"
    dated: "2026-03-11"
    result: "101 aye / 19 no -- Carried"
    # NOT PLACEABLE -- confirmed 2026-08-21, by arithmetic rather than
    # ambiguity. 16 of the 19 noes were Stage 3 opponents, so the no lobby
    # smells like obstruction -- but 3 of the 19 voted FOR the Bill at Stage 3
    # (scheduling objections), so a "no: +1" line would fire false conflict
    # flags on them; and every genuine opponent in the lobby already sits at
    # +/-2 from the Stage 3 vote itself, which outranks a +/-1 under
    # most-directional-wins. The line would place nobody new and manufacture
    # three wrong warnings. Pure cost, no yield.

  - reference: "S6M-20898"
    title: "Business Programme (week including assisted dying scheduling)"
    dated: "2026-02-25"
    result: "92 aye / 23 no -- Carried"
    # NOT PLACEABLE -- confirmed 2026-08-21. All 23 noes are Conservative:
    # a party-whip vote on the week's timetable, zero issue signal.


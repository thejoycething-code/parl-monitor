# The review window for the new country editions (src/edition_review.py,
# tools/edition_review.py; 11 October 2026, UK parity).
#
# With `review: true` the weekly job does not DM the edition: it writes the
# edition as a draft and reviews/<cc>-review-<date>.md, which Chris may edit
# (keep / cut / edit per item, a note, hold or now) until the window ends.
# jobs/edition-publish.sh (Mac Mini, 06:31 and 21:10 London) then sends it,
# honouring the review; unedited, it goes out unchanged.
#
#   publish_at   London time the window ends (HH:MM). The publish job runs at
#                06:31 and 21:10, so a time between those goes out at the
#                next run after it.
#   after_days   days after the edition's date: 1 = the next morning, 0 = the
#                same day (a publish_at already past sends at the next run).
#   review       false sends at once from the weekly job, as before.
#
# Never reviewed, always immediate: the same-day vote briefs and the Latam
# instant alerts. Only the fifteen own editions and the Latam monthly
# ("latam") read this file.

default:
  # OFF (Chris, 11 October 2026): the UK retired its review loop on 21 August
  # 2026, so editions go out at once as before. Set `review: true` here or on a
  # country's line to switch the window on.
  review: false
  publish_at: "06:30"
  after_days: 1

countries:
  # One line per edition, so a change is one edit. {} = the default above.
  es: {}
  it: {}
  fr: {}
  nl: {}
  be: {}
  at: {}
  ch: {}
  pl: {}
  pt: {}
  hr: {}
  sk: {}
  hu: {}
  br: {}
  ar: {}
  mx: {}
  latam: {}

# Bundestag (and earlier parliaments): what a vote or a paper MEANS, written
# by a human.
#
# The German mirror of config/ca_stance.yaml, under the same rule: which way a
# division or a paper points is the campaigner's judgement, and no tool
# estimates it. tools/de_5ca.py applies these lines; it never invents one.
#
# CONFIRMED (29 September 2026). Every entry was drafted by Claude the same
# day and confirmed as drafted by Christopher: "I agree with all of the
# positions. We'll let the German team amend in the future if helpful or
# necessary." Reviewed through the sign-off checklist,
# https://claude.ai/artifact/KGH9fAZ7WTnX9qHJEZf2qh
#
# To AMEND a reading, change its values here (and say why in a `note:`); to
# take one out of play without deleting it, put `draft: true` back -- a draft
# places nobody, and `python3 tools/de_5ca.py --area 1 --preview-drafts` still
# shows what drafts would do.
#
# Two sections:
#   divisions  keyed by abgeordnetenwatch poll id (a single global id space
#              across the Bundestag and all sixteen Landtage). `ja:` / `nein:`
#              carry the Westminster stance value (-2..2) of each lobby.
#              Earlier parliaments are here too: a sitting member's Land vote
#              is their record, but see the COALITION rule in tools/de_5ca.py.
#   papers     keyed by DIP Vorgang id. `authored:` is the value of putting
#              your name to it (co-sponsor, co-author, asker), from
#              de_authorship. `placeable: false` with a reason: listed, never
#              placed (a question whose title does not show the asker's side).
#
# The paper directions were drafted FROM TITLES AND INITIATIVE ALONE and
# confirmed on that basis; the German team may amend any against its text.

# The Bundestag's own subject descriptors (DIP Sachbegriffe) per area, which
# tools/de_authorship.py uses to find the papers below. Area 1 measured 29
# September 2026: by descriptor it found 119 Vorgänge in WP 20-21 where our
# taxonomy had tagged 32, including the § 218 group bill it had missed.
descriptors:
  1: [Schwangerschaftsabbruch, Pränataldiagnostik, Schwangerschaftskonfliktberatung, Lebensschutz]
  2: ["Sterbehilfe", "Suizid", "Palliativversorgung", "Hospiz"]
  3: ["Transsexualität", "Hormontherapie"]
  4: ["Gesetz zum Schutz vor Konversionsbehandlungen"]
  5: ["Transsexualität", "Selbstbestimmungsgesetz", "Gesetz über die Selbstbestimmung in Bezug auf den Geschlechtseintrag", "Transsexuellengesetz", "Intersexualität", "Rechtschreibung", "Amtssprache"]
  6: ["Sexualerziehung", "Schulpflicht", "Inobhutnahme", "Erziehung"]
  7: ["Meinungsfreiheit", "Netzwerkdurchsetzungsgesetz", "Digitale-Dienste-Gesetz", "Digital Services Act", "Volksverhetzung", "Beleidigung", "Vorratsdatenspeicherung", "Staatstrojaner", "Online-Durchsuchung"]
  8: ["Religionsfreiheit", "Religiöse Minderheit", "Religiöse Verfolgung", "Christentum", "Kirche", "Religionsgemeinschaft", "Kirchenasyl", "Beauftragter der Bundesregierung für weltweite Religionsfreiheit", "Religion", "Religionsausübung"]
  9: ["Splittingverfahren", "Eheähnliche Lebensgemeinschaft", "Eherecht", "Eheschließung", "Ehe", "Familienrecht", "Kindschaftsrecht", "Adoption", "Elterliche Sorge", "Eingetragene Lebenspartnerschaft"]
  10: ["Leihmutterschaft", "Fortpflanzungsmedizin", "Pränataldiagnostik", "Embryonenschutzgesetz", "Embryonenschutz", "Stammzellforschung", "Künstliche Befruchtung"]
  12: ["Prostitution", "Prostituiertenschutzgesetz", "Menschenhandel"]


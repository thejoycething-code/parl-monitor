# Party colour chips for the country vote pages (src/portraits.py, 12 October 2026).
#
# Party LOGOS are trademarks with no open licence from any official source
# (docs/portraits-logos-licences.md, "Party logos"), so the pages show a
# colour chip beside the party or group name instead. A colour is not a mark.
#
# Source: Wikidata's "sRGB colour hex triplet" (P465) on the party or
# parliamentary group item (CC0), matched to the label the store uses by
# tools/party_colours.py on 12 October 2026 (the item is in each comment).
# A label with no unambiguous colour gets no chip, never a guess; the
# unmatched labels are listed so a person can add one with its source.
# Keys are the labels exactly as the vote page shows them.

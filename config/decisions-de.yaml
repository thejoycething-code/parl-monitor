# Decisions the GERMAN monitor is waiting on. Same machinery as
# config/decisions.yaml (src/decisions.py) against its own log, so a why-line
# that calls something an open decision cannot recur week after week with
# nobody owning it.
#
# Kept SEPARATE from the Westminster log deliberately: the owners differ (most
# of these are the German team's, not Christopher's), and a German question
# appearing in the Westminster edition's block would be noise to everyone who
# reads it.
#
#   decision:   the question, as a sentence
#   about:      a phrase found in the item's TITLE, so the block can pair it
#               with the item and stop the why-line recurring unlogged
#   owner:      who decides (null = unassigned, and the block says so)
#   decide_by:  YYYY-MM-DD; the block counts down and marks OVERDUE
#   opened:     when it was logged
#   status:     open | decided
#   decided_on, outcome: filled when decided; shown for two editions, then gone
#
# A why-line calling something an open decision with NO entry here renders as
# "not yet logged" -- the recurrence is made visible rather than quietly
# accepted.
decisions:
  - id: verify-german-taxonomy
    decision: Who on the German team verifies config/taxonomy-de.yaml, and by when?
    about: "taxonomy"
    owner: null
    decide_by: 2026-10-31
    opened: 2026-09-23
    status: open
    # Why it is a decision and not a task: every German surface carries
    # "TAXONOMY v0.4 UNVERIFIED" on its face until someone signs it off, and
    # the edition cannot be presented internally as finished before then.
    #
    # EMPIRICALLY VERIFIED 26 September 2026 (Christopher: "verify the
    # taxonomy"). This narrows the decision; it does not close it.
    #
    # What was measured, against everything the German store holds:
    #   * RECALL. Of 2,172 rows the taxonomy REJECTED across committee
    #     reports, divisions, petitions, judgments and amendments, 14 carry
    #     an obvious term for one of our areas -- and all 14 are migration,
    #     which area 11's own note says is deliberately sparse because it is
    #     collated and never campaigned. Zero misses across the eleven areas
    #     we do campaign on.
    #   * PRECISION. The matched divisions and committee reports read
    #     correctly by eye; the two abortion divisions are unmistakably ours
    #     ("Keine weitere Liberalisierung des Abtreibungsrechts").
    #   * EVERY AREA YIELDS. None of the twelve is dead. Migration is 249 of
    #     the ~620 matches, still about 40%, and still the Bundestag's
    #     volume rather than the terms being loose.
    #   * THE THIN AREAS ARE NOT VOCABULARY. Assisted dying matched 2 and
    #     conversion practices 3, which looked like gaps. DIP holds 15
    #     Sterbehilfe and 9 Konversionstherapie Vorgänge and we hold none --
    #     because they are dated 2020 to 2022 and de_documents sweeps a
    #     120-day window. The terms are right and in the sweep list; the
    #     corpus does not reach back to when Germany argued about it.
    #
    # WHAT THIS CANNOT ESTABLISH, and why a German reader is still needed:
    # the probe list used to test recall was written from the same
    # understanding that produced the taxonomy, so it cannot find a term
    # neither of them knows. Measuring behaviour is not the same test as
    # reading the words, and only the second finds a shared blind spot. The
    # Vorgänge corpus compounds this: it is fetched BY the terms, so it
    # structurally cannot demonstrate they are complete -- which is what
    # schedule-document-window-mode below would fix.
    #
    # So the question narrows to: who reads the 131 tier-1 terms as German,
    # and says whether they are the words the Bundestag actually uses?

  - id: schedule-document-window-mode
    decision: Does the German weekly also run de_documents.py --mode window, adding the body-text layer?
    about: "Drucksachen"
    owner: Christopher
    decide_by: 2026-10-10
    opened: 2026-09-23
    status: open
    # The weekly runs --mode terms, which writes Vorgänge only, so
    # de_documents is empty by design and the edition says so. --mode window
    # sweeps ~150 documents a week and body-matches them. It is a runtime
    # cost decision, not an oversight.

  - id: apply-for-dip-key
    decision: Does CitizenGO apply for a DIP API key in its own name?
    about: "DIP"
    owner: Christopher
    decide_by: 2026-10-10
    opened: 2026-09-23
    status: decided
    decided_on: 2026-09-24
    outcome: >-
      Applying, in Chris Joyce's own name with joyce.digital as the business
      (his call, 24 September 2026) rather than CitizenGO's -- consistent with
      the repo living under thejoycething-code and not the work account.
      Application drafted; Christopher sends it. When the key arrives it is
      one step and no code: add DIP_API_KEY as a GitHub secret. The weekly
      already writes it into config/secrets.yaml and src/dip.py prefers it
      over the published example.
    # FORCED BY EVENTS on 24 September 2026, not decided at leisure:
    # bundestag.de began resetting our connections during the TLS handshake
    # -- an edge block on this machine's IP, after roughly 2,000 requests in
    # a day, most of them one 1,816-document committee backfill. Five German
    # collectors depend on that host. The weekly runs from GitHub's IPs so it
    # is probably unaffected, but "probably" is the honest word.
    #
    # The weekly currently drives DIP from the key the Bundestag publishes as
    # a documentation EXAMPLE in its own OpenAPI spec. It works and rotation
    # heals itself, but it is shared, it can be rate-limited by other
    # people's traffic, and it is a terms-of-use exposure rather than only a
    # technical one. DIP_API_KEY and config/secrets.yaml already take
    # precedence, so the swap is a secret, never a commit.

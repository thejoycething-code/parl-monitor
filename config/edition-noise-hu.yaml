# Hungary edition noise rules (src/noise.py; format documented there).
# Hand-edited. Patterns match folded text: lower case, accents stripped.
# A watched item (and so an amendment to the Fundamental Law, HU4) is never
# filtered.
#
# Measured on the 43rd term's gazette (9 May to 9 October 2026, 108 issues,
# 736 contents entries, read 10 October 2026 under taxonomy-hu v0.1): 43
# entries on our ground before these rules. The collector classifies the
# title alone; since taxonomy-hu v0.2 divorce is matched by its explicit
# forms, so "választás" (election) no longer files under area 9. What was
# left that is not ours: the media regulator's
# technical decrees (frequency fees, the network register, subscriber
# contracts), which cite an "NMHH rendelet" in their titles. Its decree on
# safe services for minors is kept. Migration items are matched and stored
# but never shown (X-rule, area 11).
#
# Recorded votes (HU7, karzat's backfill of 9 May to 28 August 2026): a vote's
# title is the record's own words for the motion put. Measured on the 48
# votes on our ground: 5 are procedural (taking a bill as urgent or in the
# exceptional procedure, hearing an amendment beyond the bill's scope); the
# bill's amendments and final vote stay, grouped. A watched or HU4 vote is
# never filtered.
procedural_votes:
  - '^surgossegi javaslat'
  - '^kivetelessegi javaslat'
  - 'hazszabalyi rendelkezesektol valo elteres'
  - '^zaroszavazas elhalasztasa'
  - '^bizottsagi javaslat tulterjeszkedo'
  - '^tulterjeszkedo modosito javaslat szabalyszeru'
exclude_titles:
  - '\bfrekvencia'
  - '\bhirkozles halozati nyilvantartas'
  - '\belektronikus hirkozlesi elofizetoi szerzodes'
alert:
  title_tier1: true
  distinct_terms: 2

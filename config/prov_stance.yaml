      (docs.assembly.ab.ca/LADDAR_files/docs/bills/bill/legislature_31/session_2/20251023_bill-013.pdf)
    text: >
      Mr. Shepherd [...] moved that the motion be amended [...] be read a
      Third time this day six months hence. [...] The question being put,
      the amendment was defeated. The question being immediately put, the
      motion for Third Reading was agreed to on the voice vote.
    # TEXT READ 8 October 2026. The preamble: 'freedom of thought, belief,
    # opinion and expression is of foundational importance'; s.5(2) forbids

  # --- QUEBEC (Assemblée nationale), DRAFTED 8 October 2026 -----------------
  # Christopher: "draft READINGS for Quebec's recorded divisions on our ground".
  # NOT CONFIRMED: every entry carries `draft: true` and places nobody.
  # All 179 recorded divisions the store tagged with an area (prov='qc',
  # 39th-43rd Legislatures) have an entry: 21 carry values, 158 are
  # `placeable: false` (113 unanimous, 45 contested but procedure, supply or
  # not ours); none is left read-first. Each entry's `text:` is the
  # procès-verbal's own words (fetched 8 October 2026; unanimous entries
  # quote the store's excerpt, "[...]" where it begins mid-item), `lobbies:`
  # is counted from prov_votes with the party printed in the PV annex, and
  # every mover's or sponsor's own vote was checked against the direction
  # (each voted Yea). Stages: "adoption du principe" is a second reading
  # (+/-1), "adoption" a third reading (+/-2), an opposition-day motion +/-1.
  # Where a Nay was cast for reasons that are not ours (the opposition voting
  # against the constitution on process, the PQ and CAQ wanting a STRONGER
  # face-covering law), only the Yea carries a value, as on C-62.
  # LAICITY (Bills 21, 52, 94 and 9; Bill 62 of 2017 and Bill 94 of 2011;
  # the 2017 and 2024 motions) is read as CitizenGO's defence of religious
  # freedom: a ban on religious symbols for public employees, a face rule for
  # public services, a bar on prayer on public premises and cutting faith
  # schools' subsidies restrict it, so a Yea is against our side. That is a
  # JUDGEMENT CALL FOR CHRISTOPHER, flagged on each entry. Where the stored
  # areas came from stray words (Bill 9's 'expression de genre', Bill 94's
  # home-schooling face rule, Bill 59's marriage clauses, Bill 70's
  # 'identité de genre'), the reading states its own `areas:`.
  # "TAXONOMY FALSE POSITIVE" in a reason names a tag that was wrong: supply
  # bills tagged laicity on a line of their schedule, budget bills on
  # 'identité numérique' or IVF tax credits, and motions that inherited a tag
  # from the item before them in the procès-verbal.
  # --- Quebec, 43rd Legislature --------------------------------------------------
  - key: qc-43-3-2026-06-04-22

  - key: qc-43-2-2026-04-01-139
    title: "Bill 1 (43-2), Loi constitutionnelle de 2025 sur le Québec -- adoption du principe (second reading)"
    dated: 2026-04-01
    result: "La motion est adoptée 68-31 (1 abstained)"
    lobbies: "Yea: CAQ 65, IND 3. Nay: PLQ 15, QS 8, PQ 6, IND 2. Abstain: IND 1 (party as printed in the annex)"
    moved_by: "Simon Jolin-Barrette (CAQ; Minister of Justice), who voted Yea"
    source: >
      Procès-verbal de l'Assemblée, 2026-04-01, vote n° 139
      (https://www.assnat.qc.ca/Media/Process.aspx?MediaId=ANQ.Vigie.Bll.DocumentGenerique_220051&process=Default&token=ZyMoxNwUn8ikQ+TRKYwPCjWrKwg+vIv9rjij7p3xLGTZDmLVSmJLoqe/vG7/YWzz)
    text: >
      L’Assemblée tient le vote reporté le 31 mars 2026 sur la motion de M. Jolin- Barrette,
      ministre de la Justice et ministre des Relations canadiennes proposant que le principe du
      projet de loi n° 1, Loi constitutionnelle de 2025 sur le Québec, soit maintenant adopté.
    # TEXT READ (bill as introduced). Bill 1 writes into a Quebec Constitution: s.29 « L'État
    # protège la liberté des femmes d'avoir recours à une interruption volontaire de grossesse
    # »; s.22 « L'État est laïque »; and amends the Charter: s.9.2 « En cas de conflit entre
    # l'exercice du droit à l'égalité entre les femmes et les hommes et l'exercice de la liberté
    # de religion, le premier l'emporte », s.39.2 « Toute personne, dont l'état le requiert, a
    # le droit de recevoir des soins de fin de vie » (which include medical aid in dying). Only
    # the Yea places: the PLQ, QS and PQ opposed the constitution on process and on federalism,
    # not on abortion or MAID, so a Nay is not our side. -1, not -2: principle only (the bill
    # died with the 43rd Legislature).
    yea: -1
    why_yea: "Voted for the principle of a Quebec constitution that entrenches 'la liberté des femmes d'avoir recours à une interruption volontaire de grossesse', a Charter right to end-of-life care (MAID), and sex equality over freedom of religion."
    draft: true

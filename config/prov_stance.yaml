    text: >
      WHEREAS the Child and Youth Advocate, the New Brunswick Women's Council,
      the minister responsible for the Child and Youth Well-Being Act, and the
      Human Rights Commission have identified serious problems with the process
      to review Policy 713; WHEREAS the changes proposed in the new version of
      Policy 713 disregard the rights of children and youth and the best
      interest of the child; [...] BE IT RESOLVED that the Legislative Assembly
      urge the government to request that the Office of the Child and Youth
      Advocate conduct full consultations with relevant stakeholders on any
      changes to Policy 713 and the impact of such changes, and make public the
      results of such consultations by August 15, 2023.
    # TEXT READ 8 October 2026. As moved, the motion urged reverting to the
    # August 2020 Policy 713; the amendment (-4) softened that to consultations.
    # Six PCs -- Holder, Shephard, Allain, Carr, Anderson-Mason and Wetmore --
    # voted with the opposition, which is what makes this vote tell members
    # apart. +/-1 as a non-binding motion; CLOSE CALL, it is the province's
    # defining vote on parental consent.
    yea: -1
    why_yea: "Voted for a motion declaring that the government's Policy 713 changes -- parental consent before an under-16 uses a new name or pronoun at school -- 'disregard the rights of children'."

    lobbies: "Yea: CAQ 65. Nay: PLQ 16, QS 9, PQ 6, IND 3. Abstain: IND 1 (party as printed in the annex)"
    source: >
      Procès-verbal de l'Assemblée, 2026-06-04, vote n° 22

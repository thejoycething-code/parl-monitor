  - key: ab-31-2-2026-04-22-1
    title: "Bill 18, Safeguards for Last Resort Termination of Life Act -- third reading"
    dated: 2026-04-22
    result: "Carried 44-15"
    lobbies: "Yea: UCP 43, Ind. 1. Nay: NDP 15 (store, prov_votes; party at the vote)"
    moved_by: "Mickey Amery (UCP; Minister of Justice, the sponsor), who voted Yea"
    source: >
      Votes and Proceedings, 2026-04-22
      (docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_31/session_2/20260422_1200_01_vp.pdf);
      Bill 18 as introduced
      (docs.assembly.ab.ca/LADDAR_files/docs/bills/bill/legislature_31/session_2/20251023_bill-018.pdf)
    text: >
      Purposes 2 [...] (b) to ensure that the rules and standards [...]
      uphold the sanctity of human life [...]. 4(2) A practitioner must not
      provide medical assistance in dying to an individual except [...] only
      if (a) the individual makes a request [...] that (i) is not based on a
      mental illness being the individual's sole underlying medical
      condition [...], (b) the individual is at least 18 years of age [...],
      (c) [...] the individual's natural death is reasonably foreseeable
      within 12 months [...]. Part 2 Division 2: a health care facility's
      right to refuse provision of medical assistance in dying.
    # TEXT READ 8 October 2026. Alberta closes MAID to mental illness alone,
    # to minors and to deaths not foreseeable within 12 months, protects
    # facilities that refuse it and writes 'the sanctity of human life' into
    # the purposes. Second reading and committee were voice. +/-2 at third
    # reading. CLOSE CALL only in that the Act regulates rather than ends
    # MAID, which is federal law.
    yea: 2
    why_yea: "Voted to pass Alberta's restrictions on assisted suicide: no MAID for mental illness alone, for minors, or where death is not foreseeable within 12 months, and facilities free to refuse it."
    nay: -2
    why_nay: "Voted against Alberta's restrictions on assisted suicide for mental illness, minors and those not near death."


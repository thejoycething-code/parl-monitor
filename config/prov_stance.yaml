  # Bill 9, Protecting Alberta's Children Statutes Amendment Act, 2025: the
  # notwithstanding clause over Bills 26, 27 and 29. Squarely ours.
  - key: ab-31-2-2025-11-18-1
    title: "Bill 9, Protecting Alberta's Children Statutes Amendment Act, 2025 -- first reading"
    dated: 2025-11-18
    result: "Carried 48-35"
    lobbies: "Yea: UCP 46, Ind. 2. Nay: NDP 35 (store, prov_votes; party at the vote)"
    moved_by: "Mickey Amery (UCP; Minister of Justice, the sponsor), who voted Yea"
    source: >
      Votes and Proceedings, 2025-11-18
      (docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_31/session_2/20251118_1200_01_vp.pdf);
      Bill 9 as introduced
      (docs.assembly.ab.ca/LADDAR_files/docs/bills/bill/legislature_31/session_2/20251023_bill-009.pdf)
    text: >
      Bill 9 declares that the Education Act's ss.18(1)(d.1)-(d.2), 18.1,
      33.2, 58.11 and 58.12 (Bill 27), the Fairness and Safety in Sport Act
      (Bill 29) and the Health Professions Act's ss.1.91-1.93 (Bill 26)
      'shall operate notwithstanding (a) sections 2 and 7 to 15 of the
      Canadian Charter of Rights and Freedoms, (b) the Alberta Bill of
      Rights, and (c) the Alberta Human Rights Act'.
    # TEXT READ 8 October 2026. A recorded first-reading division: +/-1 as for
    # sk-29-3-2023-10-12-1. Peter Guthrie (Ind.) voted Yea here and Nay at
    # second and third reading; Scott Sinclair (Ind.) Yea.
    yea: 1
    why_yea: "Voted to introduce Bill 9, shielding Alberta's laws on gender medicine for minors, parental consent on names and pronouns and female sport with the notwithstanding clause."
    nay: -1
    why_nay: "Voted against even introducing Bill 9, the notwithstanding-clause shield for Bills 26, 27 and 29."
    draft: true

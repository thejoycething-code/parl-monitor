  - key: bc-43-2-2026-03-12-141.2
    title: "Government Motion 13 -- 'unequivocal support' for the Human Rights Code and the Tribunal's powers to enforce it"
    dated: 2026-03-12
    result: "Carried 83-3"
    lobbies: "Yea: NDP 46, Conservative 33, Green 2, Independent 2. Nay: Independent 3 (counted from prov_votes; party is the LIMS API's undated label, today's caucus, not party at the vote)"
    moved_by: "Mike Farnworth (NDP; the Speaker puts it as 'tabled by the Minister of Transportation'), who voted Yea"
    source: "Hansard, 12 March 2026 p.m., issue 141 (lims.leg.bc.ca/hdms/file/Debates/43rd2nd/20260312pm-Hansard-n141.html)"
    text: >
      That this House affirms its unequivocal support for the B.C. Human Rights
      Code and the Tribunal's powers to enforce it, protecting people from hate
      speech and discrimination based on Indigenous identity, race, colour,
      ancestry, place of origin, religion, marital status, family status,
      physical or mental disability, sex, sexual orientation, gender identity or
      expression, and age.
    # TEXT READ 8 October 2026. The government's answer to the Human Rights Code
    # Repeal Act refused first reading on 26 February
    # (bc-43-2-2026-02-26-126.1). Only the Nay places: the Yea of 83 takes in
    # the NDP, the Greens and the whole Conservative caucus, who first moved
    # (Warbus, bc-43-2-2026-03-12-141.1, Negatived 36-50) to strike the
    # Tribunal's powers and the hate-speech words and then voted for the motion
    # as it stood, so a Yea tells no member apart. As the C-62 reasoned
    # amendment (commons-44-1-640), the other way about. The Warbus amendment
    # carries no areas in the store and so has no entry: it is the better vote
    # on our ground if the taxonomy is widened to it.
    nay: 1
    why_nay: "One of three members to vote against affirming 'unequivocal support' for the Human Rights Tribunal's powers to police 'hate speech', a fortnight after its fine on Barry Neufeld."
    draft: true

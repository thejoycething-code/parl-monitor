    text: >
      Bill 24 adds to the Bill of Rights: 'freedom of speech and
      expression'; the right of an individual with capacity 'not to be
      subjected to, or coerced into receiving, medical care, medical
      treatment or a medical procedure without the consent of that
      individual', and the same for 'a vaccine'; property and firearms
      rights; a preamble acknowledging 'the supremacy of God' and 'the
      position of the family in a society of free people and free
      institutions'; paramountcy over other Alberta law and a court remedy.
    # TEXT READ 8 October 2026. Our ground is real (expression made paramount
    # and enforceable, freedom from coerced treatment, God and the family in
    # the preamble) but shares the bill with property and firearms, so a Nay
    # need not be a vote against free speech: +/-1, not +/-2. CLOSE CALL:
    # Christopher may prefer yea only (drop nay), as on the BC Human Rights
    # Code Repeal Act flag.
    yea: 1
    why_yea: "Voted to add freedom of expression, freedom from coerced medical treatment and vaccination, and the family to the Alberta Bill of Rights, and to make it paramount."
    nay: -1
    why_nay: "Voted against the Bill of Rights amendments adding freedom of expression and freedom from coerced medical treatment."

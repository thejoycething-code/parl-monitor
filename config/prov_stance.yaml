    text: >
      [Summary; the 2018 bill text was not re-read:] Bill 9, Protecting
      Choice for Women Accessing Health Care Act: access ('bubble') zones
      around abortion facilities and providers' homes, within which protest
      and trying to advise or persuade a person not to access abortion
      services are prohibited (the zone is 50 metres, up to 150 by
      regulation, per amendment ab-29-4-2018-05-08-3; 160 metres for homes,
      per ab-29-4-2018-05-15-2).
    # Bubble zones restrict pro-life witness and speech: Yea is against our
    # side. -1/+1 at second reading. The only Nay is Derek Fildebrandt; the
    # UCP abstained by absence, which the store does not record as a position.

  - key: ab-29-3-2017-11-08-1
    areas: [6]          # parental rights (and faith schools); tagged 5 only from 'gender expression'
    title: "Bill 24, An Act to Support Gay-Straight Alliances (2017) -- second reading"
    dated: 2017-11-08
    result: "Carried 44-9"
    lobbies: "Yea: NDP 39, Alberta Party 2, PC 1, Liberal 1, Ind. 1. Nay: UCP 8, Ind. 1 (store, prov_votes; party at the vote)"
    moved_by: "David Eggen (NDP; Minister of Education, the sponsor), who voted Yea"
    source: >
      Votes and Proceedings, 2017-11-08
      (docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_29/session_3/20171108_1200_01_vp.pdf);
      Bill 24 as introduced
      (docs.assembly.ab.ca/LADDAR_files/docs/bills/bill/legislature_29/session_3/20170302_bill-024.pdf)
    text: >
      16.1(6) The principal is responsible for ensuring that notification,
      if any, respecting a voluntary student organization or an activity
      referred to in subsection (1) is limited to the fact of the
      establishment of the organization or the holding of the activity.
      [...] 9 Section 50.1 is amended by adding [...] (4) For greater
      certainty, this section does not apply with respect to the
      establishment or operation of a voluntary student organization
      referred to in section 16.1 [...]. [And s.16.1 and related sections
      are applied to private schools.]
    # TEXT READ 8 October 2026. The bill bars a school from telling parents
    # more than that a GSA exists, exempts GSA activities from the parental
    # notice and opt-out for instruction on human sexuality (s.50.1), and
    # imposes both on private faith schools. Yea is against our side: -1/+1 at
    # second reading.
    yea: -1
    why_yea: "Voted for the principle of barring schools from telling parents their child joined a gay-straight alliance, in public and faith schools alike."
    nay: 1
    why_nay: "Voted against barring schools from telling parents of their child's gay-straight alliance participation."

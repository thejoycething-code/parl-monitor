  # DRAFTED 3 October 2026 for Christopher ("Draft the provincial readings").
  # Each mover's or sponsor's own vote was checked against the direction:
  # LaGrange, Nicolaides, Schow and Moe voted Yea on their government bills,
  # Rustad Yea on the BC first reading; Pancholi, Sabir and Love voted Yea on
  # their own amendments. Provincial votes are near-total party lines, so a
  # second reading is +/-1 and only the third reading is +/-2: two readings of
  # one bill must not read as twice the conviction. Clause-by-clause votes
  # that split exactly as the bill are left out (placeable: false).


  # Bill 13, Regulated Professions Neutrality Act (2025): professionals' free
  # speech off duty. Bill 13 carries no areas in the store (a taxonomy MISS);
  # both entries state `areas: [7]`.
  - key: ab-31-2-2025-12-02-1
    areas: [7]          # free speech; tagged 5 only from 'gender expression' in the amendment
    title: "Bill 13, Regulated Professions Neutrality Act -- Sabir amendment A1 (regulators may sanction off-duty 'hateful' communications)"
    dated: 2025-12-02
    result: "Defeated 14-44"
    lobbies: "Yea: NDP 14. Nay: UCP 44 (store, prov_votes; party at the vote)"
    moved_by: "Irfan Sabir (NDP, Calgary-Bhullar-McCall), who voted Yea"
    source: >
      Votes and Proceedings, 2025-12-02
      (docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_31/session_2/20251202_1200_01_vp.pdf),
      pp. 4-5; Sessional Paper 242/2025; Bill 13 as introduced
      (docs.assembly.ab.ca/LADDAR_files/docs/bills/bill/legislature_31/session_2/20251023_bill-013.pdf)
    text: >
      (viii) communications intended to vilify, humiliate or incite or
      promote hatred against a person or a class of persons on the basis of
      race, religious beliefs, colour, gender, sexual orientation, gender
      identity, gender expression, age, physical disability, mental
      disability, ancestry or place of origin. (b) [...] (3) Nothing in this
      section precludes a regulatory appeal body or regulatory body from
      imposing a sanction on a regulated professional for [...] (b)
      communications of the kind described in subsection (2)(b)(viii).
    # TEXT READ 8 October 2026. Bill 13 s.5(2) bars a regulator from
    # sanctioning a professional's expressive conduct outside practice except
    # for threats, misuse of position, convictions, boundary and sexual
    # misconduct. A1 adds a 'hate' exception -- the ground on which gender-
    # critical professionals have been disciplined -- so a Yea re-opens off-
    # duty speech to discipline. +/-1, as the Bill 26/27 opposition
    # amendments.
    yea: -1
    why_yea: "Voted to let professional regulators discipline members for off-duty speech judged hateful, including on gender identity and expression."
    nay: 1
    why_nay: "Voted against letting professional regulators discipline members for off-duty speech judged hateful."
    draft: true

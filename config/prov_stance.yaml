    nay: -1
    why_nay: "Voted to refuse the Protecting Minors from Gender Transition Act even a first reading."
    note: "Read as the confirmed Gender Ideology and Child Protection Act (bc-43-2-2026-02-19-119.1): +/-1. Elenore Sturko (shown Independent) voted Nay."

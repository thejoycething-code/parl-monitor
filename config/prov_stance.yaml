    title: "Bill 24, Alberta Bill of Rights Amendment Act, 2024 -- third reading"
    dated: 2024-11-27
    result: "Carried 46-31"
    lobbies: "Yea: UCP 46. Nay: NDP 31 (store, prov_votes; party at the vote)"

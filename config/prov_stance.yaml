  - key: bc-43-2-2026-02-26-126.1
    draft: true
    title: "Human Rights Code Repeal Act -- first reading (refused)"
    dated: 2026-02-26
    result: "Negatived 37-50"
    lobbies: >
      Yea 37: Conservative 25, Independent 12 (Armstrong, Brodie, Kealy and
      nine others). Nay 50: NDP 47, Green 2, Independent 1 (Sturko). Counted
      from the Hansard division list; party is the LIMS API's, which is
      undated (one per parliament, today's caucus), so the Conservative /
      Independent line is NOT party at the vote.
    moved_by: "Tara Armstrong (Kelowna–Lake Country–Coldstream), who voted Yea"
    source: >
      Hansard, 26 February 2026 a.m., issue 126
      (lims.leg.bc.ca/hdms/file/Debates/43rd2nd/20260226am-Hansard-n126.html).
      THE BILL WAS NEVER PRINTED: refused first reading, it has no number and
      is absent from the session's progress-of-bills JSON
      (lims.leg.bc.ca/pdms/bills/progress-of-bills/206), so the only account
      of its content is the member's first-reading statement.
    text: >
      Tara Armstrong: I move that a bill intituled Human Rights Code Repeal
      Act, of which notice has been given in my name on the order paper, be
      introduced and read a first time now. The purpose of this bill is to
      end the assault on freedom of speech by our Human Rights Tribunal. [...]
      It will abolish the Human Rights Tribunal, a kangaroo court, and repeal
      the human rights code that the Left is using to punish and profit from
      anyone who doesn't adopt their views. The bill will terminate the
      position of a Human Rights Commissioner, who makes over $300,000 a year
      to police speech, and it will invalidate any outstanding orders made by
      the tribunal against Canadians like Mr. Neufeld.
    # TEXT READ 2 October 2026 (draft), from the statement: no bill text
    # exists. It answers what she called the Tribunal's fine on Barry Neufeld
    # the week before, for "refusing to believe that a man could become a
    # woman". +/-1, as for the Gender Ideology and Child
    # Protection Act (119.1): first reading is leave to introduce, not the
    # principle. FLAG FOR CHRISTOPHER: the bill repeals the WHOLE Code --
    # including its protection against discrimination on religion -- so a
    # Nay may be a vote to keep anti-discrimination law rather than against
    # free speech (Elenore Sturko, shown Independent, voted Nay). If that
    # weighs, drop the `nay` value and let only the Yea place, as on the
    # C-62 reasoned amendment (commons-44-1-640).
    yea: 1
    why_yea: "Voted to let the Human Rights Code Repeal Act be introduced, a bill to abolish the Human Rights Tribunal after its fine on Barry Neufeld (+1: first reading is leave to introduce, not the bill's principle)."
    nay: -1
    why_nay: "Voted to refuse the Human Rights Code Repeal Act even a first reading."
    note: "Introduced by Tara Armstrong a week after the Gender Ideology and Child Protection Act was refused first reading; tagged free speech."


      TEXT READ 2 October 2026 (draft). It was offered BESIDE the consent
      clause, not instead of it: a new s.197.5 inserted after s.197.4, leaving
      the parental-consent rule untouched. A consultation strategy neither
      strengthens nor weakens parental consent, so neither lobby is on our
      ground; and it split exactly as the readings (NDP 11 against the
      government 33), which carry Bill 137. Evidence only.

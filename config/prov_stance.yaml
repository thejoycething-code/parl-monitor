  # The three Committee of the Whole amendments below were READ and DRAFTED on
  # 2 October 2026 (Christopher: "Draft the 10 'read first' readings") from
  # the Votes and Proceedings of 27 November 2024, against Bill 27 as
  # introduced. CONFIRMED 2 October 2026. The day's divisions
  # in order are Bill 24 third reading (1), Bill 26 clauses (2), these three
  # (3-5) and the Bill 27 clauses (6); the V&P tallies match the titles, but
  # the store's seq numbers were not checked (31-1 not yet collected): CHECK
# them against prov_divisions when the Alberta backfill lands, because a key
# one off would apply a reading to the wrong amendment.
  # Lobbies are counted from the printed V&P lists, party from the 31st
  # Legislature's dated terms (tests/fixtures/prov/ab_terms_31.json).
  - key: ab-31-1-2024-11-27-3
    title: "Bill 27 -- Pancholi amendment A1 (tell the student first; notify parents only if the student proceeds)"
    dated: 2024-11-27
    result: "Defeated 32-44"
    lobbies: "Yea: NDP 32. Nay: UCP 44 (counted from the V&P)"
    moved_by: "Rakhi Pancholi (NDP, Edmonton-Whitemud), who voted Yea; the minister, Demetrios Nicolaides, voted Nay"
    source: >
      Votes and Proceedings, 27 November 2024, pp. 5-6
      (docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_31/session_1/20241127_1200_01_vp.pdf);
      Sessional Paper 678/2023-24; read against s.33.2 of Bill 27 as
      introduced
    text: >
      that the Bill be amended in section 9, in the proposed section 33.2(2),
      by striking out "the board shall" and substituting "the board shall
      notify the student of the board's obligations under clauses (a) and (b)
      and, if the student decides to proceed with the request, shall".
    # TEXT READ 2 October 2026. Under the bill, a pupil's request for
    # a new preferred name or pronouns itself triggers notice to the parent
    # (and, under 16, the parent's consent). Under A1 the pupil is warned
    # first and can withdraw, and then the parent is never told the request
    # was made. The name still could not be used without notice (s.33.2(3)
    # is untouched), so this is the mildest of the three: -1/+1, as for the
    # Bill 26 and Bill 137 opposition amendments.
    yea: -1
    why_yea: "Voted to let a pupil withdraw a request for a new name or pronouns before the school tells the parents, so parents learn of it only if the pupil goes ahead."
    nay: 1
    why_nay: "Voted against letting a pupil's request for a new name or pronouns be kept from the parents by withdrawing it once warned."
  - key: ab-31-1-2024-11-27-4
    title: "Bill 27 -- Pancholi amendment A2 (parental consent for sexuality instruction only if a board's policies require it)"
    dated: 2024-11-27
    result: "Defeated 32-44"
    lobbies: "Yea: NDP 32. Nay: UCP 44 (counted from the V&P)"
    moved_by: "Rakhi Pancholi (NDP, Edmonton-Whitemud), who voted Yea; Nicolaides voted Nay"
    source: >
      Votes and Proceedings, 27 November 2024, pp. 6-8 (same PDF); Sessional
      Paper 679/2023-24; read against ss.58.11 and 58.12 of Bill 27 as
      introduced
    text: >
      that the Bill be amended in section 12 as follows: (a) in the proposed
      section 58.11 as follows: (i) in subsection (1) by striking out "provide
      notice to, and seek the consent of" and substituting "provide notice to
      and, if required by the policies, seek the consent of"; [...] (iii) in
      subsection (4) by striking out "Where no consent has been provided
      under this section in respect of a student" and substituting "If a
      parent's consent is required under this section in respect of a student
      and that consent is not provided, or if a parent's consent is not
      required in respect of a student and the parent makes a signed written
      request that the student be excluded from all or part of the
      instruction, course or program of study or use of instructional
      materials"; (b) in the proposed section 58.12 [...] (C) by adding the
      following immediately after subclause (ii): (ii.1) whether the board is
      required to seek a parent's consent under section 58.11(1);
    # TEXT READ 2 October 2026. The stored text was the tail of this
    # amendment; the V&P prints it whole and names the mover. It turns the
    # bill's parental
    # OPT-IN for instruction dealing "primarily and explicitly with gender
    # identity, sexual orientation or human sexuality" into a choice for each
    # board: where its policies do not require consent, the parent is only
    # notified and must ask in writing to withdraw the child (opt-out). The
    # V&P records the voice vote as "agreed to"; the division defeated it
    # (Sessional Paper 679: "Defeated on division").
    yea: -1
    why_yea: "Voted to let each school board decide whether parents must opt in to sexuality and gender-identity instruction, leaving parents elsewhere only an opt-out."
    nay: 1
    why_nay: "Voted to keep parental opt-in consent for all school instruction on gender identity, sexual orientation and human sexuality."
  - key: ab-31-1-2024-11-27-5
    title: "Bill 27 -- Government amendment A3 (religious instruction exempted; names and pronouns clause restated)"
    dated: 2024-11-27
    result: "Agreed 43-32"
    lobbies: "Yea: UCP 43. Nay: NDP 32 (counted from the V&P)"
    moved_by: "Demetrios Nicolaides (UCP; Minister of Education, the bill's sponsor), who voted Yea"
    source: >
      Votes and Proceedings, 27 November 2024, pp. 8-10 (same PDF); Sessional
      Paper 680/2023-24; read against ss.18.1 and 33.2 of Bill 27 as
      introduced
    text: >
      A Section 7 is amended in the proposed section 18.1 (a) in subsection
      (2) by striking out "A board" and substituting "Subject to subsection
      (3.1), a board"; (b) by adding the following after subsection (3):
      (3.1) Subsection (2) does not apply where the learning and teaching
      resources are used or provided to provide religious instruction. [...]
      B Section 9 is amended in the proposed section 33.2 (a) by striking out
      subsection (2) and substituting the following: (2) Subject to
      subsection (4), if a student requests that a new preferred name or
      pronouns be used by teachers, teacher leaders and other school staff
      when referring to the student in school, the board shall notify the
      student's parent of the request. (b) in subsection (3) [...] (b) in the
      case of a student who is under 16 years of age, (i) until the student's
      parent is notified under subsection (2), and (ii) unless the parent
      provides consent for the new preferred name or pronouns to be used by
      teachers, teacher leaders and other school staff when referring to the
      student in school.
    # TEXT READ 2 October 2026. Part A frees religious instruction
    # from the rule that resources dealing "primarily and explicitly with
    # gender identity, sexual orientation or human sexuality" need the
    # Minister's approval (an outside provider of it still needs approval):
    # religious freedom for faith-based and Catholic schools. Part B keeps
    # the bill's rule -- every parent notified, under-16s need the parent's
    # consent -- and only moves the duty from the board "seeking" consent to
    # the parent "providing" it. Nothing on our ground is weakened, so Yea is
    # our side. +/-1: it split exactly as the Bill 27 clause vote (6, 44-32),
    # and the readings carry the bill. ALTERNATIVE for Christopher:
    # placeable: false on that ground, if he would rather the government's
    # drafting amendments not score at all.
    yea: 1
    why_yea: "Voted to exempt religious instruction from ministerial approval of sexuality and gender-identity resources, and for parental notice and under-16 consent on new names and pronouns."
    nay: -1
    why_nay: "Voted against exempting religious instruction from ministerial approval of sexuality resources, and against the restated parental notice and consent rule on names and pronouns."

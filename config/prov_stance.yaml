    placeable: false
    title: "Bill 137 -- Love amendment adding a parental engagement strategy (new s.197.5)"
    dated: 2023-10-19
    result: "Negatived 11-33"
    lobbies: "Yea: NDP 11. Nay: Saskatchewan Party 32, Ind. 1 (Nadine Wilson) (counted from the Minutes; party from the Hansard member list of 20 October 2023)"
    moved_by: "Matt Love (NDP, Saskatoon Eastview), who voted Yea"
    source: >
      Minutes (Votes and Proceedings), 19 October 2023, pp. 5-6
      (docs.legassembly.sk.ca/legdocs/Assembly/Minutes/29L3S/231019Minutes.pdf)
    text: >
      In Clause 4 of the printed Bill, insert the following subsection after
      proposed section 197.4: "Parental Engagement Strategy 197.5(1) The
      Ministry shall develop a parental engagement strategy to enhance
      parental engagement in the delivery of education in the province within
      one year of this section coming into force. (2) In developing the
      parental engagement strategy, the Ministry must facilitate consultation
      with parents, teachers, school community councils, and school
      divisions. (3) The parental engagement strategy shall be reviewed on an
      annual basis and the review must include consultations with parents,
      teachers, school community councils, and school divisions."
    reason: >
      TEXT READ 2 October 2026. It was offered BESIDE the consent
      clause, not instead of it: a new s.197.5 inserted after s.197.4, leaving
      the parental-consent rule untouched. A consultation strategy neither
      strengthens nor weakens parental consent, so neither lobby is on our
      ground; and it split exactly as the readings (NDP 11 against the
      government 33), which carry Bill 137. Evidence only.

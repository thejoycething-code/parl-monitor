  - key: on-41-2-2017-05-18-5
    title: "Bill 129 (Yurek), Regulated Health Professions Amendment Act (Freedom of Conscience in Health Care), 2017 -- second reading (lost)"
    dated: 2017-05-18
    result: "Negatived 23-39"
    lobbies: "Yea: PC 23. Nay: Liberal 34, NDP 5 (counted from prov_votes; party at the vote, from the day's Hansard roster)"
    moved_by: "Jeff Yurek (PC), the sponsor, who voted Yea"
    source: "Votes and Proceedings, 18 May 2017 (ola.org); Bill 129 first reading text, explanatory note (ola.org bill---text-41-2-en-b129_e.pdf)"
    text: >
      Explanatory note: Member participation in medical assistance in dying
      shall be voluntary. A member shall not be subject to civil,
      administrative, disciplinary, employment, credentialing, regulatory or
      other sanction or penalty [...] for refusing to participate in medical
      assistance in dying. Participation includes, but is not limited to,
      performing, assisting in the performance of or making a referral for any
      activities related to, or for the purpose of, medical assistance in dying.
    # TEXT READ 8 October 2026. +/-2 as the federal C-230 (commons-44-1-186): a
    # private member's bill that died at its only reading. PC 23 Yea; Liberal 34
    # and NDP 5 Nay.
    yea: 2
    why_yea: "Voted to protect health professionals from sanction for refusing to take part in, or refer for, MAID."

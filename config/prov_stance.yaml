  - key: on-41-2-2017-05-09-2
    title: "Bill 84, Medical Assistance in Dying Statute Law Amendment Act, 2017 -- third reading"
    dated: 2017-05-09
    result: "Carried 61-26"
    lobbies: "Yea: Liberal 48, NDP 13. Nay: PC 26 (counted from prov_votes; party at the vote, from the day's Hansard roster)"
    moved_by: "Eric Hoskins (Liberal; Minister of Health, the bill's sponsor), who voted Yea"
    source: "Votes and Proceedings, 9 May 2017 (ola.org); Bill 84 as enacted, S.O. 2017 c.7, explanatory note (ola.org bill---text-41-2-en-b084ra_e.pdf)"
    text: >
      Explanatory note: The Excellent Care for All Act, 2010 is amended to
      provide protection against litigation for care providers and for doctors,
      nurse practitioners and people assisting them for performing medical
      assistance in dying. [...] The Minister is required to establish a care
      coordination service to assist patients and caregivers in accessing
      additional information and services for medical assistance in dying [...].
      The Freedom of Information and Protection of Privacy Act [...] amended to
      provide that they do not apply to identifying information relating to
      medical assistance in dying.
    # TEXT READ 8 October 2026. Party line: PC 26 Nay; Liberal 48 and NDP 13
    # Yea. The PCs moved Bill 129 (conscience) the same month. CLOSE CALL: the
    # bill implements a federal law rather than legalising MAID; +/-1 is the
    # alternative.
    yea: -2
    why_yea: "Voted to pass Ontario's MAID statute: immunity from suit for MAID providers, MAID records closed to FOI, a state MAID coordination service, and no conscience protection."
    nay: 2
    why_nay: "Voted against Ontario's MAID statute, which gave providers immunity and left out conscience protection."

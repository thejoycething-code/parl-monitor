    title: "Government Motion 17 -- regulate medical assistance in dying after Carter"
    dated: 2016-06-01
    result: "Carried 41-18"
    lobbies: "Yea: NDP 40, Alberta Party 1. Nay: Wildrose 12, PC 6 (store, prov_votes; party at the vote)"
    moved_by: "Brandy Payne (NDP; Associate Minister of Health), who voted Yea"
    source: >
      Votes and Proceedings, 2016-06-01
      (docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_29/session_2/20160601_1200_01_vp.pdf)
      (motion text read in full there)
    text: >
      Be it resolved that the Legislative Assembly urge the Government to
      implement measures to regulate medical assistance in dying, consistent
      with the decision of the Supreme Court of Canada in Carter [...] so
      that: (a) Albertans may exercise their rights to access medical
      assistance in dying; (b) appropriate safeguards be put in place to
      protect vulnerable Albertans; (c) conscience rights are respected
      while ensuring the right of patients to access this service; [...]
    # The store links it to Bill 20 (Climate Leadership) by date: wrong bill
    # key. A motion that leads with access and makes conscience rights yield
    # to it: Yea -1, Nay +1. Not -2: it also asks for safeguards and
    # conscience rights, and is non-binding.
    yea: -1
    why_yea: "Voted to urge the Government to implement access to medical assistance in dying in Alberta, with conscience rights subject to patients' access."
    nay: 1
    why_nay: "Voted against urging the Government to implement access to medical assistance in dying."
    draft: true

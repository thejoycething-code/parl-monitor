  - key: bc-43-1-2025-10-08-79.1
    title: "Protecting Minors from Gender Transition Act -- first reading (refused)"
    dated: 2025-10-08
    result: "Negatived 40-48"
    lobbies: "Yea: Conservative 37, OneBC 2, Independent 1. Nay: NDP 45, Green 2, Independent 1 (counted from prov_votes; party is the LIMS API's undated label, today's caucus, not party at the vote)"
    moved_by: "Tara Armstrong (Kelowna-Lake Country-Coldstream), who voted Yea"
    source: "Hansard, 8 October 2025 p.m., issue 79 (lims.leg.bc.ca/hdms/file/Debates/43rd1st/20251008pm-Hansard-n79.html). Refused first reading, the bill was never printed: the member's first-reading statement is the only account of it."
    text: >
      Tara Armstrong: I move that a bill intituled Protecting Minors from Gender
      Transition Act [...] be introduced and read a first time now. [...] This
      bill will bring B.C. in line with the U.K. and other progressive European
      countries that have banned harmful and unscientific social and medical
      gender-transition procedures for minors. In our schools, it will stop them
      using the wrong pronouns, keep boys out of girls' bathrooms and remove
      gender ideology from school libraries and curricula. It will stop doctors
      from attempting to change the sex of minors.

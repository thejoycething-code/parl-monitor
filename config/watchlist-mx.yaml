# Mexico watchlist -- GROUNDWORK DRAFT (9 October 2026), not yet reviewed by
# anyone who campaigns in Mexico. See docs/mexico-scope.md.
#
# Until Christopher approves a Spanish term list (config/taxonomy-es.yaml),
# this file is the ONLY thing that gives a Mexican iniciativa or vote an
# area. Every entry below was found by the draft Spanish terms measured in
# the scope doc and read by hand.
#
# APPLIED BY KEY, NEVER BY TITLE (src/mx_store.add_watch_areas). Keys are
# '<legislature>/<number>', the sequence number the Gaceta Parlamentaria
# prints at the end of each entry ('(1130)'). Never use a provisional number
# ('(783X)'): it is replaced within weeks. Mexican titles are formulaic
# ("Que reforma los artículos 329 y 330 del Código Penal Federal..."), so a
# title term would collide at once.
#
# A vote carries no iniciativa number. When the Chamber votes on a watched
# iniciativa, list the SITL vote ids under `votaciones` and the vote takes
# the iniciativa's areas. None of these has reached the floor yet.
#
# The LXVI ends on 31 August 2027; re-key surviving entries for the LXVII.
iniciativas:

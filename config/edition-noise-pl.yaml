# Poland edition noise rules (src/noise.py; format documented there).
# Hand-edited. Patterns match folded text: lower case, accents stripped,
# 'ł' as 'l'. A watched item is never filtered.
#
# Measured on the scoping store (9 October 2026, reclassified under
# taxonomy-pl v0.1), 1 September to 9 October: 66 items on our ground.
# 24 of them were the votes on the alcohol bills (druki 2007 and 2010:
# advertising bans and age checks at the till), on area 7 through
# "weryfikacj* wieku" and "radiofonii i telewizji" in the Sejm's summary;
# the alcohol act is left out by its name. Four were procedural votes
# (shortening a deadline, going to second reading without committee).
# Kept: the broadcasting council's annual report, the patriotic-education
# bill, the operational-control bill's Senate amendments.
procedural_votes:
  - '^\W*glosowanie proceduralne\b'
  - '\bwniosek o skrocenie terminu\b'
  - '\bwniosek o przystapienie do (drugiego czytania|glosowania) bez (kierowania|odsylania)\b'
  - '\bwniosek o (ogloszenie )?przerw[ey]\b'
  - '\bwniosek o (uzupelnienie|zmiane) porzadku dziennego\b'
exclude_titles:
  - '\bwychowaniu w trzezwosci\b'
alert:
  title_tier1: true
  distinct_terms: 2

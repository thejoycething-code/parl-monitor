# Northern Ireland Assembly: bills whose divisions we collect member votes for.
#
# WHY THIS FILE STILL HAS TO EXIST -- corrected 2026-08-18, because the first
# version of this note asserted something that is now measurably false.
#
# The SUBJECT LINE cannot be classified: "Amendment 97 - Consideration Stage:
# Justice Bill (NIA Bill 7/22-27) (Day 4) [Mr Timothy Gaston]" names the
# amendment NUMBER and never its content, and is truncated at 100 characters.
# Zero of 139 divisions matched on it.
#
# The AMENDMENT'S OWN WORDING often can be, and tools/ni_classify.py now reads
# it from Hansard: amendment 97 is "Accommodation of women prisoners", which is
# area 5. So the earlier claim that "no classifier can decide whether amendment
# 97 is about abortion clinic buffer zones or court fees" was wrong, and leaving
# it would stop the next reader from looking.
#
# What is still human, and why this file is not replaced by the classifier:
#
#   * A FALSE NEGATIVE IS INVISIBLE. An amendment whose wording is anodyne but
#     whose effect is on our ground classifies to nothing, and nothing says so.
#   * The yield is small and honest -- 4 of 139 in the year to 2026-08-18 -- so
#     gating vote harvesting on a taxonomy match would have collected 4
#     divisions instead of 37 and lost the Justice Bill almost entirely.
#   * 3 of those 4 are on bills already listed here. The hand-picked list was
#     right; classification CORROBORATES the judgement rather than superseding
#     it, and the 4th was a motion nothing else would have surfaced.
#
# So: list a bill here and every one of its divisions gets per-MLA votes
# harvested. Same discipline as config/vote_tracker.yaml on the Westminster
# side -- a vote enters the ledger because somebody decided it counts, not
# because a keyword fired.
#
# Run `python3 tools/ni_divisions.py --review` for the ranked candidate list
# and the "classified but not watched" section, which is the feedback loop.

bills:
  # 24 divisions in 2025-26, the Assembly's most-divided bill of the session.
  # A Justice Bill is where safe-access-zone and sentencing amendments land in
  # NI, so it is watched on the strength of the vehicle, not a keyword hit.
  - name: "Justice Bill"
    why: "Most-divided bill of the session; the usual vehicle for safe access zone and sentencing amendments."

  # Life-adjacent on its face. Three divisions.
  - name: "Deaths, Still-Births and Baby Loss Bill"
    why: "Directly touches how the law treats an unborn or newly-born child."

  # Historic institutional abuse. Adjacent rather than core, watched because
  # the inquiry's framing tends to reach into conscience and church matters.
  # NB the name here was wrong on the first pass -- "Magdalene Laundries) Bill"
  # instead of "...and Workhouses) Bill" -- and matched nothing. Because the
  # API truncates subjects at 100 characters, no stored spelling is complete
  # enough to check a name against by eye; use --review output, and note that
  # tools/ni_divisions.py now WARNS when a watch entry matches no division.
  - name: "Inquiry (Mother and Baby Institutions, Magdalene Laundries and Workhouses) Bill"
    why: "Framing of church-run institutions; conscience and religious liberty adjacent."

  # Parental rights in education is a standing area for us.
  - name: "School Uniforms (Guidelines and Allowances) Bill"
    why: "Statutory guidance to schools; the mechanism parental-rights amendments use."

# Croatia watchlist -- GROUNDWORK DRAFT (9 October 2026), not yet reviewed by
# anyone who campaigns in Croatia.
#
# APPLIED BY KEY, NEVER BY TITLE (src/hr_store.add_watch_areas). Two kinds:
#   bills: '<saziv>/<number>', from "P.Z. br. N" / "P.Z.E. br. N" in the
#          agenda title. PZ and PZE share one sequence; numbers restart with
#          each saziv, so every entry is re-keyed after a general election.
#   items: an agenda appearance's tid, for votes that are not bills
#          (interpellations, decisions, declarations). A tid is ONE
#          appearance: an item carried to the next session gets a new tid,
#          so items entries need adding again when that happens.
#
# Until config/taxonomy-hr.yaml exists this file is the ONLY source of areas
# for the Croatian edition. Each entry below was found by the proposed
# Croatian terms (docs/croatia-scope.md) and read by hand: its subject is
# plain in its own title.
bills:

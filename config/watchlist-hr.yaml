            why: "Withdrawal from the Istanbul Convention (repeal of the ratification act). Private member's bill, Marijan Pavlicek; on the agenda of every session since the 2nd, never debated."}
  "11/169": {areas: [5],
             why: "Amendment to the Gender Equality Act (Zakon o ravnopravnosti spolova), Mrak-Taritas and Oreskovic. Voted at the 7th session."}
  "11/213": {areas: [6, 7],
             why: "Digital Protection of Children Act (Zakon o digitalnoj zastiti djece), Mozemo! club. Voted at the 9th session."}
  "11/214": {areas: [10],
             why: "Amendment to the Medically Assisted Reproduction Act (Zakon o medicinski pomognutoj oplodnji), Mrak-Taritas and Oreskovic."}
  "11/244": {areas: [9],
             why: "Amendment to the Family Act (Obiteljski zakon), SDP club. Voted at the 10th session."}
items:
  214612: {areas: [1],
           why: "Interpellation on the Government's record on women's reproductive rights (16 members), 12th session appearance."}
  214529: {areas: [1],

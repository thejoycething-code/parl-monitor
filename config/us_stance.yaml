    aye_means: "For passing the bill: Title IX barred from letting males take part in athletics designated for women or girls, sex defined by reproductive biology and genetics at birth."
    yea: 2
    why_yea: "Voted to pass the Protection of Women and Girls in Sports Act: women's and girls' school sport kept for females."
    nay: -2
    why_nay: "Voted against keeping women's and girls' school sport for females."

# US Congress: what a roll call, a sponsorship or a cosponsorship MEANS,
# written by a human.
#
# The US mirror of config/ca_stance.yaml and config/prov_stance.yaml, under
# the same rule: which lobby is CitizenGO's is the campaigner's judgement, and
# no tool estimates it. tools/us_5ca.py applies these lines; it never invents
# one.
#
# EVERY ENTRY IS A DRAFT (9 October 2026). Claude drafted them from the store
# at Christopher's request ("5CA parity for the US Congress"). An entry
# carrying `draft: true` places NOBODY, so until readings are signed every
# US sheet is an evidence list ending "NO SIGNED READINGS". To sign: tick the
# box in docs/5ca-us-readings.md and run `python3 tools/us_5ca.py
# --sign-from-doc`, or delete the `draft: true` line by hand. To regenerate
# the guide after editing this file: `python3 tools/us_5ca.py --signoff-doc`.
#
# Four kinds of entry:
#   * divisions with `yea:` / `nay:` on the stance scale (-2..2), and why
#     lines -- a reading that, once signed, places every member who voted;
#   * `placeable: false` with a `reason:` -- the vote tells no member apart
#     (near-unanimous) or is procedure (a 119th-Congress motion to recommit,
#     which carries no instructions). Evidence only, once signed;
#   * `read_first:` with no values -- no direction proposed;
#   * bills with `sponsored:` / `cosponsored:` -- sponsoring is weight 3,
#     cosponsoring weight 2, a vote weight 5. Cosponsorship is drafted at +/-1
#     so that it alone never reaches ++ ("will vote with us"); a vote does.
#
# Keys are the store's: roll calls 'house-119-1-27' / 'senate-119-1-11'
# (chamber-congress-session-roll), bills '119/hr/21'. `motion:` is the
# amendment purpose the House printed, or the Senate's question; `aye_means:`
# says what a Yea was for. `lobbies:` is counted from us_votes (party AT THE
# VOTE), not remembered. `flag:` is a question for the signer.
#


    title: "On Cloture on the Motion to Proceed S. 9: Protection of Women and Girls in Sports Act of 2025"
    dated: "2025-03-03"
    result: "Cloture on the Motion to Proceed Rejected 51-45"
    lobbies: "Yea: R 51. Nay: D 43, I 2."
    motion: "Motion to Invoke Cloture: Motion to Proceed to S. 9 | A bill to provide that for purposes of determining compliance with title IX of the Education Amendments of 1972 in athletics, sex shall be recognized based solely on a person's reproductive biology and genetics at birth."
    aye_means: "For invoking cloture on the motion to proceed to S. 9: ending the filibuster so the Senate could take the bill up. 60 needed; it failed."
    yea: 2
    why_yea: "Voted to let the Senate take up the Protection of Women and Girls in Sports Act (cloture on the motion to proceed)."
    nay: -2
    why_nay: "Voted to keep the Protection of Women and Girls in Sports Act from the Senate floor (against cloture)."
    flag: "A cloture vote on a motion to proceed is procedure in form, but it was the Senate's only vote on S. 9 and the filibuster is how the bill died. Drafted at +/-2 as the de facto vote; +/-1 if you read cloture as procedure."
    draft: true
    drafted: "Claude, 9 October 2026"


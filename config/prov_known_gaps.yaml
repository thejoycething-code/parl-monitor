# Alberta: the 2010 backfill's tally gaps, re-read 2 October 2026. Of 358,
# 355 cleared in the parser and resolver; of the record's own errors, three
# are now cleared by division-scoped reviewed facts in config/prov_record.yaml
# (a Hansard total, a Hansard name, a bill-number correction). What is left
# cannot be cleared by any of those. The tally check is untouched.
ab:
  - contains: "ab-28-1-2013-05-13-2: tally check failed"
    reviewed: 2026-10-02
    why: >-
      The V&P (legislature_28/session_1/20130513_1200_01_vp.pdf, p.9) prints
      "Against the motion: 14" over 13 names. Hansard for the same division,
      second reading of Bill 22 (20130513_1930_01_han.pdf), lists 14 with
      Wilson, "Totals: For - 36 Against - 14". The V&P dropped Wilson. A
      reviewed fact may settle a bare name or supply a missing total, never
      add a name the record left out, so the division stays untrusted.
  - contains: "ab-31-2/20: bill page says Third Reading on 2026-03-26 passed on division"
    reviewed: 2026-10-02
    why: >-
      The bill page is wrong. The V&P of 26 Mar 2026
      (legislature_31/session_2/20260326_1200_01_vp.pdf) records Bill 20's third
      reading as "The question being put, the motion was agreed to", with no
      division; the one division that afternoon (43-14) was the Standing Order
      64(5) question on the Appropriation Bill, Bill 19, whose own page flags it.

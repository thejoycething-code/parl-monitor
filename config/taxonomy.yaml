om the stored value, and was wrong. The WHO name SPELLED OUT is guarded too, on evidence: at v0.6 it was unguarded and it filed the NI motion "Addressing the Mental Health Crisis" under area 7, whose text only says its recommendations "align with recent calls from the World Health Organisation and the United Nations for systematic mental health reform" -- WHO as a research citation, not health sovereignty. Any health motion citing WHO would do the same. Bare WHO is BOTH all-caps (case-sensitive, so it never matches the pronoun) AND guarded, because case-sensitivity does not survive an all-caps heading and most WHO mentions are global health aid rather than sovereignty. IHR, INB and CBDC rely on case-sensitivity alone; if triage shows noise, guard them rather than delete. Agenda 2030 and the SDGs are included at tier 2 to catch "Reject Agenda 2030" (20,037) and the Doha Summit (16,191); they are UN governance rather than the three issues named, so strike this pair if unwanted. American vocabulary (v1.17, 9 October 2026, measured against the 119th Congress, docs/us-scope.md): Section 230 is guarded because UK statutes have a section 230 too. "First Amendment" appears in almost every American civil-liberties text, so it sits at tier 2 and triage decides.

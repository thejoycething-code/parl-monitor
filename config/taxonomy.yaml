    tier1: ["marriage law", "weddings law", "Tying the Knot", "Marriage (Same Sex Couples)", "same-sex marriage", "same sex marriage", "equal marriage", "marriage equality", {term: "Law Commission", with: [marriage, "wedding*", "cohabit*", "surrogac*", family]}, "cohabitation reform", "cohabitation rights", "marriage allowance", "family breakdown", "no-fault divorce", "Parenthood Regulation", "recognition of parenthood", "European Certificate of Parenthood", "Respect for Marriage Act", Obergefell, "Defense of Marriage Act"]
    tier2: ["civil partnership*", "family hub*", fatherhood, "forced marriage", "humanist marriage", "child marriage", sharia, "rainbow famil*", demography, "demographic change", "family mainstreaming", "birth rate*", "birthrate*", "fertility rate*", "natalis*", "family formation", "two-child limit", "two-child benefit cap"]
    # note: EU vocabulary (v1.5): the Parenthood Regulation family ("recognition of parenthood", the European Certificate of Parenthood) at tier 1 -- the live cross-border surrogacy/parenthood vehicle; demography terms at tier 2 by Christopher's decision (2026-09-01, opportunities not just threats), triage-gated because EU demography traffic is mostly statistics. "Law Commission" gained a guard at v0.9, found via Holyrood but a WESTMINSTER bug: the Commission works on everything, and 141 ledger lines matched the bare term with only 6 keeping marriage/family company -- the rest were leasehold, digital wills and self-harm internet regulation, quietly inflating area 9 evidence. The guard names the Commission work this area actually watches. Deliberately lean; childcare and general family-benefit items are excluded. Tying the Knot is a v0.2 pilot patch. FAMILY ECONOMICS was scoped at v1.6 (Christopher, 2026-09-04: "let's work on it") and deliberately kept NARROW. Measured across every chamber first: childcare 61 unmatched items, child poverty 60, maternity 32 -- and reading them, they are devolved SERVICE ADMINISTRATION (funding rates for the early learning entitlement, NHS Grampian midwife recruitment, Child Poverty Delivery Plan updates), not family policy. Admitting them would have put ~150 Scottish Government delivery questions a quarter into a monitor whose editions run to a dozen items, which is how a filter stops being read. What IS ours is the demographic argument -- birth rates, fertility, family formation -- and this area already carried demography and demographic change, so the addition is the vocabulary around them plus the two-child limit. The two-child cap is the one judgement call: its removal is usually argued from child poverty, but the pro-life case against it (a benefit rule that prices a third child) is made in the same debates, so it sits at tier 2 for triage to weigh rather than tier 1. Marriage allowance and family hubs were already here. v1.10 (29 September 2026): "Marriage (Same Sex Couples)" at tier 1, the Bill and Act of 2013. The area held NO term for same-sex marriage at all, so the pre-2016 division backfill could not tag the Bill's own divisions by title (Second Reading 400-175, 5 February 2013) while it did tag the 2015 Assisted Dying Bill beside them. The Bill's name is unambiguous. The broader phrases were left for Christopher, and v1.11 (29 September 2026, Christopher: "add the marriage phrases") adds them at tier 1: "same-sex marriage", "same sex marriage", "equal marriage", "marriage equality". The last is the NI Assembly's own wording: its five motions of 2012-15 are titled "Marriage Equality", which matched nothing, found by the devolved probe of the same day. These now reach every weekly edition, not only the backfills.
  10_surrogacy_embryology:
    tier1: [surrogacy, surrogate, "Surrogacy Arrangements Act", "Human Fertilisation and Embryology", HFEA, "commercial surrogacy", "embryo research", "14-day rule", "gamete donation", "egg donation", "in vitro fertilization", "in vitro fertilisation", "embryo adoption"]
    tier2: ["fertility treatment", IVF, "donor conception", "donor-conceived", "mitochondrial donation", "genome editing", "embryo screening", "polygenic screening", "artificial womb*", "substances of human origin", SoHO]
    # note: EU vocabulary (v1.5): the SoHO Regulation (substances of human origin) is the EU vehicle for embryo and gamete rules; both forms tier 2, SoHO case-sensitive. Ties to the Bought and Broken documentary workstream; any Law Commission surrogacy implementation signal is an automatic score 3.
  11_migration:
    tier1: ["Immigration and Asylum Bill", "illegal migration", "Illegal Migration Act", "small boats", "Channel crossing*", "asylum hotel*", "net migration", "border security", "asylum backlog", "safe and legal routes", "foreign national offender*", "deportation*", "indefinite leave to remain", "Nationality and Borders", "Safety of Rwanda", "Rwanda plan", "Rwanda scheme", "Pact on Migration and Asylum", "Migration and Asylum Pact"]
    tier2: [migration, immigration, asylum, "asylum seeker*", "refugee*", "leave to remain", citizenship, "community cohesion", "immigration detention", "illegal working", Rwanda, Frontex, "returns directive"]
    # note: EU vocabulary (v1.5): the Pact on Migration and Asylum (both word orders) at tier 1, Frontex and the returns directive at tier 2 -- same standing rule as Westminster: collated, never campaigned. New area, added 3 August 2026 by Christopher's decision. Nationality and Borders and the Rwanda terms are v0.4 historic-vocabulary patches for the 2021-24 debates; bare Rwanda sits at tier 2 (it is also just a country) and triage gates it. Bare migration/immigration/asylum sit at tier 2 deliberately: they are common words (data migration, asylum in history debates) and the triage pass gates them. Cross-tags: religious conversion in asylum claims stays in area 8; Islamophobia and community-speech items in area 7.
  12_prostitution:
    name: "Prostitution, trafficking and sexual exploitation"
    tier1: ["commercial sexual exploitation", "sex buyer*", "kerb-crawling", "paying for sex", "brothel*", pimping, "Prostitution (Offences and Support)", "trafficking for sexual exploitation", "trafficking in women", {term: "Nordic model", with: [prostitution, "sex work*", "sexual exploitation", "buyer*", demand, "brothel*", "kerb*"]}]
    tier2: [prostitution, "sex work*", "strip club*", "lap dancing", "adult entertainment", "survivors of prostitution", "human trafficking", "trafficking in human beings", "modern slavery", "Modern Slavery Act", "Human Trafficking and Exploitation"]
    # note: New at v1.6 (Christopher, 2026-09-04): nothing in the eleven areas covered the Nordic-model ground -- the demand-side offence, the buyer, the brothel -- and the only term reaching it was bare `prostitution` sitting in area 5, where it filed the Prostitution (Offences and Support) (Scotland) Bill and an EP draft report on regulating prostitution in the EU under single-sex spaces. Measured across 20,566 items in every chamber: `prostitution` 5, "sex work" 1, "commercial sexual exploitation" 1, and zero for the demand-side vocabulary, which is forward-looking by design -- the Scottish Bill is live and the EP report is in draft, so the phrasing is about to arrive. "Nordic model" is GUARDED because it is also the Nordic welfare and labour-market model, which is a different debate entirely. Bare "sexual exploitation" is deliberately EXCLUDED: 17 items carry it and most are child sexual exploitation, which area 6 owns and which triage would otherwise see twice; "commercial sexual exploitation" is the adult term of art and carries no such collision. TRAFFICKING lives here rather than in area 11, and the reason is structural: area 11 is collated and never campaigned (make_briefs excludes it), so filing anti-trafficking under migration would have hidden a campaign family behind a flag meant for border policy. The area was renamed accordingly at v1.6 -- the key stays 12_prostitution, only the label moves. Bare "trafficking" is NOT a term: 10 corpus items carry it and they include narco-trafficking and Europe's waters, so the terms are the human ones ("human trafficking" 4, "trafficking in human beings" the EU's phrase, "modern slavery" 0 today but the Act is UK law) at tier 2, with the sexual-exploitation compounds at tier 1. Cross-tag with area 11 where the vehicle is border policy, and with area 5 where the argument is about women's services.
  13_organ_donation:
    name: Organ donation and transplant ethics
    tier1: [{term: "organ donation*", without: ["organ donation leave", "organ donor leave", "leave for organ donation", "leave related to", "employment standards", "labour standards", "Labour Code"]}, {term: "organ donor*", without: ["organ donation leave", "organ donor leave", "leave for organ donation", "leave related to", "employment standards", "labour standards", "Labour Code"]}, "organ transplant*", "Organ Donation (Deemed Consent)", {term: "deemed consent", with: [organ, organs, donation, "donor*", "transplant*"]}, "organ harvesting", "transplant tourism", "organ trafficking", "trafficking in organs"]
    tier2: ["Human Tissue Act", "Human Tissue Authority"]
    # note: v1.16 (Christopher, 2026-10-02: "guard both taxonomy terms"): "organ donation*" and "organ donor*" are VETOED by labour-law company. Canadian employment standards codes grant leave to living donors, and the bare terms filed those Bills as transplant ethics: Manitoba 42-3 Bill 44 ("unpaid leave for organ donation", section 59.6 of the Employment Standards Code) and Newfoundland and Labrador 50-2 Bill 82 (Labour Standards Act, Part VII.9 "Leave related to long-term illness, long-term injury and organ donation"). The vetoes are the leave phrasings and the statute names; a deemed-consent or transplant Bill carries none of them. Measured the same day: both Bills' texts lose the match (Manitoba 1 passage to 0, Newfoundland and Labrador 3 to 0), and no stored organ-donation match anywhere loses it (390 Canadian Commons speeches, 146 Holyrood and 29 Senedd events, 70 NI and 89 Holyrood items, and the Canadian bills, divisions, petitions, Gazette and testimony rows). New at v1.9 (Christopher, 26 September 2026: "cover organ donation in the UK edition too"), the same day Germany gained it. It is its OWN area, not part of area 2, because area 2 feeds member stance, issue pages and the 5CA: an organ-donation speech filed there would be scored as a position ON ASSISTED DYING, and the two are separate questions -- a member can oppose assisted dying and support opt-out donation. Measured against the written-questions API, counting only results that genuinely contain the phrase (its search is loose relevance matching -- "organ donation" reports 58,113 hits, headed "Artificial Intelligence: China"): `organ donation` 51 of 100 fetched, `organ harvesting` 53 of 94 -- almost all forced harvesting from Falun Gong and other prisoners in China -- `organ transplant` 38, `deemed consent` 24 of 64, `Human Tissue` 31, `organ trafficking` 2, `transplant tourism` 2. Our own ledger held almost none of it (2 hits in 169,155 texts), because our sweeps search by our own terms: the vocabulary was never fetched, not absent. `deemed consent` is GUARDED: among its genuine matches is "Flags: Palestine", because deemed consent is also advertisement and planning law. The guard is `organ` and `organs` as whole words, never `organ*`, which would match `organisation`. REJECTED: `brain stem death` (0), `living donor` (0), and `NHS Blood and Transplant` (7 of 100, mostly blood donation and a Stonewall question). Organ trafficking and forced harvesting sit HERE rather than in area 12 or 8: they are organ ethics first, though triage should weigh religious persecution where the victims are Falun Gong. REJECTED from tier 2 after the retag dry run: bare `transplant*`. Of the 20 stored Holyrood rows it would have tagged, 11 matched on it alone, and every one was clinical, not ethical -- World Kidney Day motions, stem-cell research funding, a charity run by a stem-cell transplant survivor, heart transplant rates at the Golden Jubilee. Tier 2 alone admits a row, so a bare clinical word is a standing noise source. The German `Transplantation*` has no such problem: the matcher anchors at word start, so Stammzelltransplantation never reaches it. POSITION (Christopher, 26 September 2026): "Organ donation is fine but forced organ donation and assumed consent is not." CitizenGO supports freely given donation and opposes presumed/deemed-consent opt-out systems, forced organ harvesting, organ trafficking and transplant tourism; the wording lives in the stance, triage and debate-report prompts. Members are scored against it, but the area has NO 5CA SHEET ("not a huge issue for us"; config/stance_overrides.yaml excluded_from_5ca). Because donation itself is supported, the terms that find donor-awareness items find ground we do not contest: those items score low and carry no stance direction by design.
exclusions_global: [termination, conversion, transition, blocker, gender, safeguarding, education, equality]

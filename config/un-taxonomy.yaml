# UN taxonomy: the same twelve areas, in the UN's vocabulary.
#
# AUTHORED, not generated. config/taxonomy.yaml is built from
# docs/keyword-taxonomy.md and must never be hand-edited; this file is the
# opposite and is edited directly. Same schema, so src/filter.py reads it
# unchanged -- including guarded terms ({term, with: [...]}), which matter
# more here than at Westminster because UN language is far more ambiguous.
#
# WHY A SECOND TAXONOMY. Run against the fifteen OHCHR calls open on
# 2026-08-17, the parliamentary taxonomy matched ZERO -- including "Child
# rights and safety in the digital environment" and the faith-based
# organisations call, both plainly ours. It encodes British legislative
# vocabulary: "EOTAS", "safe access zones", "Cass Review". The UN says
# "comprehensive sexuality education", "child, early and forced marriage",
# "sexual and reproductive health and rights". Same issues, different words.
#
# PROVENANCE. Terms marked (mined) were extracted from the 2,331 UPR
# recommendations already in the store, by frequency within each area, rather
# than guessed: "child, early and forced marriage" and "lesbian, gay,
# bisexual, transgender and intersex" are the UN's own set phrases and are not
# how a British campaigner would write them. The rest are standard UN and
# treaty-body terms of art.
#
# Areas match taxonomy.yaml exactly. Area 11 stays collated-only: tracked for
# intelligence, never campaigned.
version: 0.1
areas:
  1_abortion:
    tier1: ["abortion", "decriminalize abortion", "decriminalise abortion", "safe and legal abortion", "unsafe abortion", "termination of pregnancy", "post-abortion care", "sexual and reproductive health and rights", SRHR, "reproductive rights", "Maputo Protocol", {term: "right to life", with: ["unborn", "conception", "prenatal", "abortion"]}, {term: "conscientious objection", with: ["abortion", "health", "medical", "termination", "reproductive"]}]
    tier2: ["sexual and reproductive health", "reproductive justice", "bodily autonomy", "family planning", "maternal mortality", "sex-selective", "therapeutic abortion"]
    # note: "sexual and reproductive" is the single most frequent phrase in area 1 (mined); "right to life" is guarded because in UN usage it is overwhelmingly death-penalty work.
  2_assisted_dying:
    tier1: [euthanasia, "assisted suicide", "assisted dying", "medical assistance in dying", MAiD]
    tier2: ["end-of-life", "palliative care", "right to die", "terminal illness"]
  3_gender_medicine_children:
    tier1: ["puberty blocker*", "puberty-suppressing", "gender-affirming", "gender affirming care", "sex reassignment surgery", "sex-reassignment", "gender reassignment", {term: "hormone", with: ["gender", "trans", "child", "adolescent", "minor"]}, {term: "irreversible", with: ["gender", "trans", "sex characteristic"]}]
    tier2: ["gender dysphoria", "transgender children", "trans youth", "medical transition", {term: "intersex", with: ["surgery", "surgical", "medical", "children", "infant", "non-consensual"]}]
    # note: the UN frames paediatric intersex surgery as bodily integrity, so the guarded "intersex" here catches the medical cases while area 5 keeps the rest.
  4_conversion_practices:
    tier1: ["conversion therapy", "conversion practices", "so-called conversion"]
    tier2: ["gender exploratory therapy", "reparative therapy"]
  5_sex_based_rights:
    tier1: ["sexual orientation and gender identity", SOGI, LGBTI, LGBTIQ, "LGBTIQ+", "lesbian, gay, bisexual", "legal gender recognition", "gender recognition", "intersex persons", {term: "self-identification", with: ["gender", "sex", "trans"]}, "single-sex"]
    tier2: ["gender identity", "transgender", "trans persons", "gender expression", "sex characteristics", "advancement of women", "self-defined", "self-declared", {term: "self-determination", with: ["gender", "trans", "sex", "identity", "recognition", "legal"]}, {term: "legal recognition", with: ["gender", "sex", "trans", "identity"]}, {term: "bodily integrity", with: ["gender", "trans", "sex", "intersex", "surger"]}]
    # note: HIJACKED TERMS. "self-determination" at the UN means decolonisation
    # -- "the right of peoples to self-determination" -- so it cannot simply be
    # added; guarded, it catches "legal recognition based on self-determination"
    # while staying silent on Palestine. Same for "legal recognition" and
    # "bodily integrity". This is the mechanism built for "buffer zone*" and it
    # is the answer to a new framing arriving inside a word we already exclude.
    # "self-defined" and "self-declared" are new coinages and unambiguous, so
    # they go in bare.
    # note: "advancement of women" is the other annual omnibus title, tier2 for
    # the same reason as the child-rights one.
    # note: "lesbian gay bisexual transgender and intersex" written out in full is the commonest phrasing in the store (mined), not the acronym.
  6_parental_rights_education:
    tier1: ["comprehensive sexuality education", "sexuality education", "sex education", "parental rights", "rights of parents", "home education", "homeschooling", "prior right to choose"]
    tier2: ["school curricul*", "age-appropriate", "child protection", "best interests of the child", "rights of the child", "rights of children"]
    # note: the last two are the ANNUAL OMNIBUS resolution titles. Deliberately
    # tier2: they are generic by design, and generic is the point -- the
    # omnibus is the vehicle CSE and SRHR language is inserted into, so a match
    # means "read this draft", not "this is definitely ours". Added 2026-08-17
    # after A/C.3/80/L.20 ("Promotion and protection of the rights of
    # children") matched nothing at all.
  7_free_speech_online_safety:
    tier1: ["freedom of expression", "hate speech", "blasphemy", "online safety", "age verification", "age assurance", "child sexual abuse material", {term: "digital environment", with: ["child", "young", "safety", "rights"]}]
    tier2: ["incitement to hatred", "defamation of religion", "content moderation", "disinformation", "online violence"]
  8_freedom_of_religion:
    tier1: ["freedom of religion or belief", "freedom of religion", FoRB, "religious minorities", "places of worship", "religious freedom", {term: "conscientious objection", with: ["religio", "belief", "military", "conscience"]}]
    tier2: ["faith-based", "manifest religion", "religious symbols", "apostasy", "religious education"]
    # note: "freedom of religion or belief" is the treaty formula and outranks "religious freedom" in the store (mined).
  9_marriage_family:
    tier1: ["protection of the family", "child, early and forced marriage", "child early and forced marriage", "forced marriage", "child marriage", "female genital mutilation", "same-sex marriage", "natural family"]
    tier2: ["diverse families", "family values", "civil union", "family policy", "traditional values"]
    # note: CEFM and FGM travel together in UN texts and are the two commonest phrases in area 9 (mined).
  10_surrogacy_embryology:
    tier1: [surrogacy, "commercial surrogacy", "assisted reproduction", "reproductive technolog*", {term: "sale of children", with: ["surrogacy", "reproduct", "adoption"]}]
    tier2: ["in vitro", "embryo", "gamete", "gestational carrier"]
  11_migration:
    tier1: ["asylum-seekers", "asylum seekers", "non-refoulement", "irregular migrants"]
    tier2: ["immigration detention", "safe and regular migration"]
    # note: collated for intelligence only, never campaigned, so kept narrow.
    # "migrant workers" was in tier2 and was REMOVED after measurement: on an
    # unfiltered sample of 299 recommendations it fired 11 times, every one a
    # generic "accede to the Migrant Workers Convention" line. At 3.7% of all
    # UPR traffic it would have been the largest single source of rows in the
    # store, all of it collation noise.
  12_prostitution:
    tier1: ["exploitation of prostitution", "forced prostitution",
            "sexual slavery", "commercial sexual exploitation", "sex tourism"]
    tier2: [prostitution, "sex work", "sex workers",
            {term: "sexual exploitation",
             with: [prostitution, "sex work", trafficking, women, adults,
                    demand, brothel]}]
    # note: new with area 12 (2026-09-04), MINED from the 3,552 UPR
    # recommendations in the store rather than guessed, as this file
    # requires: "exploitation of prostitution" is the CEDAW article 6 phrase
    # (1 row), "sexual exploitation" (19) and "trafficking in persons" (19)
    # are the UN's standing pairing, "sex work" (5) is the opposing frame.
    # Both frames belong here, so a recommendation urging decriminalisation is
    # caught beside one urging demand reduction. UNLIKE the parliamentary
    # taxonomy, bare "sexual exploitation" IS included -- at tier 2 and
    # guarded, because UN recommendations pair it with trafficking of ADULTS
    # as often as with children; the guards keep it off the child-protection
    # text area 6 already owns.
exclusions_global: []

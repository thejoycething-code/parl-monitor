# Senedd division verdicts -- the Holyrood pattern (config/holyrood_votes.yaml)
# applied to Wales. signed_off gates every verdict: until Christopher signs,
# the tracker shows how each Member voted and says nothing about what it
# meant.
#
# Drafted 2026-09-04 from the two divisions on our ground in the store. Both
# are LEGISLATIVE CONSENT MOTIONS, which is exactly why neither is signed:
# an LCM is not a vote on the policy but on whether Westminster may
# legislate for Wales in a devolved area, so "our side" is a judgement about
# devolution as much as about the Bill. The Crime and Policing Bill carried
# the abortion decriminalisation clauses, and the Senedd REFUSED consent
# 25-27 -- a refusal that can be read two ways, and reading it wrong in
# public is the Lords inversion again.

divisions:
  - key: "757579"
    dated: 2026-03-10
    issue: abortion
    stage: Legislative Consent Motion
    short: "LCM: Crime and Policing Bill"
    motion: >-
      Item 8. Legislative Consent Motion: The Crime and Policing Bill.
      Rejected 25-27.
    # NOT OURS -- struck from every tracker by Christopher, 2026-09-06,
    # after reading the Record rather than the title. The taxonomy tagged
    # this under abortion because the Bill carried s.241, but abortion is
    # a RESERVED matter in Wales (Government of Wales Act 2006, Sch 7A,
    # Head J, Section J1), so the Senedd's consent could never have
    # covered those clauses; the motion consents only "to the extent
    # they relate to devolved matters". The stated reasons for refusal:
    # Conservatives -- AI, facial recognition and the recording of
    # non-crime hate incidents; Plaid -- concurrent powers ceded to
    # Westminster; Reform -- the Bill "does not go far enough". Nobody
    # mentioned abortion. A verdict either way would be the Lords
    # inversion exactly: a title standing in for a question.
    #
    # not_ours is honoured in three places, because the collector
    # re-derives areas from the title on every weekly run and a store-only
    # fix would come back the following Thursday: tools/sd_divisions.py
    # writes areas [] for it, tools/make_devolved_votes.py never lists it,
    # tools/devolved_score.py never scores it.
    not_ours: true
    our_side: null
    signed_off: false

  - key: "759759"
    dated: 2026-03-17
    issue: parental-rights
    stage: Legislative Consent Motion
    landmark: true
    short: "LCM: Children's Wellbeing and Schools Bill"
    motion: >-
      Item 8. Legislative Consent Motion: The Children's Wellbeing and
      Schools Bill. Agreed 37-13.
    note: >-
      Signed by Christopher 2026-09-06 after reading the Record. The
      consent covered "a small number of clauses" the Cabinet Secretary
      asked to apply equally to Wales, and the Record is explicit about
      which: the children-not-in-school register and the requirement
      that parents notify or seek a local authority's permission before
      deregistering a child (Cefin Campbell, supporting; Natasha Asghar
      and Mark Isherwood, opposing, on mandatory registration of home
      educators). Labour 24, Plaid 12 and the Lib Dem for; Conservatives
      11, Reform 1 and one Plaid Member against. Several Conservative
      speeches led on competence and scrutiny as well as substance, which
      is why both sentences describe what the vote DID and say nothing
      about motive.
    our_side: against
    signed_off: true
    meaning_good: >-
      Voted to refuse the Senedd's consent to Westminster extending the
      children-not-in-school register -- mandatory registration of
      home-educating families and council permission to deregister -- to
      Wales.
    meaning_bad: >-
      Voted to give the Senedd's consent to Westminster extending the
      children-not-in-school register and council permission to
      deregister to Wales.

  # --- DRAFTED 2 October 2026 from the Fifth Senedd backfill; SIGNED OFF by
  # --- Christopher the same day ("Sign off the four Welsh drafts") ----------
  # Index 401 (src/ingest/senedd.py FIFTH_SENEDD). Neither Bill is tagged by
  # the taxonomy on its title, which is why they surfaced by hand; area 6
  # gains the terms in v1.12. Both are Welsh Government Bills, and both
  # ministers (Julie Morgan, Kirsty Williams) voted For at every stage
  # drafted. Party labels in sd_members are each Member's LATEST party, not
  # the party at the date, so no party split is stated. Not drafted: the
  # Financial Resolutions (procedural) and the ten Stage 3 amendment votes of
  # 21 January 2020, stored as "Amendment N" with no text.
  - key: "219178"
    dated: 2019-09-17
    issue: parental-rights
    stage: "Stage 1 -- general principles"
    landmark: false
    short: "Smacking ban: general principles (Reasonable Punishment Bill)"
    motion: >-
      NDM7130: the general principles of the Children (Abolition of Defence
      of Reasonable Punishment) (Wales) Bill, which removes the defence of
      reasonable punishment for parents in Wales. Agreed 36-15.
    our_side: against
    signed_off: true
    meaning_good: >-
      Voted against the general principles of the Bill removing parents'
      defence of reasonable punishment.
    meaning_bad: >-
      Voted for the general principles of the Bill removing parents'
      defence of reasonable punishment.

  - key: "261621"
    dated: 2020-01-28
    issue: parental-rights
    stage: "Stage 4 -- final vote"
    landmark: true
    short: "Smacking ban: Stage 4 (Reasonable Punishment Bill passed)"
    motion: >-
      NDM7246: Stage 4 of the Children (Abolition of Defence of Reasonable
      Punishment) (Wales) Bill. Passed 36-14. The Act removed the defence of
      reasonable punishment in Wales from 21 March 2022.
    our_side: against
    signed_off: true
    meaning_good: >-
      Voted against passing the Bill removing parents' defence of
      reasonable punishment.
    meaning_bad: >-
      Voted to pass the Bill removing parents' defence of reasonable
      punishment.

  - key: "342454"
    dated: 2020-12-15
    issue: parental-rights
    stage: "Stage 1 -- general principles"
    landmark: false
    short: "Curriculum and Assessment Bill: general principles (compulsory RSE)"
    motion: >-
      The general principles of the Curriculum and Assessment (Wales) Bill,
      which makes Relationships and Sexuality Education a mandatory part of
      the curriculum with no right for parents to withdraw their children.
      Agreed 41-10, with 1 abstention.
    our_side: against
    signed_off: true
    meaning_good: >-
      Voted against the general principles of the Bill making
      Relationships and Sexuality Education mandatory with no parental
      right to withdraw.
    meaning_bad: >-
      Voted for the general principles of the Bill making Relationships and
      Sexuality Education mandatory with no parental right to withdraw.

  - key: "363365"
    dated: 2021-03-09
    issue: parental-rights
    stage: "Stage 4 -- final vote"
    landmark: true
    short: "Curriculum and Assessment Bill: Stage 4 (compulsory RSE passed)"
    motion: >-
      Item 16: Stage 4 of the Curriculum and Assessment (Wales) Bill. Passed
      32-18, with 1 abstention. It became the Curriculum and Assessment
      (Wales) Act 2021: Relationships and Sexuality Education is mandatory
      from age 3, with no parental right of withdrawal.
    our_side: against
    signed_off: true
    meaning_good: >-
      Voted against passing the Bill making Relationships and Sexuality
      Education mandatory with no parental right to withdraw.
    meaning_bad: >-
      Voted to pass the Bill making Relationships and Sexuality Education
      mandatory with no parental right to withdraw.

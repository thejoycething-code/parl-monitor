# Peru's regional governments and Lima Metropolitana (PE4, 12 October 2026).
# Read by tools/pe_regions.py. See docs/peru-regions-scope.md for how each
# line was measured.
#
#   key         the store's region slug (pe_regional_norms.region)
#   name        English name for the edition
#   gazette     the issuing body's heading in El Peruano's Normas Legales, as
#               printed (accents and "DE"/"DEL" folded when matched)
#   gobpe       the institution's slug on www.gob.pe (normas-legales pages)
#   types       gob.pe norm-type pages read weekly: the council's own acts
#               only (ordenanzas and council acuerdos), measured on each
#               institution's /normas-legales/tipos page, 12 October 2026
#   population  rounded INEI estimate, millions, for the ranking only
#
# Lima Metropolitana is not one of the 25 regional governments: the
# Municipalidad Metropolitana de Lima holds the regional functions for the
# province of Lima (Ley Orgánica de Municipalidades, art. 151 onwards), so
# its Concejo Metropolitano's ordenanzas are read here too.

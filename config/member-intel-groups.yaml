at:
  - match: "gleichbehandlung"
    areas: [3, 5]
    why: the equal treatment committee
  - match: "familie"
    areas: [6, 9]
    why: the family committee
  - match: "^gesundheitsausschuss"
    areas: [1, 2]
    why: the health committee
  - match: "^justizausschuss"
    areas: [7, 9]
    why: the justice committee
  - match: "menschenrecht"
    areas: [7, 8]
    why: the human rights committee

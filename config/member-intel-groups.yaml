it:
  - match: "affari sociali"
    areas: [1, 2, 10]
    why: the social affairs committee (XII)
  - match: "\\(giustizia\\)"
    areas: [7, 9, 10]
    why: the justice committee (II)
  - match: "infanzia e l.adolescenza"
    areas: [3, 6]

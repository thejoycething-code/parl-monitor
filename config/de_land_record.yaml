# Former Land members now in the Bundestag: their OWN abortion record from
# their Land parliament, searched BY HAND (29 September 2026).
#
# Why by hand: abgeordnetenwatch documents only a sample of Land votes (nine
# abortion roll calls in all), and the sixteen Land documentation systems are
# sixteen different searches. Christopher asked for the 14 members of the 21st
# Bundestag with a Land seat on file and no other record to be searched in
# their own parliament's documents. Every item names its protocol or
# Drucksache and the URL that was opened; quotes were checked against the
# page (Möller's two 6/135 quotes re-verified word for word).
#
# A person with no items was SEARCHED and had nothing: `searched` says what.
# That is a finding, not a gap -- except where `gap:` says otherwise.
#
# AREA: every item below was found in the abortion (area 1) search and
# carries `area: 1`; an item without one is read as area 1, never all areas.
#
# RULES APPLIED: a passing mention outside an abortion debate is listed,
# never placed (placeable: false). A heckle in an abortion debate is the
# weakest tier (a question). Confirmed as drafted by Christopher on 29
# September 2026, with config/de_stance.yaml; the German team may amend.


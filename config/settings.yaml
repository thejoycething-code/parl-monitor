# Operational settings (handoff section 2). Edit freely; no code changes needed.

# Written-questions sweep (questions-statements-api is slow and flaky: each term
# can take 7-30s and may fail even after retries; failures land in the gaps
# table and the edition footer). Keep this list curated, not exhaustive -- the
# taxonomy filter runs over the results, so terms here only decide what gets
# fetched, not what gets published.
# Some terms answer HTTP 500 after 30-60s. Measured repeatedly on 2026-08-17,
# and two earlier explanations here were wrong: they are neither deterministic
# per term nor caused by our own parallelism (there is none -- every sweep is
# a sequential loop). They cluster on a term for a WINDOW of minutes:
# "border-security" failed 4/4 in ten minutes and answered 3/3 in the next
# ten. So measure a term at least twice before rejecting it. Terms that gap
# are retried once at the end of the pull by run_weekly.resweep_pq_gaps,
# which is where the useful separation in time comes from.
# The taxonomy filter runs over whatever comes back, so a broader term costs
# nothing but a few discarded rows. It costs TIME here, though: this is much
# the slowest feed. The Hansard sweep reads the same list, but measured at
# 221.7s for all 39 terms against roughly twenty minutes for the same terms
# here, so it is about a tenth of the cost and adding a term is effectively
# a written-questions decision.
# Runtime is dominated by how warm the API's cache is, not by term count. A
# repeat call for a term the API has already computed returns in 1-2s against
# 27-50s cold. Forced full pulls on 2026-08-17: 40m05s (36 terms, three retry
# attempts), 33m47s (36), 17m38s (39), 17m54s (39), 12m13s, 16m47s and 17m45s
# (39, various fetch concurrencies). Read that spread as noise, not as a
# ranking: repeats of the SAME setting ranged 12m13s to 17m45s. Treat none of
# them as the cold cost either -- the Sunday run comes a week cold and is the
# only honest figure.
# NI Assembly sweep additions. These are searched ONLY by tools/ni_pull.py, on
# top of pq_sweep_terms -- they are NI vocabulary that would return noise or
# nothing at Westminster. Each earned its place by measurement against the NIA
# corpus on 2026-08-18 (question counts are the full 18-year index):
#   relationships-and-sexuality-education  47 questions, 28 since 2024 (the NI
#                                          statutory term; RSHE is GB-only)
#   unborn                                 17 questions, 13 plenary mentions/yr
#   brackenburn                            11 questions (the NI adult GIC)
#   knowing-our-identity                    6 questions (the NI youth gender
#                                          service -- NI's Tavistock)
#   christian-ethos                         8 questions, 21 plenary mentions/yr
#   fatal-foetal-abnormality               27 questions 2014-17 (historic depth)
#   ashers                                 13 questions 2013-20 (Lee v Ashers)
#   integrated-education                   63 plenary mentions/yr (Christopher,
#                                          2026-08-18: include, triage-gated)
ni_sweep_terms:
  - relationships-and-sexuality-education
  - unborn
  - brackenburn
  - knowing-our-identity
  - christian-ethos
  - fatal-foetal-abnormality
  - ashers
  - integrated-education

pq_sweep_terms:
  # Two precise terms replace "assisted dying", which returned 12,480 matches
  # whose newest was about fuel oil. Measured twice each, 2026-08-17:
  # terminally-ill-adults 82 (the Bill itself), assisted-suicide 44 (the wider
  # debate: euthanasia, prosecutions). Rejected: "terminally-ill" (527, but
  # the newest are disability benefit questions), "assisted-dying-bill" and
  # "end-of-life-bill" (500s), "Leadbeater" (5, subsumed by the first).
  - terminally-ill-adults
  - assisted-suicide
  - assisted-dying         # 60 (the HYPHENATED form; spaced returned 12,480)
  # Recency insurance for this issue (Christopher, 2026-08-17). The three
  # terms above returned NOTHING answered since 1 June: the Bill was dormant
  # between sessions, so questions moved to the adjacent ground. Measured
  # since 1 June: palliative-care 57, hospices 32, the assisted-dying terms 0.
  - palliative-care        # 1,012 total, newest on terminal illness diagnosis
  - home-education          # 444, was a 500 as "home education"
  - religious-education     # 286, newest on Religion: Teachers (v1.1 term)
  - safe-access-zones       # 45, was a 500
  - hospices
  # Gender medicine, retuned 2026-08-17. "PATHWAYS" was the worst term in the
  # list for a reason the others do not share: the sweep API is CASE-
  # INSENSITIVE, so the all-caps trial name matched "care pathways",
  # "referral pathways" and "employment pathways" -- 9,844 results led by
  # electric goods vehicles. src/filter.py matches acronyms case-sensitively
  # and so does NOT have this problem, which is why PATHWAYS stays in
  # taxonomy.yaml and watchlist.yaml. Fetching and filtering are different
  # jobs; only the fetch term had to change.
  # Bare "Cass" goes the same way: 459 results whose newest were workplace
  # pensions and prisoner release, because it is also a surname.
  # Measured (total / since 1 June): gender-dysphoria 387/29,
  # gender-reassignment 182/9, Cass-Review 177/8,
  # puberty-suppressing-hormones 108/4, gender-clinics 40/4,
  # pathways-trial 41/0. Rejected: "gender identity services",
  # "gender-questioning" and "children and young people's gender services"
  # (500 on every attempt); "youth-gender" (1 result, a climate conference).
  - puberty-blockers        # 78, from 221; the plain name
  - puberty-suppressing-hormones  # 108; the NHS's own formal name
  - gender-dysphoria        # 387; best recency in this family
  - gender-reassignment     # 182; Gender Recognition, equality duties
  - Cass-Review             # 177, from 459 of surname noise
  - gender-clinics          # 40
  - pathways-trial          # 41; the trial itself, all on-topic
  # Detransition (Christopher, 2026-08-17). Tiny and entirely on-topic:
  # detransitioners 4 total, detransitioned 16 total / 5 since 1 June, newest
  # "Gender Dysphoria: Surgery". Both measured twice. taxonomy.yaml already
  # carries "detransition*" in area 3 tier2, so what these fetch will map and
  # score as supporting evidence -- no taxonomy change needed.
  - detransitioners
  - detransitioned
  - age-assurance           # 258, from 77,980 of near-random matches
  - home-schooling          # 203, was a 500 as "home schooling"
  - anti-Muslim hostility   # hyphenated form 500s
  - Islamophobia
  - grooming-gangs          # 234, from 1,583
  - illegal-migration       # 747, from 14,118
  - small-boats             # 782, from 23,398
  - conversion-therapy      # 289, from 6,342
  - surrogacy
  # Sex-based rights, retuned 2026-08-17. "single-sex spaces" returned 8,518
  # matches whose newest was "Electricity: Northern Ireland" -- the API
  # loose-matches, so it was really searching for "spaces". Measured
  # (total / since 1 June): gender-recognition 545/10, single-sex 237/7,
  # changing-rooms 84/1, single-sex-wards 14. Rejected: "female-only" (5,715,
  # newest "Armed Forces: Body Armour"), "sex-based-rights" (7, and all of
  # them conversion therapy, which area 4 already covers), "womens-refuges"
  # (0 results).
  - single-sex              # 237; newest "Women: Public Places"
  - gender-recognition      # 545; Gender Recognition, passports and sex
  - changing-rooms          # 84; newest "NHS Trusts: Gender"
  - single-sex-wards        # 14; newest "Hospital Wards: Gender"
  # historic-vocabulary terms (v0.4): serve the 2020+ backfill; low weekly volume
  - Tavistock
  - Rwanda
  # Online safety, retuned 2026-08-17. "Online Safety Bill" (spaced) returned
  # 105,581 matches led by a DWP pay question; every hyphenated form of the
  # Act or Bill name answers HTTP 500, so the legislation cannot be searched
  # by name at all. Covered instead by the regulator and the mechanisms,
  # which is where the questions actually are. Measured since 1 June: Ofcom
  # 179, age-verification 13, internet-safety live in July.
  - Ofcom                  # 3,874; newest "Internet: Age Assurance"
  - age-verification       # 248
  - internet-safety        # 495; newest "Internet: Safety", July
  # Abortion clinic zones, retuned 2026-08-17. "buffer zones" returned 3,234
  # matches led by "Universal Credit: Foreign Nationals". The hyphenated form
  # is precise and belongs to the WRONG SUBJECT: "buffer-zones" returns 103
  # results about pesticides, newest "Bees and Butterflies". A term can be
  # tight and still be searching someone else's policy area, so on-topic
  # headings matter more than the total.
  # safe-access-zones (45, above) already carries the statutory name; this
  # adds the plain one. Rejected: "silent-prayer" (8 ever, 0 since 1 June --
  # it would re-fetch the same historic items every week). That rejection
  # originally also cited a "two sweeps" cost, which was wrong: the Hansard
  # sweep is about a tenth of the price. The thin weekly yield is the reason
  # on its own, and worth revisiting if clinic-zone prosecutions return.
  - abortion-clinics       # 145 / 4 since June; "Prayer: Public Places"
  # Migration, retuned 2026-08-17. "Nationality and Borders" returned 14,523
  # matches led by a benefits question, and the hyphenated form returns ZERO -
  # that Act is from 2022 and is no longer what questions name. Replaced by
  # the live vocabulary, measured since 1 June: asylum-seekers 120,
  # asylum-accommodation 117, border-security 49, deportation 37. Migration
  # is collated for MP intelligence only, never campaigned, so these feed the
  # ledger and the written-questions page, not the 5CA or briefs.
  # DIGEST: Christopher decided 2026-08-21 that migration DOES render in the
  # Slack digest, full inclusion -- the Written Questions table and the MP
  # section show it with member names. This was asked, not assumed: it had
  # never rendered (every edition since area 11 was added on 3 Aug was recess
  # mode, and PQs skip recess), so the first September edition is the first
  # time the team sees it. Do NOT "fix" this as a leak: hidden means hidden
  # from BRIEFS and the 5CA (make_briefs EXCLUDED_AREAS), not from the team.
  - asylum-seekers         # 4,574; newest "Asylum: Housing"
  - asylum-accommodation   # 1,498; newest "Asylum: MOD Bicester"
  - deportation            # 1,699; newest "Deportation", 3 August
  - border-security        # 764; newest "Immigration Controls: EU Countries"

  # Area 7 widened to civil liberties (taxonomy v0.6, Christopher 2026-08-20),
  # and he asked for parliamentary monitoring as well as benchmarks. Measured
  # 2026-08-20 with tools/check_sweep_terms.py; the state the tool prints is
  # based on the TOTAL only, so each one was judged on its newest headings.
  # Cost is bounded: pqs.fetch_questions takes 6 per term per run, whatever the
  # total, so these five add at most 30 items a week to the triage pass.
  # DORMANT vs LIVE, from the first real run (w/c 2026-08-24). The sweep keeps
  # only questions answered within 7 days of the week start, so a term's
  # LIFETIME total says nothing about whether it will ever contribute -- the
  # date of its newest answer is what matters. Recorded per term.
  # A term feeds BOTH the Written Questions sweep and the Hansard sweep, so
  # judge it on both. An earlier note here called the pandemic pair dormant on
  # the PQ evidence alone; they are live in DEBATES (Hansard 2026, newest 14
  # and 16 July). Only CBDC is dormant in both.
  - pandemic-treaty        # PQ: 5 total, newest answered 2023-04-24, dormant.
                           # Hansard 2026: 3, newest 2026-07-14. LIVE in debate.
  - pandemic-accord        # PQ: 7, 2023 era. Hansard 2026: 1, newest 07-16.
  - CBDC                   # PQ 34, newest 2025-07-24; Hansard 2026: 0. DORMANT
                           # in both. Kept as cheap insurance, yields nothing
                           # today.
  - digital-ID             # 430 total, newest answered 2026-07-17. LIVE.
  - digital-identity       # 194 total, "Proof of Identity: Digital Technology".
                           # LIVE, same recency as digital-ID.
  #
  # NO TERM FOUND for the International Health Regulations, and the gap is
  # recorded rather than left to look like coverage:
  #   international-health-regulations  HTTP 500 - the API cannot serve it,
  #                                     and so do the spaced form AND the bare
  #                                     word "international", so this is an API
  #                                     limit, not our phrasing
  #   IHR                               95 matches but the newest are
  #                                     "Antisemitism": the search matches
  #                                     IHRA, the Holocaust Remembrance
  #                                     Alliance definition, loosely
  #   health-regulations                234, newest "Health Hazards: Chemicals"
  # The taxonomy still CLASSIFIES IHR correctly in anything fetched by another
  # term -- its "IHR" is case-sensitive and word-anchored, and was tested
  # against IHRA -- and pandemic-treaty/pandemic-accord overlap the same
  # material. Retry if the 500 is ever fixed.


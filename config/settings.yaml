  - assisted dying
  - home education
  - safe access zones
  - Cass Review
  - hospices
  - puberty blockers
  - age assurance
  - anti-Muslim hostility
  - Islamophobia
  - grooming gangs
  - home schooling
  - conversion therapy
  - surrogacy
  - PATHWAYS
  - single-sex spaces


# Operational settings (handoff section 2). Edit freely; no code changes needed.

# Written-questions sweep (questions-statements-api is slow and flaky: each term
# can take 7-30s and may fail even after retries; failures land in the gaps
# table and the edition footer). Keep this list curated, not exhaustive -- the
# taxonomy filter runs over the results, so terms here only decide what gets
# fetched, not what gets published.
# Three terms make the Written Questions API return HTTP 500 after 30-60s of
# trying, every time: "home education", "safe access zones" and "Cass Review".
# It is the term, not the phrase length -- "assisted dying" and "age
# assurance" are fine. Hyphenating fixes two of them, and "Cass" alone works
# where both "Cass Review" and "Cass-Review" fail. Verified 2026-08-17:
# home-education 444 results, safe-access-zones 45, Cass 459. The taxonomy
# filter runs over whatever comes back, so a broader term costs nothing but
# a few discarded rows.
pq_sweep_terms:
  - assisted dying
  - home-education
  - safe-access-zones
  - Cass
  - hospices
  - puberty blockers
  - age assurance
  - anti-Muslim hostility
  - Islamophobia
  - grooming gangs
  - illegal migration
  - small boats
  - home schooling
  - conversion therapy
  - surrogacy
  - PATHWAYS
  - single-sex spaces
  # historic-vocabulary terms (v0.4): serve the 2020+ backfill; low weekly volume
  - Tavistock
  - Rwanda
  - Online Safety Bill
  - buffer zones
  - Nationality and Borders

# Early Day Motions sweep (fast API). Matched EDMs are stored as items and
# their signature counts recorded per edition for week-on-week deltas.
edm_sweep_terms:
  - migration
  - Islamophobia
  - assisted dying
  - abortion
  - home education
  - free speech
  - surrogacy
  - single-sex
  - conversion therapy
  - Rwanda
  - online safety

# Division-title sweep (both votes APIs). Division titles are bill names plus
# motion/amendment wording, so these are bill-title vocabulary, not the PQ
# phrases above. Used by tools/backfill_divisions.py and (from September) the
# weekly division member-breakdown capture.
division_sweep_terms:
  - abortion
  - assisted dying
  - Terminally Ill Adults
  - online safety
  - Rwanda
  - illegal migration
  - Nationality and Borders
  - immigration
  - asylum
  - gender recognition
  - conversion therapy
  - surrogacy
  - marriage
  - free speech
  - freedom of speech
  - puberty

# Partner site root. The weekly edition links its written-questions section
# here for the full detail, so the link must be absolute: it is read from a
# Slack canvas and an Asana task as well as from the site itself.
partner_site_url: https://parl-monitor-partner.vercel.app

# Weekly stance-scoring ceiling: the most evidence refs one Sunday pull will
# send to the Claude API. Cost tracks refs, not volume (a 600-voter division
# is two refs, one per direction), so a normal sitting week uses 50-100 and
# costs pennies. Anything over the cap is disclosed in the edition's gaps and
# scored on the next run, so a freak week cannot produce a surprise bill.
stance_weekly_max_refs: 400

# A bill's closing entry renders only while the terminal event (Royal Assent
# or fall) is within this many days of the edition; older closures are
# recorded silently. Keeps cold-start catch-ups off the board.
closure_fresh_days: 28

  # --- DRAFTED 2 October 2026 from the 2011-23 backfill, for Christopher ----
  # Motion text verbatim from sp_items; party splits from sp_votes, which
  # records each MSP's party at the vote. Each Bill's member in charge voted
  # Yes at every stage drafted (Aileen Campbell, John Finnie, Humza Yousaf,
  # Shona Robison, Gillian Mackay). NAMED PERSON TRAP: on 25 Sept 2013 and
  # 2 Dec 2015 the motion in Liz Smith's name was AMENDED by the Government,
  # and the final vote was on the motion as amended -- she voted No to it.
  # So "Named Persons" divisions m2107 and m2485 carry the Government's
  # wording, not hers. The Government amendments themselves (m2106, m2484)
  # are drafted here, where the text is unambiguous; the as-amended votes
  # split almost identically and are left out. Also left out: the Children
  # and Young People Bill's Stage 1 (104-0, the same split as Stage 3) and
  # the three 9 Sept 2020 hate crime debate votes, whose amendments
  # rewrote one another.
  - key: m2106
    reference: S4M-07783.2
    issue: parental-rights
    dated: 2013-09-25
    stage: Debate -- Government amendment
    landmark: false
    signed_off: false
    our_side: against
    short: Named Person -- Government amendment backing it (2013)
    motion: >-
      As an amendment to Liz Smith's motion opposing the named person,
      insert that the Parliament "understands that the named person has
      been developed and implemented as an essential element of that
      approach ... and welcomes the opportunity provided by the Children and
      Young People (Scotland) Bill". Moved by Aileen Campbell. Carried 71
      to 14.
    context: >-
      SNP 62, Lib Dem 5, Independent 2, Green 2 for; Conservative 14
      against; Labour 29 abstained.
    meaning_for: >-
      Voted to back a named person for every child, replacing a motion
      that warned it would undermine the role of parents.
    meaning_against: >-
      Voted against the amendment backing the named person scheme.

  - key: m2176
    reference: S4M-09050
    issue: parental-rights
    dated: 2014-02-19
    stage: Stage 3 -- final vote
    landmark: true
    signed_off: false
    our_side: against
    short: Children and Young People Bill passed (named person in law)
    motion: >-
      That the Parliament agrees that the Children and Young People
      (Scotland) Bill be passed.
    context: >-
      The Act put a named person for every child from birth to 18 into
      law (Part 4). Passed 103 to 0: SNP 63, Labour 32, Lib Dem 4,
      Independent 2, Green 2 for; the 15 Conservatives abstained. The
      Supreme Court found Part 4's information-sharing unlawful in 2016,
      and the scheme was later dropped.
    meaning_for: >-
      Voted to pass the Act that put a named person for every child into
      law.
    meaning_against: >-
      Voted against passing the Act.

  - key: m2484
    reference: S4M-14999.2
    issue: parental-rights
    dated: 2015-12-02
    stage: Debate -- Government amendment
    landmark: false
    signed_off: false
    our_side: against
    short: Named Person -- Government amendment backing it (2015)
    motion: >-
      As an amendment to Liz Smith's motion on growing opposition to the
      named person policy, insert that the Parliament "acknowledges that the
      named person service is an important component of this approach ...
      and calls on all members to support implementation of all the GIRFEC
      provisions of the Act". Moved by Aileen Campbell. Carried 66 to 14.
    context: >-
      SNP 57, Lib Dem 5, Independent 3, Green 1 for; Conservative 14
      against; Labour 28 abstained.
    meaning_for: >-
      Voted to back implementing the named person scheme, replacing a
      motion on parents' and professionals' opposition to it.
    meaning_against: >-
      Voted against the amendment backing the named person scheme.


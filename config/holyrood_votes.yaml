# Scored Holyrood divisions. Same vocabulary as config/vote_tracker.yaml so a
# Scottish page can read it the way the Westminster one reads that: our_side,
# the two meanings, landmark, signed_off.
#
# Written 2026-08-29. The store already held 218 divisions on the Assisted
# Dying for Terminally Ill Adults (Scotland) Bill and 129 MSPs with a recorded
# vote -- every one of them still sitting -- and the page said nothing about
# any of it.
#
# WHY ONLY THREE OF 218. The other 215 are Stage 3 amendment votes with no
# motion reference and no recorded result in the store, so what each decided
# cannot be established from what we hold. They are not scored. The three
# below carry their motion text verbatim, which is what makes our_side
# checkable rather than asserted.
#
# our_side is "against" throughout: CitizenGO opposes legalising assisted
# suicide, matching the Westminster and Lords entries.
#
# SIGNED OFF by Christopher, 2026-08-29, after seeing the three rendered
# unsigned with their motion text. The scoring is his, not my inference.

divisions:
  - key: m7624
    reference: S6M-17416
    issue: assisted-suicide
    dated: 2025-05-13
    stage: Stage 1
    landmark: true
    signed_off: true
    our_side: against
    short: Stage 1 -- general principles
    motion: >-
      That the Parliament agrees to the general principles of the Assisted
      Dying for Terminally Ill Adults (Scotland) Bill.
    context: >-
      The first vote of principle. Carried 70 to 56, so the Bill proceeded.
    meaning_for: >-
      Supported the general principles of legalising assisted suicide for
      terminally ill adults in Scotland.
    meaning_against: >-
      Voted to stop the Bill at its first hurdle.

  - key: m7860
    reference: S6M-19456
    issue: assisted-suicide
    dated: 2025-10-30
    stage: Financial Resolution
    landmark: false
    signed_off: true
    our_side: against
    short: Financial Resolution
    motion: >-
      That the Parliament, for the purposes of any Act resulting from the
      Assisted Dying for Terminally Ill Adults (Scotland) Bill, agrees to any
      expenditure arising in consequence of the Act.
    context: >-
      Procedural rather than a vote of principle -- a Bill cannot proceed
      without it -- so it is a weaker signal than the other two and is not
      marked a landmark. Carried 70 to 31.
    meaning_for: >-
      Voted to let the Bill proceed by authorising its costs.
    meaning_against: >-
      Voted against authorising the Bill's costs.

  - key: m9165
    reference: S6M-21005
    issue: assisted-suicide
    dated: 2026-03-17
    stage: Stage 3 -- final vote
    landmark: true
    signed_off: true
    our_side: against
    short: Final vote -- Bill defeated
    motion: >-
      That the Parliament agrees that the Assisted Dying for Terminally Ill
      Adults (Scotland) Bill be passed.
    context: >-
      The decisive vote. DEFEATED 57 to 69, so the Bill fell and assisted
      suicide was not legalised in Scotland. Scotland then went to the polls
      in May 2026, so 64 of the 129 who voted are still sitting.
    meaning_for: >-
      Voted to pass the Bill and legalise assisted suicide in Scotland.
    meaning_against: >-
      Voted to reject the Bill. The Bill fell on this vote.

  # --- Drafted 29 September 2026 for Christopher's sign-off ------------------
  # From the 2011-23 Holyrood backfill. The motion text is verbatim from
  # sp_items, and each mover voted For their own motion (Alex Neil, 1894, on
  # both marriage votes; Patrick Harvie, 2892, who took the Assisted Suicide
  # Bill on after Margo MacDonald died). our_side follows the Westminster
  # entries for the same issues: against redefining marriage
  # (same-sex-marriage-2013) and against legalising assisted suicide.
  # The seven Stage 3 amendment divisions on the marriage Bill (4 Feb 2014)
  # are Official Report aggregates with no names, so they cannot place anyone
  # and are not drafted.
  - key: m2135
    reference: S4M-08327
    issue: redefining-marriage
    dated: 2013-11-20
    stage: Stage 1
    landmark: false
    signed_off: false
    our_side: against
    short: Marriage and Civil Partnership Bill -- Stage 1
    motion: >-
      That the Parliament agrees to the general principles of the Marriage
      and Civil Partnership (Scotland) Bill.
    context: >-
      The vote of principle on the Scottish Government Bill that redefined
      marriage in Scotland to include same-sex couples. Carried 98 to 15.
    meaning_for: >-
      Supported the general principles of redefining marriage to include
      same-sex couples.
    meaning_against: >-
      Voted against the Bill's general principles.

  - key: m2173
    reference: S4M-08915
    issue: redefining-marriage
    dated: 2014-02-04
    stage: Stage 3 -- final vote
    landmark: true
    signed_off: false
    our_side: against
    short: Marriage and Civil Partnership Bill -- passed
    motion: >-
      That the Parliament agrees that the Marriage and Civil Partnership
      (Scotland) Bill be passed.
    context: >-
      The final vote. Passed 105 to 18, and the Bill became the Marriage and
      Civil Partnership (Scotland) Act 2014.
    meaning_for: >-
      Voted to pass the Bill redefining marriage in Scotland.
    meaning_against: >-
      Voted against passing the Bill.

  - key: m2420
    reference: S4M-13258
    issue: assisted-suicide
    dated: 2015-05-27
    stage: Stage 1
    landmark: true
    signed_off: false
    our_side: against
    short: Assisted Suicide (Scotland) Bill -- Stage 1
    motion: >-
      That the Parliament agrees to the general principles of the Assisted
      Suicide (Scotland) Bill.
    context: >-
      Margo MacDonald's Bill, taken on by Patrick Harvie after her death.
      DEFEATED 36 to 82 at Stage 1, so the Bill fell.
    meaning_for: >-
      Supported the general principles of legalising assisted suicide in
      Scotland.
    meaning_against: >-
      Voted to reject the Bill at Stage 1. The Bill fell on this vote.

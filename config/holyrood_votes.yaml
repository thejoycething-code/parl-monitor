  - key: m2420
    reference: S4M-13258
    issue: assisted-suicide
    dated: 2015-05-27
    stage: Stage 1
    landmark: true
    signed_off: true
    our_side: against
    short: Assisted Suicide (Scotland) Bill -- Stage 1

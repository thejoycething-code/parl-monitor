    title: "C-11 report stage -- Motions 1 and 3 (Thomas): delete clauses 2 and 4"
    dated: 2022-06-20
    result: "Negatived 117-209"
    lobbies: "Yea: Conservative 116, Independent 1. Nay: Liberal 152, Bloc 31, NDP 24, Green 2"
    moved_by: >
      Rachael Thomas (Conservative, Lethbridge), seconded by Kelly McCauley;
      Thomas has no recorded vote on it (absent from the Journals list), McCauley voted Yea
    source: >
      Journals No. 91, 17 June 2022 (the motions) and No. 92, 20 June 2022
      (the vote: "Accordingly, Motion No. 3 was also negatived on the same
      division"); ourcommons.ca/DocumentViewer/en/44-1/house/sitting-92/journals
    text: >
      Motion No. 1: "That Bill C-11 be amended by deleting Clause 2." Motion
      No. 3: "That Bill C-11 be amended by deleting Clause 4."
    reason: >
      READ 3 October 2026; a judgement call, flagged for Christopher. Clause 2
      is the definitions clause: it makes "online undertaking" a class of
      broadcasting undertaking, and holds the s.2(2.1)-(2.3) exclusions
      (users uploading to social media do not carry on a broadcasting
      undertaking). Clause 4 is all of s.4.1 and s.4.2. Deleting both takes
      the internet out of the Act altogether -- Netflix and Spotify as much
      as user uploads -- so it is a vote on the bill's scope, like the
      whole-bill votes, not one specifically about speech. It also deletes
      the user exclusions themselves.

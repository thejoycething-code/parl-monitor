    dated: 2026-06-17
    result: "Agreed 189-128"
    lobbies: "Yea: Liberal 164, Bloc 19, NDP 4, Green 1, Ind 1. Nay: Conservative 128"
    read_first: >
      Which Senate amendments this motion accepted and rejected was not read.
      The Royal Assent text differs from the House's only by adding "a
      noose", so any other Senate amendment was rejected here.
  - key: commons-45-1-84

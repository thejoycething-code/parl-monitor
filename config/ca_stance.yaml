# Parliament of Canada: what a vote or a sponsorship MEANS, written by a human.
#
# The Canadian mirror of config/ni_stance.yaml, under the same rule: reading
# a division's direction is the campaigner's judgement, and no tool estimates
# it. tools/ca_5ca.py applies these lines; it never invents one.
#
# EVERY ENTRY BELOW IS A CLAUDE DRAFT (26 September 2026), and a draft
# PLACES NOBODY. The sheet shows the vote as evidence and leaves the column
# blank until Christopher confirms the reading by deleting `draft: true`.
#
# Three kinds of entry:
#   * `yea:` / `nay:` values on the Westminster stance scale (-2..2), with
#     why lines -- a reading that, once confirmed, places every member.
#   * `placeable: false` with a reason -- the vote cannot tell members apart
#     (unanimous) or is about procedure, not substance. Evidence only, for
#     ever, confirmed or not.
#   * `read_first:` with no values -- the text was not read, so no direction
#     is proposed. The lobbies are recorded so the reader knows what to test
#     a reading against. Fill in yea/nay only after reading.
#
# Keys are the store's: `commons-<parl>-<sess>-<number>` and
# `senate-<parl>-<sess>-<details id>`; bills are `<parl>-<sess>/<number>`.
#
# VERIFIED FROM THE BILL TEXTS (26 September 2026), which the C-9 lines
# rest on: the repeal of s.319(3)(b) -- the defence for opinions expressed
# in good faith on religious subjects or texts -- was ADDED AT COMMITTEE
# (C-9_2, "as amended by committee"; it is absent from first reading) and
# survived to Royal Assent (C-9_4). The committee also struck "religion" from
# the legitimate-purpose defence for displaying a hate symbol. The only
# substantive Senate change that became law was adding "a noose" to the
# banned symbols. A "for greater certainty" clause protecting "educational,
# religious, political or scientific" statements made without wilfully
# promoting hatred was in the House text and remains.
#
# The lobby lines (Party yea/nay) are counted from ca_votes, not remembered.

divisions:
  # --- Area 1: abortion ------------------------------------------------------
  - key: commons-44-1-377
    draft: true
    title: "2nd reading of Bill C-311 (violence against pregnant women)"
    dated: 2023-06-14
    result: "Negatived 113-205"
    lobbies: "Yea: Conservative 113. Nay: Liberal 148, Bloc 30, NDP 23, Green 2, Independent 2"
    yea: 2
    why_yea: >
      Voted to advance a bill making the pregnancy of a victim an aggravating
      factor at sentencing -- recognition of the unborn child in criminal law.
    nay: -2
    why_nay: >
      Voted to stop, at second reading, a bill recognising a victim's
      pregnancy as an aggravating factor at sentencing.

  # --- Area 2: assisted dying -------------------------------------------------
  - key: commons-44-1-423
    draft: true
    title: "2nd reading of Bill C-314 (MAID: mental illness as sole condition)"
    dated: 2023-10-18
    result: "Negatived 150-167"
    lobbies: "Yea: Conservative 115, NDP 24, Liberal 8, Green 2, Ind 1. Nay: Liberal 136, Bloc 30, Ind 1"
    yea: 2
    why_yea: >
      Voted to advance a bill excluding mental illness as the sole
      underlying condition for MAID.
    nay: -2
    why_nay: >
      Voted to stop a bill that would have kept MAID closed to people whose
      sole condition is a mental illness.
    note: >
      The split is not a party line: 24 NDP members and 8 Liberals voted Yea.
      Those 32 are the people this area's 5CA exists to find.

  - key: commons-44-1-641
    draft: true
    title: "2nd reading of Bill C-62 (delay MAID for mental illness to 2027)"
    dated: 2024-02-14
    result: "Agreed 294-33"
    lobbies: "Yea: Conservative 116, Liberal 150, NDP 24, Green 2, Ind 2. Nay: Bloc 32, Liberal 1"
    yea: 1
    why_yea: >
      Voted to delay MAID for mental illness alone by three years. A delay,
      not a repeal, so it is weaker evidence than C-314.
    nay: -2
    why_nay: >
      Voted against delaying MAID for mental illness alone: for it opening in
      March 2024 as scheduled.
  - key: commons-44-1-646
    draft: true
    title: "3rd reading of Bill C-62 (delay MAID for mental illness to 2027)"
    dated: 2024-02-15
    result: "Agreed 272-32"
    lobbies: "Yea: Conservative 106, Liberal 142, NDP 20, Green 1, Ind 3. Nay: Bloc 31, Liberal 1"
    yea: 1
    why_yea: "Voted to pass the three-year delay of MAID for mental illness alone."
    nay: -2
    why_nay: "Voted against passing the delay: for MAID for mental illness alone from March 2024."
  - key: commons-44-1-640
    draft: true
    title: "2nd reading of Bill C-62 (reasoned amendment)"
    dated: 2024-02-14
    result: "Negatived 33-291"
    lobbies: "Yea: Bloc 31, NDP 1, Ind 1. Nay: everyone else"
    read_first: >
      The reasoned amendment's text was not read. The Bloc lobby suggests it
      opposed the delay, but that is an inference from who voted, and a
      reading built on who voted is circular. Read Hansard, 14 February 2024.
  - key: commons-44-1-874
    draft: true
    title: "Concurrence in the Second Report of the Special Joint Committee on MAID"
    dated: 2024-10-31
    result: "Agreed 209-114"
    lobbies: "Yea: Liberal 149, Bloc 32, NDP 24, Green 2, Ind 2. Nay: Conservative 114"
    read_first: >
      What the Second Report recommended was not read. The party-line split is
      clean, which makes it a strong vote once its meaning is known -- and a
      misleading one if it is guessed.
  - key: commons-44-1-638
    placeable: false
    title: "Government Business No. 34 (proceedings on C-62), amendment"
    reason: "Programming of a bill's timetable: procedure, not substance."
  - key: commons-44-1-639
    placeable: false
    title: "Government Business No. 34 (proceedings on C-62)"
    reason: "Programming of a bill's timetable: procedure, not substance."


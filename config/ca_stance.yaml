  # --- C-11 amendments, READ 3 October 2026 for Christopher -------------------
  # "Only score amendments specifically related to speech." Every C-11
  # amendment division was read from the Journals (House and Senate) and its
  # page/line references checked against the bill as passed by the House
  # (parl.ca/Content/Bills/441/Government/C-11/C-11_3/C-11_3.PDF), which is
  # the print the Senate's references use. The ground in the bill:
  #   s.4.1(1) "This Act does not apply in respect of a program that is
  #     uploaded to an online undertaking that provides a social media service
  #     by a user of the service for transmission over the Internet and
  #     reception by other users of the service."
  #   s.4.1(2) "Despite subsection (1), this Act applies ... if the program
  #     (a) is uploaded to the social media service by the provider of the
  #     service ... or (b) is prescribed by regulations made under section 4.2."
  #   s.4.2 the CRTC "may make regulations prescribing programs in respect of
  #     which this Act applies", weighing "the extent to which a program,
  #     uploaded to an online undertaking that provides a social media
  #     service, directly or indirectly generates revenues".
  # FOUR amendments are speech-specific, all in the Senate, and are drafted
  # below. Every House amendment was a whole-bill, scope or procedural
  # motion. Movers and seconders all voted Yea on their own Senate
  # amendments; the two House movers with no recorded vote are named.
  - key: senate-44-1-598845
    title: "C-11 -- Senate third reading amendment (Sen. Plett): delete s.4.1(2) and s.4.2"
    dated: 2023-02-02
    result: "Defeated 16-44-1"
    lobbies: "Yea: C 10, CSG 6. Nay: ISG 25, PSG 10, Non-affiliated 5, CSG 4"
    moved_by: "Senator Donald Plett, seconded by Senator Housakos (both voted Yea)"
    source: >
      Journals of the Senate, 2 February 2023
      (sencanada.ca/en/content/sen/chamber/441/journals/096jr_2023-02-02-e);
      lines read against C-11 as passed by the House, pp. 9-10
    text: >
      That Bill C-11, as amended, be not now read a third time, but that it be
      further amended, in clause 4 (as amended by the decision of the Senate
      on December 14, 2022), (a) on page 9, by deleting lines 30 to 37; (b) on
      page 10, by deleting lines 9 to 32.
    # TEXT READ 3 October 2026. Page 9 lines 30-37 are all of s.4.1(2), the
    # clause that brings user uploads back under the Act; page 10 lines 9-32
    # are all of s.4.2, the CRTC's power to prescribe them by regulation. With
    # both gone, s.4.1(1) stands alone: the Act would not apply to programs
    # users upload to social media. THE cleanest speech vote on C-11, and the
    # only one whose sole effect is user uploads. Nay is -1, not -2, as on
    # Senator Martin's C-9 amendment: the deletion also took out s.4.1(2)(a)
    # (programs the platform itself uploads), and the committee's amendment
    # 3 had already narrowed s.4.2, so a Nay need not be a vote for
    # regulating users.
    yea: 1
    # +1, not +2 (Christopher, 3 October 2026: "score Plett at +1").
    why_yea: >
      Voted to delete the CRTC's power to bring programs users upload to
      social media under the Broadcasting Act (s.4.1(2) and s.4.2), leaving
      user uploads outside the Act.
    nay: -1
    why_nay: >
      Voted to keep the CRTC's power to bring user-uploaded social-media
      programs under the Broadcasting Act by regulation (s.4.2).
  - key: senate-44-1-605567
    title: "C-11 -- Commons message, subamendment (Sen. MacDonald): insist on Senate amendment 3 alone"
    dated: 2023-04-26
    result: "Defeated 15-53-2"
    lobbies: "Yea: C 12, CSG 3. Nay: ISG 33, PSG 10, Non-affiliated 5, CSG 5"
    moved_by: "Senator Michael MacDonald, seconded by Senator Housakos (both voted Yea)"
    source: >
      Journals of the Senate, 20 and 26 April 2023
      (sencanada.ca/en/content/sen/chamber/441/journals/114jr_2023-04-20-e and
      116jr_2023-04-26-e); amendment 3 from the Senate's message, Journals of
      the House of Commons No. 153, 3 February 2023; the House's reason for
      disagreeing from ourcommons.ca/members/en/votes/44/1/292
    text: >
      That the motion in amendment be amended: 1. in the proposed new wording
      for sub-paragraph (b), by replacing the words "amendments to which the
      House of Commons disagrees;" by the following: "amendment 3 to which the
      House of Commons disagrees; and (c) do not insist on its other
      amendments to which the House of Commons disagrees;"; and 2. in the
      proposed new paragraph empowering the Standing Senate Committee on
      Transport and Communications to develop the Senate's reasons for its
      insistence, by replacing the word "amendments" by the word "amendment".
    # TEXT READ 3 October 2026. Senate amendment 3 (Clause 4, page 10)
    # replaced the s.4.2(2) matters -- including "the extent to which a
    # program ... directly or indirectly generates revenues" -- with: "(a)
    # the extent to which a program contains a sound recording that has been
    # assigned a unique identifier under an international standards system;
    # (b) the fact that the program has been uploaded ... by the owner or the
    # exclusive licensee of the copyright in the sound recording, or an agent
    # of the owner; and (c) the fact that the program or a significant part
    # of it has been broadcast by a broadcasting undertaking that (i) is
    # required to be carried on under a licence, or (ii) is required to be
    # registered". The House rejected it as limiting the power "to
    # appropriately scope the regulation of social media services". The
    # subamendment's sole effect: the Senate insists on amendment 3 and
    # drops the rest. +/-1, not +/-2: amendment 3 narrows what the CRTC
    # weighs rather than excluding user uploads, and not insisting is the
    # Senate's ordinary course on a Commons message.
    yea: 1
    why_yea: >
      Voted for the Senate to insist, against the House, on its amendment
      narrowing CRTC regulation of user-uploaded social-media programs to
      commercial sound recordings.
    nay: -1
    why_nay: >
      Voted against insisting on the Senate amendment narrowing CRTC
      regulation of user-uploaded social-media programs to commercial sound
      recordings.
  - key: senate-44-1-598337
    title: "C-11 -- Senate third reading amendment (Sen. Manning): $10 million floor on s.4.2 regulations"
    dated: 2023-01-31
    result: "Defeated 16-52-1"
    lobbies: "Yea: C 11, CSG 4, Non-affiliated 1. Nay: ISG 31, PSG 11, Non-affiliated 6, CSG 4"
    moved_by: "Senator Fabian Manning, seconded by Senator Batters (both voted Yea)"
    source: >
      Journals of the Senate, 31 January 2023
      (sencanada.ca/en/content/sen/chamber/441/journals/094jr_2023-01-31-e)
    text: >
      That Bill C-11, as amended, be not now read a third time, but that it be
      further amended in clause 4 (as amended by the decision of the Senate on
      December 14, 2022), on page 10, by adding the following after line 32:
      "(4) The regulations shall not prescribe a program of a broadcasting
      undertaking that generates annual revenues of less than $10 million.".
    # TEXT READ 3 October 2026. Page 10 line 32 is the end of s.4.2(3), the
    # list of programs the user-upload regulations may not prescribe; this
    # adds a fourth exclusion. Speech-specific because it narrows the only
    # power the bill gives over user uploads, but +/-1: it is a revenue
    # threshold, and its reach is uncertain -- s.2(2.1) says a user uploading
    # to social media is NOT a broadcasting undertaking, so "a program of a
    # broadcasting undertaking" may not reach individual users at all.
    # Confirm only if that reading is accepted.
    yea: 1
    why_yea: >
      Voted to bar the CRTC's user-upload regulations (s.4.2) from
      prescribing a program of a broadcasting undertaking earning under $10
      million a year.
    nay: -1
    why_nay: >
      Voted against a $10 million revenue floor on the programs the CRTC's
      user-upload regulations (s.4.2) may prescribe.
  - key: senate-44-1-598860
    title: "C-11 -- Senate third reading amendment (Sen. Housakos): discoverability"
    dated: 2023-02-02
    result: "Defeated 13-42-3"
    lobbies: "Yea: C 9, CSG 4. Nay: ISG 25, PSG 9, Non-affiliated 4, CSG 4"
    moved_by: "Senator Leo Housakos, seconded by Senator Martin (both voted Yea)"
    source: >
      Journals of the Senate, 2 February 2023
      (sencanada.ca/en/content/sen/chamber/441/journals/096jr_2023-02-02-e);
      lines read against C-11 as passed by the House, pp. 8 and 14
    text: >
      That Bill C-11, as amended, be not now read a third time, but that it be
      further amended, (a) in clause 3 (as amended by the decision of the
      Senate on December 14, 2022), on page 8, by replacing line 31 with the
      following: "(i) allow the discoverability of Canadian program-"; (b) in
      clause 10 (as amended by the decision of the Senate on December 14,
      2022), on page 14, by replacing lines 27 to 30 with the following:
      "services for selection by the public;".
    # TEXT READ 3 October 2026. (a) changes s.3(1)(q)(i), online undertakings
    # "should (i) ensure the discoverability of Canadian programming services
    # and original Canadian programs", from "ensure" to "allow". (b) cuts
    # s.9.1(1)(e), the CRTC's power to impose conditions respecting "the
    # presentation of programs and programming services for selection by the
    # public, including the showcasing and the discoverability of Canadian
    # programs and programming services, such as original French language
    # programs", back to "... for selection by the public;". Speech-specific
    # under the discoverability test (who decides what users are shown), but
    # +/-1: it reaches streaming services' catalogues as much as social
    # media feeds, and the CRTC keeps a general power over "presentation".
    yea: 1
    why_yea: >
      Voted to remove the CRTC's power to order online platforms to showcase
      and make discoverable Canadian programs, and to soften their duty from
      "ensure" to "allow" discoverability.
    nay: -1
    why_nay: >
      Voted to keep the CRTC's power to order online platforms to showcase
      and make discoverable Canadian programs.


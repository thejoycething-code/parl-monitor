    result: "Adopted 45-13-2"
    lobbies: "Yea: ISG 26, PSG 9, CSG 5, GRO 4, Non-aff 1. Nay: C 7, ISG 4, CSG 2"
    yea: -2
    why_yea: "Voted to pass C-9, repealing the religious-texts defence in s.319(3)(b)."

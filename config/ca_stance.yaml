# Sponsoring a private member's bill is a chosen act of advancing a text, the
# Canadian equivalent of proposing a motion (NI) or sponsoring an EDM. A
# government bill's sponsor is the minister, which is office, not choice:
# those carry no `sponsored` value.
bills:
  - key: 44-1/C-311

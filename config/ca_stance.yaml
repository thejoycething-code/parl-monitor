  # --- Areas 7 and 8: C-9, the Combatting Hate Act ---------------------------
  - key: commons-45-1-86
    draft: true
    title: "Concurrence at report stage of Bill C-9"
    dated: 2026-03-23
    result: "Agreed 188-144"
    lobbies: "Yea: Liberal 166, Bloc 22. Nay: Conservative 138, NDP 5, Green 1"
    yea: -2
    why_yea: >
      Voted to concur in C-9 as amended by committee: the text that repeals
      the religious-texts defence in s.319(3)(b).
    nay: 1
    why_nay: >
      Voted against the committee's C-9, which repeals the religious-texts
      defence. Scored +1, not +2: a Nay on the whole bill does not say which
      part was objected to.
  - key: commons-45-1-93
    draft: true
    title: "3rd reading of Bill C-9"
    dated: 2026-03-25
    result: "Agreed 186-137"
    lobbies: "Yea: Liberal 164, Bloc 22. Nay: Conservative 131, NDP 5, Green 1"
    yea: -2
    why_yea: "Voted to pass C-9, repealing the religious-texts defence in s.319(3)(b)."
    nay: 1
    why_nay: "Voted against passing C-9, which repeals the religious-texts defence (+1: the whole bill, not the clause)."
  - key: commons-45-1-92
    draft: true
    title: "Bill C-9 (recommittal to a committee)"
    dated: 2026-03-25
    result: "Negatived 123-190"
    lobbies: "Yea: Conservative 122, Green 1. Nay: Liberal 163, Bloc 22, NDP 5"
    read_first: >
      A motion to send C-9 back to committee, apparently moved by the
      opposition. If its instruction was to reinstate s.319(3)(b), a Yea is
      +2 and the strongest C-9 evidence there is, because it is about the
      clause and not the whole bill. Read the motion's text before scoring it.

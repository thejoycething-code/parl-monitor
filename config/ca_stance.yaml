  - key: senate-45-1-700344
    title: "Combatting Hate Act – C-9 – Third Reading – Amendment (Sen. Martin)"
    dated: 2026-06-04
    result: "Defeated 21-40-2"
    lobbies: "Yea: C 8, CSG 7, PSG 3, ISG 2, Non-aff 1. Nay: ISG 27, PSG 6, GRO 4, CSG 3"
    moved_by: "Senator Yonah Martin, seconded by Senator Batters"
    source: "Journals of the Senate, 4 June 2026 (sencanada.ca/en/content/sen/chamber/451/journals/079jr_2026-06-04-e)"
    text: >
      That Bill C-9, as amended, be not now read a third time, but that it be
      further amended, in clause 11.1, on page 6, (a) by replacing line 22
      with the following: "nicating a statement in good faith on a matter of
      public inter-"; (b) by replacing lines 25 to 27 with the following:
      "discussion, publication or debate.".
    # TEXT READ 26 September 2026. It does NOT restore s.319(3)(b). It
    # rewrites the bill's own safe-harbour clause, 11.1(1), which as passed
    # protects "a statement on a matter of public interest, including an
    # educational, religious, political or scientific statement made in the
    # course of a discussion, publication or debate, if they do not wilfully
    # promote hatred against an identifiable group by communicating the
    # statement". The amendment adds "in good faith" and DELETES the closing
    # "if they do not wilfully promote hatred..." condition -- so a
    # good-faith religious statement on a matter of public interest would be
    # protected outright, the closest thing to the repealed defence the
    # Senate voted on. Nay is -1, not -2: a senator can object to the
    # drafting (the deleted condition is what made 11.1 a clarification
    # rather than a defence) without opposing religious expression.
    yea: 2
    why_yea: >
      Voted to protect good-faith statements on matters of public interest,
      including religious ones, outright in C-9's safe-harbour clause.
    nay: -1
    why_nay: >
      Voted against widening C-9's safe-harbour clause to protect good-faith
      religious and public-interest statements outright.
  - key: senate-45-1-699935
    placeable: false
    reason: >
      Left unscored by Christopher, 2 October 2026: the report bundled a new
      residential-schools denialism offence with the noose amendment and a
      widened exception, and he chose not to score it. Evidence only.
    title: "Combatting Hate Act – C-9 – RIDR Report No. 3 with amendments (Senate)"
    dated: 2026-06-03
    result: "Defeated 32-41-2"
    lobbies: "Yea: ISG 23, PSG 5, CSG 4. Nay: CSG 12, ISG 9, PSG 8, C 7, GRO 5"
    moved_by: "Senator Senior (committee chair), seconded by Senator Clement"
    source: >
      Journals of the Senate, 2 June 2026 (the report) and 3 June 2026 (the
      vote): sencanada.ca/en/content/sen/chamber/451/journals/077jr_2026-06-02-e
      and 078jr_2026-06-03-e
    text: >
      The Human Rights committee's THIRD REPORT on C-9, with amendments. In
      clause 4 it (i) adds "a noose" to the banned symbols; (ii) creates a
      NEW OFFENCE, s.319(2.4): "Everyone who, by communicating statements
      other than in private conversation, wilfully promotes hatred against
      Indigenous Peoples by condoning, denying or downplaying the Indian
      Residential Schools System" (two years indictable, or summary); and
      (iii-v) extends the existing defences and forfeiture provisions to that
      offence. In clause 6 it extends the information-gathering exception at
      places of worship to subsection (1) as well as (2). A sub-amendment by
      Senator Arnot (re-wording the noose line) was adopted first; the report
      as amended was then defeated.
    # TEXT READ 26 September 2026. The substantive change is a new speech
    # offence -- criminalising "denying or downplaying" a historical system
    # -- which is what CitizenGO's free-speech line opposes. The report also
    # carried the noose (later adopted anyway, on Senator Bernard's motion)
    # and a modest widening of an exception, so each side is scored +/-1: a
    # vote on the whole report. THIS IS THE MOST SENSITIVE READING IN THE
    # FILE; confirm it only if CitizenGO's line on denialism offences is
    # settled.
    yea: -1
    why_yea: >
      Voted for the committee report creating an offence of promoting hatred
      by "condoning, denying or downplaying" the residential school system
      (-1: the whole report).
    nay: 1
    why_nay: >
      Voted against the committee report that would have created a
      residential-school "denialism" speech offence (+1: the whole report).


  # --- Area 6: parental rights and education (Dail) ---

  - key: "dail/34/2025-05-14/vote_58"
    title: "Parental Choice in Education: Motion (Resumed) [Private Members]: Amendment put:"
    dated: "2025-05-14"
    result: "Carried (Tá 84, Níl 65, Staon 0)"
    lobbies: "Tá: Fianna Fáil 44, Fine Gael 32, Independent 8. Níl: Sinn Féin 34, Labour Party 11, Social Democrats 8, Independent 4, Independent Ireland 3, People Before Profit-Solidarity 2, Aontú 2, Green Party 1."
    tellers: "Tellers: Tá, Deputies Mary Butler and Emer Currie; Níl, Deputies Jen Cummins and Cian O'Callaghan."
    motion: "Government amendment No. 1 to the Social Democrats' 'Parental Choice in Education' motion (Jen Cummins): delete the motion and substitute the Government's text. The original motion called for all new schools under non-religious patronage, faith formation outside the school day, and repeal of section 37.1 of the Employment Equality Act; the Government's text keeps both faith-based and multi-denominational choice and continues the reconfiguration process."
    aye_means: "For replacing the Social Democrats' motion with the Government's text."
    placeable: false
    reason: "A Government-versus-opposition division: the Government's text against the opposition's, whipped on both sides. Aontu voted Nil with the Social Democrats and Sinn Fein, for opposition reasons; a Nil does not mean support for removing faith formation, nor a Ta support for denominational schools. The motion is evidence of who carried the secular text, not a direction."
    draft: true
    drafted: "Claude, 9 October 2026"

  - key: "dail/34/2025-05-14/vote_59"
    title: "Parental Choice in Education: Motion (Resumed) [Private Members]: Question put: \"That the motion, as amended, be agreed to.\""

    title: "Civil Liability (Child Sexual Abuse Proceedings Against Unincorporated Bodies of Persons) Bill 2025: Second Stage (Resumed) [Private Members]: Amendment put:"
    dated: "2026-07-08"
    result: "Carried (Tá 80, Níl 65, Staon 0)"
    lobbies: "Tá: Fianna Fáil 42, Fine Gael 32, Independent 6. Níl: Sinn Féin 37, Social Democrats 10, Labour Party 9, Independent 3, People Before Profit-Solidarity 2, Independent Ireland 2, Aontú 2."
    tellers: "Tellers: Tá, Deputies Mary Butler and John Clendennen; Níl, Deputies Ivana Bacik and Duncan Smith."
    motion: "Government amendment to the Second Stage of the Civil Liability (Child Sexual Abuse Proceedings Against Unincorporated Bodies of Persons) Bill 2025 (Ivana Bacik, Labour): read the Bill a second time 'this day six months' to consider its legal and policy implications. The Bill lets abuse survivors sue unincorporated bodies (religious congregations among them) and reach associated trusts' assets."
    aye_means: "For deferring the Bill six months (the Government's timed amendment)."
    placeable: false
    reason: "A Government-versus-opposition division: the Government's text against the opposition's, whipped on both sides. A timed amendment on a redress bill; abuse redress is not a CitizenGO position either way, and the vote tells no member's stance on our ground apart."
    flag: "If the reach into religious congregations' trust assets is a freedom-of-religion concern for CitizenGO, say so and it can be read again."
    draft: true
    drafted: "Claude, 9 October 2026"


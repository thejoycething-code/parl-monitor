    result: "Carried (Tá 87, Níl 62, Staon 0)"
    lobbies: "Tá: Fianna Fáil 44, Fine Gael 32, Independent 8, Independent Ireland 3. Níl: Sinn Féin 34, Labour Party 11, Social Democrats 8, Independent 4, People Before Profit-Solidarity 2, Aontú 2, Green Party 1."
    tellers: "Tellers: Tá, Deputies Mary Butler and Emer Currie; Níl, Deputies Jen Cummins and Cian O'Callaghan."
    motion: "\"That the motion, as amended, be agreed to\": the Government's text on parental choice in education."
    aye_means: "For the motion as amended by the Government."
    placeable: false
    reason: "A Government-versus-opposition division: the Government's text against the opposition's, whipped on both sides. Same lobbies as the amendment before it (Aontu in the Nil lobby)."
    draft: true
    drafted: "Claude, 9 October 2026"


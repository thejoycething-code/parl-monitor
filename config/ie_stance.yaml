# The Oireachtas: what a division or a Private Member's bill sponsorship
# MEANS, written by a human.
#
# The Irish mirror of config/ca_stance.yaml, under the same rule: which lobby
# is CitizenGO's is the campaigner's judgement, and no tool estimates it.
# tools/ie_5ca.py applies these lines; it never invents one.
#
# EVERY ENTRY IS A DRAFT (9 October 2026). Claude drafted them from the store
# and from the Dail debate records of the day (the question put, the motion,
# the tellers), at Christopher's request ("5CA parity for Ireland"). An entry
# carrying `draft: true` places NOBODY. To sign: tick the box in
# docs/5ca-ie-readings.md and run `python3 tools/ie_5ca.py --sign-from-doc`,
# or delete the `draft: true` line by hand.
#
# `yea:` is the Ta lobby (stored 'Yes'), `nay:` the Nil lobby ('No'). Staon
# (a recorded abstention) never places anyone. `sponsored:` applies to the
# sponsors of a Private Member's bill (weight 3; a vote is weight 5).
#
# NOT IN THE STORE: the store holds the 34th Dail and the 27th Seanad only.
# The safe access zones Act 2024 and the hate offences Bill were voted in the
# 33rd Dail, so their divisions cannot be read here; if Christopher wants
# them, ie_rollcalls.py needs a --dail 33 backfill first.
#
# Keys are the store's: divisions 'dail/34/2026-06-17/vote_149', bills
# '2026/47'. `lobbies:` is counted from ie_votes (party AT THE VOTE).
#


# UN monitor settings. Separate from settings.yaml: the UN runs on sessions,
# not sitting weeks, and shares none of Westminster's vocabulary.

# HOW FRESH IS THIS DATA? Measured from the API on 2026-08-17 rather than
# asked, because the answer is in the data:
#   * the database is actively maintained. Sorting by creationDate desc
#     (sort=creationDate&order=desc, which the API supports) puts the newest
#     records at 2026-08-12 -- five days old at the time of measuring;
#   * those newest records are Fourth Cycle reviews (Congo, Argentina,
#     Nigeria) and they already carry responses, so Supported/Noted is not
#     added in a separate later pass;
#   * but the /api/thesauris Sessions list ends at "50 - November 2025".
#     Sessions 51 and 52, which fall in 2026, are absent entirely. That is
#     the coverage frontier, and it is roughly nine months behind.
#   * much of the recent write activity is BACKFILL of older cycles, not new
#     sessions: 119 of the 200 most recently created records were Dominican
#     Republic Third Cycle.
# Read that as: a reliable research archive that trails the live calendar by
# something like two to three sessions, not a same-week monitor. Schedule
# accordingly -- monthly is ample, weekly would mostly re-read the same rows.
# This is inferred from coverage, not a published policy; if the frontier
# matters for a campaign decision, confirm it with UPR Info directly.

# UPR Info issue tags to harvest. These are LABELS from the Issues thesaurus
# at /api/thesauris (68 values); the uuids they resolve to are fetched every
# run, never pinned here -- a stale uuid returns totalRows=0 with HTTP 200,
# which reads as "nobody raised this" rather than as a bug.
#
# Probed 2026-08-16. Nine of the 68 touch our areas. Read these as a NET, not
# as a verdict: the UN's "Right to life" is mostly death-penalty work, so
# every recommendation still goes through the taxonomy filter on its text.
upr_issues:
  - Right to life                          # 132 recommendations; incl. death penalty
  - Sexual and reproductive rights
  - Freedom of religion and belief
  - Rights of the Child
  - Right to education
  - Sexual Orientation and Gender Identity
  - Gender-based violence
  - Trafficking
  - Human rights education and training

# Rejected at the probe, with reasons, so nobody re-adds them blind:
#   the other 59 issue tags -- disability, minorities, torture, detention and
#   so on. Real human rights work, no overlap with our areas; adding them
#   would mean filtering thousands of rows to keep none.

# Recommendation responses. Three values, not two: "Noted" is the diplomatic
# form of refusal and is the single most useful signal in the dataset.
# src/ingest/upr.py encodes this; listed here for readers.
#   Supported | Noted | Not Supported

# Quoted search phrases, which is how this is actually harvested. Measured
# 2026-08-16, and the quoting is not decoration: an UNQUOTED multi-word term
# matches loosely and returns everything, exactly as Parliament's Written
# Questions API does.
#     sexuality education      -> 10,000 (the whole database)
#     "sexuality education"    ->    228
# Harvesting by issue tag alone fetched 13,166 rows to keep 1,775 and still
# truncated six of nine tags. Terms fetch ~3,100 for a comparable yield.
# Counts below are totalRows at the time of measurement.
upr_search_terms:
  - '"abortion"'                            # 571
  - '"sexual and reproductive health"'      # 746
  - '"sexuality education"'                 # 228; superset of "comprehensive sexuality education" (189)
  - '"decriminalize abortion"'              # 195
  - '"safe abortion"'                       # 101
  - '"therapeutic abortion"'                # 22
  - '"sex-selective"'                       # 4
  - '"euthanasia"'                          # 7
  - '"assisted suicide"'                    # 8
  - '"surrogacy"'                           # 1
  - '"conscientious objection"'             # 79; mostly military service, taxonomy sorts it
  - '"blasphemy"'                           # 68
  - '"freedom of religion"'                 # 2,943; broad but a core area
  - '"same-sex marriage"'                   # 87
  - '"conversion therapy"'                  # 33
  - '"parental rights"'                     # 14
  - '"rights of parents"'                   # 14
  - '"home education"'                      # 2
  - '"child marriage"'                      # 555
  - '"forced marriage"'                     # 540
  - '"trafficking in women"'                # 180
  # Gender identity, measured 2026-08-17 to replace the 4,330-row
  # '"gender identity"'. These name the actual mechanisms states are asked to
  # change, which is also what makes them usable: a recommendation to
  # introduce self-identification is a concrete legislative ask, where
  # "gender identity" mostly returns generic anti-discrimination language.
  - '"transgender"'                         # 1,142; the widest of these, all on-topic
  - '"gender identity and expression"'      # 86
  - '"gender recognition"'                  # 74; superset of "legal gender recognition" (63)
  - '"self-identification"'                 # 42; the self-ID mechanism itself
  - '"trans persons"'                       # 23
  - '"gender-affirming"'                    # 17
  - '"gender reassignment"'                 # 14
  - '"change of gender"'                    # 4
  - '"intersex"'                            # 1,032 (Christopher, 2026-08-17)
#
# Rejected as too broad to be worth the fetch, with the numbers so nobody
# re-adds them blind: "reproductive rights" (1,182, largely restating the
# abortion terms), "gender identity" (4,330) and "sexual orientation and
# gender identity" (4,277 -- barely narrower than the bare term).
# "intersex" was initially left out as a distinct subject; added on request
# 2026-08-17. Two things the harvest then showed, both against expectation:
# its rows map overwhelmingly to area 5 (750 of 751), not to area 3 as
# guessed; and it added only 14 recommendations the store did not already
# hold, because "transgender" had captured the rest. Kept for the explicit
# coverage, but read as ~98% overlap rather than as a new seam.
# "gender ideology" returns ZERO. It is our vocabulary and the sector's, not
# the UN's, and searching for it would have looked like an issue nobody
# raises. Search what the source says, not what we say about it.

upr_page_size: 100
upr_max_pages: 40        # 4,000 per term; every term above fits except religion

# Poland watchlist -- GROUNDWORK DRAFT (9 October 2026), not yet reviewed by
# anyone who campaigns in Poland.
#
# APPLIED BY KEY, NEVER BY TITLE (src/pl_store.add_watch_areas). Keys are
# '<term>/<process number>': the Sejm numbers a legislative process by the
# print (druk) that opened it, and restarts the numbering every term. Bills
# fall at the end of a term EXCEPT citizens' bills (projekty obywatelskie),
# which carry over under a new number, so every entry is re-keyed when the
# 11th Sejm convenes (after the autumn 2027 election).
#
# Until config/taxonomy-pl.yaml exists this file is the ONLY source of areas
# for the Polish edition; a watched process passes its areas to every vote
# that cites one of its prints. Each entry was found by the proposed Polish
# terms (docs/poland-scope.md) and read by hand: its subject is plain in the
# Sejm's own summary of it. Titles such as "o zmianie ustawy - Kodeks karny"
# say nothing, which is exactly why these are keyed.
processes:
  # Abortion
  "10/176": {areas: [1],
             why: "Kodeks karny: decriminalises abortion up to 12 weeks with the woman's consent. Title says only 'Kodeks karny'. Rejected at final vote on 12 July 2024, 215 to 218 (sitting 15, vote 9)."}
  "10/177": {areas: [1, 8],
             why: "O bezpiecznym przerywaniu ciąży: abortion as a health service to 12 weeks, narrows the conscience clause. Survived a motion to reject at first reading, 12 April 2024."}
  "10/223": {areas: [1],
             why: "Amends the 1993 family planning act to reverse the Constitutional Tribunal's October 2020 ruling (eugenic ground restored)."}
  "10/224": {areas: [1],
             why: "O świadomym rodzicielstwie: a right to end a pregnancy, state role in family planning."}
  "10/611": {areas: [1],
             why: "Kodeks karny: partial decriminalisation of abortion and of helping a woman to one. A motion to reject at first reading failed on 8 November 2024, 216 to 232."}
  # Gender ideology, LGBT, sex-based rights
  "10/25": {areas: [5, 9],
            why: "Citizens' bill 'Tak dla rodziny, nie dla gender': withdraw from the Istanbul Convention and draft a family-rights convention. Carried over from the 9th term; rejected at first reading on 22 February 2024, 234 to 189."}
  "10/26": {areas: [5],
            why: "Citizens' bill 'Stop LGBT': bans assemblies promoting same-sex relations or gender change. Rejected at first reading on 22 February 2024, 233 to 189."}
  "10/876": {areas: [5, 7],
             why: "Kodeks karny (government, passed): extends hate-speech and hate-crime protection to disability, age, sex and sexual orientation."}
  "10/2623": {areas: [5],
              why: "Kodeks pracy: repeals the duty to use gender-neutral job titles in job adverts."}
  # Marriage, partnerships, family
  "10/1457": {areas: [9],
              why: "O związkach partnerskich: registered partnerships, open to same-sex couples."}
  "10/1458": {areas: [9],
              why: "Implementing act for the partnerships bill 10/1457."}
  "10/2110": {areas: [9],
              why: "O statusie osoby najbliższej (government): registered cohabitation contracts. Passed 29 May 2026 (230 to 198); the President asked the Sejm to reconsider it."}
  "10/2111": {areas: [9],
              why: "Implementing act for 10/2110."}
  "10/2212": {areas: [9],
              why: "Kodeks karny: new offence of persistently obstructing a parent's contact with a child (art. 209a)."}
  # Parental rights and education
  "10/1603": {areas: [6, 8],
              why: "Citizens' bill: compulsory religion or ethics, two hours a week, in every school; reverses the 2024-25 cuts to religion lessons."}
  "10/1892": {areas: [6],
              why: "Kodeks postępowania cywilnego: the child's best interest when children are removed from their parents."}
  "10/1006": {areas: [6, 7],
              why: "Citizens' bill: age verification for pornographic sites, blocking for refusal."}
  "10/2697": {areas: [6, 7],
              why: "Government bill on protecting minors from online pornography: age verification by digital service providers."}
  # Free speech and online regulation
  "10/1757": {areas: [7],
              why: "DSA implementation (usługi drogą elektroniczną): takedown orders for illegal content, the free-speech fight of 2025-26."}
  "10/2694": {areas: [7],
              why: "Second DSA implementation bill: UKE as the digital services coordinator, disinformation and illegal-content procedures."}
  "10/2488": {areas: [7],
              why: "Anti-SLAPP: special protection for people in public debate (passed, Dz.U. 2026 poz. 830)."}
  "10/1114": {areas: [7],
              why: "Withdrawal from the World Health Organization (Konfederacja); the pandemic-treaty flank."}
  # Freedom of religion
  "10/29": {areas: [8, 7],
            why: "Citizens' bill: protects expressing views grounded in one's religion in the Criminal Code. Carried over from the 9th term."}
  "10/2145": {areas: [8],
              why: "Resolution condemning the public desecration of a religious symbol in a school."}
  # Embryology
  "10/31": {areas: [10],
            why: "Citizens' bill (passed, Dz.U. 2023 poz. 2730): state-funded IVF programme."}
  # Migration (collated, never campaigned, as everywhere else)
  "10/1043": {areas: [11],
              why: "Resolution against implementing the EU Pact on Migration and Asylum (passed, M.P. 2025 poz. 683)."}
  "10/2602": {areas: [11],
              why: "Citizens' bill on internal security and the EU migration pact (art. 72 TFEU)."}

# --- voivodeship assemblies (sejmiki, 13 October 2026) ---------------------
# Resolutions of the sixteen sejmiki read by tools/pl_regions.py, by
# plr_acts.act_key: '<region>/<number as printed>' for a sejmik's own
# register ('ld/XXXI/396/2026', 'pm/366/XXX/26'), '<region>/<kind>/<number>'
# for kinds numbered apart ('ma/deklaracja/1/19'), '<region>/doc/<BIP id>'
# for unnumbered positions ('lu/doc/1382854'), '<region>/dz/<year>/<position>'
# for a voivodeship journal ('mz/dz/2026/9183').
#
# Seeded 13 October 2026 (Chris: "Yes, seed it") from the first live run of
# the thirteen registers (scratch store) and from the 2019-20 "LGBT ideology"
# declarations and Family Charter resolutions and their later repeals, read in
# the registers themselves (Lubelskie's document lists, Małopolskie's
# Deklaracje menu and 2021 register, Świętokrzyskie's VI-term register PDF).
#
# CITED BY NUMBER OR PHRASE (src/pl_regions_store.cited): most of these are
# older than any window a reader takes, so they are matched when a later act
# of the same voivodeship cites them: a title naming the number ("uchylenia
# uchwały nr X/125/19", "Deklaracji Nr 1/19") or one of the entry's `cites:`
# phrases inherits the entry's areas.
regional:
  # From the first live run (13 October 2026)
  "ma/XXVIII/418/26": {areas: [9],
                       why: "Małopolskie, 30 March 2026: the sejmik's answer to a citizen's petition to adopt the Samorządowa Karta Praw Rodzin (the Family Charter). Matches the new term \"Kart* Praw Rodzin*\" (taxonomy-pl v0.3)."}
  "ma/apel/6/25": {areas: [6, 8],
                   why: "Małopolskie, 1 July 2025: appeal on the planned changes to religion teaching in public schools."}
  "ma/apel/8/26": {areas: [7],
                   why: "Małopolskie, 23 February 2026: appeal to the Sejm and the government for a statutory ban on social media for under-15s."}
  "ld/XXV/307/2026": {areas: [5],
                      why: "Łódzkie, 31 March 2026: the 2026-2030 regional programme against domestic violence (the Istanbul Convention's framing; context, not a campaign)."}
  "lu/XVII/264/2025": {areas: [5],
                       why: "Lubelskie, 1 December 2025: the 2026-2030 regional programme against domestic violence (context)."}
  # Lubelskie: the 25 April 2019 position and its 2021 amendment
  "lu/doc/1382854": {areas: [5],
                     why: "Lubelskie, 25 April 2019: Stanowisko 'w sprawie wprowadzania ideologii LGBT do wspólnot samorządowych' (stanowiska list, BIP document 1382854). Older than the window read.",
                     cites: ["stanowisko z dnia 25 kwietnia 2019", "z dnia 25 kwietnia 2019 r. w sprawie wprowadzania ideologii"]}
  "lu/doc/1677532": {areas: [5],
                     why: "Lubelskie, 27 September 2021: 'Stanowisko ... zmieniające stanowisko z dnia 25 kwietnia 2019 r.', the amendment of the 2019 position; its title names only the date."}
  "lu/XVI/268/2020": {areas: [5],
                      why: "Lubelskie, 27 May 2020: the answer to the Ombudsman's complaint against the 25 April 2019 position."}
  "lu/XXXVIII/591/2022": {areas: [9],
                          why: "Lubelskie, 22 June 2022: petition asking the sejmik to adopt the 'Karta Praw Rodziny'."}
  # Małopolskie: Deklaracja Nr 1/19 and its repeal
  "ma/deklaracja/1/19": {areas: [5],
                         why: "Małopolskie, 29 April 2019: Deklaracja Nr 1/19 'w sprawie sprzeciwu wobec wprowadzenia ideologii LGBT do wspólnot samorządowych'. Older than the window read (the Deklaracje menu's current and previous year)."}
  "ma/deklaracja/5/21": {areas: [5],
                         why: "Małopolskie, 27 September 2021: Deklaracja Nr 5/21 repealing Deklaracja Nr 1/19."}
  "ma/XLVI/652/21": {areas: [5],
                     why: "Małopolskie, 25 October 2021: petition demanding the repeal of Deklaracja Nr 1/19."}
  "ma/XLVI/653/21": {areas: [5],
                     why: "Małopolskie, 25 October 2021: a second petition demanding the repeal of Deklaracja Nr 1/19."}
  # Świętokrzyskie: uchwała X/125/19 and what followed (VI-term register PDF)
  "sk/X/125/19": {areas: [5],
                  why: "Świętokrzyskie, 19 June 2019: resolution adopting the position 'w sprawie sprzeciwu wobec prób wprowadzenia ideologii LGBT do wspólnot samorządowych oraz promocji tej ideologii w życiu publicznym'. VI term: not in the register read (VII term)."}
  "sk/XII/168/19": {areas: [5],
                    why: "Świętokrzyskie, 26 August 2019: a citizen's complaint against X/125/19."}
  "sk/XXV/350/20": {areas: [5],
                    why: "Świętokrzyskie, 2020: a legal person's complaint (14 September 2020) against X/125/19."}
  "sk/XXVII/369/20": {areas: [5],
                      why: "Świętokrzyskie, December 2020: petition to repeal the position adopted by X/125/19."}
  "sk/XXXV/486/21": {areas: [5],
                     why: "Świętokrzyskie, 22 September 2021: the position 'w sprawie poszanowania wielowiekowej tradycji i kultury Rzeczypospolitej Polskiej oraz równouprawnienia i sprawiedliwego traktowania', adopted when the sejmik withdrew the 2019 position (press reports; the register line itself does not cite X/125/19)."}
  "sk/XLIV/558/22": {areas: [9],
                     why: "Świętokrzyskie, 24 February 2022: petition about adopting the 'Karta Praw Rodziny'."}

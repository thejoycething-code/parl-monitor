        document: https://lims.leg.bc.ca/hdms/file/Debates/39th1st/H0825am-01.PDF
        verified_against: >-
          The Hansard issue of 25 August 2009 (39th Parliament) lists
          "herbert, Spencer (nDP) ... Vancouver–West End"; the issue of 19
          February 2026 (43rd) lists "Chandra Herbert, Hon. Spencer ...
          Vancouver–West End". The members API holds one member for both,
          id 13, "Spencer Chandra Herbert", Vancouver-West End, in the 39th
          to 43rd Parliaments, and no other Herbert. Division lists of 2010
          print "Herbert" (bc-39-2-2010-03-11-7.1, Nay).
        why: >-
          The 39th Parliament's division lists print the surname he then
          sat under; the roster carries only the later one.
  "on":
    hansard_labels:
      - division: on-41-2-2017-09-21-1
        position: Yea
        printed: "Deputy Speaker"
        office: true
        member: soo-wong
        document: https://www.ola.org/en/legislative-business/house-documents/parliament-41/session-2/2017-09-21/votes-proceedings
        hansard: https://www.ola.org/sites/default/files/node-files/hansard/document/pdf/2017/2017-09/house-document-hansard-transcript-2-EN-21-SEP-2017_L095.pdf
        quoted: >-
          The ayes are 16; the nays are 16. The Deputy Speaker (Ms. Soo Wong): I
          declare the motion carried.
        why: >-
          Second reading of Bill 146 (Gas Pricing Transparency Act, Mr.
          McNaughton). The V&P prints 17-16 with "Deputy Speaker" as the 17th
          Aye: the chair's casting vote on a tie. Hansard for the SAME division
          (p. 5136) names the chair, Soo Wong, who held the office. Christopher
          (2 October 2026) chose to place casting votes, against the convention
          that a casting vote is not a stance. This division only: "Deputy
          Speaker" maps to nobody anywhere else.
    misprints:
      - printed: "Cuzzeto"
        member: rudy-cuzzetto
        from: 2018-07-19
        to: 2020-07-21
        document_prefix: https://www.ola.org/en/legislative-business/house-documents/parliament-42/session-1/
        documents: >-
          The Votes and Proceedings of the 42nd Parliament, 1st Session: every
          division list from 19 July 2018 to 21 July 2020 except 21 February -
          6 June 2019 (when it is spelt "Cuzzetto"), e.g. .../2018-07-25/votes-proceedings
          (both divisions) and .../2020-07-21/votes-proceedings (both divisions).
        verified_against: >-
          The Hansard of the same sittings: its own division lists print
          "Cuzzetto, Rudy" where the V&P prints "Cuzzeto" (25 July 2018,
          25-JUL-2018_L009_1.pdf, both divisions), and its member list prints
          one "Cuzzetto, Rudy (PC) Mississauga—Lakeshore" and no Cuzzeto (25
          July 2018 and 21 July 2020). Read 2 October 2026.
        why: >-
          135 votes, one in each of 135 divisions, and in 118 of them the only
          thing wrong. The surname itself is misprinted, so nothing but a
          reviewed fact can match it; from October 2021 the V&P spells it
          correctly.

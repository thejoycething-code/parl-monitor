# Canadian PROVINCIAL legislatures: reviewed facts from official records.
#
# Every entry here was READ BY A PERSON in an official document and checked
# against a second record. Nothing is inferred: an entry names the document
# it was read in, the date, and what it was checked against. The collectors
# (src/ingest/prov_nb.py, prov_nl.py, prov_ns.py, prov_ab.py) read this file; nothing in
# it overrides a record that resolves on its own.
#
#   label_aliases  A printed name in a division list that is a typo in the
#                  source. Consulted by src/prov_names.Aliased ONLY after the
#                  normal resolver has found nobody, ONLY on that date and in
#                  that document, and ONLY if the member holds a term that
#                  day. The tally check still runs. Never a fuzzy matcher:
#                  add an entry only after reading the record yourself.
#   by_elections   (nl) Vacancies and by-elections in a year whose Members'
#                  Attendance summary has no text (2024 is a scan). Used by
#                  prov_nl.bridge_year to date the roster terms around them.
#   other_surnames A surname a member ALSO sat under, as the member's own
#                  official page states it. Read by
#                  src/prov_names.Resolver.with_record: the label is still
#                  matched against every member valid on the day, so the
#                  answer stays unique-or-nothing.
#   riding_aliases A constituency as a record abbreviates it, with the
#                  constituency's own name. Same reader; a riding still has
#                  to match one of the member's own terms that day.
#   hansard_labels, hansard_totals, bill_corrections
#                  Facts about ONE division (`division:` is its key), read
#                  by src/prov_names.ReviewedDivisions (Christopher, 2
#                  October 2026). Where Hansard is explicit for the SAME
#                  division: settle one bare AMBIGUOUS label in one list (the
#                  member must be one of the candidates), or supply a total
#                  the record omits (a printed total is never replaced; the
#                  tally check then holds the names to it). A bill correction
#                  applies only while the record still prints `printed_bill`,
#                  and leaves the printed number in tally_note. None of these
#                  is ever an alias outside its division. A hansard_labels
#                  entry with `office: true` names who held an office the
#                  list prints instead of a name (the chair's casting vote,
#                  "Deputy Speaker"); it applies only to a label that
#                  resolved to nobody (Christopher, 2 October 2026: casting
#                  votes are placed).
#   misprints      (on) One misspelling of one member's name repeated over a
#                  span of days, in documents under a URL prefix; read by
#                  Aliased like a label alias. Approved by Christopher, 2
#                  October 2026.
#
# Built 2 October 2026 for Christopher's "Fix New Brunswick and NL"
# (3 October 2026). Alberta's entries added 2 October 2026 for the
# 2010 backfill's tally gaps.

provinces:
  "ab":
    other_surnames:
      - member: "0918"
        surname: "Glasgo"
        document: https://www.assembly.ab.ca/members/members-of-the-legislative-assembly/member-information?mid=0918
        verified_against: >-
          The member page heads "Michaela Frey (Also served under Glasgo)",
          30th Legislature, Brooks-Medicine Hat, 16 Apr 2019 - 6 Oct 2022.
          The V&P of 23 May 2019 (legislature_30/session_1/20190523_1200_01_vp.pdf)
          prints "Ms Glasgo, Hon. Member for Brooks-Medicine Hat" and the V&P
          of 25 Oct 2021 (legislature_30/session_2/20211025_1200_01_vp.pdf)
          "Mrs. Frey, Hon. Member for Brooks-Medicine Hat". Division lists
          print "Glasgo" from 23 May 2019 to 16 Jun 2021 and "Frey" from
          25 Oct 2021, never both in one list; the 30th Legislature has no
          other Glasgo.
        why: >-
          "Glasgo" was unresolved in 133 recorded divisions of the 30th
          Legislature (2019-2021): the roster carries only her later surname.
    riding_aliases:
      - printed: "Rimbey-Rocky Mtn. House-Sundre"
        riding: "Rimbey-Rocky Mountain House-Sundre"
        document: https://docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_30/session_1/20190523_1200_01_vp.pdf
        verified_against: >-
          Jason Nixon's member page (member-information?mid=0892) gives
          Rimbey-Rocky Mountain House-Sundre for the 29th, 30th and 31st
          Legislatures; the V&P of 16 Mar 2015
          (legislature_28/session_3/20150316_1200_01_vp.pdf) spells it in
          full ("Hon. Member for Rimbey-Rocky Mountain House-Sundre"). No
          other Alberta constituency begins "Rimbey-Rocky".
        why: >-
          With two Nixons sitting (Jason, and Jeremy for Calgary-Klein) the
          V&P names Jason "Nixon (Rimbey-Rocky Mtn. House-Sundre)", which did
          not match his riding: unresolved in 185 recorded divisions, 2019-2023.
    hansard_labels:
      - division: ab-28-1-2013-11-19-2
        position: Nay
        printed: "Johnson"
        member: "0801"
        document: https://docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_28/session_1/20131119_1200_01_vp.pdf
        hansard: https://docs.assembly.ab.ca/LADDAR_files/docs/hansards/han/legislature_28/session_1/20131119_1930_01_han.pdf#page=25
        quoted: "Johnson, L."
        why: >-
          The V&P prints a bare "Johnson" in the Nays on amendment A4 to Bill
          30 while Jeff (0778) and Linda (0801) Johnson both sat. Hansard for
          the SAME division (Alberta Hansard p. 2953: "the question on
          amendment A4", For 5, "Totals: For - 5 Against - 35") lists the same
          names in the same order with "Johnson, L." in the Against list.
          Linda Johnson in this division only; a bare Johnson stays ambiguous
          everywhere else.
    hansard_totals:
      - division: ab-28-1-2012-12-03-7
        position: Nay
        total: 29
        document: https://docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_28/session_1/20121203_1200_01_vp.pdf
        hansard: https://docs.assembly.ab.ca/LADDAR_files/docs/hansards/han/legislature_28/session_1/20121203_1930_01_han.pdf#page=23
        quoted: "Totals: For - 9 Against - 29"
        why: >-
          The V&P prints "Against the amendment" with no total. Hansard for the
          SAME division (Alberta Hansard p. 1239, "the question, then, on
          amendment A8", Mr. Saskiw's amendment striking "3 years") lists the
          same nine names For, in the same order, and gives "Against - 29".
          The 29 is then held against the names the V&P lists, as any printed
          total is.
    bill_corrections:
      - division: ab-29-1-2015-11-26-3
        printed_bill: "9"
        bill: "5"
        document: https://docs.assembly.ab.ca/LADDAR_files/docs/houserecords/vp/legislature_29/session_1/20151126_1200_01_vp.pdf
        verified_against: >-
          The same V&P, after the division: "The following Bill was read a
          Second time and referred to Committee of the Whole: Bill 5 Public
          Sector Compensation Transparency Act -- Hon. Ms Ganley", and before
          it "On the motion that the following Bill be now read a Second time:
          Bill 5 Public Sector Compensation Transparency Act". Bill 5's own page
          (bills-by-legislature 29-1) marks Second Reading on 26 Nov 2015
          "passed on division"; Bill 9 is the Appropriation Act, 2015, read a
          third time earlier that day.
        why: >-
          The V&P's narrative before the division reads "Debate resumed on the
          motion for Second Reading of Bill 9, Public Sector Compensation
          Transparency Act": the right title under the wrong number. Stored
          under Bill 5; tally_note keeps "the record names Bill 9".
  "bc":

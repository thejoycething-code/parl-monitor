# Canadian PROVINCIAL legislatures: reviewed facts from official records.
#
# Every entry here was READ BY A PERSON in an official document and checked
# against a second record. Nothing is inferred: an entry names the document
# it was read in, the date, and what it was checked against. The collectors
# (src/ingest/prov_nb.py, prov_nl.py, prov_ns.py, prov_ab.py) read this file; nothing in
# it overrides a record that resolves on its own.
#
#   label_aliases  A printed name in a division list that is a typo in the
#                  source. Consulted by src/prov_names.Aliased ONLY after the
#                  normal resolver has found nobody, ONLY on that date and in
#                  that document, and ONLY if the member holds a term that
#                  day. The tally check still runs. Never a fuzzy matcher:
#                  add an entry only after reading the record yourself.
#   by_elections   (nl) Vacancies and by-elections, each read in the Elections
#                  NL report. Used by prov_nl.bridge_year for a year whose
#                  Members' Attendance summary has no text (2024 is a scan),
#                  and by prov_nl.date_terms to date the summaries'
#                  calendar-year terms around them (7 October 2026).
#   general_elections (nl) Election days, each read in the Elections NL
#                  report; prov_nl.date_terms ends or starts a summary's term
#                  on it when the member is absent from the next or the
#                  previous year's summary. Approved by Christopher, 7
#                  October 2026.
#   titles         (nb, nl) The title a record prints for a member, read
#                  where it joins the title to the full name; settles an
#                  AMBIGUOUS label only (prov_nb.CaseExact, prov_nl.Titled).
#   other_surnames A surname a member ALSO sat under, as the member's own
#                  official page states it. Read by
#                  src/prov_names.Resolver.with_record: the label is still
#                  matched against every member valid on the day, so the
#                  answer stays unique-or-nothing.
#   riding_aliases A constituency as a record abbreviates it, with the
#                  constituency's own name. Same reader; a riding still has
#                  to match one of the member's own terms that day.
#   added_members  (Christopher, 7 October 2026) A member the Clerk's count
#                  includes and the printed list omits, with the side, for
#                  ONE division. Applies only while that side prints fewer
#                  names than its count, to a member placed nowhere in the
#                  division, and only from a SECOND official record that
#                  states the vote (Hansard narrative, the Journals, the
#                  Assembly's vote record): `record` cites it and `quoted`
#                  quotes it. Read by src/prov_names.ReviewedDivisions.add;
#                  the tally check then runs as normal. Nova Scotia's five
#                  "Premier counted, not printed" divisions (2021-2025) have
#                  no such record (the Journals print no names and stop in
#                  2021), so none is entered and they stay known gaps.
#   hansard_labels, hansard_totals, bill_corrections
#                  Facts about ONE division (`division:` is its key), read
#                  by src/prov_names.ReviewedDivisions (Christopher, 2
#                  October 2026). Where Hansard is explicit for the SAME
#                  division: settle one bare AMBIGUOUS label in one list (the
#                  member must be one of the candidates), or supply a total
#                  the record omits (the tally check then holds the names to
#                  it). A printed total is replaced ONLY by an entry with
#                  `replaces:` stating the figure the record prints, and
#                  only while it still prints exactly that (Christopher, 2
#                  October 2026); the printed figure stays in tally_note. A
#                  bill correction applies only while the record still prints
#                  `printed_bill`, and leaves the printed number in
#                  tally_note. None of these is ever an alias outside its
#                  division. A hansard_labels entry with `office: true` names
#                  who held an office the list prints instead of a name (the
#                  chair's casting vote, "Deputy Speaker"); it applies only to
#                  a label that resolved to nobody (Christopher, 2 October
#                  2026: casting votes are placed).
#   misprints      (on) One misspelling of one member's name repeated over a
#                  span of days, in documents under a URL prefix; read by
#                  Aliased like a label alias. Approved by Christopher, 2
#                  October 2026.
#   vp_not_served  (mb) A sitting day whose listed V&P is not served (an
#                  error page, or a copy of another day's record): the
#                  day's Hansard PDFs named here are read for their own
#                  division lists INSTEAD, that day only, and only while the
#                  listed record still fails. The Clerk's counts are the
#                  totals the tally check holds the names to.
#   same_person    (mb) Member keys that are ONE person where the seat rule
#                  (same surname, same riding, same legislature, given names
#                  one inside the other) cannot join them: across
#                  legislatures, or "Tom" and "Thomas". Merged in place by
#                  prov_store.merge_split_members.
#
#   roster_rows, titles, roster_bridges
#                  (nb) Rows of a compiled Journal's members page (with an
#                  optional by-election date, `elected:`), the title a record
#                  prints for a member, and a session's roster read from the
#                  next session's members page. All three APPROVED by
#                  Christopher, 7 October 2026 (the 57-1 bridge by name).
#
# Built 2 October 2026 for Christopher's "Fix New Brunswick and NL"
# (3 October 2026). Alberta's entries added 2 October 2026 for the
# 2010 backfill's tally gaps.


      - printed: "Hon. Timothy Hallman"
        member: timothy-halman
        date: 2024-04-05
        document: https://nslegislature.ca/legislative-business/hansard-debates/assembly-64-session-1/house_24apr05
        verified_against: >-
          The same Hansard's first recorded division that day (the motion to
          recommit Bill 419, defeated 21-28) prints "Hon. Timothy Halman" in
          the NAYS; the 64th Assembly's Members table lists one Halman (Timothy
          Halman, Dartmouth East) and no Hallman. Read from CI on 2 October 2026.
        why: >-
          Printed "Hon. Timothy Hallman" in the YEAS of Bill 419's third
          reading (carried 28-17), the division's only unresolved label. The
          surname itself is misprinted, so the surname-only retry cannot help.
  "nb":
    label_aliases:
      - printed: "Mr. Russel"
        member: kevin-russell
        date: 2025-11-20
        document: https://www.legnb.ca/content/house_business/61/2/journals/15251120e.pdf
        verified_against: >-
          The same Journal's third recorded division that day (Motion 3) prints
          "Mr. Russell" in the NAYS; the 61st Legislature has one Russell
          (Kevin Russell, Miramichi West, /en/members/current) and no Russel.

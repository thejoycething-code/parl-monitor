# Portugal watchlist: initiatives of the Assembleia da Republica on CitizenGO
# ground, keyed by initiative KEY '<legislature>/<IniTipo>/<number>', never
# by title (src/pt_store.py). Applied by tools/pt_rollcalls.py on every pull
# and on --reclassify.
#
# IniTipo letters: J projeto de lei, P proposta de lei (Government),
# R projeto de resolucao, D projeto de deliberacao.
#
# Why this file matters more in Portugal than elsewhere: until Chris approves
# a Portuguese term list (proposed in docs/portugal-scope.md), the collector
# classifies with the shared English taxonomy, which matched 5 of the 2,328
# initiatives of the XVII legislature. These entries are what the edition
# can see in the meantime. Seeded 9 October 2026 from the live dumps of the
# XV, XVI and XVII legislatures; every key was read off the Assembleia's
# own record.
#
# Earlier legislatures are listed for a --legislature backfill and for the
# 5CA; the weekly pulls only the current one (XVII).

initiatives:

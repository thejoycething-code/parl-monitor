# Ecuador watchlist (9 October 2026), applied by DIVISION KEY, never by title
# (src/ec_store.watch_areas).
#
# Keys are 'ec-<votingId>', the Asamblea's own vote number in its datos
# parlamentarios service. Bills would be the better key, but no vote carries
# a bill number and the bill systems are closed or frozen
# (docs/ecuador-scope.md); a `bills:` section keyed by trámite number joins
# this file when phase 2 has a bill source.
#
# Until the Spanish taxonomy proposed in docs/ecuador-scope.md is approved,
# areas are NULL everywhere and this file is the only thing that lends them.
# Every entry below was found by the draft terms and read by hand.

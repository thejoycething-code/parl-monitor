items:
  t-255e9b0ea7:
    kind: title
    who: ''
    original: Réponse intégrale aux violences sexuelles et sexistes contre les femmes et les enfants
    english: ''
    by: ''
  p-4582474fce:
    kind: passage
    who: M. Éric Bothorel (EPR)
    original: Les contenus existent toujours ; d’ailleurs, ils restent parfois accessibles moyennant des
      mécanismes de contournement.Je comprends votre intention – de nombreux parlementaires ont étudié
      la question, dans le cadre de l’examen de ce texte et d’autres encore –, mais, comme l’a rappelé
      le ministre, le rejet de l’amendement du gouvernement rendrait l’écriture du présent article incompatible
      avec le droit européen. Comme cela a été le cas pour l’encadrement de l’accès des mineurs aux réseaux
      sociaux défendu par Mme Miller, de très bonnes intentions finissent parfois par se fracasser ainsi.
    english: ''
    by: ''
  p-e363231ade:
    kind: passage
    who: Mme Émilie Bonnivard (DR)
    original: En effet, lorsqu’une photo ou une vidéo pédopornographique est mise en ligne, elle est immédiatement
      enregistrée et partagée par le réseau de pédocriminalité.À l’heure actuelle, les technologies proactives
      de détection par les plateformes constituent les seules mesures efficaces de prévention. Elles ont
      déjà été mises en place dans certains pays et ne coûtent pas d’argent public. Le hachage est l’une
      de ces technologies, qui permet de réduire le risque systémique de rediffusion en codant les images
      pédopornographiques ou manifestement illicites pour qu’elles ne soient plus jamais publiées nulle
      part.L’amendement vise à faire en sorte que les plateformes installent ces technologies proactives
      de détection – elles en ont les moyens techniques et financiers.
    english: ''
    by: ''
  p-756e87d856:
    kind: passage
    who: Mme Violette Spillebout (EPR)
    original: 'C’est un aspect fondamental de la lutte contre la pédocriminalité en ligne.L’article 10
      est lui aussi fondamental. Nous avons tous fait nôtre le message de la Ciivise – Commission indépendante
      sur l’inceste et les violences sexuelles faites aux enfants – qui dit aux enfants victimes : « Je
      te crois, je te protège. » Ce que nous souhaitons, c’est que l’article 10 dise la même chose aux
      femmes victimes de retransmission de ces contenus criminels, dont elles ne consentent pas, n’ont
      jamais consenti ou ne consentent plus à la diffusion.Nous comprenons le risque d’inconventionnalité
      évoqué par le gouvernement, mais, aujourd’hui, il faut surtout changer de logiciel.'
    english: ''
    by: ''
  p-02b5de09cc:
    kind: passage
    who: M. Iñaki Echaniz (SOC)
    original: Pour l’heure, elles s’en lavent les mains et refusent de retirer des annonces d’appartements,
      même lorsqu’il est prouvé qu’ils ont été utilisés pour de la prostitution. Nous sommes nombreux
      sur ces bancs à avoir été alertés par des propriétaires de logements voisins. Ceux-ci alertent la
      police et la gendarmerie, qui déclarent ne pas pouvoir intervenir dans des logements privés ; ils
      alertent Airbnb, qui maintient l’annonce en prétextant que cela ne les regarde pas, et rien ne se
      fait ! Une action de votre part est donc nécessaire pour lutter contre les plateformes de location
      touristique détournées pour l’exploitation des mineures.
    english: ''
    by: ''
  p-bcbf8933e3:
    kind: passage
    who: Mme Sylvie Bonnet (DR)
    original: 'L’exploitation sexuelle des mineurs n’est pas un phénomène marginal. Les réseaux sociaux
      sont devenus un puissant outil pour recruter, approcher et maintenir sous emprise les jeunes victimes.
      Parmi elles, les mineurs confiés à l’aide sociale à l’enfance sont particulièrement vulnérables.
      Leur parcours, leurs carences affectives et leur fragilité peuvent être exploités par des proxénètes
      qui savent précisément où trouver leurs victimes et comment exercer leur emprise.Face à cela, nous
      devons être clairs : l’exploitation sexuelle d’un enfant ne peut jamais être considérée comme une
      infraction ordinaire.'
    english: ''
    by: ''
  p-26a5652373:
    kind: passage
    who: Mme Karine Lebon (GDR)
    original: Pour lutter efficacement contre l’exploitation sexuelle des mineurs, nous devons partir
      des réalités de chaque territoire.Dans les outre-mer, certains facteurs – l’isolement de certaines
      communes, les barrières linguistiques, ainsi que, dans plusieurs territoires, les circulations transfrontalières
      – peuvent compliquer considérablement le repérage et la protection des enfants. Nous proposons que
      chaque territoire dispose d’un plan, construit à partir d’un diagnostic local, avec les collectivités,
      la justice, la protection de l’enfance, l’éducation nationale et les associations pour organiser
      concrètement le parcours du mineur, de sa mise à l’abri jusqu’à son accompagnement sanitaire, psychologique,
      social et judiciaire.Un plan national donne une direction ; sa déclinaison territoriale transforme
      cette ambition en réponse réellement accessible aux enfants.
    english: ''
    by: ''
  p-e77d283a1f:
    kind: passage
    who: Mme Sophie Blanc (RN)
    original: 'Or personne n’explique à la victime pourquoi il y a un écart entre la peine prononcée à
      la fin de l’audience et celle exécutée par l’auteur des faits.Par cet amendement, nous souhaitons
      exclure du bénéfice de ces différents mécanismes les personnes condamnées pour des infractions constituant
      des violences sexuelles et sexistes, notamment lorsqu’elles sont punies d’au moins cinq ans d’emprisonnement
      : viol, agression sexuelle, atteinte sexuelle sur mineur, proxénétisme, recours à la prostitution
      d’un mineur, pédocriminalité… La peine prononcée doit redevenir la peine subie ; c’est ce que les
      victimes attendent quand elles entendent le verdict.'
    english: ''
    by: ''
  p-746d5edf93:
    kind: passage
    who: Mme Catherine Ibled (EPR)
    original: L’inceste n’est pas une pulsion, c’est une préméditation et une domination du corps de l’enfant.
      Il trahit le lien de confiance et détruit la filiation.L’article 19 permet précisément à notre droit
      de mieux nommer cette réalité. Pendant trop longtemps, l’inceste a vécu dans le silence des familles
      et a détruit des enfants. Nommer l’inceste, c’est dire aux milliers de victimes, enfants d’hier
      et d’aujourd’hui, que ce qu’elles ont subi a un nom et que la loi les protège. (Applaudissements
      sur les bancs du groupe EPR.)
    english: ''
    by: ''
  p-e00505d651:
    kind: passage
    who: Mme Clémentine Autain (ECOS)
    original: Je suis moi aussi très sensible au concept d’incestualité, qui me paraît pertinent parce
      qu’il donne à voir un continuum des violences. Parfois, il n’y a pas de passage à l’acte, et pourtant
      une situation d’incestualité avec le père, en particulier, peut causer des traumas aussi importants
      que quand il y a passage à l’acte. Je prends donc le sujet très au sérieux et je le crois très important.À
      présent, le concept est-il pertinent dans un cadre juridique ? Je ne le crois pas. D’abord, je pense
      que tous les rapports sociaux, même quand ils sont traumatisants, n’ont pas nécessairement de solution
      juridique, à travers la pénalisation.
    english: ''
    by: ''
  p-c604e9a996:
    kind: passage
    who: Mme Perrine Goulet (DEM)
    original: La généralisation des programmes Evar et Evars d’éducation à la vie affective et relationnelle,
      et à la sexualité, devrait nous y aider. Ensuite, il faut qu’il ait suffisamment confiance dans
      un adulte pour pouvoir s’exprimer. Ce n’est pas lorsque l’adulte est disponible ou présent que la
      parole de l’enfant se libère, mais lorsqu’il est lui-même prêt. Il faut donc que l’enfant sache
      qu’à tout moment, il a quelqu’un vers qui se tourner.En commission, le rapporteur Erwan Balanant
      s’est engagé à « muscler encore » le dispositif de l’article 30, et surtout à le rendre réaliste,
      réalisable et à hauteur d’enfant.
    english: ''
    by: ''
  p-b272f750bb:
    kind: passage
    who: Mme Sarah Legrain (LFI-NFP)
    original: Cet article vise notamment à condamner des commanditaires de violence dans les dispositifs
      dits « directs en ligne », qui se sont tristement démocratisés. Ces faits extrêmement graves, consistant
      dans la commande de viols à distance, ont récemment émaillé l’actualité en France à travers plusieurs
      affaires.Néanmoins, celles-ci ont plutôt démontré l’efficacité du droit puisque des condamnations
      ont été prononcées.
    english: ''
    by: ''
  p-513ac120bb:
    kind: passage
    who: Mme Virginie Duby-Muller (DR)
    original: 'Je profite de cette intervention pour revenir sur un amendement que j’avais déposé et dont
      – sans remettre en cause le travail des services de l’Assemblée – je regrette qu’il ait été déclaré
      irrecevable alors qu’il me semblait s’inscrire pleinement dans l’objet de notre discussion, à savoir
      renforcer la lutte contre l’exploitation sexuelle des enfants et prévenir la récidive.Sa vocation
      était très concrète : protéger les enfants au-delà de nos frontières car les criminels, eux, peuvent
      les franchir. Nous savons que les auteurs d’infractions sexuelles condamnés en France peuvent voyager
      et que certains cherchent à poursuivre leurs agissements à l’étranger, où les mécanismes de protection
      des mineurs sont moins développés.'
    english: ''
    by: ''

  p-a90fae97e9:
    kind: passage
    who: Florence Reuter (MR)
    original: Dans la plupart des situations, cela semble logique, mais cela correspond moins à la réalité
      particulière d'une euthanasie programmée, puisque dans ce cas, une date a été fixée à l'avance.
      Les familles savent que les jours qui précèdent sont importants, et au-delà des démarches à accomplir,
      ce qu'elles veulent, pour la plupart en tout cas, c'est passer du temps avec une personne concernée
      avant la date fixée. Or le cadre légal ne le permet pas, et c'est précisément ce que nous voulons
      changer. Non pas créer des jours de congé supplémentaires, mais assouplir le congé existant.
    english: ''
    by: ''
  p-2255eccf0d:
    kind: passage
    who: Axel Ronse (N-VA)
    original: Dit gaat over een heel delicaat thema, namelijk euthanasie. Dit toont aan dat men als parlementslid
      ook het verschil kan maken in dossiers zonder dat ze een financiële meerkost met zich meebrengen.
      Dit is echt een kwestie van empathie en zich kunnen inleven in de situatie van mensen. Collega Reuter,
      ik dank u voor dit initiatief en voor het feit dat u collega's rond dat idee hebt verzameld. Er
      is collega Vanrobaeys, die ook een zeer groot hart heeft voor alles wat sociaal is en voor de rouw
      die mensen meemaken.
    english: ''
    by: ''
  p-cdd27a281f:
    kind: passage
    who: Caroline Désir (PS)
    original: Chers collègues, depuis 25 ans, notre pays reconnaît le droit à mourir dans la dignité,
      et c'est vraiment une fierté pour nous sachant que ce droit est encore refusé dans de nombreux pays.
      Nous devons faire vivre ce droit et garantir qu'il puisse s'exercer dans les meilleures conditions
      pour la personne concernée, au premier chef, comme pour ses proches, bien sûr. Aujourd'hui, la proposition
      qui nous est soumise permet justement une belle avancée dans l'exercice de ce droit. Parce que mourir
      dans la dignité, c'est aussi permettre à la personne qui fait ce choix d'être entourée par ses proches,
      par celles et ceux qui comptent pour elle, et ce, jusqu'au dernier moment.
    english: ''
    by: ''
  p-974cff4477:
    kind: passage
    who: Robin Tonniau (PVDA-PTB)
    original: Zo zou men eigenlijk niet moeten kiezen tussen aanwezig zijn bij een euthanasie of bij een
      begrafenis. Het is goed dat dit wetsvoorstel het mogelijk maakt om een deel van het rouwverlof op
      te nemen voor het overlijden wanneer euthanasie gepland is, zodat naasten aanwezig kunnen zijn om
      afscheid te nemen. Ik vind het wel jammer dat de meerderheid dat niet mogelijk maakt voor broers
      en zussen, want zij hebben recht op één dag rouwverlof. Als een broer euthanasie pleegt, dan kan
      diens zus geen dag rouwverlof nemen.
    english: ''
    by: ''
  p-8ef15a70ad:
    kind: passage
    who: Anne Pirson (Les Engagés)
    original: Nous rejoignons évidemment le MR et notre collègue Florence Reuter sur cette question et
      cette thématique. En effet, ce n'est pas parce que l'on connaît la date du décès d'un proche que
      la séparation n'en est pas moins douloureuse. Lorsqu'une euthanasie est programmée, les proches
      doivent pouvoir être présents avant le décès lorsque leur accompagnement est essentiel. Pour Les
      Engagés, accompagner la fin de vie suppose évidemment aussi le soutien aux proches. Nous enjoignons
      donc l'ensemble des membres de cet hémicycle à voter en faveur de ce texte.
    english: ''
    by: ''
  p-0b58df59bb:
    kind: passage
    who: Funda Oru (Vooruit)
    original: Mijnheer de voorzitter, ik sluit me graag aan bij wat er al gezegd is. ik wil namens mijn
      fractie mevrouw Reuter bedanken voor haar initiatief om het rouwverlof bij geplande euthanasie beter
      af te stemmen op wat families nodig hebben. Het afscheid bij geplande euthanasie begint voor naasten
      immers vaak al voor de dag zelf. Mensen willen uiteraard in die moeilijke periode bij een dierbare
      zijn en die kunnen bijstaan. Het is dus belangrijk dat de verlofregeling ook rekening houdt met
      die werkelijkheid. Daar zorgen we vandaag voor via dit voorstel.
    english: ''
    by: ''
  p-7fb4835898:
    kind: passage
    who: Els Van Hoof (cd&v)
    original: 'L''intitulé a été modifié par la commission en "proposition de loi visant à flexibiliser
      la période du congé de deuil en cas d’euthanasie programmée et du congé pour soins palliatifs".
      Het wetsvoorstel telt 17 artikelen. La proposition de loi compte 17 articles. Ingediend amendement:
      Amendement déposé: Art. 2 • 20 – Caroline Désir (1338/9) Besluit van de artikelsgewijze bespreking:
      Conclusion de la discussion des articles: Aangehouden: het amendement en artikel 2. Réservés: l''amendement
      et l''article 2. Artikel per artikel aangenomen: de artikelen 1 en 3 tot 17. Adoptés article par
      article: les articles 1 et 3 à 17 .'
    english: ''
    by: ''

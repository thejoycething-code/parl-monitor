name: Senedd weekly
on:
  schedule:
    # Thursday 06:00 UTC, retry 14:00. The Senedd sits Tuesday and Wednesday,
    # so by Thursday the week's divisions and transcripts are published,
    # and the slot is clear of the Sunday pull (01:00-15:00 Sun),
    # the Monday publish (02:00-07:00 Mon) and the monthly UPR (3rd, 06:00).
    #
    # Deliberately SIMPLER than sunday-pull.yml, and why is worth recording:
    # no DST guard pair, because this is a pull with no publish attached and
    # nobody's morning depends on the London hour; no secrets file, because
    # every Senedd endpoint is keyless and the filter is regex, not triage; no
    # last-chance Monday slot, because a stale NI store costs a week of
    # watching-brief freshness, not a missed edition.
    - cron: "0 6 * * 4"
    - cron: "0 14 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# The same group as the Sunday pull and Monday publish: every workflow that
# commits data/ must serialise, or two bots race on parl-monitor.db -- the
# binary-merge conflict this repo has already paid for twice.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # A full run measured ~12 minutes cold (the question enrichment is one
    # throttled request per matched question); 30 covers checkout and pip too.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        # The store is a release asset, not a tracked file (88MB against a
        # 100MB hard push limit). The concurrency group above is what makes
        # this safe: one writer at a time, repo-wide.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Pull the roster from parlparse
        run: python3 tools/sd_members.py | tee /tmp/sd-members.log
      - name: Walk new written questions
        if: always()
        run: python3 tools/sd_pull.py | tee /tmp/sd-pull.log
      - name: Harvest plenary divisions
        if: always()
        run: python3 tools/sd_divisions.py --parl 908 | tee /tmp/sd-divisions.log
      - name: Refresh the bill register
        if: always()
        run: python3 tools/sd_bills.py | tee /tmp/sd-bills.log
      - name: Harvest committee scrutiny and the forward look
        if: always()
        run: python3 tools/sd_committees.py | tee /tmp/sd-committees.log
      - name: Pull open Welsh Government consultations
        if: always()
        run: python3 tools/dg_consultations.py --nation wales | tee /tmp/sd-consultations.log
      - name: Health summary
        # The tools print their gaps and then exit 0, so a PARTIAL refresh is
        # a green tick with the detail buried in the log. Lifting the gap lines
        # into the run summary makes the Actions page answer "did this week
        # work" at a glance -- the same reasoning as printing gaps at all: a
        # feed that fails quietly is worse than one that fails loudly.
        if: always()
        run: |
          {
            echo "## Senedd weekly refresh"
            for f in members pull divisions bills committees consultations; do
              echo "### $f"
              if [ -f "/tmp/sd-$f.log" ]; then
                echo '```'
                grep -E "gap\(s\)|no gaps|^  \* |stored|written|held in total|carry an issue area|consultation|committee|sitting" \
                  "/tmp/sd-$f.log" | head -20 || echo "(no summary lines)"
                echo '```'
              else
                echo "step did not run"
              fi
            done
            TOTAL=$(grep -ho "[0-9]\+ gap(s)" /tmp/sd-*.log 2>/dev/null \
                    | awk '{s+=$1} END {print s+0}')
            echo ""
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step logs. A gap is a"
              echo "source that did not answer, not a crash: the rest of the"
              echo "refresh still landed."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the store
        # NEVER publish a store the pull refused: see the note in
        # monday-publish.yml. `always()` alone turned one sha mismatch
        # into a cascade across three workflows on 2026-08-28.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Senedd weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push

name: Monday publish
on:
  schedule:
    # Target: 06:30 Europe/London every Monday (UTC duplicate + guard, as Sunday).
    - cron: "30 5 * * 1"
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: London-hour guard (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=Europe/London date +%H)
          if [ "$HOUR" != "06" ]; then
            echo "London hour is $HOUR, not 06 - off-DST duplicate slot; exiting."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: env.SKIP != '1'
        run: pip install pyyaml
      - name: Write secrets file
        if: env.SKIP != '1'
        run: |
          cat > config/secrets.yaml <<EOF
          anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
          asana_pat: "${{ secrets.ASANA_PAT }}"
          asana_workspace: "826488630492934"
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"
          slack_channel_id: C9RH217PZ
          slack_team_id: T066M0LAJ
          EOF
      - name: Render and publish
        if: env.SKIP != '1'
        run: python3 run_monday.py
      - name: Deploy partner site
        if: env.SKIP != '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_rpnwoDBcJ5Wz1K5P8UCTGY2k
          VERCEL_PROJECT_ID: prj_S8GXaZdccVrPLzoXQdWaiq1MyZGr
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set - partner site deploy skipped (deploy in-session instead)"
          else
            npx --yes vercel@latest deploy partner_site --prod --yes --token "$VERCEL_TOKEN"
          fi
      - name: Commit state
        if: env.SKIP != '1'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/ reviews/
          git diff --cached --quiet || git commit -m "Monday publish: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push

name: Monday publish
on:
  schedule:
    # Target: 04:00 Europe/London every Monday (Christopher, 2026-08-17; was
    # 06:30). UTC duplicate + guard, as Sunday.
    - cron: "0 3 * * 1"
    - cron: "0 4 * * 1"
    # Retry slots: the publish is idempotent per week (publish_log), so these
    # cost nothing when the primary ran and save the morning when it did not.
    - cron: "30 5 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the Slack post and Asana task (still deploys the partner site)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # SIXTY (21 Sept 2026): a dispatched dry run was killed by the 30-minute
    # wall inside run_monday.py with nothing in the log, because Python
    # buffered stdout into the runner. Same shape as the EU weekly two days
    # earlier. The wall is raised so the real slot can finish; the log is
    # unbuffered so the next kill, if any, says where it happened.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: London-hour guard (scheduled runs only)
        if: github.event_name == 'schedule'
        # Same delay-proof guard as the Sunday pull: decide by which cron
        # fired, not by the hour at run time (see 2026-08-09 skipped pull).
        # Retries are 06:30 and 08:00 London, so a delayed primary still has
        # two chances before the working day.
        # Retry slots pass unconditionally: publish_log makes duplicates
        # impossible, so only the paired primary slots need the DST pick.
        run: |
          case "${{ github.event.schedule }}" in
            "30 5 * * 1"|"0 7 * * 1") echo "retry slot; idempotency decides"; exit 0 ;;
          esac
          OFFSET=$(TZ=Europe/London date +%z)   # +0100 during BST, +0000 GMT
          WANT="0 4 * * 1"
          [ "$OFFSET" = "+0100" ] && WANT="0 3 * * 1"
          if [ "${{ github.event.schedule }}" != "$WANT" ]; then
            echo "Fired by '${{ github.event.schedule }}' but London (UTC$OFFSET) wants '$WANT' - off-DST duplicate slot; exiting."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
        if: env.SKIP != '1'
      # ref: the branch TIP at checkout time, not github.sha. A dispatched
      # or scheduled run PINS github.sha when it is created; queued behind
      # another run in the parl-monitor-state group, it then checks out a
      # sidecar OLDER than the store that run just published, and the fetch
      # refuses the mismatch. Found 2026-08-31: a sunday-pull dispatched
      # while a publish ran died exactly this way -- the fourth known route
      # to store/sidecar divergence, and the first that needs no failure
      # anywhere. These workflows act on repo STATE, so the tip is always
      # the right thing to act on.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        if: env.SKIP != '1'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: env.SKIP != '1'
        run: pip install pyyaml google-auth
      - name: Fetch the store
        id: fetch
        # Guarded like every other work step. Without this it runs on the
        # off-DST sibling with no checkout, exits 2, and turns a run that
        # was meant to skip silently into a red one. sunday-pull.yml took
        # exactly that failure at 02:03 on 2026-08-30; this file carried the
        # identical hole and had not fired it only because its sibling lands
        # on Monday -- at 04:00 UTC, beside the publish. Missed when the
        # store moved to a release asset (d6e9738); the neighbours all had it.
        if: env.SKIP != '1'
        # The store is a release asset, not a tracked file (88MB against a
        # 100MB hard push limit). The concurrency group above is what makes
        # this safe: one writer at a time, repo-wide.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        # One tar per day folder, only the folders whose content moved.
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Link written questions
        if: env.SKIP != '1'
        # Offline: reads the archived payloads in data/raw, no API calls, one
        # second. It lives here rather than in a backfill anyone has to
        # remember because the page's written-question links depend on it --
        # without it, 206 rows lose their source.
        run: python3 tools/backfill_pq_links.py
      - name: Write secrets file
        if: env.SKIP != '1'
        run: |
          cat > config/secrets.yaml <<EOF
          anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
          asana_pat: "${{ secrets.ASANA_PAT }}"
          asana_workspace: "826488630492934"
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"
          slack_channel_id: C9RH217PZ
          slack_team_id: T066M0LAJ
          EOF
      - name: Render and publish
        id: publish
        if: env.SKIP != '1'
        env:
          # Manual runs default to a dry run: the partner site still deploys,
          # but nothing lands in #campaigns-en-gb unless dry_run is unticked.
          NO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          # Drive publishing is optional: without this secret the brief-sheet
          # step reports the missing key and the run carries on.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 run_monday.py
      - name: Deploy partner site
        if: env.SKIP != '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_rpnwoDBcJ5Wz1K5P8UCTGY2k
          VERCEL_PROJECT_ID: prj_S8GXaZdccVrPLzoXQdWaiq1MyZGr
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not set - partner site deploy skipped (deploy in-session instead)"
          else
            npx --yes vercel@latest deploy partner_site --prod --yes --token "$VERCEL_TOKEN"
          fi
      - name: Judge evaluation
        # The eval loop was in NO workflow until 2026-09-25: the sample was
        # written and the report regenerated only when somebody remembered,
        # which is the same shape as the answer archiver that had decayed to
        # 56% before it was scheduled. An unchecked judge is not a judge that
        # agrees with us, and since answer_kind arrived the edition ROUTES on
        # its label -- a drift there hides real answers rather than merely
        # misplacing them.
        #
        # Order matters. INGEST first, so a checklist filled in during the
        # week is read before anything measures agreement; then SAMPLE this
        # edition's verdicts; then REPORT, which now has both. Sampling
        # before ingesting would measure last week's corpus and hand out
        # this week's checklist against a report nobody had updated.
        #
        # The verdicts themselves are banked by the SUNDAY PULL, where the
        # triage pass runs -- not by the publish above. So they are in the
        # store before this step, and this is the first moment the edition
        # they belong to exists to be checked against. A Sunday sample would
        # race the pull that writes what it samples.
        #
        # No API calls: every action here reads the store and the reviews
        # directory. `rescore` is the one that spends, and it is deliberately
        # not here -- it asks before spending and stays a human decision.
        #
        # always() with the fetch guard, like every step here: a failed feed
        # above must not skip the evaluation, but a refused store must,
        # because the sample would be drawn from a store this run does not
        # own. A DUPLICATE retry slot is skipped for the same reason: its
        # store is stale, its push is skipped below, so its sample and report
        # would be written from an older store and then committed over the
        # ones the real run produced.
        if: always() && steps.fetch.outcome == 'success'
          && env.SKIP != '1'
          && steps.publish.outputs.duplicate != '1'
        run: |
          WEEK=$(TZ=Europe/London python3 -c "import datetime; t=datetime.date.today(); print((t - datetime.timedelta(days=t.weekday())).isoformat())")
          echo "Judge evaluation for week commencing $WEEK"
          python3 tools/judge_eval.py ingest
          python3 tools/judge_eval.py sample --week "$WEEK"
          python3 tools/judge_eval.py report --write
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks
        # is the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
          && env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # SKIPPED on a redundant retry slot. There are four Monday crons by
        # design; when the primary succeeds, a later slot holds a store that
        # is now stale and the lineage guard correctly refuses its push. That
        # refusal was surfacing as a failed run and a real alert EVERY Monday
        # (6, 7, 14 and 21 September all have one), which is how a team stops
        # reading alerts -- and a genuinely failing coverage watch then ran
        # five days unread over 1,218 lost UPR recommendations.
        #
        # The guard is not softened: nothing here tolerates a refusal. The run
        # simply does not attempt a push it knows cannot succeed, on the same
        # fact run_monday already prints -- publish_log says this week is
        # published. Anything genuinely new is published by the slot that did
        # the publishing, or by the next workflow to run.
        #
        # NEVER publish a store the pull refused. This was `always()`, and on
        # 2026-08-28 that turned one sha mismatch into a cascade: the pull
        # refused an untrusted download, left it on disk, and this step
        # uploaded it straight back as the official asset -- while "Commit
        # state" below, correctly guarded, never recorded the new sha. So
        # every subsequent run mismatched too, against a DIFFERENT sha each
        # time, and four runs across three workflows failed in half an hour.
        # The guard that heals it is simply: if we could not trust the store
        # we pulled, we have nothing worth publishing.
        if: always() && steps.fetch.outcome == 'success'
          && env.SKIP != '1'
          && steps.publish.outputs.duplicate != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # PAIRED WITH THE PUBLISH ABOVE, and it must stay that way. That
        # includes the duplicate guard: tests/test_vote_tracker_display.py
        # asserts the two conditions are IDENTICAL in both directions, and it
        # caught this change when only the publish had it.
        #
        # Skipping the commit on a duplicate slot is not merely consistent,
        # it is better. A retry slot regenerates site artefacts and the
        # edition from the store it pulled, which on a duplicate is OLDER
        # than the one the real run published -- so committing them would
        # quietly roll the partner site back to a stale render. With no
        # condition, this step is skipped whenever ANY earlier step failed --
        # one WAF-blocked feed was enough -- while the publish above still
        # uploaded a new store. New asset, uncommitted sidecar: the next run
        # of ANY workflow then refuses the store it just published. That is
        # where 2026-08-28's cascade actually began.
        if: always() && steps.fetch.outcome == 'success'
          && env.SKIP != '1'
          && steps.publish.outputs.duplicate != '1'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/debate_watch.yaml data/ editions/ reviews/ docs/judge-eval.md partner_site/issues.html partner_site/issue-*.html partner_site/petitions.html partner_site/questions.html
          git diff --cached --quiet || git commit -m "Monday publish: $(date -u +%Y-%m-%dT%H:%M)Z"
          # The sidecar MUST land: the store was already published above,
          # so a failed push leaves the release ahead of the repo -- the
          # same divergence a skipped commit caused, by another route.
          # 2026-08-28: this push lost a race with a human push and was
          # rejected, and the next run refused the store. Rebase and retry
          # rather than leave the two out of step.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

name: Sunday pull
on:
  schedule:
    # Target: 05:00 Europe/London every Sunday (Christopher, 2026-08-17; was
    # 21:04). Actions cron is UTC-only, so both candidate UTC slots fire and
    # the London-hour guard picks the right one across BST/GMT.
    - cron: "0 4 * * 0"
    - cron: "0 5 * * 0"
    # Retry slots. The pull is idempotent per week (pull_log), so extra slots
    # are free: if the primary ran, these find the marker and exit in seconds;
    # if it was dropped or died, the week still gets pulled. A 05:00 start
    # leaves the whole of Sunday for recovery, which the old evening slot did
    # not. The last one runs early Monday, before the 06:30 publish.
    - cron: "0 9 * * 0"
    - cron: "0 18 * * 0"
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # 60min (Christopher, 2026-08-17). A cold pull measured 40m05s and the
    # weekly run is always cold; this covers the whole job, not just the
    # pull, so checkout and pip come out of the same budget.
    timeout-minutes: 60
    steps:
      - name: London-hour guard (scheduled runs only)
        if: github.event_name == 'schedule'
        # Decide by WHICH cron fired (github.event.schedule), not by the
        # wall-clock hour at run time. Actions delays scheduled runs -- a
        # 20:04 UTC run starting after 21:00 UTC read as London hour 22, was
        # "not 21", and the whole Sunday was skipped with a green tick
        # (2026-08-09). The offset check below is stable under delay.
        # Retry slots pass unconditionally: idempotency makes a duplicate
        # harmless, so only the paired primary slots still need the DST pick.
        run: |
          case "${{ github.event.schedule }}" in
            "0 9 * * 0"|"0 18 * * 0"|"30 3 * * 1") echo "retry slot; idempotency decides"; exit 0 ;;
          esac
          OFFSET=$(TZ=Europe/London date +%z)   # +0100 during BST, +0000 GMT
          WANT="0 5 * * 0"
          [ "$OFFSET" = "+0100" ] && WANT="0 4 * * 0"
          if [ "${{ github.event.schedule }}" != "$WANT" ]; then
            echo "Fired by '${{ github.event.schedule }}' but London (UTC$OFFSET) wants '$WANT' - off-DST duplicate slot; exiting."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
        if: env.SKIP != '1'
      - uses: actions/setup-python@v7
        if: env.SKIP != '1'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: env.SKIP != '1'
        run: pip install pyyaml
      - name: Write secrets file
        if: env.SKIP != '1'
        run: |
          cat > config/secrets.yaml <<EOF
          anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
          asana_pat: "${{ secrets.ASANA_PAT }}"
          asana_workspace: "826488630492934"
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"
          slack_channel_id: C9RH217PZ
          slack_team_id: T066M0LAJ
          EOF
      - name: Pull for the coming week
        if: env.SKIP != '1'
        run: |
          # Monday of the week this Sunday belongs to: tomorrow on a
          # Sunday, today if a delayed run crosses midnight into Monday. The
          # old "next Monday" formula would pull a week ahead after midnight.
          WEEK=$(TZ=Europe/London python3 -c "import datetime; t=datetime.date.today(); print((t + datetime.timedelta(days=1) if t.weekday() == 6 else t - datetime.timedelta(days=t.weekday())).isoformat())")
          echo "Pulling for week commencing $WEEK"
          TRIAGE=auto python3 run_weekly.py --pull "$WEEK"
      - name: Commit state
        if: env.SKIP != '1'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reviews/
          git diff --cached --quiet || git commit -m "Sunday pull: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push

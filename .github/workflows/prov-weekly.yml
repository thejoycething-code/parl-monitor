name: Provinces weekly
on:
  schedule:
    # Wednesday 10:00 UTC, retry 12:00. Chosen from the crons of every other
    # workflow (3 October 2026): sixteen share the parl-monitor-state group and
    # GitHub keeps only ONE run pending per group, so a third arrival cancels
    # the one already waiting. Wednesday holds only the day sweep (07:00,
    # 21:00), the division watch (18:00, 21:00), the EU day sweep (23:00) and,
    # on the 10th of the month, Member profiles (08:00). 10:00-18:00 is clear
    # even with the 3-5 hours of cron drift this repo has measured, and the
    # Canada weekly (Tuesday 10:00) is a day earlier. Every provincial
    # legislature has finished its sitting week by then except on a Wednesday
    # sitting, which the next run's lookback re-reads.
    #
    # Both slots on the same UTC day so the gate below can compare them.
    - cron: "0 10 * * 3"
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      # THE BACKFILL IS A DELIBERATE ACT, never the weekly's job (the rule
      # bought by the Bundestag IP block of 24 September 2026: backfills run
      # from CI, paced, and are announced). Name ONE province per dispatch:
      # each reads every session its legislature's own index lists whose
      # dates touch `since`, oldest first, on one clock. A run cut short by the
      # clock resumes where it stopped when dispatched again -- a record read
      # cleanly is never fetched again, nor a closed session's finished bill
      # page -- so repeat the dispatch until the summary says nothing is left.
      # A dispatch with `provinces` set runs the backfill INSTEAD of the
      # weekly steps (the weekly keeps its Wednesday slot).
      provinces:
        description: "Backfill these provinces (ab sk bc mb on nb nl qc ns); blank = the weekly. Backfills run on the Mac Mini first: jobs/prov-backfill.sh"
        type: string
        default: ""
      since:
        description: "Backfill from this date (YYYY-MM-DD)"
        type: string
        default: "2010-01-01"
      # The collection clock for the whole dispatch, shared equally among the
      # named provinces. The job is killed at 330 minutes; 300 leaves room for
      # the 5CA sheets and for publishing the store.
      minutes:
        description: "Collection clock for the dispatch, in minutes (max 300)"
        type: string
        default: "280"
      # THE SPEECHES BACKFILL IS A SEPARATE ACT (2 October 2026). Blank -- the
      # default -- leaves a `provinces` dispatch exactly the vote backfill it
      # always was. Set, the same dispatch backfills the named provinces'
      # Hansard SPEECHES from this date INSTEAD of their votes, on the same
      # clock (tools/prov_speeches.py --all-sessions). Backfill a province's
      # votes first: speakers are resolved against the roster that writes.
      speeches_since:
        description: "Backfill Hansard SPEECHES from this date instead of votes (YYYY-MM-DD; blank = no, the vote backfill)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time,
# repo-wide, or two bots race on parl-monitor.db.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this first, Wednesdays 11:00 London (tools/mini_run.sh prov-weekly;
  # 9 October 2026). Every cron here is the backup: skipped while the Mini
  # runs it and for 20 hours after.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: PROV_WEEKLY
      cover-hours: 20

  # THE SECOND SLOT IS A RETRY, NOT A SECOND PASS -- copied from ca-weekly.yml.
  # A skipped job bills nothing; an in-progress run counts as done; a hand
  # dispatch is never gated.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/prov-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The weekly's vote clocks add up to 125 minutes at most (Nova Scotia's
    # 15 were added with its collector) and its eight speech clocks to 85 (a
    # first run on an empty store is the one that spends them); a normal week
    # is a fraction of that. 260 leaves room for the pulls, the 5CA sheets
    # and the publish. The backfill gets the 330-minute maximum; its own
    # clock is capped at 300 below.
    timeout-minutes: ${{ inputs.provinces != '' && 330 || 260 }}
    env:
      # Unbuffered, or a step killed mid-run leaves an empty log.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        # ref: the branch TIP, not github.sha -- a queued run pinning a
        # pre-publish sha checks out a sidecar older than the store the run
        # ahead of it published.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        # pypdf is pinned, as in ca-weekly: the provincial PDF readers use its
        # layout fragments (src/prov_fetch.pdf_fragments).
        # cryptography: pypdf needs it for AES-encrypted PDFs (2 October 2026:
        # seven Alberta 31-1 bill texts failed "cryptography>=3.1 is required
        # for AES algorithm" and were classified on their titles only).
        run: pip install pyyaml pypdf==6.14.2 cryptography
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        # The vote collectors read with archive=False and add nothing to
        # data/raw (the URL on every row is the provenance); the speeches
        # steps archive each Hansard day they read (a speech is stored only
        # when it is on our ground, so the raw day is the record of the rest).
        # EVERY store publisher publishes the archive too
        # (tests/test_raw_state.py). It merges, never clobbers.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      #
      # ONE STEP PER PROVINCE, EACH ON ITS OWN CLOCK, EACH RUN WHATEVER THE ONE
      # BEFORE DID. A collector exits 1 on any gap, which fails its step (and so
      # the job, and the alert fires), but an Ontario 403 must never cost the
      # week's Quebec. SEQUENTIAL throughout: one SQLite file. --resume starts
      # each at the newest record it already holds, less 14 days, or at the
      # oldest record still owed. Crawl-delays are honoured per host inside
      # src/prov_fetch (legnb.ca asks for 10 s). The step timeout is the clock
      # plus a margin: one slow record can overrun a clock checked between
      # records.
      - name: Alberta
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 30
        run: python3 tools/prov_collect.py --prov ab --resume --budget-seconds 900 | tee /tmp/prov-ab.log
      - name: Saskatchewan
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 25
        run: python3 tools/prov_collect.py --prov sk --resume --budget-seconds 600 | tee /tmp/prov-sk.log
      - name: British Columbia
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 25
        run: python3 tools/prov_collect.py --prov bc --resume --budget-seconds 600 | tee /tmp/prov-bc.log
      - name: Manitoba
        # gov.mb.ca's robots.txt is read on every run: it bans named AI
        # crawlers, not us; if it ever names us, every fetch is a gap and we
        # stop (docs/canada-provinces-scope.md, "Decisions").
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 30
        run: python3 tools/prov_collect.py --prov mb --resume --budget-seconds 900 | tee /tmp/prov-mb.log
      - name: Ontario
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 30
        run: python3 tools/prov_collect.py --prov on --resume --budget-seconds 900 | tee /tmp/prov-on.log
      - name: New Brunswick
        # crawl-delay 10 on legnb.ca: the longest clock of the eight.
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 40
        run: python3 tools/prov_collect.py --prov nb --resume --budget-seconds 1200 | tee /tmp/prov-nb.log
      - name: Newfoundland and Labrador
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 25
        run: python3 tools/prov_collect.py --prov nl --resume --budget-seconds 600 | tee /tmp/prov-nl.log
      - name: Nova Scotia
        # crawl-delay 10 on nslegislature.ca, like legnb.ca. Reachable from a
        # runner, not from the laptop's VPN exit (docs/canada-provinces-scope.md).
        # Sittings first, then bills: on a short clock the divisions come first.
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 30
        run: python3 tools/prov_collect.py --prov ns --resume --budget-seconds 900 | tee /tmp/prov-ns.log
      - name: Quebec roster (read again every week)
        # The general election of 5 October 2026: election.html closes the
        # 43rd legislature's terms once it lists the poll, and the 44th
        # legislature's members arrive when depcir prints them. Read weekly,
        # whatever the roster's age, BEFORE the collector below (which then
        # finds it fresh). The 44th legislature's first session is collected
        # the week the Assembly lists it, and fails this run loudly until
        # CURRENT_SESSION in src/ingest/prov_qc.py is moved (prov_collect.py,
        # "WHICH SESSIONS").
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 20
        run: python3 tools/prov_collect.py --prov qc --roster-only --budget-seconds 600 | tee /tmp/prov-qc-roster.log
      - name: Quebec
        # The sitting index's month form is POSTed (approved by Christopher, 3
        # October 2026: "DO what is necessary"), throttled, honest UA, no retry.
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 30
        run: python3 tools/prov_collect.py --prov qc --resume --budget-seconds 900 | tee /tmp/prov-qc.log

      # --- Hansard speeches, one step per province (tools/prov_speeches.py) --
      # After the collectors: speakers resolve against the roster they just
      # stored. --resume starts at the newest Hansard day read, less 14 days;
      # a province with none read reads its last 60 days, never its backlog
      # (that is the speeches backfill below). Each step on its own clock,
      # each run whatever the one before did; legnb.ca's 10 s crawl-delay
      # makes New Brunswick the longest. Manitoba's robots.txt is honoured
      # as for its votes.
      - name: Speeches, Alberta
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 20
        run: python3 tools/prov_speeches.py --prov ab --resume --budget-seconds 600 | tee /tmp/prov-sp-ab.log
      - name: Speeches, Saskatchewan
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 20
        run: python3 tools/prov_speeches.py --prov sk --resume --budget-seconds 600 | tee /tmp/prov-sp-sk.log
      - name: Speeches, British Columbia
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 15
        run: python3 tools/prov_speeches.py --prov bc --resume --budget-seconds 480 | tee /tmp/prov-sp-bc.log
      - name: Speeches, Manitoba
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 20
        run: python3 tools/prov_speeches.py --prov mb --resume --budget-seconds 600 | tee /tmp/prov-sp-mb.log
      - name: Speeches, Ontario
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 20
        run: python3 tools/prov_speeches.py --prov on --resume --budget-seconds 600 | tee /tmp/prov-sp-on.log
      - name: Speeches, New Brunswick
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 25
        run: python3 tools/prov_speeches.py --prov nb --resume --budget-seconds 900 | tee /tmp/prov-sp-nb.log
      - name: Speeches, Newfoundland and Labrador
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 15
        run: python3 tools/prov_speeches.py --prov nl --resume --budget-seconds 480 | tee /tmp/prov-sp-nl.log
      - name: Speeches, Quebec
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 20
        run: python3 tools/prov_speeches.py --prov qc --resume --budget-seconds 600 | tee /tmp/prov-sp-qc.log

      # --- The judge, only on Christopher's yes ---------------------------------
      # tools/prov_triage.py runs only when the repository variable PROV_JUDGE
      # is 'on' (SPEND NEEDS A YES, 5 August 2026). It is not on: the backlog
      # on 9 October 2026 was 426 items, about $1.01 by --dry-run.
      - name: Judge (PROV_JUDGE)
        if: always() && steps.fetch.outcome == 'success' && vars.PROV_JUDGE == 'on' && (github.event_name == 'schedule' || inputs.provinces == '')
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/prov_triage.py --budget-seconds 1200 | tee /tmp/prov-triage.log

      # --- The backfill, only when dispatched with `provinces` ---------------
      - name: "Backfill: every listed session since the chosen date"
        if: always() && steps.fetch.outcome == 'success' && inputs.provinces != '' && inputs.speeches_since == ''
        timeout-minutes: 305
        env:
          PROVINCES: ${{ inputs.provinces }}
          SINCE: ${{ inputs.since }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          SINCE="${SINCE:-2010-01-01}"
          if ! [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::since must be YYYY-MM-DD, not '$SINCE'"; exit 1
          fi
          MINUTES="${MINUTES:-280}"
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]]; then MINUTES=280; fi
          if [ "$MINUTES" -gt 300 ]; then MINUTES=300; fi
          set -- $PROVINCES
          N=$#
          PER=$(( MINUTES * 60 / N ))
          echo "backfill: $N province(s) from $SINCE, ${PER}s of clock each"
          rc=0
          for p in "$@"; do
            case "$p" in
              ab|sk|bc|mb|on|nb|nl|qc|ns) ;;
              *) echo "::error::$p is not a built province (ab sk bc mb on nb nl qc ns)"; rc=1; continue ;;
            esac
            python3 tools/prov_collect.py --prov "$p" --all-sessions --since "$SINCE" \
              --budget-seconds "$PER" | tee -a "/tmp/prov-bf-$p.log" || rc=1
          done
          exit $rc
      - name: "Backfill: Hansard speeches since the chosen date"
        # Only with `speeches_since` set, and then INSTEAD of the vote backfill
        # above. Same rules: one clock shared by the named provinces, a day
        # read cleanly is never fetched again, re-dispatch until nothing is left.
        if: always() && steps.fetch.outcome == 'success' && inputs.provinces != '' && inputs.speeches_since != ''
        timeout-minutes: 305
        env:
          PROVINCES: ${{ inputs.provinces }}
          SPEECHES_SINCE: ${{ inputs.speeches_since }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          if ! [[ "$SPEECHES_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::speeches_since must be YYYY-MM-DD, not '$SPEECHES_SINCE'"; exit 1
          fi
          MINUTES="${MINUTES:-280}"
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]]; then MINUTES=280; fi
          if [ "$MINUTES" -gt 300 ]; then MINUTES=300; fi
          set -- $PROVINCES
          N=$#
          PER=$(( MINUTES * 60 / N ))
          echo "speeches backfill: $N province(s) from $SPEECHES_SINCE, ${PER}s of clock each"
          rc=0
          for p in "$@"; do
            case "$p" in
              ab|sk|bc|mb|on|nb|nl|qc) ;;
              *) echo "::error::$p has no Hansard reader (ab sk bc mb on nb nl qc)"; rc=1; continue ;;
            esac
            python3 tools/prov_speeches.py --prov "$p" --all-sessions --since "$SPEECHES_SINCE" \
              --budget-seconds "$PER" | tee -a "/tmp/prov-sp-bf-$p.log" || rc=1
          done
          exit $rc

      # --- 5CA evidence sheets, from the store (no fetches) -----------------
      # The stance file ships EMPTY, so every sheet is an evidence list that
      # places nobody; sheets go to data/5ca and are committed below.
      - name: 5CA sheets, Alberta
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov ab --all | tee /tmp/prov-5ca-ab.log
      - name: 5CA sheets, Saskatchewan
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov sk --all | tee /tmp/prov-5ca-sk.log
      - name: 5CA sheets, British Columbia
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov bc --all | tee /tmp/prov-5ca-bc.log
      - name: 5CA sheets, Manitoba
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov mb --all | tee /tmp/prov-5ca-mb.log
      - name: 5CA sheets, Ontario
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov on --all | tee /tmp/prov-5ca-on.log
      - name: 5CA sheets, New Brunswick
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov nb --all | tee /tmp/prov-5ca-nb.log
      - name: 5CA sheets, Newfoundland and Labrador
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov nl --all | tee /tmp/prov-5ca-nl.log
      - name: 5CA sheets, Nova Scotia
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov ns --all | tee /tmp/prov-5ca-ns.log
      - name: 5CA sheets, Quebec
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: python3 tools/prov_5ca.py --prov qc --all | tee /tmp/prov-5ca-qc.log
      - name: Write secrets file
        # The DM goes to Christopher alone (9 October 2026), as for the US and
        # Irish editions.
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: |
          cat > config/secrets.yaml <<EOF
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"
          slack_dm_user_id: U05LJP0BT61
          EOF
      - name: Edition and DM
        # tools/prov_monitor.py, after the 5CA sheets it quotes. SPEAKS ONCE
        # A DAY: an edition already committed for today (the Mini ran) is
        # rewritten, not resent.
        if: always() && steps.fetch.outcome == 'success' && (github.event_name == 'schedule' || inputs.provinces == '')
        run: |
          TODAY=$(date +%Y-%m-%d)
          if git ls-files --error-unmatch "editions/prov-monitor-$TODAY.md" >/dev/null 2>&1; then
            echo "edition for $TODAY already committed: rewriting it, not resending the DM"
            python3 tools/prov_monitor.py --edition | tee /tmp/prov-monitor.log
          else
            python3 tools/prov_monitor.py --edition --dm | tee /tmp/prov-monitor.log
          fi
      - name: "5CA sheets, the backfilled provinces"
        if: always() && steps.fetch.outcome == 'success' && inputs.provinces != ''
        env:
          PROVINCES: ${{ inputs.provinces }}
        run: |
          rc=0
          for p in $PROVINCES; do
            case "$p" in ab|sk|bc|mb|on|nb|nl|qc|ns) ;; *) continue ;; esac
            python3 tools/prov_5ca.py --prov "$p" --all | tee -a /tmp/prov-5ca-bf.log || rc=1
          done
          exit $rc

      - name: Health summary
        if: always()
        run: |
          {
            echo "## Provinces weekly"
            if [ -n "${{ inputs.provinces }}" ] && [ -n "${{ inputs.speeches_since }}" ]; then
              echo "speeches backfill: \`${{ inputs.provinces }}\` since ${{ inputs.speeches_since }}"
            elif [ -n "${{ inputs.provinces }}" ]; then
              echo "backfill: \`${{ inputs.provinces }}\` since ${{ inputs.since }}"
            fi
            echo '```'
            grep -hE "^prov-collect |^prov-speeches |^  store:|resuming from|nothing read for this province|no Hansard day read|session\(s\) listed|sessions not started|time budget|record cap|newer than CURRENT_SESSION" \
              /tmp/prov-*.log 2>/dev/null | head -90 || echo "(no summary lines)"
            echo '```'
            for f in /tmp/prov-ab.log /tmp/prov-sk.log /tmp/prov-bc.log /tmp/prov-mb.log /tmp/prov-on.log \
                     /tmp/prov-nb.log /tmp/prov-nl.log /tmp/prov-ns.log /tmp/prov-qc-roster.log /tmp/prov-qc.log /tmp/prov-bf-*.log \
                     /tmp/prov-sp-*.log; do
              [ -f "$f" ] || continue
              N=$({ grep -c "\[gap\]" "$f" 2>/dev/null || true; } | awk '{s+=$1} END {print s+0}')
              echo "- $(basename "$f" .log): $N gap(s)"
            done
            TOTAL=$({ grep -hc "\[gap\]" /tmp/prov-*.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log. A layout a parser cannot read is a gap, never a wrong vote."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/
          git diff --cached --quiet || git commit -m "Provinces weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          # A loop that falls out without a successful push must FAIL the
          # step: "for attempt ... done" with no check is how the 6 September
          # cascade started (origin left pointing at an old sidecar).
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

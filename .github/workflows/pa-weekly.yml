name: Panama weekly
on:
  schedule:
    # Saturday 17:30 UTC, retry 21:30 UTC (9 October 2026). The Asamblea's
    # plenary sits Monday to Thursday (an orden del dia for each day); by
    # Saturday the week's stage changes are in segLegis. 17:30 UTC is 12:30 in
    # Panama, which keeps UTC-5 all year. Moved from 12:00/16:00 at the
    # countries merge (10 October 2026): Portugal holds Saturday 16:00.
    - cron: "30 17 * * 6"
    - cron: "30 21 * * 6"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a Spanish taxonomy or watchlist-pa change: re-derive every
        # stored PA bill's areas, offline, before the pull.
        description: "Reclassify stored PA bills under the current taxonomy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Saturdays at 17:30 London (tools/mini_run.sh
  # pa-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 21:30 retry too: at 17:30 London in
  # summer it stamps 16:30 UTC, five hours before that slot, hence a grace
  # of 320 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: PA_WEEKLY
      grace-minutes: 320

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 17:30 backup already ran today, 21:30 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/pa-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Every run walks all of segLegis (47 postback pages, about five minutes
    # measured from the laptop on 9 October 2026) plus the stage histories of
    # bills whose stage moved and up to 15 orden-del-dia PDFs. Whether
    # sistemas.asamblea.gob.pa answers GitHub's runners is NOT yet measured
    # (docs/panama-scope.md); the Mini is the runtime that was measured.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml pypdf
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Bills, stage histories, orden del dia and deputies (Asamblea); publish
        # jobs/pa-weekly.sh is shared with the Mac Mini runner. It publishes
        # the raw archive and then the store itself (tools/raw_state.py,
        # then tools/db_state.py), only when the collector finished, gaps
        # included; the next step commits the sidecars.
        if: steps.fetch.outcome == 'success'
        env:
          # Latam alerts: a DM to Chris per watched or tier-1 item (latam_alerts.py)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PA_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/pa-weekly.sh | tee /tmp/pa-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Panama weekly"
            echo '```'
            grep -hE "pa-rollcalls:|store:|\[gap\]" /tmp/pa-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/pa-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        # Paired with the publish inside the job script -- an uncommitted
        # sidecar next to a published store is the divergence this repo has
        # already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ briefs/
          git diff --cached --quiet || git commit -m "Panama weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

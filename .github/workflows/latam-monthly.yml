name: Latam monthly
on:
  schedule:
    # The 1st of each month, 12:15 UTC, retry 15:15 UTC (10 October 2026).
    # Nothing else on main starts at :15, and the 1st falls on any weekday,
    # so the slot was chosen clear of every weekly's hour: the nearest are
    # Dominican Republic weekly (Sundays 12:00) and Bolivia weekly (Sundays
    # 12:30), and they only queue behind it in the parl-monitor-state group.
    - cron: "15 12 1 * *"
    - cron: "15 15 1 * *"
  workflow_dispatch:
    inputs:
      reclassify:
        description: "Reclassify the Venezuela and Nicaragua rows under the current taxonomy-es"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on the 1st at 13:15 London (tools/mini_run.sh
  # latam-monthly); these crons are the backup. The Mini's run must count for
  # the 15:15 retry too: in summer it stamps 12:15 UTC, three hours before
  # that slot, hence a grace of 200 minutes.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: LATAM_MONTHLY
      grace-minutes: 200

  # The second slot is a retry, not a second edition.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/latam-monthly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  edition:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # About 3 Venezuela list pages and 35 articles, and about 21 gazette
    # issues of 1.6 MB, all at one request every two seconds: under 5 minutes.
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Venezuela and Nicaragua checks, alerts, the edition and its DM, publish
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
          LATAM_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/latam-monthly.sh
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Latam monthly"
            echo '```'
            grep -hE "ve-news:|nic-gaceta:|latam-alerts:|edition:|dm:|\[gap\]" /tmp/ve-news.log /tmp/nic-gaceta.log /tmp/latam-*.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/ve-news.log /tmp/nic-gaceta.log /tmp/latam-*.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/
          git diff --cached --quiet || git commit -m "Latam monthly: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

name: NI Assembly weekly
on:
  schedule:
    # Saturday 06:00 UTC, retry 14:00. The Assembly sits Monday and Tuesday,
    # so by Saturday the week's divisions and Hansard components are
    # published, and the slot is clear of the Sunday pull (01:00-15:00 Sun),
    # the Monday publish (02:00-07:00 Mon) and the monthly UPR (3rd, 06:00).
    #
    # Deliberately SIMPLER than sunday-pull.yml, and why is worth recording:
    # no DST guard pair, because this is a pull with no publish attached and
    # nobody's morning depends on the London hour; no secrets file, because
    # every NI endpoint is keyless and the filter is regex, not triage; no
    # last-chance Monday slot, because a stale NI store costs a week of
    # watching-brief freshness, not a missed edition.
    - cron: "0 6 * * 6"
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# The same group as the Sunday pull and Monday publish: every workflow that
# commits data/ must serialise, or two bots race on parl-monitor.db -- the
# binary-merge conflict this repo has already paid for twice.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # A full run measured ~12 minutes cold (the question enrichment is one
    # throttled request per matched question); 30 covers checkout and pip too.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # ref: the branch TIP at checkout time, not github.sha. A dispatched
      # or scheduled run PINS github.sha when it is created; queued behind
      # another run in the parl-monitor-state group, it then checks out a
      # sidecar OLDER than the store that run just published, and the fetch
      # refuses the mismatch. Found 2026-08-31: a sunday-pull dispatched
      # while a publish ran died exactly this way -- the fourth known route
      # to store/sidecar divergence, and the first that needs no failure
      # anywhere. These workflows act on repo STATE, so the tip is always
      # the right thing to act on.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        # The store is a release asset, not a tracked file (88MB against a
        # 100MB hard push limit). The concurrency group above is what makes
        # this safe: one writer at a time, repo-wide.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        # One tar per day folder, only the folders whose content moved.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Pull questions, motions, diary and the forward Order Paper
        run: python3 tools/ni_pull.py | tee /tmp/ni-pull.log
      - name: Harvest divisions, member votes and Hansard
        # SEQUENTIAL with the step above on purpose: both write the same
        # SQLite file, and a concurrent run has already cost the roster once
        # ("database is locked", 2026-08-18).
        run: python3 tools/ni_divisions.py | tee /tmp/ni-divisions.log
      - name: Reclassify divisions from archived Hansard (offline)
        # Idempotent and free: reads data/raw, so a taxonomy regeneration
        # between weeks lands here without any extra fetching.
        run: python3 tools/ni_classify.py --apply | tee /tmp/ni-classify.log
      - name: Refresh the committee register
        if: always()
        # Four calls to organisations.asmx, a service this pipeline had never
        # used. Cheap, and the only place the store can answer "which NI
        # committees exist". It is NOT committee scrutiny: NI committee
        # transcripts are not in the Open Data API at all.
        run: python3 tools/ni_committees.py | tee /tmp/ni-committees.log
      - name: Pull open NI Executive consultations
        if: always()
        run: python3 tools/dg_consultations.py --nation ni | tee /tmp/ni-consultations.log
      - name: Apply the scored Assembly divisions
        if: always()
        # config/nia_votes.yaml -> ni_scored. Offline, no API calls. It runs HERE for
        # the same reason Holyrood's does: a scoring that exists only where
        # somebody ran the tool by hand is not published state, and the next
        # deploy pulls the CI store over the top of it.
        run: python3 tools/devolved_score.py --nation ni --apply | tee /tmp/ni-scored.log
      - name: Refresh the Assembly 5CA sheets
        if: always()
        # The tool was finished and ran NOWHERE (Christopher, 2026-09-04:
        # "Wire them"). It runs HERE for the same reason the scoring does:
        # a placement that exists only where somebody ran a tool by hand is
        # not published state. Offline, no API calls; a sheet that places
        # nobody is deleted and the run says so.
        run: python3 tools/devolved_5ca.py --nation ni | tee /tmp/ni-5ca.log
      - name: Health summary
        # The tools print their gaps and then exit 0, so a PARTIAL refresh is
        # a green tick with the detail buried in the log. Lifting the gap lines
        # into the run summary makes the Actions page answer "did this week
        # work" at a glance -- the same reasoning as printing gaps at all: a
        # feed that fails quietly is worse than one that fails loudly.
        if: always()
        run: |
          {
            echo "## NI weekly refresh"
            for f in pull divisions classify committees consultations scored 5ca; do
              echo "### $f"
              if [ -f "/tmp/ni-$f.log" ]; then
                echo '```'
                grep -E "gap\(s\)|no gaps|^  \* |stored|written|held in total|carry an issue area|consultation" \
                  "/tmp/ni-$f.log" | head -20 || echo "(no summary lines)"
                echo '```'
              else
                echo "step did not run"
              fi
            done
            # `|| true` is load-bearing under `bash -eo pipefail`: when
            # every feed reports "no gaps" this grep matches nothing and
            # exits 1, the assignment inherits that, and -e kills the
            # step. Fixing the last Senedd gap is what first made this
            # fail -- a health summary that breaks when everything is
            # healthy.
            TOTAL=$({ grep -ho "[0-9]\+ gap(s)" /tmp/ni-*.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            echo ""
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step logs. A gap is a"
              echo "source that did not answer, not a crash: the rest of the"
              echo "refresh still landed."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks
        # is the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # NEVER publish a store the pull refused: see the note in
        # monday-publish.yml. `always()` alone turned one sha mismatch
        # into a cascade across three workflows on 2026-08-28.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # PAIRED WITH THE PUBLISH ABOVE, and it must stay that way. With no
        # condition, this step is skipped whenever ANY earlier step failed --
        # one WAF-blocked feed was enough -- while the publish above still
        # uploaded a new store. New asset, uncommitted sidecar: the next run
        # of ANY workflow then refuses the store it just published. That is
        # where 2026-08-28's cascade actually began.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "NI weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # The sidecar MUST land: the store was already published above,
          # so a failed push leaves the release ahead of the repo -- the
          # same divergence a skipped commit caused, by another route.
          # 2026-08-28: this push lost a race with a human push and was
          # rejected, and the next run refused the store. Rebase and retry
          # rather than leave the two out of step.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

# ONE-OFF PROBE (9 October 2026): does senado.es answer GitHub's runners?
# Its Akamai edge refuses the laptop on every page, homepage included (403,
# honest UA and curl's default alike), the same shape as senate.gov in the
# US scope. Read-only, no secrets, no store: it saves what it fetched as an
# artifact for docs/spain-scope.md. Delete once the Senado question is settled.
name: Spain Senado probe
on:
  push:
    branches: [spain]
    paths: [.github/workflows/es-senado-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe senado.es
        shell: python3 {0}
        run: |
          import os, re, time, urllib.request, urllib.error
          UA = "CitizenGO-ParlMonitor/1.0 (contact: cjoyce@citizengo.net)"
          os.makedirs("out", exist_ok=True)
          seen = set()
          def get(url, name):
              if url in seen:
                  return ""
              seen.add(url)
              time.sleep(1.5)
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read()
                      code = r.status
              except urllib.error.HTTPError as e:
                  body, code = e.read(), e.code
              except Exception as e:
                  print("PROBE ERR", url, e)
                  return ""
              with open("out/" + name, "wb") as fh:
                  fh.write(body)
              print("PROBE", code, len(body), url, "::", body[:120].decode("utf-8", "replace").replace("\n", " "))
              return body.decode("utf-8", "replace") if code == 200 else ""
          home = get("https://www.senado.es/web/index.html", "home.html")
          cat = get("https://www.senado.es/web/relacionesciudadanos/datosabiertos/catalogodatos/index.html", "catalogo.html")
          links = sorted(set(re.findall(r'href="([^"]+)"', cat)))
          print("PROBE catalogue links:", len(links))
          for l in links:
              print("LINK", l)
          n = 0
          for l in links:
              if "ficopendataservlet" in l or l.lower().endswith(".xml") or "datosabiertos" in l:
                  url = l if l.startswith("http") else "https://www.senado.es" + (l if l.startswith("/") else "/web/relacionesciudadanos/datosabiertos/catalogodatos/" + l)
                  url = url.replace("&amp;", "&")
                  n += 1
                  if n > 40:
                      break
                  get(url, "f%02d_" % n + re.sub(r"[^A-Za-z0-9]+", "_", url)[-80:])
          for t in range(1, 13):
              get("https://www.senado.es/web/ficopendataservlet?tipoFich=%d&legis=15" % t, "tipofich_%02d.xml" % t)
          get("https://www.senado.es/web/actividadparlamentaria/sesionesplenarias/pleno/rwdsesionespleno/index.html", "plenos.html")
      - uses: actions/upload-artifact@v4
        with:
          name: senado-probe
          path: out/
          retention-days: 7

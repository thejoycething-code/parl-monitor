name: Mini check

# The gate in front of every scheduled workflow (docs/mac-mini-runner.md,
# step 3). The Mac Mini runs each job first, at the slot's time, and records
# it in the repo variable MINI_LAST_<JOB> after a clean run (tools/mini_run.sh).
# GitHub's own cron starts hours late or not at all, so its run is only the
# backup: it goes ahead only when the Mini has NOT run since the slot it was
# scheduled for. The rules, and their tests, are in tools/mini_check.py.
#
#     jobs:
#       mini-check:
#         uses: ./.github/workflows/mini-check.yml
#         with: { job: COVERAGE }
#       coverage:
#         needs: mini-check
#         if: needs.mini-check.outputs.run == 'true'
#
# A hand dispatch always runs, and when in doubt the backup runs.
on:
  workflow_call:
    inputs:
      job:
        description: "Job name as in MINI_LAST_<JOB>, e.g. COVERAGE"
        required: true
        type: string
      grace-minutes:
        description: "How long before the UTC slot a Mini run still counts (launchd keeps London time)"
        type: number
        default: 75
      window-hours:
        description: "Only for a cron with no fixed hours: how recent counts as this slot"
        type: number
        default: 20
    outputs:
      run:
        description: "'true' when the real job should run"
        value: ${{ jobs.check.outputs.run }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/mini_check.py
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LAST: ${{ vars[format('MINI_LAST_{0}', inputs.job)] }}
        run: >-
          python3 tools/mini_check.py --job "${{ inputs.job }}"
          --event "$EVENT" --schedule "$SCHEDULE" --last "$LAST"
          --grace-minutes ${{ inputs.grace-minutes }}
          --window-hours ${{ inputs.window-hours }}

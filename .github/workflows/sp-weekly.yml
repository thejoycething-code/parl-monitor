name: Holyrood weekly

on:
  schedule:
    # Friday 06:00 UTC, retry 14:00. Holyrood sits Tuesday-Thursday, so
    # Friday morning catches the week's questions, motions and divisions.
    # Clear of the NI slots (Sat 06:00/14:00), the Sunday pull (01:00-15:00
    # Sun) and the Monday publish (02:00-07:00 Mon). Two slots because the
    # Actions scheduler drops slots (it lost a Sunday on 9-10 Aug); a pull
    # with nothing attached needs no DST guard pair.
    - cron: "0 6 * * 5"
    - cron: "0 14 * * 5"
  workflow_dispatch:

# The same group as every workflow that commits state: two bots pushing the
# same files is a race, not a redundancy.
# Without contents: write the GITHUB_TOKEN is read-only and the Commit state
# step's push fails -- ni-weekly had this and sp-weekly launched without it,
# which (with the sunset checkout@v4) is why day one's two slots produced
# nothing. Copied from the proven workflow rather than reasoned afresh.
permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        # The store is a release asset, not a tracked file (88MB against a
        # 100MB hard push limit). The concurrency group above is what makes
        # this safe: one writer at a time, repo-wide.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Pull roster, questions and motions
        run: python3 tools/sp_pull.py | tee /tmp/sp-pull.log
      - name: Harvest divisions and member votes
        if: always()
        run: python3 tools/sp_divisions.py | tee /tmp/sp-divisions.log
      - name: Harvest committee scrutiny
        # Current year only -- the backfill to 2024 ran once on 2026-08-22;
        # upserts make re-runs safe.
        if: always()
        run: python3 tools/sp_committees.py | tee /tmp/sp-committees.log
      - name: Pull open Scottish Government consultations
        if: always()
        run: python3 tools/dg_consultations.py --nation scotland | tee /tmp/sp-consultations.log
      - name: Health summary
        # Gap lines lifted into the run summary so the Actions page answers
        # "did this week work" at a glance -- same reasoning as ni-weekly.
        if: always()
        run: |
          {
            echo "## Holyrood weekly refresh"
            for f in pull divisions committees consultations; do
              echo "### $f"
              if [ -f "/tmp/sp-$f.log" ]; then
                echo '```'
                grep -E "gap|no gaps|stored|match our areas|division|member|contribution|consultation" \
                  "/tmp/sp-$f.log" | head -15 || echo "(no summary lines)"
                echo '```'
              else
                echo "step did not run"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the store
        # NEVER publish a store the pull refused: see the note in
        # monday-publish.yml. `always()` alone turned one sha mismatch
        # into a cascade across three workflows on 2026-08-28.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # PAIRED WITH THE PUBLISH ABOVE, and it must stay that way. With no
        # condition, this step is skipped whenever ANY earlier step failed --
        # one WAF-blocked feed was enough -- while the publish above still
        # uploaded a new store. New asset, uncommitted sidecar: the next run
        # of ANY workflow then refuses the store it just published. That is
        # where 2026-08-28's cascade actually began.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "bot@parl-monitor.invalid"
          git add data/raw data/parl-monitor.db.json
          git diff --cached --quiet || git commit -m "Holyrood weekly refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin main

name: Probe legislature hosts

# 3 October 2026. Nova Scotia (TCP reset), PEI (Radware CAPTCHA) and Yukon
# (Cloudflare challenge) refused the scoping probe, which ran from a VPN exit
# in Dublin. This asks the same pages from a GitHub runner -- the IP the
# collectors really use -- and prints what came back.
#
# READ-ONLY: no store, no commit, no secrets, nothing published. GET only,
# with the repo's honest User-Agent, robots.txt honoured (its Crawl-delay
# too: 10 s on nslegislature.ca), at least `delay` seconds between requests
# to a host. A bot challenge, a 403/429, or a robots.txt that does not answer
# STOPS that host for the run (tools/probe_hosts.py): it is recorded, never
# solved or worked around. What was fetched is uploaded as a workflow
# artifact (kept 7 days), for fixtures.
#
# 2 October 2026: this is how the Nova Scotia collector (src/ingest/prov_ns.py)
# was built -- the laptop's VPN exit is reset by nslegislature.ca -- and how
# PEI was found to challenge a runner too (docs/canada-provinces-scope.md).
# Dispatch with `urls` (and optionally `follow`, a regex of links to queue).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to fetch first"
        type: string
        default: "https://nslegislature.ca/ https://nslegislature.ca/legislative-business/journals https://www.assembly.pe.ca/ https://www.assembly.pe.ca/legislative-business/house-records https://yukonassembly.ca/"
      follow:
        description: "Regex: also fetch links on those pages that match it (blank = none)"
        type: string
        default: ""
      max:
        description: "Most pages fetched in all"
        type: string
        default: "10"
      delay:
        description: "Seconds between requests to one host (at least 2)"
        type: string
        default: "2"
      show_links:
        description: "Links printed per seed page (0 for a long list of seeds)"
        type: string
        default: "150"

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml pypdf==6.14.2
      - name: Ask each host, politely
        env:
          URLS: ${{ inputs.urls }}
          FOLLOW: ${{ inputs.follow }}
          MAX: ${{ inputs.max }}
          DELAY: ${{ inputs.delay }}
          SHOW_LINKS: ${{ inputs.show_links }}
        run: |
          if ! [[ "$MAX" =~ ^[0-9]+$ ]]; then MAX=10; fi
          # 250 pages at a 10 s Crawl-delay is 42 minutes: inside the timeout.
          if [ "$MAX" -gt 250 ]; then MAX=250; fi
          if ! [[ "$DELAY" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then DELAY=2; fi
          if ! [[ "$SHOW_LINKS" =~ ^[0-9]+$ ]]; then SHOW_LINKS=150; fi
          python3 tools/probe_hosts.py --out probe-out --max "$MAX" --delay "$DELAY" \
            --show-links "$SHOW_LINKS" --follow "$FOLLOW" $URLS | tee probe-out.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: |
            probe-out
            probe-out.log
          retention-days: 7

# ONE-OFF SCOPING PROBE (9 October 2026): does Mexico's Congress answer
# GitHub's runners? diputados.gob.mx times out from the laptop and
# senado.gob.mx serves it an Incapsula challenge. Read-only: no secrets, no
# store, no commit. Each line of ops/mx-probe-args.txt is one run of
# tools/mx_probe.py; the raw archive is uploaded as an artifact.
# Delete once the Mexico collector is built and dry-run on CI.
name: Mexico probe
on:
  push:
    branches: [mexico]
    paths: [.github/workflows/mx-probe.yml, ops/mx-probe-args.txt, ops/mx-probe-collect]
permissions:
  contents: read
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Collector, live, into a scratch store (never the real one)
        if: hashFiles('ops/mx-probe-collect') != ''
        run: |
          python3 tools/mx_rollcalls.py --dry-run
          rc=0
          python3 tools/mx_rollcalls.py --db /tmp/mx-scratch.db --budget-seconds 2100 2>&1 | tee collector.log || rc=$?
          echo "collector exit $rc"
          mkdir -p scratch && cp /tmp/mx-scratch.db scratch/ || true
      - name: TLS chains (why urllib refuses sitl, web and sil)
        run: |
          for h in sitl.diputados.gob.mx web.diputados.gob.mx sil.gobernacion.gob.mx gaceta.diputados.gob.mx; do
            echo "### $h"
            echo | timeout 20 openssl s_client -connect $h:443 -servername $h -showcerts 2>&1 | grep -E "^ *[0-9] s:|^ *i:|Verify return|verify error" | head -12 || true
            curl -sS -A "CitizenGO-ParlMonitor/1.0 (contact: cjoyce@citizengo.net)" -m 30 -o /dev/null -w "curl %{http_code} %{size_download}\n" https://$h/ || true
          done 2>&1 | tee tls.log
      - name: Probe
        run: |
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue;; esac
            echo "### $line"
            eval "python3 tools/mx_probe.py $line" || true
          done < ops/mx-probe-args.txt 2>&1 | tee probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mx-probe
          path: |
            data/raw
            probe.log
            tls.log
            collector.log
            scratch
          retention-days: 7

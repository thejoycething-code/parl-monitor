name: Australia weekly
on:
  schedule:
    # Friday 02:00 UTC, retry 04:00 UTC (9 October 2026). Canberra sits
    # Monday to Thursday; Friday 02:00 UTC is 13:00 in Canberra (AEDT) or
    # 12:00 (AEST), after OpenAustralia's daily 09:05 Canberra parse has
    # picked up Thursday's Hansard. Clear of every other workflow's cron:
    # Friday holds 05:30, 06:00, 07:00, 10:00, 12:00, 13:00-17:00, 21:00 and
    # 23:00 only, and Friday 06:00-14:00 is kept free for the Ireland weekly.
    - cron: "0 2 * * 5"
    - cron: "0 4 * * 5"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a taxonomy or watchlist-au change: re-derive every stored AU
        # bill's and division's areas, offline, before the pull.
        description: "Reclassify stored AU bills and divisions under the current taxonomy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Fridays at 02:00 London (tools/mini_run.sh
  # au-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 04:00 retry too: at 02:00 London in
  # summer it stamps 01:00 UTC, three hours before that slot, hence a grace
  # of 200 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: AU_WEEKLY
      grace-minutes: 200

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 02:00 backup already ran today, 04:00 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/au-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The first run reads every sitting day of the 48th Parliament: 158 day
    # files (86 House, 72 Senate) at one a second, 6.4 minutes from the
    # laptop on 9 October 2026 and 31 MB gzipped in the raw archive. Later
    # weeks read only the days that are new or that OpenAustralia re-parsed.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Collect, judge (if on), write the edition and DM
        # jobs/au-weekly.sh is shared with the Mac Mini runner. Here it does
        # not publish (AU_PUBLISH=false); the two publish steps below run
        # under the commit step's condition, as in every store workflow. The
        # paid API judge runs only when the repository variable AU_JUDGE is
        # 'on' (SPEND NEEDS A YES, 5 August 2026); it is the alternative and
        # off. The free default is the session judge, Mini only
        # (jobs/au-session-judge.sh, Fridays 03:10). The DM goes to
        # Christopher alone (decided 9 October 2026).
        if: always() && steps.fetch.outcome == 'success'
        env:
          AU_PUBLISH: "false"
          AU_RECLASSIFY: ${{ inputs.reclassify }}
          AU_JUDGE: ${{ vars.AU_JUDGE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
        run: bash jobs/au-weekly.sh | tee /tmp/au-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Australia weekly"
            echo '```'
            grep -hE "au-rollcalls:|au-triage:|store:|PHID|edition:|dm:|\[gap\]" /tmp/au-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/au-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/ partner_site/ docs/
          git diff --cached --quiet || git commit -m "Australia weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

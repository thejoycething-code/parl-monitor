name: Day sweep

# Sweep Hansard for the sitting days not yet swept, and DM the day's debates on
# our issues. Speeches only.
#
# WHY DAILY, AND WHY THIS REPLACES PART OF THE SUNDAY PULL. The weekly sweep
# searched all 55 terms over the week just ENDED, every week -- re-searching
# ground it had covered, and never covering the current day, because a week
# that has not ended is not in its window. Measured on 2026-09-07, the day of
# the surrogacy debate: Hansard held 25 contributions from 14 members and the
# ledger held 2. The unit of new data is the sitting day, so a day is swept
# once and `sweep_log` remembers it -- recess days included, so they are never
# re-checked. The weekly pass survives as a REPAIR pass and skips the days
# this job has already done.
#
# WHY TWO TIMES A DAY. Hansard publishes a few hours after the House rises and
# revises text afterwards. 21:00 UTC catches most sitting days; 07:00 the next
# morning catches the late text and anything the evening run missed. The
# watermark makes the second run nearly free: it re-checks only days within
# two days of today, and skips everything else without a call.
#
# WHY NOT WEEKENDS. pending_days skips Saturday and Sunday without a request,
# so a weekend run would do nothing but pull and push the store. Friday's
# evening run and Monday's morning run cover the boundary between them.
#
# COST. 55 free Hansard searches per pending day, plus one sections-for-day
# call per House. No Anthropic spend: scoring the rows this writes is a
# separate, budgeted job (tools/score_stance.py).
on:
  schedule:
    - cron: "0 21 * * 1-5"     # sitting evenings, after the Houses rise
    - cron: "0 7 * * 2-6"      # next morning, for text Hansard published late
  workflow_dispatch:
    inputs:
      since:
        description: "First day to consider (YYYY-MM-DD; default 3 days ago)"
        required: false
        default: ""
      radar_only:
        description: "Find the debates, write no ledger rows"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# The same lock as every stateful workflow: this writes the store.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # MEASURED against the local run: 55 term searches per day at src/http's
    # per-host throttle is about four minutes a day, and a catch-up of three
    # days took twelve. Twenty-five minutes covers a Monday-morning run that
    # finds Friday, the weekend boundary and Monday itself pending, with room
    # for the retry a refused term triggers.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        # The branch TIP, not github.sha: a run queued behind another in the
        # parl-monitor-state group would otherwise check out a sidecar older
        # than the store that run published, and the fetch refuses it.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Which days are pending
        run: |
          ARGS=""
          if [ -n "${{ inputs.since }}" ]; then ARGS="--since ${{ inputs.since }}"; fi
          python3 tools/day_sweep.py $ARGS --dry-run | tee /tmp/pending.log
      - name: Sweep them
        # The DM goes only when a debate clears the floor; day_sweep says so
        # rather than sending an empty reading.
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
        run: |
          ARGS="--dm"
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          if [ "${{ inputs.radar_only }}" = "true" ]; then ARGS="$ARGS --radar-only"; fi
          python3 tools/day_sweep.py $ARGS 2>&1 | tee /tmp/sweep.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Day sweep"
            echo '```'
            grep -E "pending|did not sit|ledger row|worth a pack|gap" /tmp/sweep.log | tail -30 \
              || tail -10 /tmp/pending.log || echo "(no summary lines)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store citing payloads the archive lacks is the
        # worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # NEVER publish a store the pull refused: `always()` alone turned one
        # sha mismatch into a cascade across three workflows on 2026-08-28.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # PAIRED WITH THE PUBLISH ABOVE and it must stay that way: a skipped
        # commit after a completed publish leaves a new asset with an
        # uncommitted sidecar, and the next run of ANY workflow then refuses
        # the store it just published.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "bot@parl-monitor.invalid"
          git add data/parl-monitor.db.json data/raw.json
          git diff --cached --quiet || git commit -m "Day sweep: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push origin main && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

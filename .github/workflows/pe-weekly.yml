name: Peru weekly
on:
  schedule:
    # Saturday 17:00 UTC, retry 20:00 UTC (9 October 2026). Lima (UTC-5, no
    # summer time) sits in plenary Tuesday to Thursday, often past midnight
    # UTC, and the chambers upload the provisional vote records a day or two
    # later: Saturday 12:00 in Lima reads the whole week. Clear of every
    # other workflow's cron: Saturday holds 03:00, 05:00, 05:30, 06:00,
    # 07:00, 08:00, 09:00, 10:00, 11:00, 14:00, 18:00 and 23:00 only.
    - cron: "0 17 * * 6"
    - cron: "0 20 * * 6"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a taxonomy or watchlist-pe change (and the day taxonomy-es
        # lands): re-derive every stored PE proyecto's and vote's areas,
        # offline, before the pull.
        description: "Reclassify stored PE proyectos and votes under the current taxonomy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Saturdays at 16:00 London (tools/mini_run.sh
  # pe-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 20:00 retry too: at 16:00 London in
  # summer it stamps 15:00 UTC, five hours before that slot, hence a grace
  # of 330 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: PE_WEEKLY
      grace-minutes: 330

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 17:00 backup already ran today, 20:00 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/pe-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The first run reads both chambers' members, every proyecto of the
    # 2026-2031 Congress (572 on 9 October 2026, one request per chamber)
    # and every vote record PDF in the two media libraries (55 files, most
    # of them scans with nothing to read). Measured from the laptop: see
    # docs/peru-scope.md. Later weeks read only the files that are new.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        # pypdf pinned as in prov-weekly.yml: the vote records are PDFs.
        run: pip install pyyaml pypdf==6.14.2
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Members, proyectos and plenary votes (2026-2031)
        # jobs/pe-weekly.sh is shared with the Mac Mini runner. Here it only
        # collects (PE_PUBLISH=false); the two publish steps below run under
        # the commit step's condition, as in every store workflow.
        if: always() && steps.fetch.outcome == 'success'
        env:
          # Latam alerts: a DM to Chris per watched or tier-1 item (latam_alerts.py)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PE_PUBLISH: "false"
          PE_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/pe-weekly.sh | tee /tmp/pe-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Peru weekly"
            echo '```'
            grep -hE "pe-rollcalls:|store:|\[gap\]" /tmp/pe-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/pe-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ profiles/
          git diff --cached --quiet || git commit -m "Peru weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

name: Bolivia weekly
on:
  schedule:
    # Sunday 12:30 UTC, retry 16:30 UTC (9 October 2026). La Paz (UTC-4, no
    # summer time) sits in plenary through the week and both chambers post
    # their bill records on weekdays, so Sunday reads the whole week. Clear
    # of every other workflow's cron: Sunday holds 01:00, 02:00, 06:00,
    # 15:00, 19:00 and 21:00 only.
    - cron: "30 12 * * 0"
    - cron: "30 16 * * 0"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a taxonomy or watchlist-bo change (and the day taxonomy-es
        # lands): re-derive every stored BO bill's areas, offline, before
        # the pull.
        description: "Reclassify stored BO bills under the current taxonomy"
        type: boolean
        default: false
      backfill:
        # Once, on the first run: every Diputados bill record since 2020
        # (5,352 on 9 October 2026, 55 pages), not only the current year.
        description: "Backfill every Diputados bill record since 2020"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Sundays at 11:00 London (tools/mini_run.sh
  # bo-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 16:30 retry too: at 11:00 London in
  # summer it stamps 10:00 UTC, six and a half hours before that slot, hence
  # a grace of 420 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: BO_WEEKLY
      grace-minutes: 420

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 17:00 backup already ran today, 20:00 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/bo-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A weekly run is about 25 requests at one a second (36 seconds from the
    # laptop on 9 October 2026); a backfill adds 55 pages. The servers are
    # small and once stalled for minutes (docs/bolivia-scope.md), so the
    # timeout leaves room for retries.
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Members and proyectos de ley (both chambers)
        # jobs/bo-weekly.sh is shared with the Mac Mini runner. Here it only
        # collects (BO_PUBLISH=false); the two publish steps below run under
        # the commit step's condition, as in every store workflow.
        if: always() && steps.fetch.outcome == 'success'
        env:
          # Latam alerts: a DM to Chris per watched or tier-1 item (latam_alerts.py)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BO_PUBLISH: "false"
          BO_RECLASSIFY: ${{ inputs.reclassify }}
          BO_BACKFILL: ${{ inputs.backfill }}
        run: bash jobs/bo-weekly.sh | tee /tmp/bo-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Bolivia weekly"
            echo '```'
            grep -hE "bo-rollcalls:|store:|\[gap\]" /tmp/bo-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/bo-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ briefs/
          git diff --cached --quiet || git commit -m "Bolivia weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

name: Honduras weekly
on:
  schedule:
    # Sunday 14:00 UTC, retry 17:00 UTC (9 October 2026). The Congreso
    # Nacional sits Tuesday to Thursday; its press office publishes through
    # Friday, and La Gaceta posts issues one to two weeks after their date,
    # so a Sunday read loses nothing. Clear of every other workflow's cron
    # seen on main and the country branches: Sunday holds 01:00, 02:00,
    # 04:00, 06:00, 07:00, 09:00, 12:00, 12:30, 15:00, 16:30, 19:00 and
    # 21:00.
    - cron: "0 14 * * 0"
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a taxonomy-es or watchlist-hn change: re-derive every stored
        # HN row's areas, offline, before the pull.
        description: "Reclassify stored HN rows under the current taxonomy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Sundays at 14:00 London (tools/mini_run.sh
  # hn-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 17:00 retry too: at 14:00 London in
  # summer it stamps 13:00 UTC, four hours before that slot, hence a grace
  # of 260 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: HN_WEEKLY
      grace-minutes: 260

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 14:00 backup already ran today, 17:00 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/hn-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The first run backfills about 360 session agendas, the press releases
    # since 25 January 2026 and La Gaceta since January, cut at 40 minutes by
    # the collector's own budget and resumed by the next run
    # (docs/honduras-scope.md). Later weeks are a few dozen requests.
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Deputies, agendas, expedientes, press releases, Gaceta; publish
        # jobs/hn-weekly.sh is shared with the Mac Mini runner. It publishes
        # the raw archive and then the store itself (tools/raw_state.py,
        # then tools/db_state.py), only when the collector finished, gaps
        # included; the next step commits the sidecars.
        if: steps.fetch.outcome == 'success'
        env:
          # Latam alerts: a DM to Chris per watched or tier-1 item (latam_alerts.py)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HN_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/hn-weekly.sh | tee /tmp/hn-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Honduras weekly"
            echo '```'
            grep -hE "hn-rollcalls:|store:|\[gap\]" /tmp/hn-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/hn-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        # Paired with the publish inside the job script -- an uncommitted
        # sidecar next to a published store is the divergence this repo has
        # already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ briefs/
          git diff --cached --quiet || git commit -m "Honduras weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

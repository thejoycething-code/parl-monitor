name: Failure alert

# ONE watcher, so the workflows it watches hold no Slack credential.
#
# The devolved weeklies are watching briefs whose separation rule is
# structural, not merely stated: their workflows contain no Slack token, no
# secrets file and no publish step, and tests assert it. Adding a failure
# step to each would have put a Slack token into all three -- the exact
# capability the rule exists to withhold. A workflow_run watcher keeps the
# credential in one place that touches no parliamentary data at all.
on:
  workflow_run:
    workflows:
      - "Sunday pull"
      - "Monday publish"
      - "NI Assembly weekly"
      - "Holyrood weekly"
      - "Senedd weekly"
      - "UPR monthly"
      - "UN calls weekly"
      - "Historic backfill"
      - "Score stance"
      # EU weekly was missing from this list from the day it was written:
      # the one pipeline nobody would have been told about. Coverage watch
      # is here because an alert that only fires on a CRASH cannot see a
      # feed that quietly stopped answering (2026-09-04).
      - "EU weekly"
      # The EP swept per sitting day (17 Sept 2026). It is the EU's primary
      # source of roll calls now, the way the day sweep is Hansard's: a
      # silent failure here means a plenary is missed, which is exactly what
      # happened on 15 September when the weekly was cancelled and nothing
      # said so for two days.
      - "EU day sweep"
      - "Coverage watch"
      # Member profiles pulls service history, party spells and contact
      # details for every chamber. It was in neither this list nor
      # coverage.py: the same omission, twice over (2026-09-04).
      - "Member profiles"
      # The day sweep is the ledger's PRIMARY source of speeches since
      # 2026-09-09; the weekly pass only repairs what it missed. A silent
      # failure here would starve the ledger and the radar at once.
      - "Day sweep"
      # The same-day division brief. A silent failure here on a Friday
      # afternoon is the whole point missed (2026-09-07).
      - "Division watch"
      # Sign-off to site on the day of a division; a silent failure here
      # leaves the supporter emails pointing at Monday's pages.
      - "Deploy tracker"
    types: [completed]

permissions:
  contents: read

jobs:
  alert:
    # A timeout is reported as "cancelled" (19 Sept 2026: the EU weekly, twice,
    # and the 15 Sept plenary before that), so a watcher that fires only on
    # 'failure' sleeps through the failures that matter most.
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: DM the failure
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python3 tools/alert_failure.py

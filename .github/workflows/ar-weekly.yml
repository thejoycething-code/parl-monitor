name: Argentina weekly
on:
  schedule:
    # Saturday 03:00 UTC, retry 05:00 UTC (9 October 2026). Both chambers of
    # the National Congress sit mainly on Wednesdays and Thursdays, and the
    # Senate posts each acta the same night; Saturday 03:00 UTC is midnight
    # in Buenos Aires (UTC-3, no daylight saving). Clear of every cron on
    # main: Saturday holds 06:00, 07:00, 10:00, 14:00, 18:00 and 23:00 only.
    - cron: "0 3 * * 6"
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      reclassify:
        # After config/taxonomy-es.yaml or watchlist-ar changes: re-derive
        # every stored AR expediente's and division's areas, offline.
        description: "Reclassify stored AR expedientes and divisions under the current terms"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Saturdays at 03:00 London (tools/mini_run.sh
  # ar-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 05:00 retry too: at 03:00 London in
  # summer it stamps 02:00 UTC, three hours before that slot, hence a grace
  # of 200 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: AR_WEEKLY
      grace-minutes: 200

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 03:00 backup already ran today, 05:00 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/ar-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # datos.hcdn.gob.ar turns away a client whose query hangs, so the
    # Diputados register is read a calendar month per request, at most seven
    # a run, newest first: the backfill to March 2024 (32 months) finishes
    # over about eight Saturdays, each reading the last 45 days first. The
    # Senate side reads the current year's actas, one detail page per new
    # acta. The 2024 and 2025 Senate actas are a one-off backfill by hand
    # (--years 2024 2025 2026), as measured in docs/argentina-scope.md.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Members, expedientes and Senate roll calls
        # jobs/ar-weekly.sh is shared with the Mac Mini runner. Here it only
        # collects (AR_PUBLISH=false); the two publish steps below run under
        # the commit step's condition, as in every store workflow.
        if: always() && steps.fetch.outcome == 'success'
        env:
          AR_PUBLISH: "false"
          AR_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/ar-weekly.sh | tee /tmp/ar-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Argentina weekly"
            echo '```'
            grep -hE "ar-rollcalls:|store:|\[gap\]" /tmp/ar-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/ar-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Argentina weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

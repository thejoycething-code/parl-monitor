name: Colombia weekly
on:
  schedule:
    # Thursday 09:30 UTC, retry 11:30 UTC (9 October 2026). Congress sits in
    # plenary on Tuesdays and Wednesdays; 09:30 UTC Thursday is 04:30 in
    # Bogotá, after both. Moved half an hour from 09:00/11:00 at the
    # countries merge (10 October 2026): Chile holds those Thursday slots.
    - cron: "30 9 * * 4"
    - cron: "30 11 * * 4"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a taxonomy-es or watchlist-co change: re-derive every stored
        # CO bill's and division's areas, offline, before the pull.
        description: "Reclassify stored CO bills and divisions under the current taxonomy and watchlist"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Thursdays at 09:30 London (tools/mini_run.sh
  # co-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 11:30 retry too: at 09:30 London in
  # summer it stamps 08:30 UTC, three hours before that slot, hence a grace
  # of 200 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: CO_WEEKLY
      grace-minutes: 200

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 09:30 backup already ran today, 11:30 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/co-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A whole run read 1,683 bills, 181 representatives' attendance and
    # 16,587 Senate positions in about 40 seconds from the laptop on
    # 9 October 2026 (28 requests at one a second per host).
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Bills, attendance and Senate roll calls (Congress 2026-2030)
        # jobs/co-weekly.sh is shared with the Mac Mini runner. Here it only
        # collects (CO_PUBLISH=false); the two publish steps below run under
        # the commit step's condition, as in every store workflow.
        if: always() && steps.fetch.outcome == 'success'
        env:
          # Latam alerts: a DM to Chris per watched or tier-1 item (latam_alerts.py)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CO_PUBLISH: "false"
          CO_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/co-weekly.sh | tee /tmp/co-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Colombia weekly"
            echo '```'
            grep -hE "co-rollcalls:|store:|\[gap\]" /tmp/co-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/co-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Colombia weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

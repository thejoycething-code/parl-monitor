name: Belgium weekly
on:
  schedule:
    # Saturday 02:30 UTC, retry 04:30 UTC (9 October 2026). The Chamber votes
    # in plenary on Thursday afternoons and the sitting's record is on
    # lachambre.be by the evening, so Saturday morning has the week's votes
    # with a day to spare. Moved from 03:00/05:00 at the countries merge
    # (10 October 2026): Austria holds those Saturday slots.
    - cron: "30 2 * * 6"
    - cron: "30 4 * * 6"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a watchlist-be change: re-apply it to every stored dossier
        # and division, offline, before the pull.
        description: "Re-apply config/watchlist-be.yaml to stored BE dossiers and divisions"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Saturdays at 02:30 London (tools/mini_run.sh
  # be-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 04:30 retry too: at 02:30 London in
  # summer it stamps 01:30 UTC, three hours before that slot, hence a grace
  # of 200 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: BE_WEEKLY
      grace-minutes: 200

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 02:30 backup already ran today, 04:30 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/be-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # lachambre.be asks for five seconds between requests (robots.txt), so
    # the first run is long: about 143 sitting records and 39 index pages,
    # then dossier pages until the 45-minute budget (tools/be_rollcalls.py)
    # stops it. The dossier backlog drains over the following weeks. Later
    # weeks read the new sittings, the last three again and the index: about
    # five minutes. Measured from the laptop: see docs/belgium-scope.md.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Members, dossiers, sittings and recorded votes (legislature 56)
        # jobs/be-weekly.sh is shared with the Mac Mini runner. Here it only
        # collects (BE_PUBLISH=false); the two publish steps below run under
        # the commit step's condition, as in every store workflow.
        if: always() && steps.fetch.outcome == 'success'
        env:
          BE_PUBLISH: "false"
          BE_RECLASSIFY: ${{ inputs.reclassify }}
          # The edition DMs Chris alone (src/country_edition.py forces his id).
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
        run: bash jobs/be-weekly.sh | tee /tmp/be-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Belgium weekly"
            echo '```'
            grep -hE "be-rollcalls:|store:|\[gap\]" /tmp/be-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/be-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/ briefs/
          git diff --cached --quiet || git commit -m "Belgium weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

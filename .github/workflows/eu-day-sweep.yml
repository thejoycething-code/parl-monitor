name: EU day sweep
on:
  schedule:
    # 23:00 UTC daily. The Parliament sits in blocks and votes around midday
    # Strasbourg time, publishing roll calls within hours; this is late enough
    # to catch the day and clear of every other cron in the state group
    # (day sweep and division watch both sit at 21:00). A non-sitting day
    # costs one cached calendar lookup, so running it daily is cheaper than
    # trying to predict the part-sessions.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "First day to consider (YYYY-MM-DD; default 7 days ago)"
        required: false
        default: ""
permissions:
  contents: write
defaults:
  run:
    shell: bash -eo pipefail {0}
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false
jobs:
  # The Mac Mini runs this at 00:00 London daily (tools/mini_run.sh
  # eu-day-sweep), which is this cron's 23:00 UTC in summer; the cron is the
  # backup and skips a slot the Mini already ran.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: EU_DAY_SWEEP

  sweep:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Sweep, then publish the raw archive and the store
        # jobs/eu-day-sweep.sh is shared with the Mac Mini runner. It
        # publishes whatever the sweep completed even when it fails part-way.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
          EU_SWEEP_SINCE: ${{ inputs.since }}
        run: bash jobs/eu-day-sweep.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "## EU day sweep"
            echo '```'
            grep -E "SAT|ep-day-sweep|pending|gap" /tmp/eu-sweep.log | tail -30 \
              || tail -10 /tmp/eu-pending.log || echo "(no summary lines)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "bot@parl-monitor.invalid"
          git add data/parl-monitor.db.json data/raw.json
          git diff --cached --quiet && exit 0
          git commit -m "EU day sweep: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened loop (docs/mac-mini-runner.md, step 4): never retry
          # while stuck mid-rebase, and wait long enough to lose a race once.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main; then
              git push origin main && exit 0
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          echo "push failed six times"; exit 1

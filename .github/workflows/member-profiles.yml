name: Member profiles

# Reference data for the vote page: which periods each member has served,
# which party they sat for at the time, their published contact details,
# their ministerial and committee roles, and their seat's last result.
#
# WHY IT IS NOT IN THE SUNDAY PULL. Sunday pull is the critical weekly job.
# Its steps are guarded `if: env.SKIP != '1'`, which does NOT run after a
# failure, so an enrichment step placed ahead of the weekly gather would
# block the gather outright the first time the Members API hiccupped. It also
# runs to a 60-minute budget against a cold pull already measured at 40m05s,
# and its Monday 02:00 retry slot has to finish before the 03:00 publish.
# None of this reference data is worth that risk: it changes at by-elections,
# reshuffles and committee turnover, not weekly (Christopher asked directly
# whether this would break the Sunday pull, 2026-08-26).
#
# Wednesday is chosen because it is genuinely free: Monday has the publish,
# Thursday the Senedd and UN calls, Friday Holyrood, Saturday NI, Sunday the
# pull. Tuesday is the only other clear day and is kept spare.
on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# The same lock as every stateful workflow: this writes the store.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    # MEASURED, not estimated: 100 members took 4.5 minutes, so the House is
    # about 29 -- three or four requests each against src/http's 0.2s per-host
    # throttle, which dominates the raw latency. A 30-minute cap would have
    # been cut off mid-run. Wednesday 06:00 plus 45 minutes still finishes
    # more than 23 hours before the next scheduled workflow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # ref: the branch TIP at checkout time, not github.sha. A dispatched
      # or scheduled run PINS github.sha when it is created; queued behind
      # another run in the parl-monitor-state group, it then checks out a
      # sidecar OLDER than the store that run just published, and the fetch
      # refuses the mismatch. Found 2026-08-31: a sunday-pull dispatched
      # while a publish ran died exactly this way -- the fourth known route
      # to store/sidecar divergence, and the first that needs no failure
      # anywhere. These workflows act on repo STATE, so the tip is always
      # the right thing to act on.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Refresh Commons service and party history
        run: python3 tools/pull_service.py | tee /tmp/service.log
      - name: Refresh published profile detail
        # Never fatal on a partial failure: a member who cannot be fetched
        # keeps last week's detail rather than losing it.
        if: always()
        run: python3 tools/pull_profiles.py | tee /tmp/profiles.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Member profiles"
            for f in service profiles; do
              echo "### $f"
              if [ -f "/tmp/$f.log" ]; then
                echo '```'
                grep -E "members|stored|failures|%" "/tmp/$f.log" | tail -18 \
                  || echo "(no summary lines)"
                echo '```'
              else
                echo "step did not run"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Devolved member profiles
        if: always()
        # Contact details and posts for MLAs and MSPs. Two calls to NI's
        # members.asmx cover the whole Assembly; Scotland needs its role
        # lookups as well. Free APIs, no spend. Wales publishes neither.
        run: python3 tools/pull_devolved_profiles.py
      - name: Publish the store
        # NEVER publish a store the pull refused: see the note in
        # monday-publish.yml. `always()` alone turned one sha mismatch
        # into a cascade across three workflows on 2026-08-28.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # PAIRED WITH THE PUBLISH ABOVE, and it must stay that way. With no
        # condition, this step is skipped whenever ANY earlier step failed --
        # one WAF-blocked feed was enough -- while the publish above still
        # uploaded a new store. New asset, uncommitted sidecar: the next run
        # of ANY workflow then refuses the store it just published. That is
        # where 2026-08-28's cascade actually began.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "bot@parl-monitor.invalid"
          # data/raw as well as the sidecar: every sibling workflow stages
          # it, and a step that archives anything would otherwise leave the
          # tree dirty and make `git pull --rebase` refuse.
          git add data/raw data/parl-monitor.db.json
          git diff --cached --quiet || git commit -m "Member profiles: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Retry: the rebase closes most of the race, but a push can
          # still lose one, and the store was ALREADY published above --
          # so a lost push leaves the release ahead of the repo and the
          # next run refuses the store. 2026-08-28.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push origin main && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

name: UN calls weekly

# PAUSED 2026-08-17 (Christopher): nothing UN-related publishes until the
# monitor covers the issues and the forward calendar properly. The schedule
# below is deliberately commented out rather than deleted -- the cadence
# reasoning is the part worth keeping, and re-enabling should be one edit.
#
# When it comes back: 07:00 UTC Thursday. Weekly, unlike the monthly UPR
# harvest, because these carry deadlines. Thursday keeps it clear of the
# Sunday pull and Monday publish, which share the parl-monitor-state
# concurrency group.
on:
  # schedule:
  #   - cron: "0 7 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message instead of sending the DM"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  calls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # ref: the branch TIP at checkout time, not github.sha. A dispatched
      # or scheduled run PINS github.sha when it is created; queued behind
      # another run in the parl-monitor-state group, it then checks out a
      # sidecar OLDER than the store that run just published, and the fetch
      # refuses the mismatch. Found 2026-08-31: a sunday-pull dispatched
      # while a publish ran died exactly this way -- the fourth known route
      # to store/sidecar divergence, and the first that needs no failure
      # anywhere. These workflows act on repo STATE, so the tip is always
      # the right thing to act on.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml pypdf
      - name: Write secrets file
        run: |
          cat > config/secrets.yaml <<EOF
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"
          slack_channel_id: C9RH217PZ
          slack_team_id: T066M0LAJ
          slack_dm_user_id: U05LJP0BT61
          EOF
      - name: Post the week's open calls
        # No commit step: this reads a live page and sends a message. It
        # stores nothing, so there is no state to push and nothing to make
        # idempotent -- a duplicate run costs one duplicate DM, not a
        # corrupted store.
        env:
          NO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ "$NO_PUBLISH" = "1" ]; then
            python3 tools/post_un_calls.py --dry-run
          else
            python3 tools/post_un_calls.py
          fi

name: Historic backfill

# MANUAL ONLY -- no schedule. Adding a taxonomy term does not retro-capture
# anything: rows that never matched the old vocabulary were never fetched.
# This re-sweeps a NAMED term across a date range and ledgers what it finds.
#
# It exists because the store is now a release asset (tools/db_state.py):
# a backfill run on a laptop cannot publish its result without a PAT, so it
# would be stranded locally and the next weekly would overwrite the shared
# asset without it. Running the backfill HERE puts it where the store lives.
on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Comma-separated sweep terms, exactly as in settings.yaml (blank = ALL, slow)"
        required: false
        default: ""
      cutoff:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2020-01-01"
      hansard:
        description: "Also sweep Hansard speeches (slower)"
        type: boolean
        default: true
      # An END date (27 September 2026, the backfill to 2010): the ledger
      # already reached May 2015, and sweeping on to today would re-read
      # eleven years it holds. Blank = today, as before.
      until:
        description: "End date (YYYY-MM-DD, blank = today)"
        required: false
        default: ""
      # PRE-2016 COMMONS DIVISIONS (29 September 2026): the Commons Votes API
      # starts 9 March 2016, so earlier divisions come from Hansard
      # (tools/backfill_hansard_divisions.py). Title-matched ones are
      # ledgered; the rest go to docs/division-candidates-pre2016.md for a
      # human to sign off. The default keeps this workflow's old behaviour.
      what:
        description: "What to backfill"
        type: choice
        options:
          - "speeches, questions and EDMs"
          - "pre-2016 Commons divisions (Hansard)"
          - "Commons and Lords divisions (Votes APIs)"
        default: "speeches, questions and EDMs"

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# The same lock as every other stateful workflow: this one rewrites the
# ledger, so it must never interleave with a weekly.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      # ref: the branch TIP at checkout time, not github.sha. A dispatched
      # or scheduled run PINS github.sha when it is created; queued behind
      # another run in the parl-monitor-state group, it then checks out a
      # sidecar OLDER than the store that run just published, and the fetch
      # refuses the mismatch. Found 2026-08-31: a sunday-pull dispatched
      # while a publish ran died exactly this way -- the fourth known route
      # to store/sidecar divergence, and the first that needs no failure
      # anywhere. These workflows act on repo STATE, so the tip is always
      # the right thing to act on.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        # One tar per day folder, only the folders whose content moved.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Backfill questions and EDMs
        if: inputs.what == 'speeches, questions and EDMs'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="$(date -u +%F)"
          if [ -n "${{ inputs.terms }}" ]; then
            python3 tools/backfill_mp_ledger.py "${{ inputs.cutoff }}" "$END" \
              --terms "${{ inputs.terms }}" | tee /tmp/bf-ledger.log
          else
            python3 tools/backfill_mp_ledger.py "${{ inputs.cutoff }}" "$END" \
              | tee /tmp/bf-ledger.log
          fi
      - name: Backfill Hansard speeches
        if: inputs.hansard && inputs.what == 'speeches, questions and EDMs'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="$(date -u +%F)"
          if [ -n "${{ inputs.terms }}" ]; then
            python3 tools/backfill_hansard.py "${{ inputs.cutoff }}" \
              "$END" --terms "${{ inputs.terms }}" \
              | tee /tmp/bf-hansard.log
          else
            python3 tools/backfill_hansard.py "${{ inputs.cutoff }}" \
              "$END" | tee /tmp/bf-hansard.log
          fi
      - name: Commons divisions before March 2016 (Hansard)
        if: inputs.what == 'pre-2016 Commons divisions (Hansard)'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="2016-03-08"
          python3 tools/backfill_hansard_divisions.py "${{ inputs.cutoff }}" "$END" \
            | tee /tmp/bf-hdivisions.log
      - name: Commons and Lords divisions, title sweep (Votes APIs)
        # The same rule as the weekly sweep: a division whose TITLE the
        # taxonomy matches is ledgered with its motion notes (the Lords
        # question lives there, not in the title). Commons Votes API holds
        # nothing before 9 March 2016 -- use the Hansard mode for that --
        # and titles there are mostly procedural, so Commons 2016-19 is
        # thin by nature; the Lords holds more (29 Sept 2026 probe: six
        # 2013 Marriage (Same Sex Couples) Bill divisions).
        if: inputs.what == 'Commons and Lords divisions (Votes APIs)'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="$(date -u +%F)"
          python3 tools/backfill_divisions.py "${{ inputs.cutoff }}" "$END" | tee /tmp/bf-divisions.log
      - name: Record signed-off tracker divisions
        # The Monday publish does this before building the tracker; running
        # it here as well means a pre-2016 division signed off mid-week has
        # its voters (div:h<id>) and its signed stance the same day, rather
        # than the tracker and the store-backed tests waiting for Monday.
        # Idempotent: a division already in the ledger is left alone.
        if: inputs.what == 'pre-2016 Commons divisions (Hansard)'
        run: python3 tools/ledger_tracker_divisions.py | tee /tmp/bf-tracker.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Historic backfill"
            echo "terms: \`${{ inputs.terms }}\` (blank = all) from ${{ inputs.cutoff }} to ${{ inputs.until || 'today' }}"
            for f in ledger hansard hdivisions divisions tracker; do
              echo "### $f"
              if [ -f "/tmp/bf-$f.log" ]; then
                echo '```'
                grep -E "done:|ledger:|scoped to|events so far|hansard-divisions:|tracker ledger:|tracker stances:|\[gap\]" "/tmp/bf-$f.log" \
                  | tail -12 || echo "(no summary lines)"
                echo '```'
              else
                echo "step did not run"
              fi
            done
            echo "Stance scoring is NOT run here: it costs money and is"
            echo "Christopher's call. New refs sit unscored until then."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks
        # is the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # NEVER publish a store the pull refused: see the note in
        # monday-publish.yml. `always()` alone turned one sha mismatch
        # into a cascade across three workflows on 2026-08-28.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # PAIRED WITH THE PUBLISH ABOVE, and it must stay that way. With no
        # condition, this step is skipped whenever ANY earlier step failed --
        # one WAF-blocked feed was enough -- while the publish above still
        # uploaded a new store. New asset, uncommitted sidecar: the next run
        # of ANY workflow then refuses the store it just published. That is
        # where 2026-08-28's cascade actually began.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "bot@parl-monitor.invalid"
          git add data/parl-monitor.db.json data/raw.json
          # the pre-2016 division review queue, when that mode ran
          git add data/division-candidates-pre2016.json docs/division-candidates-pre2016.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Historic backfill: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Retry: the rebase closes most of the race, but a push can
          # still lose one, and the store was ALREADY published above --
          # so a lost push leaves the release ahead of the repo and the
          # next run refuses the store. 2026-08-28.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git push origin main && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

name: Historic backfill

# MANUAL ONLY -- no schedule. Adding a taxonomy term does not retro-capture
# anything: rows that never matched the old vocabulary were never fetched.
# This re-sweeps a NAMED term across a date range and ledgers what it finds.
#
# It exists because the store is now a release asset (tools/db_state.py):
# a backfill run on a laptop cannot publish its result without a PAT, so it
# would be stranded locally and the next weekly would overwrite the shared
# asset without it. Running the backfill HERE puts it where the store lives.
on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Comma-separated sweep terms, exactly as in settings.yaml (blank = ALL, slow)"
        required: false
        default: ""
      cutoff:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2020-01-01"
      hansard:
        description: "Also sweep Hansard speeches (slower)"
        type: boolean
        default: true
      # An END date (27 September 2026, the backfill to 2010): the ledger
      # already reached May 2015, and sweeping on to today would re-read
      # eleven years it holds. Blank = today, as before.
      until:
        description: "End date (YYYY-MM-DD, blank = today)"
        required: false
        default: ""
      # PRE-2016 COMMONS DIVISIONS (29 September 2026): the Commons Votes API
      # starts 9 March 2016, so earlier divisions come from Hansard
      # (tools/backfill_hansard_divisions.py). Title-matched ones are
      # ledgered; the rest go to docs/division-candidates-pre2016.md for a
      # human to sign off. The default keeps this workflow's old behaviour.
      # For the retag mode: the commit whose config/taxonomy.yaml the stored
      # tags were made under. retag_items refuses any table it cannot
      # reproduce under this OR the current taxonomy (its trust check).
      baseline:
        description: "Retag mode: git ref of the previous taxonomy (e.g. da9030de~1)"
        required: false
        default: ""
      what:
        description: "What to backfill"
        type: choice
        options:
          - "speeches, questions and EDMs"
          - "pre-2016 Commons divisions (Hansard)"
          - "Commons and Lords divisions (Votes APIs)"
          - "Holyrood from the cutoff"
          - "Senedd from the cutoff"
          - "NI Assembly questions from the cutoff"
          - "NI Assembly divisions from the cutoff"
          - "Senedd divisions of the Fifth Senedd (2016-21)"
          - "retag stored rows (taxonomy change)"
        default: "speeches, questions and EDMs"

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# The same lock as every other stateful workflow: this one rewrites the
# ledger, so it must never interleave with a weekly.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      # ref: the branch TIP at checkout time, not github.sha. A dispatched
      # or scheduled run PINS github.sha when it is created; queued behind
      # another run in the parl-monitor-state group, it then checks out a
      # sidecar OLDER than the store that run just published, and the fetch
      # refuses the mismatch. Found 2026-08-31: a sunday-pull dispatched
      # while a publish ran died exactly this way -- the fourth known route
      # to store/sidecar divergence, and the first that needs no failure
      # anywhere. These workflows act on repo STATE, so the tip is always
      # the right thing to act on.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        # One tar per day folder, only the folders whose content moved.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Backfill questions and EDMs
        if: inputs.what == 'speeches, questions and EDMs'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="$(date -u +%F)"
          if [ -n "${{ inputs.terms }}" ]; then
            python3 tools/backfill_mp_ledger.py "${{ inputs.cutoff }}" "$END" \
              --terms "${{ inputs.terms }}" | tee /tmp/bf-ledger.log
          else
            python3 tools/backfill_mp_ledger.py "${{ inputs.cutoff }}" "$END" \
              | tee /tmp/bf-ledger.log
          fi
      - name: Backfill Hansard speeches
        if: inputs.hansard && inputs.what == 'speeches, questions and EDMs'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="$(date -u +%F)"
          if [ -n "${{ inputs.terms }}" ]; then
            python3 tools/backfill_hansard.py "${{ inputs.cutoff }}" \
              "$END" --terms "${{ inputs.terms }}" \
              | tee /tmp/bf-hansard.log
          else
            python3 tools/backfill_hansard.py "${{ inputs.cutoff }}" \
              "$END" | tee /tmp/bf-hansard.log
          fi
      - name: Commons divisions before March 2016 (Hansard)
        if: inputs.what == 'pre-2016 Commons divisions (Hansard)'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="2016-03-08"
          python3 tools/backfill_hansard_divisions.py "${{ inputs.cutoff }}" "$END" \
            | tee /tmp/bf-hdivisions.log
      - name: Commons and Lords divisions, title sweep (Votes APIs)
        # The same rule as the weekly sweep: a division whose TITLE the
        # taxonomy matches is ledgered with its motion notes (the Lords
        # question lives there, not in the title). Commons Votes API holds
        # nothing before 9 March 2016 -- use the Hansard mode for that --
        # and titles there are mostly procedural, so Commons 2016-19 is
        # thin by nature; the Lords holds more (29 Sept 2026 probe: six
        # 2013 Marriage (Same Sex Couples) Bill divisions).
        if: inputs.what == 'Commons and Lords divisions (Votes APIs)'
        run: |
          END="${{ inputs.until }}"; [ -n "$END" ] || END="$(date -u +%F)"
          python3 tools/backfill_divisions.py "${{ inputs.cutoff }}" "$END" | tee /tmp/bf-divisions.log
      # --- DEVOLVED BACKFILLS (29 September 2026, Christopher: "Go ahead with 1").
      # The weeklies floor at 2024-01-01; these move the floor for one run.
      # What the sources hold was probed first: Holyrood per-MSP votes from
      # 2011 (2010 answers 500), the Sixth Senedd index back to 2021 (the
      # Fourth and Fifth Assemblies have no index), NI questions from 2008.
      - name: "Holyrood: questions, motions and divisions from the cutoff"
        if: inputs.what == 'Holyrood from the cutoff'
        run: |
          # One year's gap is reported, not fatal: the other years still run.
          Y0=$(echo "${{ inputs.cutoff }}" | cut -c1-4); LAST=2023; rc=0
          python3 tools/sp_pull.py --year "$Y0" --motions-since "${{ inputs.cutoff }}" | tee /tmp/bf-devolved.log || rc=1
          for y in $(seq $((Y0 + 1)) $LAST); do
            python3 tools/sp_pull.py --year "$y" --questions-only | tee -a /tmp/bf-devolved.log || rc=1
          done
          for y in $(seq "$Y0" $LAST); do
            python3 tools/sp_divisions.py --year "$y" | tee -a /tmp/bf-devolved.log || rc=1
          done
          exit $rc
      - name: "Senedd: questions and divisions from the cutoff"
        if: inputs.what == 'Senedd from the cutoff'
        run: |
          python3 tools/sd_pull.py --backfill --floor "${{ inputs.cutoff }}" | tee /tmp/bf-devolved.log
          python3 tools/sd_divisions.py --parl 700 --floor "${{ inputs.cutoff }}" | tee -a /tmp/bf-devolved.log
      - name: "Senedd: the Fifth Senedd's divisions and speeches (2016-21)"
        # 29 September 2026. The Fifth Senedd has its own XMLExport index, 401
        # (334 sittings from 11 May 2016); nothing older is exported, so the
        # cutoff cannot usefully go below 2016-05-01. Divisions and speeches
        # only: the question walk took 2.5 hours back to 2021 alone and would
        # not fit this job's limit back to 2016.
        if: inputs.what == 'Senedd divisions of the Fifth Senedd (2016-21)'
        run: python3 tools/sd_divisions.py --parl 401 --floor "${{ inputs.cutoff }}" | tee /tmp/bf-devolved.log
      - name: "NI Assembly: questions from the cutoff"
        if: inputs.what == 'NI Assembly questions from the cutoff'
        run: python3 tools/ni_pull.py --since "${{ inputs.cutoff }}" | tee /tmp/bf-devolved.log
      - name: "NI Assembly: divisions from the cutoff, and MLA votes on our ground"
        # 29 September 2026 (Christopher: NI divisions from 2011). Three
        # steps, in this order: store every division and archive its sitting's
        # Hansard; classify each from the amendment's own wording (offline,
        # authoritative, honours not_ours); then harvest MLA votes for the
        # watched bills AND every division the classifier put on our ground --
        # a motion such as Marriage Equality is not a bill, so the watch list
        # alone never reaches it. Votes place nobody until a verdict is signed.
        if: inputs.what == 'NI Assembly divisions from the cutoff'
        run: |
          python3 tools/ni_divisions.py --since "${{ inputs.cutoff }}" | tee /tmp/bf-devolved.log
          python3 tools/ni_classify.py --apply | grep -vE "^      " | tee -a /tmp/bf-devolved.log
          python3 tools/ni_divisions.py --since "${{ inputs.cutoff }}" --classified | tee -a /tmp/bf-devolved.log
      - name: "Devolved: the model key, for the judge step only"
        # The Westminster modes never write it: stance there is a separate,
        # approved spend (score-stance.yml). The devolved judge IS part of
        # the approved devolved backfill, and without the key it refused
        # (correctly, no stub scores) and left 140 items unjudged on 29 Sept.
        if: always() && steps.fetch.outcome == 'success' && (startsWith(inputs.what, 'Holyrood') || startsWith(inputs.what, 'Senedd') || startsWith(inputs.what, 'NI Assembly'))
        run: |
          cat > config/secrets.yaml <<EOF
          anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
          EOF
      - name: "Devolved: judge the divisions, apply the signed verdicts"
        # devolved_triage's default window is recent items plus EVERY
        # division on our ground: old questions render nowhere and are not
        # paid for, old divisions are judged once. The verdict configs
        # (sp_score / devolved_score) are human sign-offs, no model.
        # always(): a failed year in the collection step must not skip the
        # judging of everything the other years stored (Holyrood, 29 Sept).
        if: always() && steps.fetch.outcome == 'success' && (startsWith(inputs.what, 'Holyrood') || startsWith(inputs.what, 'Senedd') || startsWith(inputs.what, 'NI Assembly'))
        run: |
          python3 tools/devolved_triage.py --budget-seconds 2400 | tee -a /tmp/bf-devolved.log
          python3 tools/sp_score.py --apply | tee -a /tmp/bf-devolved.log
          python3 tools/devolved_score.py --nation wales --apply | tee -a /tmp/bf-devolved.log
          python3 tools/devolved_score.py --nation ni --apply | tee -a /tmp/bf-devolved.log
      - name: "Retag stored rows under the current taxonomy"
        # 29 September 2026 (Christopher: "Retag the stored rows for the new
        # marriage phrases"). Devolved and EU tables through retag_items, with
        # its trust check against the baseline taxonomy; the Westminster debate
        # ledger through retag_passages. Written questions are not retagged:
        # their full text is only partly archived (retag_passages guards it).
        if: inputs.what == 'retag stored rows (taxonomy change)'
        run: |
          [ -n "${{ inputs.baseline }}" ] || { echo "::error::the retag mode needs a baseline ref"; exit 1; }
          git fetch -q --deepen=200 origin "$(git rev-parse --abbrev-ref HEAD)"
          git show "${{ inputs.baseline }}:config/taxonomy.yaml" > /tmp/baseline-taxonomy.yaml
          head -4 /tmp/baseline-taxonomy.yaml | grep -i version
          python3 tools/retag_items.py --apply --baseline /tmp/baseline-taxonomy.yaml | tee /tmp/bf-retag.log
          python3 tools/retag_passages.py --apply | grep -vE "^  (Spoke| +areas| +excerpt)" | tee -a /tmp/bf-retag.log
          # NI division areas are owned by ni_classify (offline, from the
          # archived Hansard); it also honours areas a signed verdict states
          # for a clause vote with no text (3 Oct 2026).
          python3 tools/ni_classify.py --apply | grep -vE "^      " | tee -a /tmp/bf-retag.log
          # Signed verdicts are re-applied after a retag: a division the new
          # taxonomy tags may already carry one (2 Oct 2026: the Welsh
          # smacking-ban and Curriculum Bills). Offline, no model.
          python3 tools/sp_score.py --apply | tee -a /tmp/bf-retag.log
          python3 tools/devolved_score.py --nation wales --apply | tee -a /tmp/bf-retag.log
          python3 tools/devolved_score.py --nation ni --apply | tee -a /tmp/bf-retag.log
      - name: Record signed-off tracker divisions
        # The Monday publish does this before building the tracker; running
        # it here as well means a pre-2016 division signed off mid-week has
        # its voters (div:h<id>) and its signed stance the same day, rather
        # than the tracker and the store-backed tests waiting for Monday.
        # Idempotent: a division already in the ledger is left alone.
        if: inputs.what == 'pre-2016 Commons divisions (Hansard)' || inputs.what == 'Commons and Lords divisions (Votes APIs)'
        run: python3 tools/ledger_tracker_divisions.py | tee /tmp/bf-tracker.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Historic backfill"
            echo "terms: \`${{ inputs.terms }}\` (blank = all) from ${{ inputs.cutoff }} to ${{ inputs.until || 'today' }}"
            for f in ledger hansard hdivisions divisions devolved retag tracker; do
              echo "### $f"
              if [ -f "/tmp/bf-$f.log" ]; then
                echo '```'
                grep -E "done:|ledger:|scoped to|events so far|hansard-divisions:|tracker ledger:|tracker stances:|match our areas|division\(s\)|stored|devolved|scored|reproduced|gained|widened|CLEARED|NOT APPLIED|\[gap\]" "/tmp/bf-$f.log" \
                  | tail -30 || echo "(no summary lines)"
                echo '```'
              else
                echo "step did not run"
              fi
            done
            echo "Stance scoring is NOT run here: it costs money and is"
            echo "Christopher's call. New refs sit unscored until then."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks
        # is the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # NEVER publish a store the pull refused: see the note in
        # monday-publish.yml. `always()` alone turned one sha mismatch
        # into a cascade across three workflows on 2026-08-28.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # PAIRED WITH THE PUBLISH ABOVE, and it must stay that way. With no
        # condition, this step is skipped whenever ANY earlier step failed --
        # one WAF-blocked feed was enough -- while the publish above still
        # uploaded a new store. New asset, uncommitted sidecar: the next run
        # of ANY workflow then refuses the store it just published. That is
        # where 2026-08-28's cascade actually began.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "bot@parl-monitor.invalid"
          git add data/parl-monitor.db.json data/raw.json
          # the pre-2016 division review queue, when that mode ran
          git add data/division-candidates-pre2016.json docs/division-candidates-pre2016.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Historic backfill: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Retry: the rebase closes most of the race, but a push can
          # still lose one, and the store was ALREADY published above --
          # so a lost push leaves the release ahead of the repo and the
          # next run refuses the store. 2026-08-28.
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main; then
              git push origin main && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          # A loop that falls out without a successful push must FAIL the step,
          # or main keeps pointing at an old sidecar (the 6 September cascade).
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

# ONE-OFF CHECK (9 October 2026): run the whole US collector, Senate
# included, on GitHub's runners into a THROWAWAY database before the US
# weekly is merged. senate.gov refuses the laptop, so only CI can test the
# Senate half end to end. Never touches the store. Delete after the merge.
# Run 2: amendment votes take their bill from the session menu.
name: US Senate probe
on:
  push:
    branches: [us-congress]
    paths: [.github/workflows/us-senate-probe.yml]
  workflow_dispatch:
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Full collector into /tmp/us.db (not the store)
        run: python3 tools/us_rollcalls.py --db /tmp/us.db --budget-seconds 2400 || echo "EXIT $?"
      - name: What landed
        run: |
          sqlite3 /tmp/us.db "SELECT chamber, COUNT(*), SUM(areas NOT IN ('[]','[11]')) FROM us_divisions GROUP BY chamber"
          sqlite3 /tmp/us.db "SELECT d.chamber, d.roll, d.date, d.legis_num, d.areas, substr(d.description,1,90) FROM us_divisions d WHERE chamber='senate' AND own_areas NOT IN ('[]','[11]') ORDER BY date LIMIT 40"
          sqlite3 /tmp/us.db "SELECT feed, detail FROM gaps LIMIT 20"
          sqlite3 /tmp/us.db "SELECT COUNT(*) FROM us_votes v JOIN us_divisions d USING(division_key) WHERE d.chamber='senate'"

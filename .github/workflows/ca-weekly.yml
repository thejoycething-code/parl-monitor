name: Canada weekly
on:
  schedule:
    # Tuesday 10:00 UTC, retry 12:00. Chosen from the crons of every other
    # workflow (26 September 2026), because fifteen of them share the
    # parl-monitor-state group and GitHub keeps only ONE run pending per
    # group: a second arrival cancels the one already waiting. Tuesday
    # holds only the day sweep (07:00, 21:00), the division watch (18:00,
    # 21:00) and the EU day sweep (23:00), so 10:00-18:00 is clear even with
    # the 3-5 hours of cron drift this repo has measured. Tuesday also comes
    # after the whole Canadian sitting week and after both Gazette parts
    # (Part I Saturday, Part II alternate Wednesdays).
    #
    # Both slots on the same UTC day so the gate below can compare them.
    - cron: "0 10 * * 2"
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      backfill:
        # THE BACKFILL IS A DELIBERATE ACT, never the weekly's job (the rule
        # bought by the Bundestag IP block of 24 September 2026: backfills
        # run from CI, paced, and are announced). It reads what is MISSING
        # below the highest sitting and petition held -- 45-1 sittings
        # 1-137 (~40 MB) and presented petitions 451-00001..01189 (~140 MB)
        # -- plus the 44th Parliament's divisions, and the Gazette since
        # the 45th Parliament opened. A run cut short by its budget resumes
        # where it stopped when dispatched again.
        description: "Also run the one-off backfill (announce it first)"
        type: boolean
        default: false
      # BACK TO 2020 (26 September 2026). Earlier sessions are whole
      # sessions, not holes below a frontier, so they are named here. Measured
      # sizes: Hansard 43-1 45 sittings, 43-2 124, 44-1 391; presented
      # petitions 304, 1,244 and 2,982. Petitions are the long part (~1.4 s a
      # page, ~105 minutes), so they are a separate switch: size each run to
      # the gap it is dispatched into, because a run still holding the state
      # group when two scheduled slots arrive gets the first cancelled.
      older_sessions:
        description: "Earlier sessions to collect, space-separated (e.g. 44-1 43-2 43-1)"
        type: string
        default: ""
      older_petitions:
        description: "Also walk those sessions' presented petitions (~105 min for all three)"
        type: boolean
        default: false
      gazette_since:
        description: "Also read Gazette issues back to this date (YYYY-MM-DD)"
        type: string
        default: ""
      # A PARSER FIX'S REPAIR (28 September 2026): issue_key globs whose
      # issues and items are dropped before the Gazette step, so it reads
      # them again with the fixed parser (or, for a consolidated index, never).
      gazette_forget:
        description: "Gazette issues to drop and re-read, space-separated globs (e.g. p1-2011-*)"
        type: string
        default: ""
      # The petitions judge's clock (tools/ca_triage.py). 1200 s is a normal
      # week with room to spare; a backlog run can ask for up to 2700, which
      # still ends well inside the 60-minute wall below.
      judge_seconds:
        description: "Clock for the petitions judge, in seconds (max 2700)"
        type: string
        default: "1200"
      # AFTER A TAXONOMY OR WATCHLIST-CA CHANGE (29 September 2026, v1.10):
      # re-match the stored Canadian rows, adding areas, never removing
      # (tools/ca_retag.py). About 10 minutes over the 2010-2026 store.
      retag:
        description: "Retag the stored Canadian rows under the current taxonomy (additive)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time,
# repo-wide, or two bots race on parl-monitor.db.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # THE SECOND SLOT IS A RETRY, NOT A SECOND PASS -- copied from de-weekly.yml.
  # A skipped job bills nothing; an in-progress run counts as done; a hand
  # dispatch is never gated.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/ca-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Thirty for the weekly: measured by hand on 26 September 2026, the
    # division and bill lists plus a dozen detail calls, 7 sittings, ~320
    # petition pages and 16 Gazette issues each took a few minutes. The
    # backfill gets two hours; src/drain.py budgets bound each step inside it.
    # 60 for the weekly since the judge step (27 September 2026): collection
    # takes ~5 minutes and the judge's clock is 20 by default, 45 at most, and
    # a job killed by its timeout never reaches "Publish the store".
    timeout-minutes: ${{ (inputs.older_sessions != '' || inputs.gazette_since != '') && 240 || ((inputs.backfill || inputs.retag) && 120 || 60) }}
    env:
      # Unbuffered, or a step killed mid-run leaves an empty log (the EU
      # weekly's 30-minute kill read as an empty log, not a timeout).
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        # ref: the branch TIP, not github.sha -- a queued run pinning a
        # pre-publish sha checks out a sidecar older than the store the run
        # ahead of it published.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        # pypdf is pinned: the 2010 PDF reader (src/ca_gazette_pdf.py) uses its
        # layout engine's text_show_operations, a private interface.
        run: pip install pyyaml pypdf==6.14.2
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        # The Canadian collectors read with archive=False and add nothing to
        # data/raw, but EVERY store publisher publishes the archive too
        # (tests/test_raw_state.py): the rule is kept uniform rather than
        # argued case by case. It merges, never clobbers, so this is cheap.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      #
      # EVERY COLLECTOR RUNS WHATEVER THE ONE BEFORE DID. They exit 1 on a
      # gap, which fails the job (and so the alert fires), but a Gazette 503
      # must not cost the week's Hansard. SEQUENTIAL throughout: one SQLite
      # file. Order matters once: bills before Hansard and the Senate,
      # because both look bill numbers and long titles up in ca_bills.
      - name: House divisions, member positions and bills (45-1)
        if: always() && steps.fetch.outcome == 'success'
        run: python3 tools/ca_rollcalls.py --session 45-1 | tee /tmp/ca-rollcalls.log
      - name: Senate votes and senators' positions (45-1)
        if: always() && steps.fetch.outcome == 'success'
        run: python3 tools/ca_senate.py --session 45-1 | tee /tmp/ca-senate.log
      - name: Hansard since the last sitting read
        # Resumes after the highest sitting read; on an empty store, at the
        # session's seed (tools/ca_hansard.py SEED_SITTING), never at 1.
        if: always() && steps.fetch.outcome == 'success'
        run: python3 tools/ca_hansard.py --session 45-1 | tee /tmp/ca-hansard.log
      - name: Petitions (owed a refresh, newly presented, newly open)
        # 300 page fetches: the open e-petition probe alone is ~190 numbers
        # a week, nearly all of them empty 0-byte answers.
        if: always() && steps.fetch.outcome == 'success'
        run: python3 tools/ca_petitions.py --limit 300 | tee /tmp/ca-petitions.log
      - name: Canada Gazette (unread issues of the last 60 days)
        if: always() && steps.fetch.outcome == 'success'
        run: python3 tools/ca_gazette.py | tee /tmp/ca-gazette.log

      # --- The backfill, only when dispatched with backfill=true -----------
      # AFTER the weekly steps, deliberately: the backfill reads what is
      # missing BELOW the highest held, so on an empty store it needs the
      # weekly to have found the frontier first.
      - name: "Backfill: the 44th Parliament's divisions and bills"
        if: always() && steps.fetch.outcome == 'success' && inputs.backfill
        run: python3 tools/ca_rollcalls.py --session 44-1 | tee /tmp/ca-bf-rollcalls.log
      - name: "Backfill: Hansard sittings missing below the highest read"
        if: always() && steps.fetch.outcome == 'success' && inputs.backfill
        run: python3 tools/ca_hansard.py --session 45-1 --backfill --limit 200 --budget-seconds 2700 | tee /tmp/ca-bf-hansard.log
      - name: "Backfill: presented petitions missing below the highest held"
        if: always() && steps.fetch.outcome == 'success' && inputs.backfill
        run: python3 tools/ca_petitions.py --backfill --limit 1400 --budget-seconds 2700 | tee /tmp/ca-bf-petitions.log
      - name: "Backfill: the Gazette since the 45th Parliament opened"
        if: always() && steps.fetch.outcome == 'success' && inputs.backfill
        run: python3 tools/ca_gazette.py --since 2025-05-26 --budget-seconds 2400 | tee /tmp/ca-bf-gazette.log

      # --- Earlier sessions, only when named at dispatch ---------------------
      # Each collector exits 1 on a gap; the loop carries on to the next
      # session and fails the step at the end, so one bad session never
      # costs the others. Every tool resumes where it stopped: divisions and
      # positions skip what is held, Hansard continues after the highest
      # sitting read, petitions after the highest number held.
      - name: "Earlier sessions: divisions, bills and Senate votes"
        if: always() && steps.fetch.outcome == 'success' && inputs.older_sessions != ''
        run: |
          rc=0
          for s in ${{ inputs.older_sessions }}; do
            python3 tools/ca_rollcalls.py --session "$s" | tee -a /tmp/ca-old-rollcalls.log || rc=1
            python3 tools/ca_senate.py --session "$s" | tee -a /tmp/ca-old-senate.log || rc=1
          done
          exit $rc
      - name: "Earlier sessions: Hansard"
        if: always() && steps.fetch.outcome == 'success' && inputs.older_sessions != ''
        run: |
          rc=0
          for s in ${{ inputs.older_sessions }}; do
            python3 tools/ca_hansard.py --session "$s" --limit 400 --budget-seconds 1800 | tee -a /tmp/ca-old-hansard.log || rc=1
          done
          exit $rc
      - name: "Earlier sessions: presented petitions"
        if: always() && steps.fetch.outcome == 'success' && inputs.older_sessions != '' && inputs.older_petitions
        run: |
          rc=0
          for s in ${{ inputs.older_sessions }}; do
            # --limit 6000: 42-1 is scanned through its holes to a ceiling of
            # 5,500 (tools/ca_petitions.py HOLEY), mostly 0-byte empties; the
            # 4,500-second clock is what bounds the step.
            python3 tools/ca_petitions.py --session "$s" --limit 6000 --budget-seconds 4500 | tee -a /tmp/ca-old-petitions.log || rc=1
          done
          exit $rc
      - name: "Gazette back to the chosen date"
        if: always() && steps.fetch.outcome == 'success' && inputs.gazette_since != ''
        env:
          SINCE: ${{ inputs.gazette_since }}
          FORGET: ${{ inputs.gazette_forget }}
        run: |
          set -f   # the globs are for SQLite, not the shell
          python3 tools/ca_gazette.py --since "$SINCE" --budget-seconds 3000 ${FORGET:+--forget $FORGET} | tee /tmp/ca-old-gazette.log

      - name: Retag the stored Canadian rows (additive; before the judge)
        # Before the judge, so a petition that gains its first area here is
        # scored in the same run.
        if: always() && steps.fetch.outcome == 'success' && inputs.retag
        run: python3 tools/ca_retag.py | tee /tmp/ca-retag.log

      - name: Judge petitions on our ground (newest first, on a clock)
        # AFTER every collector, so this week's new petitions are in the queue.
        # The key is scoped to this step alone; nothing else here calls the API.
        # A scheduled run has no inputs, so the clock falls back to 1200.
        if: always() && steps.fetch.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SECS="${{ inputs.judge_seconds }}"; SECS="${SECS:-1200}"
          if [ "$SECS" -gt 2700 ]; then SECS=2700; fi
          python3 tools/ca_triage.py --limit 2000 --budget-seconds "$SECS" | tee /tmp/ca-triage.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Canada weekly"
            echo '```'
            grep -hE "ca-rollcalls:|ca-senate:|ca-hansard:|ca-petitions:|ca-gazette:|ca-triage:|ca-retag:|backfill|\[gap\]" \
              /tmp/ca-*.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/ca-*.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Canada weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          # A loop that falls out without a successful push must FAIL the
          # step: "for attempt ... done" with no check is how the 6 September
          # cascade started (origin left pointing at an old sidecar).
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

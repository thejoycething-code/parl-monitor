name: EU weekly
on:
  schedule:
    # Saturday 07:00 UTC, retry 15:00 -- an hour after the NI slots so the
    # two never queue on each other's heels, and clear of the Sunday pull
    # (01:00-15:00 Sun) and Monday publish (02:00-07:00 Mon). The Commission
    # publishes feedback windows continuously; weekly matches the typical
    # four-week window, and the edition lands before the team's Monday.
    # MOVED 17 Sept 2026 from 07:00/15:00. Fifteen workflows share the
    # parl-monitor-state group and GitHub keeps only ONE run pending per
    # group: a second arrival cancels the one already waiting. At 07:00
    # Saturday the day sweep ("0 7 * * 2-6") fires into the group while the
    # NI weekly (06:00) may still hold it, and the EU run was the one
    # cancelled -- both slots died on 12 Sept and the EU pipeline went dark
    # for eleven days with no failed run to alert on. 10:00 and 18:00 are
    # clear of every other cron in the group.
    - cron: "0 10 * * 6"
    - cron: "0 18 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time,
# repo-wide, or two bots race on parl-monitor.db.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # THE SECOND SLOT IS A RETRY, NOT A SECOND PASS (22 September 2026).
  # Both slots existed so a dropped or drifted cron still gets the week done,
  # but nothing stopped the second one repeating the whole job: measured over
  # 13 days the four weeklies spent about 250 minutes a month collecting what
  # the earlier slot had already collected. The Monday publish and the Sunday
  # pull have always guarded themselves; these four never did, and raising the
  # EU weekly's timeout on 21 September made its duplicate worse, because both
  # slots now run to completion instead of dying at the wall.
  #
  # A skipped job bills nothing, so the gate is one short job and the work is
  # skipped whole. An in-progress run counts as done too: the second slot
  # would otherwise queue behind the first on the state group and run anyway.
  # A hand dispatch is never gated.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/eu-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # SIXTY, not thirty (19 Sept 2026). Both Saturday runs were cancelled by
    # the 30-minute timeout at the written-question drain: 14 minutes of
    # store pull, body reads and roll calls, then a drain that sat in 429
    # backoff. GitHub reports a timeout as "cancelled", which the alert
    # ignored, so the triage, edition, tracker and 5CA steps were skipped
    # twice in silence. The drains now carry a clock of their own
    # (src/drain.py); this is the outer wall.
    timeout-minutes: 60
    env:
      # Python buffers stdout into `| tee`; a step killed mid-run left a log
      # with nothing in it. Line-by-line, so a slow step shows where it is.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        # ref: the branch TIP, not github.sha -- the fourth store-divergence
        # route (2026-08-31): a queued run pinning a pre-publish sha checks
        # out a sidecar older than the store the run ahead of it published.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        # One tar per day folder, only the folders whose content moved.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Track watched EP dossiers
        run: python3 tools/eu_dossiers.py | tee /tmp/eu-dossiers.log
      - name: Pull the plenary forward look (60 days)
        # SEQUENTIAL: same SQLite file as every step here.
        run: python3 tools/eu_agenda.py | tee /tmp/eu-agenda.log
      - name: Pull adopted texts and propose watchlist candidates
        run: python3 tools/eu_texts.py | tee /tmp/eu-texts.log
      - name: Collect MEP roll calls on our ground
        run: python3 tools/eu_rollcalls.py | tee /tmp/eu-rollcalls.log
      - name: Strasbourg watch (ECtHR judgments)
        run: python3 tools/eu_courts.py | tee /tmp/eu-courts.log
      - name: Drain EP written questions (capped)
        run: python3 tools/eu_pqs.py | tee /tmp/eu-pqs.log
      - name: Watch European Citizens' Initiatives
        run: python3 tools/eu_eci.py | tee /tmp/eu-eci.log
      - name: Committee watch (meetings ahead, pipeline documents)
        run: python3 tools/eu_committees.py | tee /tmp/eu-committees.log
      - name: Collect MEP speeches on our ground
        run: python3 tools/eu_speeches.py | tee /tmp/eu-speeches.log
      - name: Enrich new MEPs with country and group
        # Incremental: only MEPs with no stored group are fetched, so
        # after the first full pass this costs new arrivals only.
        run: python3 tools/eu_meps_enrich.py | tee /tmp/eu-enrich.log
      - name: Write secrets file
        # anthropic_api_key: the triage judge. slack: the weekly DM to
        # Christopher ONLY -- the channel is deliberately not posted
        # (his call, 2026-09-01: hold the Slack, DM the proof of concept).
        # A missing secret makes the step skip-with-disclosure, never fail.
        run: |
          cat > config/secrets.yaml <<EOF
          anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"
          slack_dm_user_id: U05LJP0BT61
          EOF
      - name: Triage the new matched EU items
        # Scored once, ever: the weekly cost is the week's NEW matched
        # rows, single digits. Spend lands in api_spend as 'eu-triage'.
        run: python3 tools/eu_triage.py | tee /tmp/eu-triage.log
      - name: Pull open Commission initiatives, write the EU edition, DM the summary
        # SEQUENTIAL with the steps above: same SQLite file throughout,
        # and the edition renders what the collectors and judge just wrote.
        run: python3 tools/eu_monitor.py --edition --dm | tee /tmp/eu-monitor.log
      - name: Build "How did your MEP vote?"
        run: python3 tools/make_eu_tracker.py | tee /tmp/eu-tracker.log
      - name: Refresh the EU 5CA (signed divisions only)
        run: python3 tools/make_eu_5ca.py | tee /tmp/eu-5ca.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## EU weekly refresh"
            echo '```'
            grep -hE "eu-consultations:|eu-courts:|eu-pqs:|eu-eci:|eu-committees:|eu-speeches:|eu-triage:|dm:|eu-rollcalls:|eu-texts:|WATCHLIST CANDIDATE|eu-dossiers:|eu-agenda:|edition:|MOVED|\[gap\]" \
              /tmp/eu-*.log 2>/dev/null | head -15 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/eu-*.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks
        # is the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/ partner_site/ docs/ briefs/
          git diff --cached --quiet || git commit -m "EU weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

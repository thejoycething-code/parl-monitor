name: Germany weekly
on:
  schedule:
    # Sunday 19:00 UTC, retry 21:00. NOT Saturday, deliberately: fifteen
    # workflows share the parl-monitor-state concurrency group and GitHub
    # keeps only ONE run pending per group, so a second arrival cancels the
    # one already waiting. Saturday already holds NI (06:00/14:00), the EU
    # weekly (10:00/18:00) and the day sweep (07:00); adding a fifth is how
    # the EU pipeline went dark for eleven days in September with no failed
    # run to alert on. Sunday evening is clear of the Sunday pull
    # (01:00-15:00 Sun) and lands before the Monday publish (02:00-07:00).
    #
    # Both slots on the same UTC day so the gate below can compare them.
    - cron: "0 19 * * 0"
    - cron: "0 21 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time,
# repo-wide, or two bots race on parl-monitor.db.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # THE SECOND SLOT IS A RETRY, NOT A SECOND PASS. Copied from eu-weekly.yml,
  # which learned it the expensive way: two slots existed so a dropped cron
  # still got the week done, and nothing stopped the later one repeating the
  # whole job -- about 250 minutes a month across the four weeklies,
  # re-collecting what the earlier slot already had. A skipped job bills
  # nothing, so the gate is one short job and the work is skipped whole. An
  # in-progress run counts as done: the second slot would otherwise queue
  # behind the first on the state group and run anyway. A hand dispatch is
  # never gated.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/de-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Forty-five. Measured: the roll calls across seventeen parliaments took
    # about 9 minutes by hand and the DIP term sweep about 11, plus the store
    # pull. The wall exists so a wedged pager cannot burn an hour, not as a
    # budget -- src/drain.py carries the clocks that actually bound the work.
    timeout-minutes: 45
    env:
      # Python buffers stdout into `| tee`; a step killed mid-run left a log
      # with nothing in it, which is how a 30-minute kill read as an empty
      # log rather than a timeout.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        # ref: the branch TIP, not github.sha -- a queued run pinning a
        # pre-publish sha checks out a sidecar older than the store the run
        # ahead of it published.
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        # pypdf: the committee agendas are PDFs and their SUBJECT is
        # inside them, never in the feed's title.
        run: pip install pyyaml pypdf
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Collect recorded votes (Bundestag and the sixteen Länder)
        # SEQUENTIAL with every step below: same SQLite file throughout.
        run: python3 tools/de_rollcalls.py --all | tee /tmp/de-rollcalls.log
      - name: Sweep DIP for Vorgänge on our ground
        # --mode terms: drives /vorgang from the tier-1 German terms. The
        # date window is the collector's own default; a wider sweep is a
        # deliberate hand run, not a weekly cost.
        run: python3 tools/de_documents.py --mode terms | tee /tmp/de-documents.log
      - name: Collect the forward agenda (committee and plenary sittings)
        # THE ONLY FORWARD-LOOKING GERMAN SOURCE. DIP returns zero results for
        # any future date. This feed is a ROLLING WINDOW with no archive, so a
        # week this step does not run is a week of agendas nobody can recover
        # -- which is why de_agenda is a watched feed rather than once-ever.
        run: python3 tools/de_agenda.py | tee /tmp/de-agenda.log
      - name: Read the plenary protocols (who spoke on our issues)
        # The Stenografischer Bericht in full, from DIP. Each protocol is read
        # ONCE -- the Bericht is final -- so the weekly cost is the sitting
        # days since the last run, and nothing else.
        run: python3 tools/de_speeches.py | tee /tmp/de-speeches.log
      - name: Collect e-petitions open for co-signature (the deadline layer)
        # The ONLY German source with a date to act on. Needs a cookie
        # session; the collector handles that itself.
        run: python3 tools/de_petitions.py | tee /tmp/de-petitions.log
      - name: Watch Karlsruhe (cases listed for decision)
        run: python3 tools/de_courts.py | tee /tmp/de-courts.log
      - name: Collect amendments to bills we watch
        run: python3 tools/de_amendments.py | tee /tmp/de-amendments.log
      - name: Collect committee reports and laid papers
        # A Beschlussempfehlung is the committee telling the House what to do
        # with a bill, BEFORE the vote. The 60-day window is deliberate: DIP
        # publishes a report first and adds its committee and parent bill
        # later, so recent documents must be re-seen to be completed.
        run: python3 tools/de_committees.py | tee /tmp/de-committees.log
      - name: Profile members we can say something about
        # Incremental and capped: members with a stance placement or a vote
        # in a matched non-migration division first -- about 281 of 2,517,
        # the ones a campaigner might contact. A profiled member is skipped,
        # so after the first passes this costs new arrivals only.
        run: python3 tools/de_profiles.py | tee /tmp/de-profiles.log
      - name: Write secrets file
        # anthropic_api_key: the triage judge. slack: the weekly DM to
        # Christopher ONLY -- the channel is deliberately not posted, the
        # same hold the EU edition is under. A missing secret makes the step
        # skip-with-disclosure, never fail.
        run: |
          cat > config/secrets.yaml <<EOF
          anthropic_api_key: "${{ secrets.ANTHROPIC_API_KEY }}"
          slack_bot_token: "${{ secrets.SLACK_BOT_TOKEN }}"
          slack_dm_user_id: U05LJP0BT61
          dip_api_key: "${{ secrets.DIP_API_KEY }}"
          EOF
      - name: Triage the new matched German items
        # Scored once, ever: the weekly cost is the week's NEW matched rows.
        # Spend lands in api_spend as 'de-triage'.
        run: python3 tools/de_triage.py | tee /tmp/de-triage.log
      - name: Place members from their own words
        # Reads the speeches the step above judged. Scored once per speech,
        # so the weekly cost is the week's NEW speeches. Spend lands in
        # api_spend as 'de-stance'.
        run: python3 tools/de_stance.py | tee /tmp/de-stance.log
      - name: Draft Campaigns Briefs for new score-3 subjects
        # AFTER triage and stance, because score 3 is what makes a subject
        # brief-worthy and the brief quotes the stance placements. One brief
        # per subject EVER, so the weekly cost is the week's NEW subjects and
        # nothing else -- the first run wrote thirteen, a normal week writes
        # none to three. A campaigner's edits are never overwritten:
        # regeneration is --force only.
        run: python3 tools/de_briefs.py | tee /tmp/de-briefs.log
      - name: Write the German edition and DM the summary
        run: python3 tools/de_monitor.py --edition --dm | tee /tmp/de-monitor.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Germany weekly"
            echo '```'
            grep -hE "de-rollcalls:|de-documents:|de-agenda:|de-speeches:|de-petitions:|de-courts:|de-amendments:|de-committees:|de-stance:|de-profiles:|de-briefs:|de-triage:|edition:|dm:|\[gap\]" \
              /tmp/de-*.log 2>/dev/null | head -15 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/de-*.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/
          git diff --cached --quiet || git commit -m "Germany weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done

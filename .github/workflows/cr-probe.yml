# ONE-OFF SCOPING PROBE (9 October 2026): does Costa Rica's Asamblea
# Legislativa answer GitHub's runners? www.asamblea.go.cr and
# datosabiertos.asamblea.go.cr drop TCP from the laptop (London) and from
# WebFetch's US network. Read-only: no secrets, no store, no commit. Each
# line of ops/cr-probe-args.txt is one run of tools/cr_probe.py; the raw
# archive is uploaded as an artifact.
# Delete once the Costa Rica collector is built and dry-run on CI.
name: Costa Rica probe
on:
  push:
    branches: [costa-rica]
    paths: [.github/workflows/cr-probe.yml, ops/cr-probe-args.txt]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Probe
        run: |
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue;; esac
            echo "### $line"
            eval "python3 tools/cr_probe.py $line" || true
          done < ops/cr-probe-args.txt 2>&1 | tee probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr-probe
          path: |
            data/raw
            probe.log
          retention-days: 7

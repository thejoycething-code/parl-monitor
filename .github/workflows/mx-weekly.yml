name: Mexico weekly
on:
  schedule:
    # Saturday 14:30 UTC, retry 16:30 UTC (9 October 2026). The Chamber of
    # Deputies sits Tuesday to Thursday; Saturday 14:30 UTC is Saturday 08:30
    # in Mexico City, after the Gaceta has listed the week's iniciativas and
    # SITL the week's votes. Moved from 03:00/05:00 at the countries merge
    # (10 October 2026): Austria holds those Saturday slots.
    #
    # FORTNIGHTLY (X9, Chris, 10 October 2026): Guatemala and Mexico run on
    # GitHub Actions every second week, to save Actions minutes. The crons
    # stay weekly; the gate below lets a scheduled run through only in an
    # ODD ISO week (Guatemala takes the even ones), and the Mini's clock
    # (jobs/mx-weekly.sh) dispatches only in an odd week. A hand dispatch
    # always runs.
    - cron: "30 14 * * 6"
    - cron: "30 16 * * 6"
  workflow_dispatch:
    inputs:
      reclassify:
        # After config/taxonomy-es.yaml lands or watchlist-mx changes:
        # re-derive every stored iniciativa's and vote's areas, offline.
        description: "Reclassify stored Mexican iniciativas and votes"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini is this workflow's CLOCK (tools/mini_run.sh mx-weekly,
  # Saturdays 15:30 London): diputados.gob.mx refuses UK addresses, so
  # jobs/mx-weekly.sh DISPATCHES this workflow instead of collecting, and a
  # dispatch always passes this gate. These crons are the backup. The Mini
  # runs ONCE for both slots: at 15:30 London in summer it stamps 14:30 UTC,
  # two hours before the 16:30 retry, hence a grace of 150 minutes.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: MX_WEEKLY
      grace-minutes: 150

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 14:30 backup (or the run the Mini dispatched) already ran
  # today, 16:30 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          WEEK=$(date -u +%V)
          if [ $((10#$WEEK % 2)) -eq 0 ]; then
            echo "fortnightly (X9): ISO week $WEEK is even, not a Mexico week"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/mx-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The first run reads every vote of the LXVI: 285 votes, about nine SITL
    # pages each at one a second, stopped by the collector's 40-minute budget
    # and drained on later runs (docs/mexico-scope.md). Later weeks read the
    # week's new votes and re-read the Gaceta lists (about 5 MB).
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Deputies, iniciativas, votes and positions (LXVI)
        # Phase 1 stores; it writes no edition and sends no DM yet.
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MX_RECLASSIFY: ${{ inputs.reclassify }}
          # The edition DMs Chris alone (src/country_edition.py forces his id).
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
        run: bash jobs/mx-collect.sh | tee /tmp/mx-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## Mexico weekly"
            echo '```'
            grep -hE "mx-rollcalls:|store:|\[gap\]" /tmp/mx-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/mx-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the raw archive
        # Before the store: a store that cites payloads the archive lacks is
        # the worse of the two failures. Merges, never clobbers.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --push
      - name: Publish the store
        # Never publish a store the pull refused.
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --push
      - name: Commit state
        # Paired with the publish above -- an uncommitted sidecar next to a
        # published store is the divergence this repo has already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ editions/
          git diff --cached --quiet || git commit -m "Mexico weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Hardened (docs/mac-mini-runner.md, step 4): six tries with longer,
          # jittered waits, and never retry while stuck mid-rebase.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"; then
              git push && break
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            echo "push not landed (attempt $attempt); retrying"
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

name: Australia division watch

# The next-morning vote brief for the Australian Parliament (Christopher,
# 9 October 2026: "start the same-day vote briefs"; parity with
# division-watch.yml). For each new House or Senate division on our ground:
# data/briefs/au-division-<key>.md and one DM to Christopher
# (tools/au_division_brief.py, src/vote_brief.py). Speaks once per division.
# Touches no store.
#
# MEASURED (9 October 2026, the OpenAustralia index): every sitting day of
# 14-17 September 2026 was posted at 09:05 the next morning, server time
# (Canberra): 23:05 UTC, 00:05 London in BST with AEST; 23:05 London once
# Canberra is on AEDT (from 4 October); 22:05 London in GMT. Canberra sits
# Monday to Thursday, so two slots Tue-Fri: 01:20 London, after the parse in
# every season, and 06:20 London, for a late or re-posted file.
on:
  schedule:
    - cron: "20 0,5 * * 2-5"       # 01:20 and 06:20 London (BST), the Mini first
  workflow_dispatch:
    inputs:
      since:
        description: "Look back to this date (YYYY-MM-DD; blank = the tool's window)"
        required: false
        default: ""
      force:
        description: "Rewrite and resend briefs that already exist"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

# Commits the raw sidecar and briefs alongside the workflows that publish state.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this at the London hours above (tools/mini_run.sh
  # au-division-watch); these crons are the backup and skip a slot the Mini
  # already ran.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: AU_DIVISION_WATCH

  brief:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Brief new divisions, publish the raw archive
        # The job script is shared with the Mac Mini runner.
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_USER_ID: U05LJP0BT61
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIVISION_SINCE: ${{ inputs.since }}
          DIVISION_FORCE: ${{ inputs.force }}
        run: |
          bash jobs/au-division-watch.sh | tee /tmp/au-division-watch.log
          { echo "## Australia division watch"; echo '```'; cat /tmp/au-division-watch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit briefs and archived payloads
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "bot@parl-monitor.invalid"
          git add data/raw.json data/briefs
          git diff --cached --quiet && exit 0
          git commit -m "Australia division watch $(date -u +%FT%H:%MZ)"
          # Hardened loop (docs/mac-mini-runner.md, step 4): never retry
          # while stuck mid-rebase, and wait long enough to lose a race once.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main; then
              git push origin main && exit 0
            else
              git rebase --abort || true
              echo "rebase conflict (attempt $attempt)"
            fi
            sleep $(( attempt * 10 + RANDOM % 10 ))
          done
          echo "push failed six times"; exit 1

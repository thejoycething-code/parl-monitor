name: El Salvador weekly
on:
  schedule:
    # Sunday 10:00 UTC, retry 13:00 UTC (9 October 2026). The Asamblea
    # Legislativa sits in plenary one day a week (usually Wednesday) and lists
    # each vote the same day; its session archive files the day's dictámenes
    # and piezas some days later, which the collector retries. Moved an hour
    # from 09:00/12:00 at the countries merge (10 October 2026): the
    # Dominican Republic holds those Sunday slots.
    - cron: "0 10 * * 0"
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a taxonomy-es or watchlist-sv change: re-derive every stored
        # SV dictamen's, pieza's and vote's areas, offline, before the pull.
        description: "Reclassify stored SV dictámenes, piezas and votes under the current taxonomy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Sundays at 10:00 London (tools/mini_run.sh
  # sv-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 13:00 retry too: at 10:00 London in
  # summer it stamps 09:00 UTC, four hours before that slot, hence a grace
  # of 260 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: SV_WEEKLY
      grace-minutes: 260

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 10:00 backup already ran today, 13:00 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/sv-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The first run backfills the 2024-2027 legislature: 784 vote PDFs and
    # its 890 days of the session archive, cut at 45 minutes by the
    # collector's own budget and resumed by the next run (about six runs;
    # docs/el-salvador-scope.md). Later weeks read only new votes and the
    # last 21 days of the archive.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Votes, dictámenes, piezas and deputies (Asamblea); publish
        # jobs/sv-weekly.sh is shared with the Mac Mini runner. It publishes
        # the raw archive and then the store itself (tools/raw_state.py,
        # then tools/db_state.py), only when the collector finished, gaps
        # included; the next step commits the sidecars.
        if: steps.fetch.outcome == 'success'
        env:
          # Latam alerts: a DM to Chris per watched or tier-1 item (latam_alerts.py)
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SV_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/sv-weekly.sh | tee /tmp/sv-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## El Salvador weekly"
            echo '```'
            grep -hE "sv-rollcalls:|store:|\[gap\]" /tmp/sv-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/sv-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        # Paired with the publish inside the job script -- an uncommitted
        # sidecar next to a published store is the divergence this repo has
        # already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "El Salvador weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi

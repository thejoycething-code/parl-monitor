name: France weekly
on:
  schedule:
    # Saturday 04:30 UTC, retry 06:30 UTC (9 October 2026). The Assemblee
    # nationale sits Tuesday to Thursday, sometimes Monday and Friday, and
    # refreshes its open-data zips nightly (stamped 22:27-02:06 UTC on 8-9
    # October 2026), so Saturday 04:30 UTC reads the whole week. Moved from
    # 03:00/05:00 at the countries merge (10 October 2026): Austria holds
    # those Saturday slots.
    - cron: "30 4 * * 6"
    - cron: "30 6 * * 6"
  workflow_dispatch:
    inputs:
      reclassify:
        # After a taxonomy or watchlist-fr change: re-derive every stored FR
        # dossier's and division's areas, offline, before the pull.
        description: "Reclassify stored FR dossiers and divisions under the current taxonomy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # the gate reads this workflow's own runs

defaults:
  run:
    shell: bash -eo pipefail {0}

# Same group as everything that commits data/: one writer at a time.
concurrency:
  group: parl-monitor-state
  cancel-in-progress: false

jobs:
  # The Mac Mini runs this on Saturdays at 04:30 London (tools/mini_run.sh
  # fr-weekly); these crons are the backup. The Mini runs ONCE for both
  # slots, so its run must count for the 06:30 retry too: at 04:30 London in
  # summer it stamps 03:30 UTC, three hours before that slot, hence a grace
  # of 200 minutes rather than the default 75.
  mini-check:
    uses: ./.github/workflows/mini-check.yml
    with:
      job: FR_WEEKLY
      grace-minutes: 200

  # The second slot is a retry, not a second pass (copied from us-weekly.yml):
  # when the 04:30 backup already ran today, 06:30 has nothing to do.
  gate:
    needs: mini-check
    if: needs.mini-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched by hand; running"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)T00:00:00Z
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/fr-weekly.yml/runs?per_page=50" \
                 --jq "[.workflow_runs[]
                        | select(.created_at >= \"$TODAY\")
                        | select(.id != ${{ github.run_id }})
                        | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                       | length" 2>/dev/null || echo 0)
          if [ "${BUSY:-0}" -gt 0 ]; then
            echo "$BUSY run(s) already succeeded or are running today; this retry slot has nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier run today; this slot does the work"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  pull:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Measured from the laptop on 9 October 2026: the four zips (AMO10,
    # dossiers, scrutins, AMO30 on a first run; 55 MB) download in about
    # 30 s and the first full run stores 8,621 scrutins and 1.29 million
    # positions in under 30 s more. Later weeks store only the new scrutins
    # and re-read the last 30 days'.
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Fetch the store
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/db_state.py --pull
      - name: Fetch the raw archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/raw_state.py --pull
      - name: Deputies, dossiers and scrutins (17th legislature); publish
        # jobs/fr-weekly.sh is shared with the Mac Mini runner. It publishes
        # the raw archive, then the store (tools/raw_state.py, then
        # tools/db_state.py, each with --push), and only when the collector finished, gaps
        # included; the next step commits the sidecars.
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FR_RECLASSIFY: ${{ inputs.reclassify }}
        run: bash jobs/fr-weekly.sh | tee /tmp/fr-weekly.log
      - name: Health summary
        if: always()
        run: |
          {
            echo "## France weekly"
            echo '```'
            grep -hE "fr-rollcalls:|store:|departed|\[gap\]" /tmp/fr-weekly.log 2>/dev/null | head -25 || echo "(no summary lines)"
            echo '```'
            TOTAL=$({ grep -hc "\[gap\]" /tmp/fr-weekly.log 2>/dev/null \
                      || true; } | awk '{s+=$1} END {print s+0}')
            if [ "$TOTAL" -gt 0 ]; then
              echo "**$TOTAL gap(s) this run** - see the step log."
            else
              echo "**No gaps.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        # Paired with the publish inside the job script -- an uncommitted
        # sidecar next to a published store is the divergence this repo has
        # already paid for.
        if: always() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "parl-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "France weekly: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break
            echo "push rejected (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          git fetch -q origin "$(git rev-parse --abbrev-ref HEAD)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "the sidecar commit never reached origin"; exit 1
          fi
